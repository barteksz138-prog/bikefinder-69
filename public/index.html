<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// Typy wpisów:

//   (brak)            → query to fraza wyszukiwana w /s-fahrraeder/{query}/k0c217

// konkretnych, znanych modelach (z cennika referencyjnego i wiedzy Groqa o pełnych zawieszeniach)

// lecących przez Groq/Gemini (mniej = taniej i mniej przeciążeń), kosztem tego że model spoza
// tej listy nie zostanie znaleziony. Możesz dowolnie włączać/wyłączać pojedyncze modele checkboxem
// w Ustawieniach — bez zmian w kodzie. Dopisuj tu modele, które Gemini rozpoznaje z własnej wiedzy
// rynkowej (patrz "powod_decyzji" w logach), żeby lista rosła wraz z tym co faktycznie się trafia.

  { id: "trek_session",      label: "Trek Session",        query: "Trek Session" },
  { id: "trek_ticket",       label: "Trek Ticket",         query: "Trek Ticket" },

  { id: "specialized_demo",        label: "Specialized Demo",        query: "Specialized Demo" },

  { id: "cube_ams",          label: "Cube AMS",            query: "Cube AMS" },
  { id: "santa_cruz",  label: "Santa Cruz (cała marka)",  query: "Santa Cruz" },
  { id: "yt",          label: "YT (cała marka)",          query: "YT" },
  { id: "commencal",   label: "Commencal (cała marka)",   query: "Commencal" },
  { id: "radon_swoop",  label: "Radon Swoop",  query: "Radon Swoop" },
  { id: "radon_slide",  label: "Radon Slide",  query: "Radon Slide" },
  { id: "radon_slush",  label: "Radon Slush",  query: "Radon Slush" },
  { id: "ghost_riot",   label: "Ghost Riot",   query: "Ghost Riot" },
  { id: "focus_jam",    label: "Focus Jam",    query: "Focus Jam" },
  { id: "focus_sam",    label: "Focus Sam",    query: "Focus Sam" },
  { id: "focus_thron",  label: "Focus Thron",  query: "Focus Thron" },
  { id: "gt_force",     label: "GT Force",     query: "GT Force" },
  { id: "gt_fury",      label: "GT Fury",      query: "GT Fury" },
  { id: "rose_bruce",   label: "Rose The Bruce", query: "Rose The Bruce" },
  { id: "dartmoor",     label: "Dartmoor (cała marka)", query: "Dartmoor" },
  // ── Nowe marki (całe, bez rozbicia na modele) ──
  { id: "propain",        label: "Propain (cała marka)",        query: "Propain" },
  { id: "norco",          label: "Norco (cała marka)",          query: "Norco" },
  { id: "ns_bikes",       label: "NS Bikes (cała marka)",       query: "NS Bikes" },
  { id: "nukeproof",      label: "Nukeproof (cała marka)",      query: "Nukeproof" },
  { id: "rocky_mountain", label: "Rocky Mountain (cała marka)", query: "Rocky Mountain" },
  { id: "marin",          label: "Marin (cała marka)",          query: "Marin" },
  { id: "transition",     label: "Transition (cała marka)",     query: "Transition" },
  { id: "evil",           label: "Evil (cała marka)",           query: "Evil" },
  { id: "intense",        label: "Intense (cała marka)",        query: "Intense" },
  { id: "raaw",           label: "Raaw (cała marka)",           query: "Raaw" },
  { id: "beddo",          label: "Beddo (dirt)",                query: "Beddo" },
  { id: "giant",          label: "Giant (cała marka)",          query: "Giant" },
];

// Etykiety typu roweru zwracanego przez Gemini
const TYPE_LABELS = {
  full: { label: "🟢 Full",  color: "#22c55e" },
  dirt: { label: "🟠 Dirt",  color: "#f59e0b" },
  elektryk_gorski: { label: "⚡ Elektryk górski", color: "#38bdf8" },
  inny: { label: "⚫ Inny",  color: "#475569" },
};

const PROVIDERS = {
  gemini: {
    label: "Google Gemini",
    models: [
      { id: "gemini-2.5-flash",      label: "Gemini 2.5 Flash (zalecany)" },
      { id: "gemini-2.5-flash-lite", label: "Gemini 2.5 Flash-Lite (najtańszy, domyślnie bez myślenia)" },
      { id: "gemini-flash-latest",   label: "Gemini 3.5 Flash (najnowszy, droższy)" },
      { id: "gemini-2.5-pro",        label: "Gemini 2.5 Pro" },
    ],
    keyPlaceholder: "AIza...",
    keyHint: "aistudio.google.com/apikey",
  },
  groq: {
    label: "Groq",
    models: [
      { id: "openai/gpt-oss-120b",      label: "GPT-OSS 120B (zalecany — tani, z rozumowaniem)" },
      { id: "openai/gpt-oss-20b",       label: "GPT-OSS 20B (tańszy, szybszy)" },
    ],
    keyPlaceholder: "gsk_...",
    keyHint: "console.groq.com/keys",
  },
};

// Groq wyłączył modele Llama 16.08.2026 (zapytania zwracają "model does not exist").
// Zapisane w ustawieniach stare ID zamieniamy na oficjalne zamienniki Groqa — inaczej dropdown
// POKAZYWAŁBY nowy model, a aplikacja dalej po cichu wysyłałaby martwy.
const DEAD_GROQ_MODELS = {
  "llama-3.3-70b-versatile": "openai/gpt-oss-120b",
  "llama-3.1-8b-instant":    "openai/gpt-oss-20b",
  "mixtral-8x7b-32768":      "openai/gpt-oss-120b",
};

// Kurs do przeliczania cen sprzedaży w PL (zł) na euro w prompcie Gemini. Wystarczy przybliżony —
// zaktualizuj, jeśli kurs mocno się zmieni (zmiana tej liczby = nowy cache promptu, to normalne).
const EUR_PLN_RATE = 4.35;

// Kurs dolara — cennik Google jest w USD. Celowo lekko zawyżony (NBP 07.2026: ~3,79 zł),
// żeby licznik wydatków raczej zawyżał niż zaniżał koszty i budżet nie został przekroczony.
const USD_PLN_RATE = 3.80;

// Cennik Gemini API (USD za 1 mln tokenów, prompty < 200 tys. tokenów), stan na 10.2026.
// "out" obejmuje tokeny myślenia, "cached" = odczyt z cache, "storage" = przechowanie cache przez godzinę.
// Służy tylko do licznika wydatków w aplikacji — źródłem prawdy jest rozliczenie w Google AI Studio.
const GEMINI_PRICES = {
  "gemini-2.5-flash":      { in: 0.30, cached: 0.03,  out: 2.50,  storage: 1.00 },
  "gemini-2.5-flash-lite": { in: 0.10, cached: 0.01,  out: 0.40,  storage: 1.00 },
  "gemini-2.5-pro":        { in: 1.25, cached: 0.125, out: 10.00, storage: 4.50 },
  "gemini-flash-latest":   { in: 1.50, cached: 0.15,  out: 9.00,  storage: 1.00 },
};
const GEMINI_PRICE_FALLBACK = { in: 2.00, cached: 0.20, out: 12.00, storage: 4.50 }; // nieznany model — liczymy jak najdroższy

// Mocniejszy model do decyzji, w których błąd kosztuje najwięcej: weryfikacja okazji i trudne przypadki.
// Stabilna wersja (nie "preview") — po wyłączeniu modeli Llama na Groqu wolimy nie ryzykować.
const STRONG_GEMINI_MODEL = "gemini-2.5-pro";

// Górny limit ceny sprzedaży używanego roweru jako ułamek "ceny nowego" z opisu, wg wieku (lata od rocznika).
// Zapobiega zakotwiczeniu wyceny na "Neupreis"/"NP" przy rowerach "neuwertig".
const ageCapFactor = (age) =>
  age <= 1 ? 0.75 : age === 2 ? 0.65 : age === 3 ? 0.58 : age === 4 ? 0.52 : age === 5 ? 0.47 : age === 6 ? 0.43 : age === 7 ? 0.40 : 0.37;

// Gdy rocznik jest nieznany (a w ogłoszeniach zwykle go nie ma): łagodny limit jak dla roweru ok. 2-letniego.
// Odcina tylko rażące zakotwiczenie na cenie nowego, nie blokuje okazji bez podanego rocznika.
const UNKNOWN_YEAR_CAP = 0.65;

// Kategorie "niepewnych" — konkretny powód zamiast ogólnego "za mało danych"
const UNCERTAIN_LABELS = {
  nisza_custom: "Nisza/custom — brak cen rynkowych",
  za_malo_opisu: "Za mało informacji w opisie",
  mozliwe_uszkodzenia: "Możliwe uszkodzenia",
  nieznany_model: "Nieznany model",
  inne: "Do sprawdzenia",
};

// Znacznik wersji — widoczny w nagłówku i w logu startu, żeby łatwo sprawdzić co działa na Vercelu.
const APP_VERSION = "v5.1 (2026-10-09)";

const SC = {
  analyzing: { bg: "#8b5cf622", color: "#a78bfa", border: "#8b5cf655", label: "AI analizuje…" },
  deal:      { bg: "#22c55e22", color: "#22c55e", border: "#22c55e55", label: "✅ Okazja!" },
  skip:      { bg: "#1e293b",   color: "#475569", border: "#1e293b",   label: "⏭ Pominięte" },
  sent:      { bg: "#3b82f622", color: "#60a5fa", border: "#3b82f655", label: "📨 Wysłano" },
  error:     { bg: "#ef444422", color: "#f87171", border: "#ef444455", label: "⚠️ Błąd" },
};

function Badge({ status }) {
  const s = SC[status] || SC.skip;
  return (
    <span style={{ background: s.bg, color: s.color, border: `1px solid ${s.border}`,
      borderRadius: 6, padding: "2px 10px", fontSize: 11, fontWeight: 700, letterSpacing: 0.4 }}>
      {s.label}
    </span>
  );
}

function App() {
  const [tab, setTab] = useState("scanner");

  const [cfg] = useState(() => {
    try { return JSON.parse(localStorage.getItem("ddf_cfg") || "{}"); } catch { return {}; }
  });
  const [geminiKey,      setGeminiKey]      = useState(cfg.geminiKey || "");
  const [provider,       setProvider]       = useState(cfg.provider || "groq");
  const [geminiModel,    setGeminiModel]    = useState(() => {
    // Migracja: martwe ID → zamiennik; model spoza listy providera → pierwszy z listy
    // (dropdown i tak pokazałby pierwszą opcję — stan musi się z tym zgadzać).
    const p = PROVIDERS[cfg.provider || "groq"] || PROVIDERS.groq;
    let m = cfg.geminiModel || p.models[0].id;
    m = DEAD_GROQ_MODELS[m] || m;
    return p.models.some(x => x.id === m) ? m : p.models[0].id;
  });
  const [geminiChatName, setGeminiChatName] = useState(cfg.geminiChatName || "");
  const [minProfit,      setMinProfit]      = useState(cfg.minProfit || 20);
  const [excludeElektryk, setExcludeElektryk] = useState(cfg.excludeElektryk !== false); // domyślnie WŁĄCZONE — odrzuca e-MTB od razu na Etapie 1, zero kosztu Gemini
  // Klucz Groq używany WYŁĄCZNIE do szybkiej, lekkiej klasyfikacji typu roweru (etap 1) — niezależnie od
  // tego jaki provider jest wybrany do właściwej analizy opłacalności (etap 2, zwykle Gemini).
  const [groqClassifierKey, setGroqClassifierKey] = useState(cfg.groqClassifierKey || "");
  // Ile rowerów maksymalnie wysyłamy do Gemini (etap 2, drogi/limitowany) w ramach JEDNEGO cyklu skanowania.
  const [maxGeminiPerCycle, setMaxGeminiPerCycle] = useState(cfg.maxGeminiPerCycle ?? 25);
  // Ogłoszenia sklasyfikowane przez Groq jako "niepewne" (z ceną) idą do Gemini TYLKO jeśli cena >= ten próg.
  // Cel: przy niepewnym typie i niskiej cenie prawdopodobieństwo że to coś wartego uwagi jest niskie —
  // nie warto marnować wywołania Gemini. Ogłoszenia bez podanej ceny ZAWSZE trafiają do listy niepewnych
  // (nie przechodzą przez ten próg, bo nie ma z czym porównać).
  const [minUncertainPrice, setMinUncertainPrice] = useState(cfg.minUncertainPrice ?? 500);
  // Maksymalna cena zakupu — droższe ogłoszenia odpadają przed jakimkolwiek wywołaniem AI.
  const [maxBuyPrice, setMaxBuyPrice] = useState(cfg.maxBuyPrice ?? 1400);
  // Miesięczny budżet na Gemini (zł). Aplikacja sama dobiera moc analizy tak, żeby się w nim zmieścić.
  const [aiBudgetPln, setAiBudgetPln] = useState(cfg.aiBudgetPln ?? 400);
  const [priceKnowledge, setPriceKnowledge] = useState(() => {
    try { return JSON.parse(localStorage.getItem("ddf_price_knowledge") || "[]"); } catch { return []; }
  });
  const [discordWebhook, setDiscordWebhook] = useState(cfg.discordWebhook || "");
  const [discordThread,  setDiscordThread]  = useState(cfg.discordThread || "");
  const [uncertainWebhook, setUncertainWebhook] = useState(cfg.uncertainWebhook || "");
  // UWAGA: "E-Bike"/"Ebike"/"Pedelec"/"Elektrofahrrad" CELOWO NIE są tu wpisane — o tym czy elektryk jest
  // górski (elektryk_gorski, chcemy) czy miejski/touringowy (inny, nie chcemy) decyduje Groq w Etapie 1
  // na podstawie kontekstu. Blankietowe blokowanie tych słów odrzucałoby też wartościowe e-MTB.
  const DEFAULT_FILTER_KEYWORDS = "Rennrad, Gravel, Trekkingrad, Hollandrad, Cityrad, Stadtrad, Kinderfahrrad, Laufrad, Klapprad, Liegerad, Dreirad, Rollator, Ersatzteile, Einzelteile, nur Rahmen, Rahmen only, Rahmenset, Bastlerrad, Schrott, gesucht, Kinder, Jugend, 12 Zoll, 16 Zoll, 20 Zoll, 24 Zoll, Damenrad, Herrenrad, Tourenrad, Reiserad, Crossrad, Fitnessbike, Singlespeed, Fixie, BMX Freestyle, Faltrad, Lastenrad, Cargobike, Seniorenrad, Elektroroller, E-Scooter, Escooter, Motorroller, Tretroller, Kickscooter, Balance Bike, Laufrädchen, Fahrradanhänger, Kinderanhänger, Kinderwagen, Fahrradträger, Rollstuhl, Vermietung, Verleih, Miete, Tausch gegen, Deko, Bastelobjekt, Spielzeugrad, Puky, Kettcar, Dreiradwagen";
  const [filterKeywords, setFilterKeywords] = useState(cfg.filterKeywords ?? DEFAULT_FILTER_KEYWORDS);
  const [selectedBikes,  setSelectedBikes]  = useState(() => {
    const saved = cfg.selectedBikes;
    if (!saved || saved.length === 0) return BIKE_MODELS.map(b => b.id);
    // Stara konfiguracja mogła mieć zaznaczoną kategorię "cat_mountainbike", której już nie ma
    // (zastąpiona listą konkretnych modeli) — po odfiltrowaniu nieistniejących id, jeśli nic nie
    // zostało, wybierz WSZYSTKIE nowe modele zamiast zostawić pustą, milczącą listę.
    const filtered = saved.filter(id => BIKE_MODELS.some(b => b.id === id));
    return filtered.length > 0 ? filtered : BIKE_MODELS.map(b => b.id);
  });

  const [logs,     setLogs]     = useState([]);
  const [results,  setResults]  = useState([]);
  const [running,  setRunning]  = useState(false);
  const [stats,    setStats]    = useState({ scanned: 0, deals: 0, sent: 0 });
  const [cycleNum, setCycleNum] = useState(0);

  // ── Chat state ─────────────────────────────────────────────────────────
  const [chatMessages, setChatMessages] = useState(() => {
    try { return JSON.parse(localStorage.getItem("ddf_chat") || "[]"); } catch { return []; }
  });
  const [chatInput, setChatInput]   = useState("");
  const [chatLoading, setChatLoading] = useState(false);
  const [showKnowledgePanel, setShowKnowledgePanel] = useState(false);
  const chatEndRef = useRef(null);

  useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [chatMessages]);

  const saveChatHistory = (msgs) => {
    try { localStorage.setItem("ddf_chat", JSON.stringify(msgs.slice(-200))); } catch {}
  };

  const savePriceKnowledge = (entries) => {
    try { localStorage.setItem("ddf_price_knowledge", JSON.stringify(entries)); } catch {}
    setPriceKnowledge(entries);
  };

  const addKnowledgeFromMessage = (content) => {
    const entry = { id: Date.now() + Math.random(), text: content.trim(), addedAt: new Date().toLocaleString("pl-PL") };
    savePriceKnowledge([...priceKnowledge, entry]);
  };

  const removeKnowledgeEntry = (id) => {
    savePriceKnowledge(priceKnowledge.filter(e => e.id !== id));
  };

  const runningRef   = useRef(false);
  const firstCycleRef = useRef(true); // cykl #1 = tylko zbieramy ID, nie analizujemy
  const geminiCallsRef = useRef(0); // licznik analiz Gemini w BIEŻĄCYM cyklu — reset na starcie każdego cyklu
  const groqKeyIndexRef = useRef(0); // wskaźnik round-robin do rotacji kluczy Groq między wywołaniami
  const groqKeyCooldownsRef = useRef({}); // { [apiKey]: timestampMs } — cooldown PER KLUCZ po dziennym limicie (TPD)

  // ── Gemini explicit context caching ─────────────────────────────────────────────────────
  // Duży statyczny blok promptu (cennik/reguły osprzętu, patrz analyzeWithGemini) jest identyczny
  // w wielu wywołaniach pod rząd — zamiast wysyłać go za każdym razem, cache'ujemy go RAZ po stronie
  // Google i tylko odwołujemy się do niego nazwą (odczyt z cache ~10% ceny bazowej input).
  // Klucz w mapie = `${model}|${wariant}|${hash statycznego tekstu}` — osobny cache dla:
  //  - każdego modelu Gemini (cache jest przypisany do konkretnego modelu, nie da się dzielić),
  //  - wariantu typeSection (typ już zaufany z Groqa vs. Gemini musi sam rozpoznać typ),
  //  - treści cennika/bazy wiedzy (gdy zmienisz cennik w Ustawieniach, hash się zmieni i zrobimy nowy cache).
  // cacheMapRef: { [key]: { name, expiresAt } }
  // cacheFailCooldownRef: { [key]: timestampMs } — jeśli tworzenie cache zawiedzie (np. prompt za
  // krótki wg progu Google — dokumentacja jest w tej kwestii niespójna, 2048 vs 32768 tokenów),
  // NIE próbujemy ponownie przy każdym kolejnym ogłoszeniu — czekamy chwilę i po prostu wysyłamy
  // pełny prompt bez cache (dokładnie tak jak działało to wcześniej, zero regresji).
  const cacheMapRef = useRef({});
  const cacheFailCooldownRef = useRef({});
  const logsEndRef  = useRef(null);

  const priceDiagLoggedRef = useRef(false); // szczegółowa diagnostyka parsera cen — tylko raz na sesję
  const descDiagLoggedRef  = useRef(false); // diagnostyka parsera pełnego opisu — tylko raz na sesję
  const detailBlockedUntilRef = useRef(0);  // bezpiecznik: do kiedy NIE pobieramy stron ogłoszeń (po blokadzie)

  // Zapamiętaj widziane ogłoszenia między restartami — ID + historia ceny (do wykrywania spadków).
  // Format w localStorage: tablica obiektów {id, price, lowest, notifiedAt, type}.
  // MIGRACJA: stary format to goła tablica ID-stringów — każdy taki wpis dostaje
  // {price:null, lowest:null, ...} (brak punktu odniesienia), żeby pierwszy skan po
  // aktualizacji NIE strzelił fałszywym "spadkiem ceny" dla wszystkiego naraz.
  const PRICE_DROP_THRESHOLD = 0.20; // spadek o min. 20% na znanym ogłoszeniu = istotna obniżka
  const SEEN_MAX = 4000; // przy 44 wyszukiwaniach na cykl aktywnych ogłoszeń bywa ponad 1000
  const loadSeenMap = () => {
    const map = new Map();
    try {
      const raw = JSON.parse(localStorage.getItem("ddf_seen") || "[]");
      for (const item of raw) {
        if (typeof item === "string") {
          map.set(item, { price: null, lowest: null, notifiedAt: null, type: null });
        } else if (item && item.id) {
          map.set(item.id, {
            price: item.price ?? null, lowest: item.lowest ?? null,
            notifiedAt: item.notifiedAt ?? null, type: item.type ?? null,
            overMax: item.overMax === true,
          });
        }
      }
    } catch {}
    return map;
  };
  const seenIdsRef = useRef(loadSeenMap());

  const persistSeenMap = () => {
    try {
      const arr = [...seenIdsRef.current.entries()].slice(-SEEN_MAX).map(([id, d]) => ({ id, ...d }));
      localStorage.setItem("ddf_seen", JSON.stringify(arr));
    } catch {}
  };

  // Nowo odkryte ogłoszenie — zapamiętaj z ceną z chwili pierwszego zobaczenia jako punkt odniesienia.
  const saveSeenEntry = (listing) => {
    seenIdsRef.current.set(listing.listingId, {
      price: listing.price ?? null, lowest: listing.price ?? null, notifiedAt: null, type: null,
      // Droższe niż limit zakupu — zapamiętujemy, żeby sprawdzić ponownie, gdy cena spadnie poniżej limitu
      overMax: listing.price != null && listing.price > maxBuyPrice,
    });
    persistSeenMap();
  };

  // Po udanej klasyfikacji Etapu 1 — zapamiętaj typ, żeby przy kolejnym spadku ceny pominąć Groq.
  const updateSeenType = (id, typ) => {
    const e = seenIdsRef.current.get(id);
    if (e) { e.type = typ; persistSeenMap(); }
  };

  useEffect(() => { logsEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [logs]);

  const saveSettings = () => {
    const data = { geminiKey, geminiModel, geminiChatName, discordWebhook, discordThread, uncertainWebhook, filterKeywords, groqClassifierKey, maxGeminiPerCycle, minUncertainPrice, selectedBikes, provider, minProfit, excludeElektryk, maxBuyPrice, aiBudgetPln };
    localStorage.setItem("ddf_cfg", JSON.stringify(data));
    addLog("💾 Ustawienia zapisane", "success");
  };

  // ── Licznik wydatków na Gemini (z danych zużycia zwracanych przez Google) ─────────────
  // Liczony w tej przeglądarce, osobno dla każdego miesiąca kalendarzowego.
  const currentMonthKey = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };
  const freshSpend = () => ({ month: currentMonthKey(), usd: 0, calls: 0 });
  const aiSpendRef = useRef((() => {
    try {
      const sp = JSON.parse(localStorage.getItem("ddf_ai_spend") || "null");
      if (sp && sp.month === currentMonthKey() && Number.isFinite(sp.usd)) return sp;
    } catch {}
    return freshSpend();
  })());
  const [aiSpend, setAiSpend] = useState(aiSpendRef.current);
  const addAiCostUsd = (usd) => {
    if (!(usd > 0)) return;
    if (aiSpendRef.current.month !== currentMonthKey()) aiSpendRef.current = freshSpend();
    const sp = aiSpendRef.current;
    sp.usd += usd; sp.calls += 1;
    try { localStorage.setItem("ddf_ai_spend", JSON.stringify(sp)); } catch {}
    setAiSpend({ ...sp });
  };
  // Koszt jednego wywołania z usageMetadata Gemini (promptTokenCount obejmuje też tokeny z cache)
  const geminiCallCostUsd = (model, u) => {
    if (!u) return 0;
    const pr = GEMINI_PRICES[model] || GEMINI_PRICE_FALLBACK;
    const prompt = u.promptTokenCount || 0;
    const cached = Math.min(u.cachedContentTokenCount || 0, prompt);
    const out = (u.candidatesTokenCount || 0) + (u.thoughtsTokenCount || 0);
    return ((prompt - cached) * pr.in + cached * pr.cached + out * pr.out) / 1e6;
  };
  // Tryb pracy wg wydatków: "premium" (w tempie budżetu) → "normal" (wydatki wyprzedzają tempo) →
  // "eco" (budżet wyczerpany). Tempo = budżet rozłożony równo na dni miesiąca + zapas jednego dnia,
  // żeby pieniądze nie zniknęły w pierwszym tygodniu.
  const getAiTier = () => {
    if (aiSpendRef.current.month !== currentMonthKey()) aiSpendRef.current = freshSpend();
    const budgetUsd = (Number(aiBudgetPln) || 0) / USD_PLN_RATE;
    const spent = aiSpendRef.current.usd;
    if (budgetUsd <= 0 || spent >= budgetUsd) return "eco";
    const now = new Date();
    const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const elapsedDays = now.getDate() - 1 + (now.getHours() + now.getMinutes() / 60) / 24;
    return spent <= budgetUsd * Math.min(1, (elapsedDays + 1) / daysInMonth) ? "premium" : "normal";
  };
  const TIER_LABELS = { premium: "premium", normal: "normalny", eco: "oszczędny" };

  const addLog = useCallback((msg, type = "info") => {
    setLogs(prev => [...prev.slice(-499), {
      time: new Date().toLocaleTimeString("pl-PL"), msg, type,
    }]);
  }, []);

  // ── Proxy API calls ────────────────────────────────────────────────────
  const callProxy = async (body) => {
    const resp = await fetch("/api/gemini", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const ct = resp.headers.get("content-type") || "";
    if (!ct.includes("application/json")) {
      throw new Error(`Proxy zwróciło HTML zamiast JSON (HTTP ${resp.status}) — sprawdź czy plik api/gemini.js jest wgrany na serwer`);
    }
    return resp.json();
  };

  // Wywołanie AI — obsługuje Gemini i Groq przez backend proxy /api/gemini
  // overrides: opcjonalne nadpisania generationConfig (używane przy eskalacji do "myślenia" — patrz analyzeWithGemini)
  // cachedContent (opcjonalnie) — nazwa explicit cache (patrz analyzeWithGemini/getCachedContentName).
  // Gdy podana, "prompt" powinien zawierać TYLKO dynamiczną część (bez powtarzania cache'owanej treści).
  // modelOverride (opcjonalnie) — inny model Gemini niż wybrany w Ustawieniach (np. mocniejszy do weryfikacji okazji).
  const callGemini = async (prompt, overrides = {}, cachedContent = null, modelOverride = null) => {
    const model = modelOverride || geminiModel;
    const data = await callProxy({
      provider,
      model,
      apiKey: geminiKey,
      messages: provider === "groq"
        ? [{ role: "user", content: prompt }]
        : [{ role: "user", parts: [{ text: prompt }] }],
      ...(cachedContent ? { cachedContent } : {}),
      // Groq/GPT-OSS: "gałki" myślenia Gemini (pierwsza próba vs eskalacja) tłumaczymy na poziom
      // rozumowania GPT-OSS — pierwsza próba "low", eskalacja (thinkingBudget -1 / wyższy level) "medium".
      generationConfig: provider === "groq"
        ? {
            temperature: 0.3, maxOutputTokens: 600, ...overrides,
            reasoningEffort: overrides.reasoningEffort
              || ((overrides.thinkingBudget === -1 || ["medium", "high"].includes(overrides.thinkingLevel)) ? "medium" : "low"),
          }
        : { temperature: 0.3, maxOutputTokens: 600, responseMimeType: "application/json", ...overrides },
    });
    if (data?.error) throw new Error(data.error?.message || JSON.stringify(data.error));
    if (provider === "groq") {
      const choice = data?.choices?.[0];
      const text = choice?.message?.content || "";
      // Ucięta odpowiedź ("length") zgłaszana jak u Gemini (MAX_TOKENS) — dzięki temu działa
      // istniejące ponawianie z większym limitem w attemptAnalysis, zamiast udawać kompletną.
      const finishReason = choice?.finish_reason === "length" ? "MAX_TOKENS" : "STOP";
      return { candidates: [{ content: { parts: [{ text }] }, finishReason }] };
    }
    if (data?.usageMetadata) addAiCostUsd(geminiCallCostUsd(model, data.usageMetadata));
    return data;
  };

  const sendChatMessage = async () => {
    if (!chatInput.trim() || chatLoading) return;
    if (!geminiKey) { alert("Wpisz klucz API w Ustawieniach, żeby korzystać z chatu."); return; }
    const userMsg = { role: "user", content: chatInput.trim(), time: new Date().toLocaleTimeString("pl-PL") };
    const newMsgs = [...chatMessages, userMsg];
    setChatMessages(newMsgs);
    setChatInput("");
    setChatLoading(true);

    try {
      let responseText = "";

      const knowledgeBlock = priceKnowledge.length > 0
        ? `Oto Twoja baza wiedzy o cenach rowerów, zbudowana z realnych transakcji i notatek użytkownika. Korzystaj z niej zawsze gdy oceniasz wartość roweru lub odpowiadasz na pytania o ceny:\n\n${priceKnowledge.map((e, i) => `${i + 1}. ${e.text}`).join("\n")}\n\n---\n\n`
        : "";

      const historyForApi = [...newMsgs];
      if (knowledgeBlock) {
        // Wstrzyknij bazę wiedzy jako kontekst do pierwszej wiadomości w wysyłce (nie zapisujemy tego w widocznej historii)
        historyForApi[0] = { ...historyForApi[0], content: knowledgeBlock + historyForApi[0].content };
      }

      const messages = provider === "groq"
        ? historyForApi.map(m => ({ role: m.role === "assistant" ? "assistant" : "user", content: m.content }))
        : historyForApi.map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] }));

      const data = await callProxy({
        provider,
        model: geminiModel,
        apiKey: geminiKey,
        messages,
        generationConfig: { temperature: 0.7, maxOutputTokens: 8192 },
      });
      if (data?.error) throw new Error(data.error?.message || JSON.stringify(data.error));
      if (provider === "groq") {
        responseText = data?.choices?.[0]?.message?.content || "(brak odpowiedzi)";
      } else {
        responseText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "(brak odpowiedzi)";
        if (data?.usageMetadata) addAiCostUsd(geminiCallCostUsd(geminiModel, data.usageMetadata));
      }
      const aiMsg = { role: "assistant", content: responseText, time: new Date().toLocaleTimeString("pl-PL") };
      const finalMsgs = [...newMsgs, aiMsg];
      setChatMessages(finalMsgs);
      saveChatHistory(finalMsgs);
    } catch (e) {
      const errMsg = { role: "assistant", content: `⚠️ Błąd: ${e.message}`, time: new Date().toLocaleTimeString("pl-PL"), isError: true };
      const finalMsgs = [...newMsgs, errMsg];
      setChatMessages(finalMsgs);
      saveChatHistory(finalMsgs);
    } finally {
      setChatLoading(false);
    }
  };

  const callDiscord = async (payload) => {
    const resp = await fetch("/api/discord", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ webhookUrl: discordWebhook, threadId: discordThread, payload }),
    });
    return resp.json();
  };

  const callUncertainDiscord = async (payload) => {
    if (!uncertainWebhook) return { ok: false };
    const resp = await fetch("/api/discord", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ webhookUrl: uncertainWebhook, threadId: "", payload }),
    });
    return resp.json();
  };

  // Filtr słów kluczowych — odrzuca ogłoszenie ZANIM trafi do Gemini (zero kosztu)
  const getFilterKeywordList = () =>
    filterKeywords.split(/[,\n]/).map(s => s.trim().toLowerCase()).filter(Boolean);

  const matchesFilterKeyword = (listing) => {
    const haystack = `${listing.title} ${listing.desc}`.toLowerCase();
    const keywords = getFilterKeywordList();
    for (const kw of keywords) {
      if (kw && haystack.includes(kw)) return kw;
    }
    return null;
  };

  // ── Filtr roku — odrzuca stare rowery (< MIN_BIKE_YEAR) ZANIM trafią choćby do Groqa ─────────
  // Działa w 2 krokach (patrz użycie w pętli fazy 1):
  //  1) checkListingYearBlock(listing) — lokalny regex na TYTULE, zero kosztu, zero API.
  //     Jeśli w tytule jest jawny rok < MIN_BIKE_YEAR albo słowo "retro"/"vintage"/itp. → odrzuć od razu,
  //     ogłoszenie nawet nie dotrze do Groqa.
  //  2) Jeśli tytuł NIE ma roku ani słowa retro — puszczamy dalej do Groqa, który w Etapie 1 SAM
  //     dodatkowo spróbuje oszacować rok na podstawie modelu/wersji (patrz prompt w classifyWithGroq).
  //     Jeśli Groq oszacuje rok < MIN_BIKE_YEAR → odpowiada "stary" i też nie idzie do Gemini.
  //     Jeśli Groq nie da rady oszacować → normalna klasyfikacja typu, idzie dalej do Gemini,
  //     gdzie rok produkcji jest ostatnią linią obrony (patrz prompt Etapu 2 w analyzeWithGemini).
  const MIN_BIKE_YEAR = 2017;

  const RETRO_KEYWORDS = [
    "retro", "vintage", "oldschool", "old school", "klassiker", "youngtimer",
    "70er", "80er", "90er", "oldtimer", "classic bike", "classic mtb"
  ];

  // Wyciąga rok z tytułu — najpierw próbuje jawnych wzorców roku produkcji (Bj., Baujahr, MY, Modelljahr),
  // dopiero potem "gołego" 4-cyfrowego tokenu w zakresie 1970-2035 (odfiltrowując ceny typu "1800€").
  const extractYearFromTitle = (title) => {
    if (!title) return null;
    const t = title;

    const explicitPatterns = [
      /\bB(?:au)?j(?:ahr)?\.?\s*(\d{4})\b/i,   // Bj. 2016 / Baujahr 2016
      /\bMY\s*'?(\d{2,4})\b/,                   // MY19 / MY 2019 — celowo BEZ flagi i (małe "my" to zwykłe angielskie słowo)
      /\bModelljahr\s*(\d{4})\b/i,
    ];
    for (const re of explicitPatterns) {
      const m = t.match(re);
      if (m) {
        let y = parseInt(m[1], 10);
        if (y < 100) y += y < 50 ? 2000 : 1900; // MY19 -> 2019, MY99 -> 1999
        if (y >= 1970 && y <= 2035) return y;
      }
    }

    // Gołe 4 cyfry, ale NIE gdy bezpośrednio sąsiadują z € / ceną (żeby nie złapać "1800€" jako roku)
    const bareMatches = [...t.matchAll(/\b(19[7-9]\d|20[0-3]\d)\b/g)];
    for (const m of bareMatches) {
      const idx = m.index ?? 0;
      const after = t.slice(idx + m[0].length, idx + m[0].length + 3);
      const before = t.slice(Math.max(0, idx - 3), idx);
      if (/^\s*[€$]/.test(after) || /[€$]\s*$/.test(before)) continue; // to raczej cena, nie rok
      return parseInt(m[1], 10);
    }
    return null;
  };

  const checkListingYearBlock = (listing) => {
    const title = listing.title || "";
    const titleLower = title.toLowerCase();

    const retroHit = RETRO_KEYWORDS.find(kw => titleLower.includes(kw));
    if (retroHit) return { blocked: true, reason: `słowo "${retroHit}" w tytule` };

    const year = extractYearFromTitle(title);
    if (year != null && year < MIN_BIKE_YEAR) {
      return { blocked: true, reason: `rok ${year} < ${MIN_BIKE_YEAR}` };
    }
    return { blocked: false };
  };

  // Ścisła wersja dla PEŁNEGO opisu (faza 2): tylko JAWNIE oznaczony rocznik (Baujahr / Bj. /
  // Jahrgang / Modelljahr / MY). Bez "gołych" lat i słów typu "Klassiker" — w długim opisie dają
  // za dużo fałszywych trafień ("Gabel von 2015 nachgerüstet" w rowerze z 2020, "ein Klassiker").
  // ── Darmowe wykrywacze na tekście ogłoszenia (zero kosztu AI) ──────────────────────────
  // E-bike: tylko twarde dowody napędu (pojemność akumulatora w Wh, znane silniki, "Motor:").
  // Same słowa "E-Bike"/"Pedelec" liczą się tylko w TYTULE — w opisie bywa np. "kein E-Bike".
  const detectEbike = (listing) => {
    const title = listing.title || "";
    const text = `${title}\n${listing.fullDesc || listing.desc || ""}`;
    const m = text.match(/\b\d{3,4}\s?Wh\b/i)
      || text.match(/\b(?:Fazua|Bosch\s+(?:Performance|CX|SX|Smart\s?System)|Shimano\s+(?:Steps|EP\s?8|EP\s?801|EP\s?600|E\s?8000|E\s?7000)|Brose\s+(?:Drive|Mag)|Yamaha\s+PW|TQ\s+HPR|Bafang|DJI\s+Avinox|Akkukapazit[äa]t)\b|\bMotor\s*:\s*\S/i)
      || title.match(/\b(?:E-?MTB|E-?Bike|Pedelec|E-?Fully|E-?Mountainbike|Turbo\s+Levo|Kenevo|Levo\s+SL)\b/i);
    return m ? m[0].trim() : null;
  };
  // Nowy rower ze sklepu = cena detaliczna, na odsprzedaży się nie zarobi. Wymaga OBU sygnałów:
  // sklepu i stanu "nowy" — sklepy sprzedają też używane rowery, te zostawiamy do oceny AI.
  const detectNewFromShop = (listing) => {
    const text = `${listing.title || ""}\n${listing.fullDesc || listing.desc || ""}`;
    const shop = text.match(/\b(?:Online-?Shop|Onlineshop)\b|in unserem (?:Online-?)?(?:Shop|Laden|Geschäft)|Lieferzeit\s*:\s*\d|verfügbare\s+Größen|\b(?:inkl|zzgl)\.?\s*(?:\d{1,2}\s*%\s*)?MwSt/i);
    if (!shop) return null;
    const isNew = text.match(/Zustand\s*:?\s*Neu\b|\bfabrikneu\b|\boriginalverpackt\b|\bNeurad\b|\bNeufahrzeug\b/i);
    return isNew ? `${shop[0].trim()} + ${isNew[0].trim()}` : null;
  };
  // Jeden powód odrzucenia bez AI (cena/e-bike/sklep) albo null
  const freeRejectReason = (listing) => {
    if (listing.price != null && listing.price > maxBuyPrice) return { kind: "price", msg: `cena ${listing.price}€ powyżej limitu zakupu ${maxBuyPrice}€` };
    const eb = excludeElektryk ? detectEbike(listing) : null;
    if (eb) return { kind: "ebike", msg: `e-bike (wykryto: "${eb}")` };
    const shop = detectNewFromShop(listing);
    if (shop) return { kind: "shop", msg: `nowy rower ze sklepu (wykryto: "${shop}")` };
    return null;
  };

  const extractMarkedYear = (text) => {
    if (!text) return null;
    let m = text.match(/\b(?:Baujahr|Bj|Jahrgang)\.?:?\s*(?:ca\.?\s*|etwa\s*)?(\d{4})\b/i)
         || text.match(/\bModell?jahr\.?:?\s*(?:ca\.?\s*|etwa\s*)?(\d{4})\b/i);
    if (m) return parseInt(m[1], 10);
    m = text.match(/\bMY\.?\s*'?(\d{2}|\d{4})\b/); // tylko wielkie "MY"
    if (m) { let y = parseInt(m[1], 10); if (y < 100) y += 2000; return y; }
    return null;
  };

  // Biała lista — zwraca true jeśli ogłoszenie zawiera CHOĆ JEDNO wymagane słowo (sygnał full/dirt).
  // Jeśli lista jest pusta, filtr jest wyłączony (przepuszcza wszystko, jak dotychczas).
  // llama-3.3-70b-versatile został wyłączony przez Groq 16.08.2026 — gpt-oss-120b to oficjalny zamiennik.
  // Model z rozumowaniem: mocny w niuansach (część vs cały rower, szacowanie roku). Wysiłek "low" wystarcza
  // do klasyfikacji i trzyma koszt nisko. Tańsza alternatywa: "openai/gpt-oss-20b".
  const GROQ_CLASSIFIER_MODEL = "openai/gpt-oss-120b";

  // Czas oczekiwania z komunikatu Groqa: "7.66s", "350ms", "3m35.2s", "7h12m3.5s".
  // Wcześniejszy regex łapał tylko pierwszą liczbę, więc np. "7h12m" dawało domyślne 2 min.
  const parseGroqWaitMs = (msg, fallbackMs) => {
    // Wariant "ms" MUSI być pierwszy — druga gałąź może dopasować pusty tekst i by go przesłoniła.
    const m = (msg || "").match(/try again in ([\d.]+ms|(?:\d+h)?(?:\d+m(?!s))?(?:[\d.]+s)?)/i);
    const s = ((m && m[1]) || "").toLowerCase();
    if (!s) return fallbackMs;
    if (/^[\d.]+ms$/.test(s)) return parseFloat(s);
    const h = Number((s.match(/(\d+)h/) || [])[1] || 0);
    const mi = Number((s.match(/(\d+)m(?!s)/) || [])[1] || 0);
    const sec = Number((s.match(/([\d.]+)s/) || [])[1] || 0);
    const total = (h * 3600 + mi * 60 + sec) * 1000;
    return total > 0 ? total : fallbackMs;
  };

  // ── Etap 1: szybka, "głupia" klasyfikacja typu roweru przez Groq ──────────
  // Cel: odrzucić ewidentnie nietrafione typy (szosówki, miejskie, dziecięce, części...) BEZ
  // wysyłania ich do drogiej/limitowanej analizy Gemini. Lekki prompt = minimalne zużycie
  // tokenów na zapytanie, więc nie zapycha limitu TPM Groqa tak jak zrobiłby to pełny prompt z cennikiem.
  // Gdy Groq nie jest pewien typu (lub wystąpi błąd/limit) — NIE odrzucamy, tylko oznaczamy jako
  // "niepewne" i przepuszczamy dalej z niższym priorytetem (patrz Faza 2 w runOneCycle).
  // Parsuje pole klucza Groq — akceptuje jeden klucz LUB kilka (każdy w nowej linii lub po przecinku).
  // Kilka kluczy = kilka NIEZALEŻNYCH dziennych budżetów 500k tokenów (Groq liczy limit per klucz/konto).
  const getGroqKeyList = () =>
    [...new Set(groqClassifierKey.split(/[\n,]/).map(s => s.trim()).filter(Boolean))];

  const classifyWithGroq = async (listing) => {
    const keys = getGroqKeyList();
    if (keys.length === 0) return "niepewne"; // brak klucza = filtr wyłączony, przepuść wszystko

    // ── Wiele kluczy Groq + cooldown PER KLUCZ po dziennym limicie tokenów (TPD) ──────────────
    // UWAGA: limity Groqa liczą się na ORGANIZACJĘ (konto), nie na klucz — kilka kluczy z jednego
    // konta dzieli ten sam limit. Darmowy limit GPT-OSS to ok. 200k tokenów/dzień na model.
    // Najprościej zwiększyć go podpinając kartę (koszt rzędu 1-3 $/mies.). Klucze są używane rotacyjnie (round-robin) między
    // wywołaniami, więc obciążenie rozkłada się równo i żaden klucz nie wyczerpuje się sam pierwszy.
    // Gdy dany klucz dostanie błąd "tokens per day" — dostaje WŁASNY cooldown (nie blokuje innych
    // kluczy) i w TYM SAMYM wywołaniu od razu próbujemy KOLEJNEGO klucza z listy, zamiast czekać.
    // Dopiero gdy WSZYSTKIE klucze są w cooldownie, przepuszczamy jako "niepewne" bez wywołania API.
    const now = Date.now();
    const startIdx = groqKeyIndexRef.current % keys.length;
    groqKeyIndexRef.current = (groqKeyIndexRef.current + 1) % keys.length; // rotacja na następne wywołanie
    const ordered = keys.map((_, i) => keys[(startIdx + i) % keys.length]);
    const usableKeys = ordered.filter(k => (groqKeyCooldownsRef.current[k] || 0) <= now);

    if (usableKeys.length === 0) {
      const soonest = Math.min(...keys.map(k => groqKeyCooldownsRef.current[k] || 0));
      const remainingSec = Math.max(0, Math.ceil((soonest - now) / 1000));
      addLog(`⏸️ Groq: wszystkie klucze (${keys.length}) w cooldownie (TPD) — pomijam wywołanie, najbliższy wznowi za ~${remainingSec}s — ${listing.title}`, "info");
      return "niepewne";
    }

    const prompt = `Klasyfikator ogłoszeń rowerowych. Na podstawie tytułu i opisu określ TYLKO typ roweru.

Typy:
- full — PEŁNE zawieszenie (amortyzator z tyłu + widelec z przodu): enduro/trail/all-mountain/downhill.
- dirt — dirt jump/slopestyle/pumptrack, sztywny hardtail do skoków.
- elektryk_gorski — elektryczny rower górski/e-MTB (napęd + charakter trail/enduro). NIE miejski e-bike.
- inny — reszta: szosówka, gravel, trekking, miejski, dziecięcy, hardtail XC bez cech dirtowych, części, miejski e-bike.

ZASADA: samo słowo "Mountainbike"/"MTB" w tytule BEZ dowodu na pełne zawieszenie = zwykle TANI HARDTAIL, czyli "inny", NIE "full"! Klasyfikuj jako "full" TYLKO gdy jest konkretny dowód: "vollgefedert"/"Fully"/"full suspension", wzmianka o amortyzatorze/zawieszeniu z tyłu ("Dämpfer", "Federung hinten", "Hinterbau"), lub znany model full: Canyon Torque/Spectral/Strive/Neuron/Nerve, Trek Fuel/Slash/Remedy, Specialized Stumpjumper/Enduro/Camber, Cube Stereo/AMS, Santa Cruz, YT, Commencal, Radon Swoop/Slide, Ghost Riot/SL AMR, Focus Jam/Sam/Thron.

ZNANE HARDTAILE (= "inny", nie "full"): Trek Marlin/Roscoe/X-Caliber, Cube Aim/Access/Acid/Analog/Attention/Reaction, BULLS Sharptail/Copperhead/Wildtail/Six50, Rockrider/Rockride (Decathlon, wszystkie ST-serie), Specialized Rockhopper/Pitch/Chisel/Hardrock, Scott Aspect/Scale, Merida Big Nine/Seven/Trail, Ghost Kato/Lanao, Giant Talon/ATX, KTM Chicago/Ultra, Focus Whistler/Raven.

E-BIKE: sygnały napędu ("E-Bike","Akku","Motor",Bosch/Shimano Steps/Brose/Yamaha, przebieg w km, "E1.5"/"E-8"). Z charakterem górskim (zawieszenie/MTB/teren) → elektryk_gorski. Z charakterem miejskim/touring (koszyk, błotniki, "City"/"Trekking") → inny.

CZĘŚCI vs CAŁY ROWER — WAŻNE: samo wymienienie konkretnych komponentów w opisie CAŁEGO roweru na sprzedaż (np. "z widelcem RockShox Pike, kołami Mavic, hamulcami Code") to NORMALNY opis wyposażenia — dalej klasyfikuj normalnie po typie zawieszenia. Odpowiedz "inny" TYLKO gdy z tytułu/opisu WPROST wynika, że przedmiotem ogłoszenia jest SAMA CZĘŚĆ, nie cały rower — np. "verkaufe nur Rahmen", "biete Gabel/Dämpfer/Laufradsatz an", "Ersatzteil", "Teile vom [model]", "nur Rahmenset", "Einzelteile", tytuł zaczynający się od nazwy komponentu bez wzmianki że to kompletny rower. W razie wątpliwości (nie jest jasne czy to część czy cały rower) → niepewne, NIE inny.

ROK PRODUKCJI: Jeśli w tytule/opisie NIE MA podanego roku, ale rozpoznajesz model na tyle dokładnie (nazwa, wersja, charakterystyczne komponenty/kolorystyka danego rocznika), że potrafisz oszacować rok produkcji — i szacowany rok jest WCZEŚNIEJSZY niż 2017 — odpowiedz dokładnie jednym słowem: stary (zamiast normalnej klasyfikacji typu). Jeśli nie potrafisz wiarygodnie oszacować roku, zignoruj tę zasadę i klasyfikuj normalnie.

Brak wystarczających informacji → odpowiedz: niepewne

Tytuł: ${listing.title}
Opis: ${listing.fullDesc || listing.desc}

FORMAT ODPOWIEDZI: Najpierw, w JEDNEJ linii, krótkie uzasadnienie (maks. 15 słów) — co przeważyło o klasyfikacji. Następnie w OSTATNIEJ, OSOBNEJ linii podaj WYŁĄCZNIE jedno słowo z: full/dirt/elektryk_gorski/inny/niepewne/stary — nic więcej w tej linii, żadnej kropki ani komentarza.`;

    addLog(`🔎 Groq: klasyfikuję — ${listing.title}${listing.price != null ? ` (${listing.price}€)` : ""}${keys.length > 1 ? ` [klucz ${ordered.indexOf(usableKeys[0]) + 1}/${keys.length}]` : ""}`, "info");

    // Pętla PO KLUCZACH — gdy aktualny klucz trafi TPD, próbujemy od razu następnego dostępnego,
    // zamiast czekać. Wewnątrz każdego klucza działa krótki retry z backoffem na zwykły RPM 429.
    for (const apiKey of usableKeys) {
      for (let attempt = 1; attempt <= 3; attempt++) {
        const startedAt = Date.now();
        try {
          const data = await callProxy({
            provider: "groq",
            model: GROQ_CLASSIFIER_MODEL,
            apiKey,
            messages: [{ role: "user", content: prompt }],
            // GPT-OSS najpierw "myśli" (tokeny rozumowania liczą się do limitu) — przy 100 odpowiedź
            // byłaby zwykle pusta. 1024 + wysiłek "low" = szybko i tanio, płaci się za faktyczne zużycie.
            generationConfig: { temperature: 0.1, maxOutputTokens: 1024, reasoningEffort: "low" },
          });
          const ms = Date.now() - startedAt;

          if (data?.error) {
            const msg = data.error?.message || "błąd";
            const isDailyLimit = /tokens per day|TPD/i.test(msg);
            const isRateLimit = /rate limit|429|too many requests/i.test(msg);

            if (isDailyLimit) {
              // Dzienny budżet TEGO klucza wyczerpany — cooldown TYLKO dla niego, inne klucze
              // (jeśli są) próbujemy dalej w tym samym wywołaniu, bez czekania.
              const waitMs = parseGroqWaitMs(msg, 120000); // domyślnie 2 min, jeśli nie uda się sparsować
              groqKeyCooldownsRef.current[apiKey] = Date.now() + waitMs + 5000; // +5s zapasu
              const keyLabel = keys.length > 1 ? ` (klucz #${keys.indexOf(apiKey) + 1}/${keys.length})` : "";
              addLog(`⏸️ Groq${keyLabel}: dzienny limit tokenów (TPD) wyczerpany — cooldown ~${Math.ceil((waitMs + 5000) / 1000)}s dla tego klucza${keys.length > 1 ? ", próbuję kolejnego klucza" : ", wszystko dalej idzie jako \"niepewne\""} — ${msg}`, "error");
              break; // przerwij retry na TYM kluczu, przejdź do kolejnego klucza w pętli zewnętrznej
            }

            if (isRateLimit && attempt < 3) {
              const waitMs = parseGroqWaitMs(msg, 3000);
              addLog(`⏳ Groq: limit RPM osiągnięty — czekam ${Math.ceil((waitMs + 300) / 1000)}s, próba ${attempt + 1}/3 — ${listing.title}`, "error");
              await sleep(waitMs + 300);
              continue; // ponów na tym samym kluczu
            }
            addLog(`⚠️ Groq klasyfikator: ${msg} (${ms}ms) — przepuszczam dalej jako niepewne`, "error");
            return "niepewne";
          }

          const raw = (data?.choices?.[0]?.message?.content || "").toLowerCase().trim();
          // Bierzemy TYLKO ostatnią niepustą linię — reszta to opcjonalne krótkie uzasadnienie
          // (patrz prompt: "najpierw uzasadnienie, w OSTATNIEJ linii wyłącznie słowo klasyfikacji").
          // Gdyby patrzeć na cały tekst, wzmianka o innym typie w uzasadnieniu (np. "to nie dirt,
          // tylko full") mogłaby zostać błędnie złapana jako pierwsze pasujące słowo.
          const rawLines = raw.split("\n").map(l => l.trim()).filter(Boolean);
          const lastLine = rawLines.length ? rawLines[rawLines.length - 1] : raw;
          let typ;
          if (lastLine.includes("stary")) typ = "stary";
          else if (lastLine.includes("elektryk")) typ = "elektryk_gorski";
          else if (lastLine.includes("dirt")) typ = "dirt";
          else if (lastLine.includes("full")) typ = "full";
          else if (lastLine.includes("inny")) typ = "inny";
          else typ = "niepewne";

          const icon = { full: "🟢", dirt: "🟠", elektryk_gorski: "⚡", inny: "⚫", niepewne: "❓", stary: "🕰️" }[typ];
          const rawNote = !["full", "dirt", "elektryk_gorski", "inny", "niepewne", "stary"].includes(lastLine) && lastLine && typ === "niepewne"
            ? ` (Groq odpowiedział niejednoznacznie: "${lastLine.slice(0, 40)}")`
            : "";
          // Krótkie uzasadnienie (jeśli Groq je dodał, patrz format promptu) — pomaga debugować klasyfikacje
          const reasonLine = rawLines.length > 1 ? rawLines.slice(0, -1).join(" ").slice(0, 80) : "";
          const reasonNote = reasonLine ? ` — powód: "${reasonLine}"` : "";
          addLog(`${icon} Groq (${ms}ms): typ="${typ}"${rawNote}${reasonNote} — ${listing.title}`, "info");
          return typ;
        } catch (e) {
          const ms = Date.now() - startedAt;
          if (attempt < 3) {
            addLog(`⏳ Groq: błąd sieci (${e.message}, ${ms}ms) — ponawiam za 2s, próba ${attempt + 1}/3 — ${listing.title}`, "error");
            await sleep(2000);
            continue;
          }
          addLog(`⚠️ Groq klasyfikator: ${e.message} (${ms}ms) — przepuszczam dalej jako niepewne`, "error");
          return "niepewne"; // błąd/limit Groqa po 3 próbach → nie odrzucaj, przepuść dalej
        }
      } // koniec pętli prób (RPM retry) dla jednego klucza
    } // koniec pętli po kluczach — tu trafiamy tylko gdy WSZYSTKIE dostępne klucze skończyły się na TPD
    addLog(`⚠️ Groq: wszystkie dostępne klucze (${usableKeys.length}/${keys.length}) trafiły dzienny limit w tym wywołaniu — przepuszczam jako niepewne — ${listing.title}`, "error");
    return "niepewne";
  };

  const scrapeKleinanzeigen = async (bike) => {
    // Kategorie mają gotowy URL z filtrem Kleinanzeigen (np. type_s:mountainbike)
    // Modele/marki konkretne używają wyszukiwania po frazie + DOPIĘTEGO filtra
    // "fahrraeder.type_s:mountainbike" — to ogranicza wyniki TYLKO do ogłoszeń otagowanych
    // przez sprzedającego jako rower górski, więc np. "Giant"/"Marin"/"Norco" (marki które
    // robią też szosówki/miejskie) nie zaśmiecają wyników niezwiązanymi typami rowerów.
    // Format zweryfikowany na realnych URL-ach Kleinanzeigen: /s-fahrraeder/{fraza}/k0c217+fahrraeder.type_s:mountainbike
    const url = bike.isCategory
      ? bike.categoryUrl
      : `https://www.kleinanzeigen.de/s-fahrraeder/${encodeURIComponent(bike.query)}/k0c217+fahrraeder.type_s:mountainbike`;
    const resp = await fetch(`/api/scrape?url=${encodeURIComponent(url)}`);
    if (!resp.ok) throw new Error(`Scrape HTTP ${resp.status}`);
    return resp.text();
  };

  // Kwota z tekstu. requireEuro=true wymaga znaku "€" za liczbą — chroni przed złapaniem
  // przypadkowej liczby (np. "27,5 Zoll", "-20%") gdy szukamy poza właściwym elementem ceny.
  const toPrice = (txt, requireEuro) => {
    if (!txt) return null;
    const re = requireEuro
      ? /(\d{1,3}(?:\.\d{3})+|\d+)(?:,\d{1,2})?\s*€/
      : /(\d{1,3}(?:\.\d{3})+|\d+)(?:,\d{1,2})?/;
    const m = txt.match(re);
    if (!m) return null;
    const val = parseInt(m[1].replace(/\./g, ""), 10);
    return Number.isFinite(val) && val > 0 ? val : null;
  };

  // ── Pełny opis ze strony ogłoszenia ────────────────────────────────────
  // Lista wyników ma tylko ucięty fragment opisu — pełny tekst jest wyłącznie na stronie ogłoszenia.
  // Pobieramy go TYLKO dla rowerów, które przeszły wszystkie tanie filtry i idą do analizy AI
  // (faza 2), z odstępem między zapytaniami, limitem na cykl i bezpiecznikiem na wypadek blokady.
  const DETAIL_FETCH_DELAY_MS = 4000;            // min. odstęp między stronami ogłoszeń (+ losowo do 2 s)
  const MAX_DETAIL_FETCHES_PER_CYCLE = 10;       // twardy limit pobrań na cykl
  const DESC_MAX_CHARS = 3000;                   // dłuższe opisy przycinamy (koszt tokenów)
  const DETAIL_BLOCK_PAUSE_MS = 30 * 60 * 1000;  // po wykryciu blokady: 30 min przerwy w pobieraniu

  const fetchListingDetails = async (listing) => {
    if (!/^https:\/\/(www\.)?kleinanzeigen\.de\//.test(listing.href || "")) {
      return { ok: false, reason: "link spoza Kleinanzeigen" };
    }
    let resp;
    try {
      resp = await fetch(`/api/scrape?url=${encodeURIComponent(listing.href)}`);
    } catch (e) {
      return { ok: false, reason: `błąd sieci: ${e.message}` };
    }
    if (resp.status === 403 || resp.status === 429) return { ok: false, blocked: true, reason: `HTTP ${resp.status}` };
    if (resp.status === 404 || resp.status === 410) return { ok: false, gone: true, reason: "ogłoszenie usunięte" };
    if (!resp.ok) return { ok: false, reason: `HTTP ${resp.status}` };

    const html = await resp.text();
    const doc = new DOMParser().parseFromString(html, "text/html");

    // Opis — warstwowo. Osobne zapytania zamiast jednej listy selektorów: querySelector z listą
    // zwraca PIERWSZY w kolejności dokumentu, a pusty <meta itemprop="description"> w <head>
    // wygrałby z właściwym opisem w treści strony.
    let desc = "";
    const descEl = doc.querySelector("#viewad-description-text") || doc.querySelector("[itemprop=description]:not(meta)");
    if (descEl) {
      descEl.querySelectorAll("br").forEach(br => br.replaceWith("\n")); // zachowaj podział linii
      desc = descEl.textContent || "";
    }
    if (!desc.trim()) {
      for (const s of doc.querySelectorAll('script[type="application/ld+json"]')) {
        try {
          const j = JSON.parse(s.textContent);
          for (const it of (Array.isArray(j) ? j : [j])) {
            if (typeof it?.description === "string" && it.description.length > desc.length) desc = it.description;
          }
        } catch {}
      }
    }
    if (!desc.trim()) desc = doc.querySelector('meta[itemprop="description"]')?.getAttribute("content") || "";
    desc = desc.replace(/[ \t]+/g, " ").replace(/\n\s*\n\s*\n+/g, "\n\n").trim();

    if (!desc) {
      // Sygnały blokady/usunięcia sprawdzamy TYLKO gdy nie ma opisu — inaczej słowo "robot"
      // albo "gelöscht" w treści zwykłego ogłoszenia dałoby fałszywy alarm.
      const bodyText = (doc.body?.textContent || "").toLowerCase();
      if (/captcha|robot|zugriff verweigert|access denied/.test(bodyText)) {
        return { ok: false, blocked: true, reason: "strona blokady/captcha" };
      }
      if (/nicht mehr verfügbar|wurde gelöscht|anzeige ist abgelaufen/.test(bodyText)) {
        return { ok: false, gone: true, reason: "ogłoszenie usunięte" };
      }
      return { ok: false, reason: "nie znaleziono opisu na stronie", doc };
    }

    return {
      ok: true,
      desc: desc.length > DESC_MAX_CHARS ? desc.slice(0, DESC_MAX_CHARS) + "…" : desc,
      fullLength: desc.length,
      price: toPrice(doc.querySelector("#viewad-price")?.textContent, false),
    };
  };

  // ── HTML parser ────────────────────────────────────────────────────────
  const parseListings = (html, bikeLabel) => {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");
    const items = [];

    // Sprawdź czy Kleinanzeigen nie zablokował
    const bodyText = doc.body?.innerText || doc.body?.textContent || "";
    if (bodyText.includes("captcha") || bodyText.includes("robot") || bodyText.includes("blocked")) {
      addLog("⚠️ Kleinanzeigen wykrył bota — captcha!", "error");
      return [];
    }

    // Próbuj różne selektory — Kleinanzeigen zmienia strukturę
    const articles = doc.querySelectorAll("article.aditem, li.aditem, [data-adid], .ad-listitem");

    let firstNoPriceArticle = null; // do diagnostyki, gdy parser przestaje znajdować ceny

    articles.forEach(article => {
      // Link i ID — najważniejsze
      const linkEl = article.querySelector("a[href*='/s-anzeige/'], a[href*='/anzeige/']");
      if (!linkEl) return;
      const href = linkEl.getAttribute("href").startsWith("http")
        ? linkEl.getAttribute("href")
        : "https://www.kleinanzeigen.de" + linkEl.getAttribute("href");

      const idMatch = href.match(/-(\d{7,})/);
      const listingId = idMatch ? idMatch[1] : href;

      // ── Układ strony: od ~09.2026 Kleinanzeigen serwuje wyniki w nowym układzie (Astro/Tailwind):
      // karta = article[data-adid], tytuł = h3, opis = <p> zaraz za h3, cena = p.text-title3
      // (pierwsza = aktualna; przekreślona stara cena po obniżce jest pomijana). Stary układ
      // (aditem-main--*) zostaje jako PIERWSZY wybór — na wypadek, gdyby część stron była po staremu.
      const jsonLd = (() => {
        for (const sc of article.querySelectorAll('script[type="application/ld+json"]')) {
          try { const j = JSON.parse(sc.textContent); if (j && typeof j === "object") return j; } catch {}
        }
        return null;
      })();
      // Przekreślona (stara) cena — pomijamy przy szukaniu aktualnej
      const isStruck = (el) => !!el.closest("del, s, [class*=line-through], [class*=strike]");

      // Tytuł: h3 (nowy układ) → stare selektory → JSON-LD karty
      const titleEl = article.querySelector("h3")
        || article.querySelector("h2, .ellipsis, .aditem-main--middle--headline, [class*=headline]");
      const title = titleEl?.textContent?.trim() || jsonLd?.title?.trim() || linkEl.textContent.trim();
      if (!title) return;

      // Cena — od najpewniejszego źródła:
      // 1) stara, znana klasa elementu ceny
      let price = toPrice(article.querySelector(".aditem-main--middle--price-shipping--price")?.textContent, false);
      // 2) nowy układ: pierwszy NIEprzekreślony p.text-title3 (tekst musi wyglądać na cenę)
      if (price == null) {
        for (const el of article.querySelectorAll("p.text-title3")) {
          if (isStruck(el)) continue;
          const t = el.textContent || "";
          if (/€|VB|verschenken/i.test(t)) { price = toPrice(t, false); break; }
        }
      }
      // 3) dowolny element z "price" w klasie, zawierający kwotę z "€"
      if (price == null) {
        for (const el of article.querySelectorAll("[class*=price]")) {
          if (isStruck(el)) continue;
          price = toPrice(el.textContent, true);
          if (price != null) break;
        }
      }
      // 4) element, którego CAŁY tekst to cena (np. "1.550 € VB") — niezależny od nazw klas.
      //    Celowo NIE przeszukujemy całego tekstu karty: w opisie i w ukrytym bloku danych (JSON-LD)
      //    bywają inne kwoty, np. "Neupreis 3.000 €", które dałyby fałszywą cenę.
      if (price == null) {
        for (const el of article.querySelectorAll("p, span, div, strong, b")) {
          if (el.closest("script, style") || isStruck(el)) continue;
          const t = (el.textContent || "").trim();
          if (/^(\d{1,3}(?:\.\d{3})+|\d+)(?:,\d{1,2})?\s*€(?:\s*VB)?$/.test(t)) { price = toPrice(t, true); break; }
        }
      }
      if (price == null && !firstNoPriceArticle) firstNoPriceArticle = article;

      // Opis: stara klasa → <p> zaraz za tytułem (nowy układ, ale nie element ceny) → JSON-LD karty
      let descEl = article.querySelector("[class*=description], .aditem-main--middle--description");
      if (!descEl) {
        const afterTitle = article.querySelector("h3 + p");
        if (afterTitle && !afterTitle.matches(".text-title3")) descEl = afterTitle;
      }
      const desc = descEl?.textContent?.trim() || (typeof jsonLd?.description === "string" ? jsonLd.description.trim() : "");
      const locEl  = article.querySelector("[class*=locality], [class*=location], .aditem-main--top--left");

      items.push({
        listingId, title, price, href,
        desc,
        location: locEl?.textContent?.trim() || "",
        bike:     bikeLabel,
      });
    });

    // Diagnostyka: większość sprzedających podaje cenę, więc gdy połowa+ ogłoszeń jej "nie ma",
    // to najpewniej parser nie pasuje do aktualnego HTML-a Kleinanzeigen.
    const noPriceCount = items.filter(i => i.price == null).length;
    if (items.length >= 4 && noPriceCount / items.length >= 0.5) {
      addLog(`⚠️ Parser: ${noPriceCount}/${items.length} ogłoszeń bez odczytanej ceny (${bikeLabel}) — możliwa zmiana HTML Kleinanzeigen`, "error");
      if (firstNoPriceArticle && !priceDiagLoggedRef.current) {
        priceDiagLoggedRef.current = true;
        // Najkrótsze elementy z "€" (z tagiem i klasami) + tekst karty BEZ skryptów — to wystarczy,
        // żeby dopasować parser do nowego układu.
        const euroEls = [...firstNoPriceArticle.querySelectorAll("*")]
          .filter(el => el.children.length === 0 && !el.closest("script, style") && /€/.test(el.textContent || ""))
          .slice(0, 5)
          .map(el => `${el.tagName.toLowerCase()}.${(el.getAttribute("class") || "").trim().split(/\s+/).join(".")}="${(el.textContent || "").trim().slice(0, 30)}"`);
        const clean = firstNoPriceArticle.cloneNode(true);
        clean.querySelectorAll("script, style").forEach(n => n.remove());
        const cardText = (clean.textContent || "").replace(/\s+/g, " ").trim().slice(0, 300);
        addLog(`🔍 Diagnostyka ceny (skopiuj to do czatu): elementy z € = [${euroEls.join(" | ") || "brak"}] · tekst="${cardText}"`, "error");
      }
    }

    return items;
  };

  // ── Gemini analysis ────────────────────────────────────────────────────
