<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DirtDealFinder 🚲</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080d18; color: #e2e8f0; font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 14px; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0d1526; }
    ::-webkit-scrollbar-thumb { background: #2d3f5c; border-radius: 3px; }
    input, select, textarea {
      background: #111c2e !important; color: #e2e8f0 !important;
      border: 1px solid #1e3352 !important; border-radius: 8px !important;
      padding: 9px 12px !important; outline: none !important; width: 100%;
      font-family: inherit; font-size: 13px;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #f59e0b !important;
      box-shadow: 0 0 0 2px #f59e0b18 !important;
    }
    input::placeholder, textarea::placeholder { color: #334155 !important; }
    button { cursor: pointer; font-family: inherit; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// Typy wpisów:
//   isCategory: true  → categoryUrl to pełny URL Kleinanzeigen z filtrem kategorii
//   (brak)            → query to fraza wyszukiwana w /s-fahrraeder/{query}/k0c217
const BIKE_MODELS = [
  {
    id: "cat_mountainbike",
    label: "🏔️ Mountain Bike",
    isCategory: true,
    categoryUrl: "https://www.kleinanzeigen.de/s-fahrraeder/preis:0:2000/c217+fahrraeder.type_s:mountainbike",
  },
];

// Etykiety typu roweru zwracanego przez Gemini/Groq
const TYPE_LABELS = {
  full: { label: "🟢 Full",  color: "#22c55e" },
  dirt: { label: "🟠 Dirt",  color: "#f59e0b" },
  elektryk_gorski: { label: "⚡ Elektryk górski", color: "#38bdf8" },
  czesc: { label: "🔧 Część", color: "#a855f7" },
  stary: { label: "🕰️ Stary", color: "#78716c" },
  inny: { label: "⚫ Inny",  color: "#475569" },
};

const PROVIDERS = {
  gemini: {
    label: "Google Gemini",
    models: [
      { id: "gemini-2.5-flash",      label: "Gemini 2.5 Flash (zalecany)" },
      { id: "gemini-2.5-flash-lite", label: "Gemini 2.5 Flash-Lite (najtańszy, domyślnie bez myślenia)" },
      { id: "gemini-flash-latest",   label: "Gemini 3.5 Flash (najnowszy, droższy)" },
      { id: "gemini-2.5-pro",        label: "Gemini 2.5 Pro" },
    ],
    keyPlaceholder: "AIza...",
    keyHint: "aistudio.google.com/apikey",
  },
  groq: {
    label: "Groq (darmowy, bez karty)",
    models: [
      { id: "openai/gpt-oss-120b",      label: "GPT-OSS 120B (zalecany — tani, z rozumowaniem)" },
      { id: "openai/gpt-oss-20b",       label: "GPT-OSS 20B (tańszy, szybszy)" },
    ],
    keyPlaceholder: "gsk_...",
    keyHint: "console.groq.com/keys",
  },
};

// Groq wyłączył modele Llama 16.08.2026 (zapytania zwracają "model does not exist").
// Zapisane w ustawieniach stare ID zamieniamy na oficjalne zamienniki Groqa — inaczej dropdown
// POKAZYWAŁBY nowy model, a aplikacja dalej po cichu wysyłałaby martwy.
const DEAD_GROQ_MODELS = {
  "llama-3.3-70b-versatile": "openai/gpt-oss-120b",
  "llama-3.1-8b-instant":    "openai/gpt-oss-20b",
  "mixtral-8x7b-32768":      "openai/gpt-oss-120b",
};

// Znacznik wersji — widoczny w nagłówku i w logu startu, żeby łatwo sprawdzić co działa na Vercelu.
const APP_VERSION = "2026-10-08 · v3 pełne opisy";

const SC = {
  analyzing: { bg: "#8b5cf622", color: "#a78bfa", border: "#8b5cf655", label: "AI analizuje…" },
  deal:      { bg: "#22c55e22", color: "#22c55e", border: "#22c55e55", label: "✅ Okazja!" },
  skip:      { bg: "#1e293b",   color: "#475569", border: "#1e293b",   label: "⏭ Pominięte" },
  sent:      { bg: "#3b82f622", color: "#60a5fa", border: "#3b82f655", label: "📨 Wysłano" },
  error:     { bg: "#ef444422", color: "#f87171", border: "#ef444455", label: "⚠️ Błąd" },
};

function Badge({ status }) {
  const s = SC[status] || SC.skip;
  return (
    <span style={{ background: s.bg, color: s.color, border: `1px solid ${s.border}`,
      borderRadius: 6, padding: "2px 10px", fontSize: 11, fontWeight: 700, letterSpacing: 0.4 }}>
      {s.label}
    </span>
  );
}

function App() {
  const [tab, setTab] = useState("scanner");

  const [cfg] = useState(() => {
    try { return JSON.parse(localStorage.getItem("ddf_cfg") || "{}"); } catch { return {}; }
  });
  const [geminiKey,      setGeminiKey]      = useState(cfg.geminiKey || "");
  const [provider,       setProvider]       = useState(cfg.provider || "groq");
  const [geminiModel,    setGeminiModel]    = useState(() => {
    // Migracja: martwe ID → zamiennik; model spoza listy providera → pierwszy z listy
    // (dropdown i tak pokazałby pierwszą opcję — stan musi się z tym zgadzać).
    const p = PROVIDERS[cfg.provider || "groq"] || PROVIDERS.groq;
    let m = cfg.geminiModel || p.models[0].id;
    m = DEAD_GROQ_MODELS[m] || m;
    return p.models.some(x => x.id === m) ? m : p.models[0].id;
  });
  const [geminiChatName, setGeminiChatName] = useState(cfg.geminiChatName || "");
  const [minProfit,      setMinProfit]      = useState(cfg.minProfit || 20);
  // Klucz Groq używany WYŁĄCZNIE do szybkiej, lekkiej klasyfikacji typu roweru (etap 1) — niezależnie od
  // tego jaki provider jest wybrany do właściwej analizy opłacalności (etap 2, zwykle Gemini).
  const [groqClassifierKey, setGroqClassifierKey] = useState(cfg.groqClassifierKey || "");
  // Ile rowerów maksymalnie wysyłamy do Gemini (etap 2, drogi/limitowany) w ramach JEDNEGO cyklu skanowania.
  const [maxGeminiPerCycle, setMaxGeminiPerCycle] = useState(cfg.maxGeminiPerCycle ?? 25);
  // Ogłoszenia sklasyfikowane przez Groq jako "niepewne" (z ceną) idą do Gemini TYLKO jeśli cena >= ten próg.
  // Cel: przy niepewnym typie i niskiej cenie prawdopodobieństwo że to coś wartego uwagi jest niskie —
  // nie warto marnować wywołania Gemini. Ogłoszenia bez podanej ceny ZAWSZE trafiają do listy niepewnych
  // (nie przechodzą przez ten próg, bo nie ma z czym porównać).
  const [minUncertainPrice, setMinUncertainPrice] = useState(cfg.minUncertainPrice ?? 500);
  const [priceKnowledge, setPriceKnowledge] = useState(() => {
    try { return JSON.parse(localStorage.getItem("ddf_price_knowledge") || "[]"); } catch { return []; }
  });
  const [discordWebhook, setDiscordWebhook] = useState(cfg.discordWebhook || "");
  const [discordThread,  setDiscordThread]  = useState(cfg.discordThread || "");
  const [uncertainWebhook, setUncertainWebhook] = useState(cfg.uncertainWebhook || "");
  // UWAGA: "E-Bike"/"Ebike"/"Pedelec"/"Elektrofahrrad" CELOWO NIE są tu wpisane — o tym czy elektryk jest
  // górski (elektryk_gorski, chcemy) czy miejski/touringowy (inny, nie chcemy) decyduje Groq w Etapie 1
  // na podstawie kontekstu. Blankietowe blokowanie tych słów odrzucałoby też wartościowe e-MTB.
  const DEFAULT_FILTER_KEYWORDS = "Rennrad, Gravel, Trekkingrad, Hollandrad, Cityrad, Stadtrad, Kinderfahrrad, Laufrad, Klapprad, Liegerad, Dreirad, Rollator, Ersatzteile, Einzelteile, nur Rahmen, Rahmen only, Rahmenset, Bastlerrad, Schrott, gesucht, Kinder, Jugend, 12 Zoll, 16 Zoll, 20 Zoll, 24 Zoll, Damenrad, Herrenrad, Tourenrad, Reiserad, Crossrad, Fitnessbike, Singlespeed, Fixie, BMX Freestyle, Faltrad, Lastenrad, Cargobike, Seniorenrad, Elektroroller, E-Scooter, Escooter, Motorroller, Tretroller, Kickscooter, Balance Bike, Laufrädchen, Fahrradanhänger, Kinderanhänger, Kinderwagen, Fahrradträger, Rollstuhl, Vermietung, Verleih, Miete, Tausch gegen, Deko, Bastelobjekt, Spielzeugrad, Puky, Kettcar, Dreiradwagen";
  const [filterKeywords, setFilterKeywords] = useState(cfg.filterKeywords ?? DEFAULT_FILTER_KEYWORDS);
  const [selectedBikes,  setSelectedBikes]  = useState(() => {
    const saved = cfg.selectedBikes;
    if (!saved) return BIKE_MODELS.map(b => b.id);
    // Migracja: stary id mtb_full_category -> nowy cat_mountainbike
    const migrated = saved.map(id => id === 'mtb_full_category' ? 'cat_mountainbike' : id);
    // Dodaj nowe kategorie jeśli ich nie ma
    ['cat_mountainbike','cat_dirt_bmx','cat_downhill'].forEach(id => {
      if (!migrated.includes(id)) migrated.push(id);
    });
    return migrated.filter(id => BIKE_MODELS.some(b => b.id === id));
  });

  const [logs,     setLogs]     = useState([]);
  const [results,  setResults]  = useState([]);
  const [running,  setRunning]  = useState(false);
  const [stats,    setStats]    = useState({ scanned: 0, deals: 0, sent: 0 });
  const [cycleNum, setCycleNum] = useState(0);

  // ── Chat state ─────────────────────────────────────────────────────────
  const [chatMessages, setChatMessages] = useState(() => {
    try { return JSON.parse(localStorage.getItem("ddf_chat") || "[]"); } catch { return []; }
  });
  const [chatInput, setChatInput]   = useState("");
  const [chatLoading, setChatLoading] = useState(false);
  const [showKnowledgePanel, setShowKnowledgePanel] = useState(false);
  const chatEndRef = useRef(null);

  useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [chatMessages]);

  const saveChatHistory = (msgs) => {
    try { localStorage.setItem("ddf_chat", JSON.stringify(msgs.slice(-200))); } catch {}
  };

  const savePriceKnowledge = (entries) => {
    try { localStorage.setItem("ddf_price_knowledge", JSON.stringify(entries)); } catch {}
    setPriceKnowledge(entries);
  };

  const addKnowledgeFromMessage = (content) => {
    const entry = { id: Date.now() + Math.random(), text: content.trim(), addedAt: new Date().toLocaleString("pl-PL") };
    savePriceKnowledge([...priceKnowledge, entry]);
  };

  const removeKnowledgeEntry = (id) => {
    savePriceKnowledge(priceKnowledge.filter(e => e.id !== id));
  };

  const runningRef   = useRef(false);
  const priceDiagLoggedRef = useRef(false); // szczegółowa diagnostyka parsera cen — tylko raz na sesję
  const descDiagLoggedRef  = useRef(false); // diagnostyka parsera pełnego opisu — tylko raz na sesję
  const detailBlockedUntilRef = useRef(0);  // bezpiecznik: do kiedy NIE pobieramy stron ogłoszeń (po blokadzie)
  const firstCycleRef = useRef(true); // cykl #1 = tylko zbieramy ID, nie analizujemy
  const geminiCallsRef = useRef(0); // licznik analiz Gemini w BIEŻĄCYM cyklu — reset na starcie każdego cyklu
  const logsEndRef  = useRef(null);

  // Zapamiętaj widziane ogłoszenia między restartami — ID + historia ceny (do wykrywania spadków).
  // Format w localStorage: tablica obiektów {id, price, lowest, notifiedAt, type}.
  // MIGRACJA: stary format to goła tablica ID-stringów — każdy taki wpis dostaje
  // {price:null, lowest:null, ...} (brak punktu odniesienia), żeby pierwszy skan po
  // aktualizacji NIE strzelił fałszywym "spadkiem ceny" dla wszystkiego naraz.
  const loadSeenMap = () => {
    const map = new Map();
    try {
      const raw = JSON.parse(localStorage.getItem("ddf_seen") || "[]");
      for (const item of raw) {
        if (typeof item === "string") {
          map.set(item, { price: null, lowest: null, notifiedAt: null, type: null });
        } else if (item && item.id) {
          map.set(item.id, {
            price: item.price ?? null, lowest: item.lowest ?? null,
            notifiedAt: item.notifiedAt ?? null, type: item.type ?? null,
          });
        }
      }
    } catch {}
    return map;
  };
  const seenIdsRef = useRef(loadSeenMap());

  const persistSeenMap = () => {
    try {
      const arr = [...seenIdsRef.current.entries()].slice(-2000).map(([id, d]) => ({ id, ...d }));
      localStorage.setItem("ddf_seen", JSON.stringify(arr));
    } catch {}
  };

  // Nowo odkryte ogłoszenie — zapamiętaj z ceną z chwili pierwszego zobaczenia jako punkt odniesienia.
  const saveSeenEntry = (listing) => {
    seenIdsRef.current.set(listing.listingId, {
      price: listing.price ?? null, lowest: listing.price ?? null, notifiedAt: null, type: null,
    });
    persistSeenMap();
  };

  // Po udanej klasyfikacji Etapu 1 — zapamiętaj typ, żeby przy kolejnym spadku ceny pominąć Groq.
  const updateSeenType = (id, typ) => {
    const e = seenIdsRef.current.get(id);
    if (e) { e.type = typ; persistSeenMap(); }
  };

  useEffect(() => { logsEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [logs]);

  const saveSettings = () => {
    const data = { geminiKey, geminiModel, geminiChatName, discordWebhook, discordThread, uncertainWebhook, filterKeywords, groqClassifierKey, maxGeminiPerCycle, minUncertainPrice, selectedBikes, provider, minProfit };
    localStorage.setItem("ddf_cfg", JSON.stringify(data));
    addLog("💾 Ustawienia zapisane", "success");
  };

  const addLog = useCallback((msg, type = "info") => {
    setLogs(prev => [...prev.slice(-499), {
      time: new Date().toLocaleTimeString("pl-PL"), msg, type,
    }]);
  }, []);

  // ── Proxy API calls ────────────────────────────────────────────────────
  const callProxy = async (body) => {
    const resp = await fetch("/api/gemini", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const ct = resp.headers.get("content-type") || "";
    if (!ct.includes("application/json")) {
      throw new Error(`Proxy zwróciło HTML zamiast JSON (HTTP ${resp.status}) — sprawdź czy plik api/gemini.js jest wgrany na serwer`);
    }
    return resp.json();
  };

  // Wywołanie AI — obsługuje Gemini i Groq przez backend proxy /api/gemini
  const callGemini = async (prompt) => {
    const data = await callProxy({
      provider,
      model: geminiModel,
      apiKey: geminiKey,
      messages: provider === "groq"
        ? [{ role: "user", content: prompt }]
        : [{ role: "user", parts: [{ text: prompt }] }],
      // Groq/GPT-OSS: tokeny rozumowania liczą się do limitu — 4096 daje zapas na myślenie + JSON
      // (płaci się tylko za faktycznie użyte tokeny, sam limit nic nie kosztuje).
      generationConfig: provider === "groq"
        ? { temperature: 0.3, maxOutputTokens: 4096, reasoningEffort: "medium" }
        : { temperature: 0.3, maxOutputTokens: 2048, responseMimeType: "application/json" },
    });
    if (data?.error) throw new Error(data.error?.message || JSON.stringify(data.error));
    if (provider === "groq") {
      const choice = data?.choices?.[0];
      const text = choice?.message?.content || "";
      // Ucięta odpowiedź ("length") zgłaszana jak u Gemini, zamiast udawać kompletną.
      const finishReason = choice?.finish_reason === "length" ? "MAX_TOKENS" : "STOP";
      return { candidates: [{ content: { parts: [{ text }] }, finishReason }] };
    }
    return data;
  };

  const sendChatMessage = async () => {
    if (!chatInput.trim() || chatLoading) return;
    if (!geminiKey) { alert("Wpisz klucz API w Ustawieniach, żeby korzystać z chatu."); return; }
    const userMsg = { role: "user", content: chatInput.trim(), time: new Date().toLocaleTimeString("pl-PL") };
    const newMsgs = [...chatMessages, userMsg];
    setChatMessages(newMsgs);
    setChatInput("");
    setChatLoading(true);

    try {
      let responseText = "";

      const knowledgeBlock = priceKnowledge.length > 0
        ? `Oto Twoja baza wiedzy o cenach rowerów, zbudowana z realnych transakcji i notatek użytkownika. Korzystaj z niej zawsze gdy oceniasz wartość roweru lub odpowiadasz na pytania o ceny:\n\n${priceKnowledge.map((e, i) => `${i + 1}. ${e.text}`).join("\n")}\n\n---\n\n`
        : "";

      const historyForApi = [...newMsgs];
      if (knowledgeBlock) {
        // Wstrzyknij bazę wiedzy jako kontekst do pierwszej wiadomości w wysyłce (nie zapisujemy tego w widocznej historii)
        historyForApi[0] = { ...historyForApi[0], content: knowledgeBlock + historyForApi[0].content };
      }

      const messages = provider === "groq"
        ? historyForApi.map(m => ({ role: m.role === "assistant" ? "assistant" : "user", content: m.content }))
        : historyForApi.map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] }));

      const data = await callProxy({
        provider,
        model: geminiModel,
        apiKey: geminiKey,
        messages,
        generationConfig: { temperature: 0.7, maxOutputTokens: 8192 },
      });
      if (data?.error) throw new Error(data.error?.message || JSON.stringify(data.error));
      if (provider === "groq") {
        responseText = data?.choices?.[0]?.message?.content || "(brak odpowiedzi)";
      } else {
        responseText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "(brak odpowiedzi)";
      }
      const aiMsg = { role: "assistant", content: responseText, time: new Date().toLocaleTimeString("pl-PL") };
      const finalMsgs = [...newMsgs, aiMsg];
      setChatMessages(finalMsgs);
      saveChatHistory(finalMsgs);
    } catch (e) {
      const errMsg = { role: "assistant", content: `⚠️ Błąd: ${e.message}`, time: new Date().toLocaleTimeString("pl-PL"), isError: true };
      const finalMsgs = [...newMsgs, errMsg];
      setChatMessages(finalMsgs);
      saveChatHistory(finalMsgs);
    } finally {
      setChatLoading(false);
    }
  };

  const callDiscord = async (payload) => {
    const resp = await fetch("/api/discord", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ webhookUrl: discordWebhook, threadId: discordThread, payload }),
    });
    return resp.json();
  };

  const callUncertainDiscord = async (payload) => {
    if (!uncertainWebhook) return { ok: false };
    const resp = await fetch("/api/discord", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ webhookUrl: uncertainWebhook, threadId: "", payload }),
    });
    return resp.json();
  };

  // Filtr słów kluczowych — odrzuca ogłoszenie ZANIM trafi do Gemini (zero kosztu)
  const getFilterKeywordList = () =>
    filterKeywords.split(/[,\n]/).map(s => s.trim().toLowerCase()).filter(Boolean);

  const matchesFilterKeyword = (listing) => {
    const haystack = `${listing.title} ${listing.desc}`.toLowerCase();
    const keywords = getFilterKeywordList();
    for (const kw of keywords) {
      if (kw && haystack.includes(kw)) return kw;
    }
    return null;
  };

  // ── Filtr roku — zero kosztu, ZANIM cokolwiek trafi do Groqa/Gemini ────────
  // Łapie TYLKO jawny rok/retro w tekście. Brak jawnego roku → przepuszczamy dalej,
  // Groq (etap 1) spróbuje oszacować rok z modelu/osprzętu; jeśli i on nie da rady,
  // trafia do Gemini jako zwykły kandydat.
  const MIN_YEAR = 2017;
  const PRICE_DROP_THRESHOLD = 0.20; // 20% spadku ceny na znanym ogłoszeniu żeby uznać to za istotną zmianę

  const extractExplicitYear = (listing) => {
    const text = `${listing.title} ${listing.desc}`;

    if (/\b(retro|vintage|oldschool|old school|klassiker|klassik|90er|80er|90s|80s)\b/i.test(text)) {
      return "retro/vintage";
    }

    let m = text.match(/\bB(?:au)?j(?:ahr)?\.?:?\s*(\d{4})\b/i);
    if (m) return parseInt(m[1], 10);

    // "MY" celowo BEZ flagi i (tylko wielkie litery) i tylko 2 lub 4 cyfry — inaczej np.
    // angielskie "my 160mm fork" dawało "rok 160" i odrzucenie dobrego roweru.
    m = text.match(/\bMY\.?\s*'?(\d{2}|\d{4})\b/) || text.match(/\bModell?jahr\.?:?\s*(\d{4})\b/i);
    if (m) {
      let y = parseInt(m[1], 10);
      if (y < 100) y += 2000;
      return y;
    }

    const yearMatches = [...text.matchAll(/\b(19[89]\d|20[0-2]\d)\b/g)].map(x => parseInt(x[1], 10));
    if (yearMatches.length > 0) return Math.min(...yearMatches); // ostrożnie: bierz najstarszy

    return null;
  };

  const matchesYearFilter = (listing) => {
    const year = extractExplicitYear(listing);
    if (year === null) return null;
    if (year === "retro/vintage") return "retro/vintage";
    if (typeof year === "number" && year < MIN_YEAR) return `rok ${year} < ${MIN_YEAR}`;
    return null;
  };

  // Ścisła wersja dla PEŁNEGO opisu: tylko JAWNIE oznaczony rocznik (Baujahr / Bj. / Jahrgang /
  // Modelljahr / MY). Bez "gołych" lat i słów typu "Klassiker" — w długim opisie dają za dużo
  // fałszywych trafień ("Gabel von 2015 nachgerüstet" w rowerze z 2020, "ein Klassiker unter den Enduros").
  const extractMarkedYear = (text) => {
    if (!text) return null;
    let m = text.match(/\b(?:Baujahr|Bj|Jahrgang)\.?:?\s*(?:ca\.?\s*|etwa\s*)?(\d{4})\b/i)
         || text.match(/\bModell?jahr\.?:?\s*(?:ca\.?\s*|etwa\s*)?(\d{4})\b/i);
    if (m) return parseInt(m[1], 10);
    m = text.match(/\bMY\.?\s*'?(\d{2}|\d{4})\b/); // tylko wielkie "MY"
    if (m) { let y = parseInt(m[1], 10); if (y < 100) y += 2000; return y; }
    return null;
  };

  // Biała lista — zwraca true jeśli ogłoszenie zawiera CHOĆ JEDNO wymagane słowo (sygnał full/dirt).

  const GROQ_CLASSIFIER_MODEL = "openai/gpt-oss-20b";  // szybki, tani, z rozumowaniem (wysiłek "low")
  const GROQ_ESCALATION_MODEL = "openai/gpt-oss-120b"; // mocniejszy — tylko dla "niepewne" z etapu 1a

  // Cel: odrzucić ewidentnie nietrafione typy (szosówki, miejskie, dziecięce, części...) BEZ
  // wysyłania ich do drogiej/limitowanej analizy Gemini. Lekki prompt = minimalne zużycie
  // tokenów na zapytanie, więc nie zapycha limitu TPM Groqa tak jak zrobiłby to pełny prompt z cennikiem.
  // Gdy Groq nie jest pewien typu (lub wystąpi błąd/limit) — NIE odrzucamy, tylko oznaczamy jako
  // "niepewne" i przepuszczamy dalej z niższym priorytetem (patrz Faza 2 w runOneCycle).
  const classifyWithGroq = async (listing) => {
    if (!groqClassifierKey) return "niepewne"; // brak klucza = filtr wyłączony, przepuść wszystko

    const buildClassifierPrompt = () => `Klasyfikator ogłoszeń rowerowych. Na podstawie tytułu i opisu określ TYLKO typ roweru.

Typy:
- full — PEŁNE zawieszenie (amortyzator z tyłu + widelec z przodu): enduro/trail/all-mountain/downhill.
- dirt — dirt jump/slopestyle/pumptrack, sztywny hardtail do skoków.
- elektryk_gorski — elektryczny rower górski/e-MTB (napęd + charakter trail/enduro). NIE miejski e-bike.
- czesc — to NIE JEST cały rower, tylko POJEDYNCZA CZĘŚĆ/KOMPONENT wystawiona na sprzedaż osobno (sama rama, sam widelec, sam amortyzator, same koła, napęd itp — ogłoszenie SPRZEDAJE TĘ CZĘŚĆ, a nie kompletny rower z tą częścią zamontowaną). UWAGA: jeśli ogłoszenie sprzedaje CAŁY, KOMPLETNY rower i tylko WYMIENIA jego wyposażenie w opisie (np. "Canyon Spectral z widelcem Fox 36 i amortyzatorem DPX2") — to NIE jest "czesc", to normalny rower ze szczegółowym opisem osprzętu. "czesc" dotyczy WYŁĄCZNIE sytuacji gdy tytuł/opis jednoznacznie mówi że przedmiotem sprzedaży jest sama część, nie cały rower.
- stary — rower JEST full/dirt/elektryk_gorski, ale na podstawie modelu, generacji osprzętu lub wprost podanego roku szacujesz rok produkcji na PRZED 2017. Nie myl z "inny" — "stary" to rower który TYPEM by się kwalifikował, ale jest zbyt stary.
- inny — reszta: szosówka, gravel, trekking, miejski, dziecięcy, hardtail XC bez cech dirtowych, miejski e-bike.

ZASADA: samo słowo "Mountainbike"/"MTB" w tytule BEZ dowodu na pełne zawieszenie = zwykle TANI HARDTAIL, czyli "inny", NIE "full"! Klasyfikuj jako "full" TYLKO gdy jest konkretny dowód: "vollgefedert"/"Fully"/"full suspension", wzmianka o amortyzatorze/zawieszeniu z tyłu ("Dämpfer", "Federung hinten", "Hinterbau"), lub znany model full: Canyon Torque/Spectral/Strive/Neuron/Nerve, Trek Fuel/Slash/Remedy, Specialized Stumpjumper/Enduro/Camber, Cube Stereo/AMS, Santa Cruz, YT, Commencal, Radon Swoop/Slide, Ghost Riot/SL AMR, Focus Jam/Sam/Thron.

ZNANE HARDTAILE (= "inny", nie "full"): Trek Marlin/Roscoe/X-Caliber, Cube Aim/Access/Acid/Analog/Attention/Reaction, BULLS Sharptail/Copperhead/Wildtail/Six50, Rockrider/Rockride (Decathlon, wszystkie ST-serie), Specialized Rockhopper/Pitch/Chisel/Hardrock, Scott Aspect/Scale, Merida Big Nine/Seven/Trail, Ghost Kato/Lanao, Giant Talon/ATX, KTM Chicago/Ultra, Focus Whistler/Raven.

E-BIKE: sygnały napędu ("E-Bike","Akku","Motor",Bosch/Shimano Steps/Brose/Yamaha, przebieg w km, "E1.5"/"E-8"). Z charakterem górskim (zawieszenie/MTB/teren) → elektryk_gorski. Z charakterem miejskim/touring (koszyk, błotniki, "City"/"Trekking") → inny.

ROK PRODUKCJI: jeśli tytuł/opis PODAJE rok wprost — użyj go. Jeśli NIE podaje roku wprost, OSZACUJ rok na podstawie modelu i generacji osprzętu — tylko jeśli masz z czego wnioskować. Jeśli oszacowany lub podany rok to przed 2017 → typ: "stary". Jeśli NIE masz żadnej podstawy żeby ocenić rok (brak roku, nieznany/nierozpoznawalny model) — NIE zgaduj, po prostu klasyfikuj normalnie po typie.

Brak wystarczających informacji żeby ocenić typ → odpowiedz: niepewne

Tytuł: ${listing.title}
Opis: ${listing.fullDesc || listing.desc}

Odpowiedz WYŁĄCZNIE jednym słowem (full/dirt/elektryk_gorski/czesc/stary/inny/niepewne), bez innego tekstu.`;

    const KNOWN_TYPES = ["full", "dirt", "elektryk_gorski", "czesc", "stary", "inny", "niepewne"];
    const TYPE_ICON = { full: "🟢", dirt: "🟠", elektryk_gorski: "⚡", czesc: "🔧", stary: "🕰️", inny: "⚫", niepewne: "❓" };

    // Pojedynczy strzał klasyfikacji na wskazanym modelu, z retry/backoffem na 429.
    // Używane zarówno dla taniego pierwszego przebiegu (8B) jak i droższej eskalacji
    // (GPT-OSS-120B) dla przypadków które 8B zostawił jako "niepewne".
    const runClassification = async (model, maxTokens, effort) => {
      const prompt = buildClassifierPrompt();
      addLog(`🔎 Groq (${model}): klasyfikuję — ${listing.title}${listing.price != null ? ` (${listing.price}€)` : ""}`, "info");

      for (let attempt = 1; attempt <= 3; attempt++) {
        const startedAt = Date.now();
        try {
          const data = await callProxy({
            provider: "groq",
            model,
            apiKey: groqClassifierKey,
            messages: [{ role: "user", content: prompt }],
            generationConfig: { temperature: 0.1, maxOutputTokens: maxTokens, reasoningEffort: effort },
          });
          const ms = Date.now() - startedAt;

          if (data?.error) {
            const msg = data.error?.message || "błąd";
            const isRateLimit = /rate limit|429|too many requests/i.test(msg);
            if (isRateLimit && attempt < 3) {
              const m = msg.match(/try again in ([\d.]+)(ms|s)/i);
              const waitMs = m ? (m[2].toLowerCase() === "ms" ? parseFloat(m[1]) : parseFloat(m[1]) * 1000) : 3000;
              addLog(`⏳ Groq (${model}): limit RPM osiągnięty — czekam ${Math.ceil((waitMs + 300) / 1000)}s, próba ${attempt + 1}/3 — ${listing.title}`, "error");
              await sleep(waitMs + 300);
              continue; // ponów
            }
            addLog(`⚠️ Groq (${model}): ${msg} (${ms}ms) — przepuszczam dalej jako niepewne`, "error");
            return "niepewne";

          const choice = data?.choices?.[0];
          const raw = (choice?.message?.content || "").toLowerCase().trim();
          // 1) Dokładnie jedno słowo (po usunięciu interpunkcji/formatowania) → bierzemy je wprost.
          // 2) Odpowiedź zawiera "niepewne" → niepewne (model sam zgłosił wątpliwość).
          // 3) Zdanie: typ uznajemy TYLKO gdy pada dokładnie jeden. Kilka typów naraz
          //    (np. "full, nie część") = niejednoznaczne → niepewne → eskalacja do mocniejszego
          //    modelu, zamiast pochopnie odrzucić dobry rower jako "część".
          const word = raw.replace(/[^a-ząćęłńóśźż_]/g, "").replace("część", "czesc");
          const TYPE_MATCHERS = {
            elektryk_gorski: r => r.includes("elektryk"),
            dirt:  r => r.includes("dirt"),
            czesc: r => r.includes("czesc") || r.includes("część"),
            stary: r => r.includes("stary"),
            full:  r => r.includes("full"),
            inny:  r => r.includes("inny"),
          };
          let typ;
          if (KNOWN_TYPES.includes(word)) typ = word;
          else if (raw.includes("niepewn")) typ = "niepewne";
          else {
            const hits = Object.keys(TYPE_MATCHERS).filter(k => TYPE_MATCHERS[k](raw));
            typ = hits.length === 1 ? hits[0] : "niepewne";
          }

          const rawNote = !raw && choice?.finish_reason === "length"
            ? " (odpowiedź ucięta — limit tokenów)"
            : (!KNOWN_TYPES.includes(word) && raw && typ === "niepewne"
              ? ` (Groq odpowiedział niejednoznacznie: "${raw.slice(0, 40)}")`
              : "");
          addLog(`${TYPE_ICON[typ]} Groq ${model} (${ms}ms): typ="${typ}"${rawNote} — ${listing.title}`, "info");
          return typ;
        } catch (e) {
          const ms = Date.now() - startedAt;
          if (attempt < 3) {
            addLog(`⏳ Groq (${model}): błąd sieci (${e.message}, ${ms}ms) — ponawiam za 2s, próba ${attempt + 1}/3 — ${listing.title}`, "error");
            await sleep(2000);
            continue;
          }
          addLog(`⚠️ Groq (${model}): ${e.message} (${ms}ms) — przepuszczam dalej jako niepewne`, "error");
          return "niepewne"; // błąd/limit Groqa po 3 próbach → nie odrzucaj, przepuść dalej
        }
      }
      return "niepewne"; // nie powinno tu dotrzeć, ale na wszelki wypadek
    };

    // Etap 1a: szybki, tani 20B. Limit 1024 a nie 20 — GPT-OSS najpierw "myśli", a tokeny
    // myślenia liczą się do limitu; przy 20 tokenach odpowiedź byłaby zawsze pusta.
    let typ = await runClassification(GROQ_CLASSIFIER_MODEL, 1024, "low");

    // Etap 1b: jeśli 20B się nie zdecydował, eskaluj do mocniejszego (ale wciąż bardzo taniego)
    // modelu — zanim poddamy się i wyślemy do drogiego Etapu 2 (Gemini).
    if (typ === "niepewne") {
      typ = await runClassification(GROQ_ESCALATION_MODEL, 2048, "medium");
    }

    return typ;
  };

  const scrapeKleinanzeigen = async (bike) => {
    // Kategorie mają gotowy URL z filtrem Kleinanzeigen (np. type_s:mountainbike)
    // Modele konkretne używają wyszukiwania po frazie
    const url = bike.isCategory
      ? bike.categoryUrl
      : `https://www.kleinanzeigen.de/s-fahrraeder/${encodeURIComponent(bike.query)}/k0c217`;
    const resp = await fetch(`/api/scrape?url=${encodeURIComponent(url)}`);
    if (!resp.ok) throw new Error(`Scrape HTTP ${resp.status}`);
    return resp.text();
  };

  // Kwota z tekstu. requireEuro=true wymaga znaku "€" za liczbą — chroni przed złapaniem
  // przypadkowej liczby (np. "27,5 Zoll", "-20%") gdy szukamy poza właściwym elementem ceny.
  const toPrice = (txt, requireEuro) => {
    if (!txt) return null;
    const re = requireEuro
      ? /(\d{1,3}(?:\.\d{3})+|\d+)(?:,\d{1,2})?\s*€/
      : /(\d{1,3}(?:\.\d{3})+|\d+)(?:,\d{1,2})?/;
    const m = txt.match(re);
    if (!m) return null;
    const val = parseInt(m[1].replace(/\./g, ""), 10);
    return Number.isFinite(val) && val > 0 ? val : null;
  };

  // ── Pełny opis ze strony ogłoszenia ────────────────────────────────────
  // Lista wyników ma tylko ucięty fragment opisu — pełny tekst jest wyłącznie na stronie ogłoszenia.
  // Pobieramy go TYLKO dla rowerów, które przeszły wszystkie tanie filtry i idą do analizy AI,
  // z odstępem między zapytaniami, limitem na cykl i bezpiecznikiem na wypadek blokady.
  const DETAIL_FETCH_DELAY_MS = 4000;            // min. odstęp między stronami ogłoszeń (+ losowo do 2 s)
  const MAX_DETAIL_FETCHES_PER_CYCLE = 10;       // twardy limit pobrań na cykl
  const DESC_MAX_CHARS = 3000;                   // dłuższe opisy przycinamy (koszt tokenów)
  const DETAIL_BLOCK_PAUSE_MS = 30 * 60 * 1000;  // po wykryciu blokady: 30 min przerwy w pobieraniu

  const fetchListingDetails = async (listing) => {
    if (!/^https:\/\/(www\.)?kleinanzeigen\.de\//.test(listing.href || "")) {
      return { ok: false, reason: "link spoza Kleinanzeigen" };
    }
    let resp;
    try {
      resp = await fetch(`/api/scrape?url=${encodeURIComponent(listing.href)}`);
    } catch (e) {
      return { ok: false, reason: `błąd sieci: ${e.message}` };
    }
    if (resp.status === 403 || resp.status === 429) return { ok: false, blocked: true, reason: `HTTP ${resp.status}` };
    if (resp.status === 404 || resp.status === 410) return { ok: false, gone: true, reason: "ogłoszenie usunięte" };
    if (!resp.ok) return { ok: false, reason: `HTTP ${resp.status}` };

    const html = await resp.text();
    const doc = new DOMParser().parseFromString(html, "text/html");

    // Opis — warstwowo. Osobne zapytania zamiast jednej listy selektorów: querySelector z listą
    // zwraca PIERWSZY w kolejności dokumentu, a pusty <meta itemprop="description"> w <head>
    // wygrałby z właściwym opisem w treści strony.
    let desc = "";
    const descEl = doc.querySelector("#viewad-description-text") || doc.querySelector("[itemprop=description]:not(meta)");
    if (descEl) {
      descEl.querySelectorAll("br").forEach(br => br.replaceWith("\n")); // zachowaj podział linii
      desc = descEl.textContent || "";
    }
    if (!desc.trim()) {
      for (const s of doc.querySelectorAll('script[type="application/ld+json"]')) {
        try {
          const j = JSON.parse(s.textContent);
          for (const it of (Array.isArray(j) ? j : [j])) {
            if (typeof it?.description === "string" && it.description.length > desc.length) desc = it.description;
          }
        } catch {}
      }
    }
    if (!desc.trim()) desc = doc.querySelector('meta[itemprop="description"]')?.getAttribute("content") || "";
    desc = desc.replace(/[ \t]+/g, " ").replace(/\n\s*\n\s*\n+/g, "\n\n").trim();

    if (!desc) {
      // Sygnały blokady/usunięcia sprawdzamy TYLKO gdy nie ma opisu — inaczej słowo "robot"
      // albo "gelöscht" w treści zwykłego ogłoszenia dałoby fałszywy alarm.
      const bodyText = (doc.body?.textContent || "").toLowerCase();
      if (/captcha|robot|zugriff verweigert|access denied/.test(bodyText)) {
        return { ok: false, blocked: true, reason: "strona blokady/captcha" };
      }
      if (/nicht mehr verfügbar|wurde gelöscht|anzeige ist abgelaufen/.test(bodyText)) {
        return { ok: false, gone: true, reason: "ogłoszenie usunięte" };
      }
      return { ok: false, reason: "nie znaleziono opisu na stronie", doc };
    }

    return {
      ok: true,
      desc: desc.length > DESC_MAX_CHARS ? desc.slice(0, DESC_MAX_CHARS) + "…" : desc,
      fullLength: desc.length,
      price: toPrice(doc.querySelector("#viewad-price")?.textContent, false),
    };
  };

  // ── HTML parser ────────────────────────────────────────────────────────
  const parseListings = (html, bikeLabel) => {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");
    const items = [];

    // Sprawdź czy Kleinanzeigen nie zablokował
    const bodyText = doc.body?.innerText || doc.body?.textContent || "";
    if (bodyText.includes("captcha") || bodyText.includes("robot") || bodyText.includes("blocked")) {
      addLog("⚠️ Kleinanzeigen wykrył bota — captcha!", "error");
      return [];
    }

    // Próbuj różne selektory — Kleinanzeigen zmienia strukturę
    const articles = doc.querySelectorAll("article.aditem, li.aditem, [data-adid], .ad-listitem");

    let firstNoPriceArticle = null; // do diagnostyki, gdy parser przestaje znajdować ceny

    articles.forEach(article => {
      // Link i ID — najważniejsze
      const linkEl = article.querySelector("a[href*='/s-anzeige/'], a[href*='/anzeige/']");
      if (!linkEl) return;
      const href = linkEl.getAttribute("href").startsWith("http")
        ? linkEl.getAttribute("href")
        : "https://www.kleinanzeigen.de" + linkEl.getAttribute("href");

      const idMatch = href.match(/-(\d{7,})/);
      const listingId = idMatch ? idMatch[1] : href;

      const titleEl = article.querySelector("h2, h3, .ellipsis, .aditem-main--middle--headline, [class*=headline], [class*=title]");
      const title = titleEl?.textContent?.trim() || linkEl.textContent.trim();
      if (!title) return;

      // Cena — trzy warstwy, od najpewniejszej:
      // 1) znana klasa elementu ceny Kleinanzeigen
      let price = toPrice(article.querySelector(".aditem-main--middle--price-shipping--price")?.textContent, false);
      // 2) dowolny element z "price" w klasie, zawierający kwotę z "€" (gdy zmienili nazwę klasy)
      if (price == null) {
        for (const el of article.querySelectorAll("[class*=price]")) {
          price = toPrice(el.textContent, true);
          if (price != null) break;
        }
      }
      // 3) kwota z "€" w tekście karty ogłoszenia, BEZ tytułu i opisu (żeby nie złapać np. "NP 3000€")
      if (price == null) {
        const clone = article.cloneNode(true);
        clone.querySelectorAll("h2, h3, [class*=description], [class*=headline], [class*=title]").forEach(n => n.remove());
        price = toPrice(clone.textContent, true);
      }
      if (price == null && !firstNoPriceArticle) firstNoPriceArticle = article;

      // Opis i lokalizacja
      const descEl = article.querySelector("[class*=description], .aditem-main--middle--description");
      const locEl  = article.querySelector("[class*=locality], [class*=location], .aditem-main--top--left");

      items.push({
        listingId, title, price, href,
        desc:     descEl?.textContent?.trim() || "",
        location: locEl?.textContent?.trim() || "",
        bike:     bikeLabel,
      });
    });

    // Diagnostyka: wyszukiwanie ma filtr ceny w URL, więc prawie każde ogłoszenie POWINNO mieć cenę.
    // Jeśli połowa+ nie ma — parser najpewniej nie pasuje do aktualnego HTML-a Kleinanzeigen.
    const noPriceCount = items.filter(i => i.price == null).length;
    if (items.length >= 3 && noPriceCount / items.length >= 0.5) {
      addLog(`⚠️ Parser: ${noPriceCount}/${items.length} ogłoszeń bez odczytanej ceny — możliwa zmiana HTML Kleinanzeigen`, "error");
      if (firstNoPriceArticle && !priceDiagLoggedRef.current) {
        priceDiagLoggedRef.current = true;
        const priceClasses = [...new Set([...firstNoPriceArticle.querySelectorAll("*")]
          .flatMap(el => [...el.classList]).filter(c => /price|preis/i.test(c)))];
        const cardText = (firstNoPriceArticle.textContent || "").replace(/\s+/g, " ").trim().slice(0, 300);
        addLog(`🔍 Diagnostyka ceny (skopiuj to do czatu): klasy=[${priceClasses.join(", ") || "brak"}] · tekst="${cardText}"`, "error");
      }
    }

    return items;
  };

  // ── Gemini analysis ────────────────────────────────────────────────────
  // groqType: "full" | "dirt" | "elektryk_gorski" | "niepewne" — wynik klasyfikacji z Etapu 1 (Groq).
  // Gdy Groq był PEWNY typu, Gemini mu ufa i NIE klasyfikuje od nowa (oszczędność promptu/tokenów,
  // zero duplikacji pracy). Tylko dla "niepewne" Gemini sam rozpoznaje typ jako siatka bezpieczeństwa.
  // ── Filtrowanie bazy wiedzy po słowach kluczowych — mniej tokenów, mniej szumu dla modelu ──
  // Dopasowuje wpisy, których jakieś znaczące słowo (marka/model) pojawia się w ogłoszeniu.

  const KNOWLEDGE_STOPWORDS = new Set(["oraz","żeby","które","model","modelu","rower","rowery","cena","ceny","cenie","sprzedaje","sprzedaż","zakup","zakupu","wersja","wersji","roku","dobrej","dobra","można","warto","także","tylko","nawet","bardzo","jest","być","czyli","czasem","sobie","swoje","this","that","with","from","price","model"]);

    const listingWords = new Set(extractSignificantWords(`${listing.title} ${listing.fullDesc || listing.desc}`));

  };

  const analyzeWithGemini = async (listing, groqType) => {

    const relevantKnowledge = filterKnowledgeForListing(listing);
    const knowledgeSection = relevantKnowledge.length > 0

          continue; // nie idzie do Gemini
        }

        if (typ === "stary") {
          phase1Stats.oldYear = (phase1Stats.oldYear || 0) + 1;
          addLog(`🚫 Groq: typ "stary" (rok < ${MIN_YEAR} wg oceny Groqa) — odrzucono — ${listing.title}`, "info");
          setResults(prev => [{
            id: Date.now() + Math.random(), listing,
            analysis: { typ_roweru: "stary", decyzja: "nie", oplaca_sie: false, krotki_opis: `Odrzucone przez Groq (etap 1) — oszacowany rok < ${MIN_YEAR}` },
            status: "skip",
            timestamp: new Date().toLocaleTimeString("pl-PL"),
          }, ...prev].slice(0, 400));
          continue; // nie idzie do Gemini
        }

        // ── Brak ceny — od razu do "niepewne", bez Gemini ──
        if (listing.price == null) {
          phase1Stats.noPrice++;
          addLog(`❓ Brak ceny — do listy niepewnych: ${listing.title}`, "info");
          uncertainBatch.push({ listing, reason: "brak ceny w ogłoszeniu" });
          setResults(prev => [{
            id: Date.now() + Math.random(), listing,
            analysis: { typ_roweru: "?", decyzja: "niepewne", oplaca_sie: false, krotki_opis: "Brak ceny — wymaga ręcznego sprawdzenia" },
            status: "skip",
            timestamp: new Date().toLocaleTimeString("pl-PL"),
          }, ...prev].slice(0, 400));
          continue;
        }

        // typ === "full" | "dirt" | "elektryk_gorski" | "niepewne" → kandydat do Gemini (etap 2)
        // Wyjątek: "niepewne" + cena poniżej progu → od razu odrzuć, nie marnuj wywołania Gemini
        // (ma cenę — więc nie kwalifikuje się do listy "brak ceny" — a Groq nie umiał rozpoznać typu,
        // więc przy niskiej cenie zakładamy że to niewart uwagi hardtail/miejski i pomijamy).
        if (typ === "niepewne" && listing.price < minUncertainPrice) {
          phase1Stats.priceThreshold++;
          addLog(`🚫 Groq: niepewny typ + cena ${listing.price}€ < ${minUncertainPrice}€ próg — odrzucono — ${listing.title}`, "info");
          setResults(prev => [{
            id: Date.now() + Math.random(), listing,
            analysis: { typ_roweru: "?", decyzja: "nie", oplaca_sie: false, krotki_opis: `Niepewny typ, cena ${listing.price}€ poniżej progu ${minUncertainPrice}€ — odrzucone bez Gemini` },
            status: "skip",
            timestamp: new Date().toLocaleTimeString("pl-PL"),
          }, ...prev].slice(0, 400));
          continue;
        }

        if (typ === "niepewne") phase1Stats.uncertain++; else phase1Stats.confident++;
        geminiCandidates.push({ listing, groqType: typ });
      }

      await sleep(3000);
    }

    if (firstCycleRef.current) {
      firstCycleRef.current = false;
      addLog(`✔ Cykl #${cycleN} zakończony — czekam 60s przed kolejnym`, "info");
      return;
    }

    addLog(
      `📊 Podsumowanie etapu 1: 🚫 ${phase1Stats.blacklist} odrzuconych (czarna lista) · 🚫 ${phase1Stats.oldYear} odrzuconych (rok < ${MIN_YEAR}/retro) · 🚫 ${phase1Stats.groqCzesc} odrzuconych (Groq: część) · 🚫 ${phase1Stats.groqInny} odrzuconych (Groq: inny) · 🚫 ${phase1Stats.priceThreshold} odrzuconych (niepewne + cena < ${minUncertainPrice}€) · ❓ ${phase1Stats.noPrice} bez ceny → niepewne · 📉 ${phase1Stats.priceDrops} spadków ceny → ➡️ ${geminiCandidates.length} kandydatów do Gemini (${phase1Stats.confident} pewnych, ${phase1Stats.uncertain} niepewnych)`,
      "success"
    );

    // ── FAZA 2 — Gemini: tylko jeśli jest jeszcze limit na ten cykl, pewne typy najpierw ──
    // Sortowanie stabilne: kandydaci z pewną klasyfikacją (full/dirt/elektryk_gorski) idą PRZED
    // "niepewnymi" — jeśli limit się skończy, to "niepewne" odpadają jako pierwsze.
    const sorted = [...geminiCandidates].sort((a, b) =>
      (b.groqType !== "niepewne" ? 1 : 0) - (a.groqType !== "niepewne" ? 1 : 0));
    if (sorted.length > maxGeminiPerCycle) {
      addLog(`⚖️ ${sorted.length} kandydatów do Gemini, limit cyklu = ${maxGeminiPerCycle} — część zostanie pominięta (priorytet: pewne typy)`, "info");
    }

    let lastDetailFetchAt = 0; // do odstępu między pobraniami stron ogłoszeń
    let detailFetches = 0;     // ile stron ogłoszeń pobrano w tym cyklu

    for (let { listing, groqType } of sorted) {
      if (!runningRef.current) return;

      if (geminiCallsRef.current >= maxGeminiPerCycle) {
        addLog(`⏭ Pominięte — limit ${maxGeminiPerCycle} analiz Gemini na cykl osiągnięty: ${listing.title}`, "info");
        setResults(prev => [{
          id: Date.now() + Math.random(), listing,
          analysis: { typ_roweru: "?", decyzja: "niepewne", oplaca_sie: false, krotki_opis: `Pominięte — limit ${maxGeminiPerCycle} analiz Gemini na ten cykl osiągnięty` },
          status: "skip",
          timestamp: new Date().toLocaleTimeString("pl-PL"),
        }, ...prev].slice(0, 400));
        continue;
      }

      // ── Pełny opis ze strony ogłoszenia — TYLKO dla rowerów, które naprawdę idą do analizy ──
      if (detailFetches < MAX_DETAIL_FETCHES_PER_CYCLE && Date.now() >= detailBlockedUntilRef.current) {
        const wait = DETAIL_FETCH_DELAY_MS + Math.random() * 2000 - (Date.now() - lastDetailFetchAt);
        if (wait > 0) await sleep(wait);
        if (!runningRef.current) return;
        lastDetailFetchAt = Date.now();
        detailFetches++;
        const det = await fetchListingDetails(listing);
        if (det.ok) {
          listing.fullDesc = det.desc;
          addLog(`📄 Pełny opis (${det.fullLength} znaków${det.fullLength > DESC_MAX_CHARS ? `, przycięty do ${DESC_MAX_CHARS}` : ""}) — ${listing.title}`, "info");
          if (det.price != null && det.price !== listing.price) {
            addLog(`💶 Cena na stronie ogłoszenia (${det.price}€) różni się od listy (${listing.price ?? "?"}€) — używam ceny ze strony`, "info");
            listing.price = det.price;
          }
        } else if (det.gone) {
          addLog(`🗑 Ogłoszenie już usunięte — pomijam: ${listing.title}`, "info");
          setResults(prev => [{
            id: Date.now() + Math.random(), listing,
            analysis: { typ_roweru: groqType, decyzja: "nie", oplaca_sie: false, krotki_opis: "Ogłoszenie usunięte przed analizą" },
            status: "skip",
            timestamp: new Date().toLocaleTimeString("pl-PL"),
          }, ...prev].slice(0, 400));
          continue;
        } else if (det.blocked) {
          detailBlockedUntilRef.current = Date.now() + DETAIL_BLOCK_PAUSE_MS;
          addLog(`⛔ Kleinanzeigen blokuje strony ogłoszeń (${det.reason}) — wstrzymuję pobieranie pełnych opisów na 30 min, AI dostaje krótkie fragmenty`, "error");
        } else {
          addLog(`⚠️ Brak pełnego opisu (${det.reason}) — AI dostaje krótki fragment: ${listing.title}`, "error");
          if (det.doc && !descDiagLoggedRef.current) {
            descDiagLoggedRef.current = true;
            const ids = [...det.doc.querySelectorAll("[id]")].map(e => e.id).filter(id => /desc|beschreib/i.test(id)).slice(0, 10);
            const cls = [...new Set([...det.doc.querySelectorAll("*")].flatMap(el => [...el.classList]).filter(c => /desc|beschreib/i.test(c)))].slice(0, 10);
            addLog(`🔍 Diagnostyka opisu (skopiuj to do czatu): id=[${ids.join(", ") || "brak"}] · klasy=[${cls.join(", ") || "brak"}]`, "error");
          }
        }
      }

      // ── Ścisły filtr roku na PEŁNYM opisie — zero kosztu, przed Gemini ──
      const markedYear = extractMarkedYear(listing.fullDesc);
      if (markedYear != null && markedYear < MIN_YEAR) {
        addLog(`🕰️ Pełny opis: rocznik ${markedYear} < ${MIN_YEAR} — odrzucono bez Gemini: ${listing.title}`, "info");
        setResults(prev => [{
          id: Date.now() + Math.random(), listing,
          analysis: { typ_roweru: "stary", decyzja: "nie", oplaca_sie: false, krotki_opis: `Odrzucone — w pełnym opisie rocznik ${markedYear}` },
          status: "skip",
          timestamp: new Date().toLocaleTimeString("pl-PL"),
        }, ...prev].slice(0, 400));
        continue;
      }

      // ── "Niepewne" z etapu 1: druga, tania próba Groqa — tym razem z pełnym opisem ──
      // Rozstrzygnięte tu części / stare / "inne" w ogóle nie trafiają do (droższego) Gemini.
      if (groqType === "niepewne" && listing.fullDesc && groqClassifierKey) {
        const typ2 = await classifyWithGroq(listing);
        if (["inny", "czesc", "stary"].includes(typ2)) {
          addLog(`🚫 Groq (pełny opis): typ "${typ2}" — odrzucono bez Gemini: ${listing.title}`, "info");
          setResults(prev => [{
            id: Date.now() + Math.random(), listing,
            analysis: { typ_roweru: typ2, decyzja: "nie", oplaca_sie: false, krotki_opis: `Odrzucone przez Groq po przeczytaniu pełnego opisu (${typ2})` },
            status: "skip",
            timestamp: new Date().toLocaleTimeString("pl-PL"),
          }, ...prev].slice(0, 400));
          continue;
        }
        if (["full", "dirt", "elektryk_gorski"].includes(typ2)) {
          groqType = typ2;
          updateSeenType(listing.listingId, typ2);
        }
      }

      geminiCallsRef.current += 1;
      const analysis = await analyzeWithGemini(listing, groqType);
      let status = "skip";

      if (!analysis) {
        status = "error";
      } else if (analysis.decyzja === "tak") {
        // ✅ Gemini mówi TAK → wysyłaj webhook
        addLog(`✅ OKAZJA! [${analysis.typ_roweru}] ${listing.title} | zakup: ${analysis.cena_zakupu_eur ?? "?"}€ → sprzedaż PL: ${analysis.szacowana_sprzedaz_eur ?? "?"}€ | zysk: ~${analysis.przewidywany_zysk}€`, "success");
        setStats(s => ({ ...s, deals: s.deals + 1 }));
        const sent = await sendToDiscord(listing, analysis);
        status = sent ? "sent" : "deal";
        if (sent) {
          setStats(s => ({ ...s, sent: s.sent + 1 }));
          addLog(`📨 Wysłano na Discord: ${listing.href}`, "success");
        } else {
          addLog(`⚠️ Nie udało się wysłać na Discord`, "error");
        }
      } else if (analysis.decyzja === "niepewne") {
        // ❓ Za mało danych żeby ocenić — zbierz do zbiorczej wiadomości
        addLog(`❓ Niepewne [${analysis.typ_roweru}] — ${listing.title} | zakup: ${analysis.cena_zakupu_eur ?? "?"}€ — ${analysis.krotki_opis || "za mało informacji"}`, "info");
        uncertainBatch.push({ listing, reason: analysis.krotki_opis || "za mało informacji" });
      } else {
        // ❌ Gemini mówi NIE → nie wysyłaj
        const reason = analysis.odrzucenie === "czesc" ? `z opisu: sama część, nie kompletny rower`
          : analysis.odrzucenie === "stary" ? `z opisu: rocznik sprzed ${MIN_YEAR}`
          : analysis.typ_roweru === "inny" ? `typ: inny — odrzucone automatycznie`
          : `zysk za mały`;
        addLog(`⏭ Gemini: NIE opłaca się (${reason}) — [${analysis.typ_roweru}] ${listing.title} | zakup: ${analysis.cena_zakupu_eur ?? "?"}€ → sprzedaż PL: ${analysis.szacowana_sprzedaz_eur ?? "?"}€`, "info");
      }

      setResults(prev => [{
        id: Date.now() + Math.random(), listing, analysis, status,
        timestamp: new Date().toLocaleTimeString("pl-PL"),
      }, ...prev].slice(0, 400));

      await sleep(5000);
    }

    // ── Wyślij zbiorczą listę "niepewnych" na koniec cyklu (jeśli są i webhook ustawiony) ──
    if (uncertainBatch.length > 0 && uncertainWebhook) {
      const lines = uncertainBatch.map(u => `🔸 ${u.listing.title}${u.listing.price != null ? ` (${u.listing.price}€)` : ""} — ${u.reason}\n${u.listing.href}`).join("\n\n");
      const content = `❓ **Niepewne rowery — cykl #${cycleN}** (${uncertainBatch.length})\n\n${lines}`.slice(0, 1900);
      try {
        await callUncertainDiscord({ content });
        addLog(`📨 Wysłano listę ${uncertainBatch.length} niepewnych na Discord`, "success");
      } catch (e) {
        addLog(`⚠️ Błąd wysyłki listy niepewnych: ${e.message}`, "error");
      }
    } else if (uncertainBatch.length > 0 && !uncertainWebhook) {
      addLog(`❓ ${uncertainBatch.length} niepewnych rowerów (brak webhooka — ustaw w Ustawieniach żeby dostawać listę)`, "info");
    }

    firstCycleRef.current = false;
    addLog(`✔ Cykl #${cycleN} zakończony — czekam 60s przed kolejnym`, "info");
  }, [geminiKey, geminiModel, geminiChatName, discordWebhook, discordThread, uncertainWebhook, filterKeywords, groqClassifierKey, maxGeminiPerCycle, minUncertainPrice, selectedBikes, priceKnowledge, minProfit]);

  // ── Continuous loop ────────────────────────────────────────────────────
  const startLoop = async () => {
    if (!geminiKey)      { addLog("❌ Brak klucza API (Groq/Gemini)", "error"); setTab("settings"); return; }
    if (!discordWebhook) { addLog("❌ Brak Discord Webhook",    "error"); setTab("settings"); return; }

    runningRef.current = true;
    firstCycleRef.current = true;
    setRunning(true);
    setStats({ scanned: 0, deals: 0, sent: 0 });
    addLog(`🏷️ Wersja aplikacji: ${APP_VERSION}`, "info");
    addLog("🚀 Uruchamiam skanowanie — zbieram istniejące ogłoszenia (cykl #1), od cyklu #2 analizuję tylko nowe", "success");

    let n = 1;
    while (runningRef.current) {
      setCycleNum(n);
      await runOneCycle(n);
      if (!runningRef.current) break;
      for (let i = 60; i > 0 && runningRef.current; i--) {
        await sleep(1000);
      }
      n++;
    }

    setRunning(false);
    addLog("⏹ Zatrzymano", "info");
  };

  const stopLoop = () => { runningRef.current = false; };

  const logColors = { info: "#475569", success: "#22c55e", error: "#f87171" };

  // ── RENDER ─────────────────────────────────────────────────────────────
  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>

      {/* HEADER */}
      <div style={{
        background: "#0c1525", borderBottom: "1px solid #1a2d4a",
        padding: "14px 24px",
        display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{
            width: 40, height: 40, borderRadius: 10,
            background: "linear-gradient(135deg, #f59e0b 0%, #ef4444 100%)",
            display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20,
          }}>🚲</div>
          <div>
            <div style={{ fontSize: 17, fontWeight: 800, letterSpacing: -0.5 }}>
              DirtDeal<span style={{ color: "#f59e0b" }}>Finder</span>
            </div>
            <div style={{ fontSize: 10, color: "#334155", letterSpacing: 0.8, textTransform: "uppercase" }}>
              Kleinanzeigen × Gemini AI × Discord · v{APP_VERSION}
            </div>
          </div>
        </div>

        <div style={{ display: "flex", gap: 16, alignItems: "center" }}>
          {[["🔍", stats.scanned, "Nowe"], ["✅", stats.deals, "Okazje"], ["📨", stats.sent, "Wysłane"]].map(([ico, n, lbl]) => (
            <div key={lbl} style={{ textAlign: "center" }}>
              <div style={{ fontSize: 18, fontWeight: 800 }}>{ico} {n}</div>
              <div style={{ fontSize: 10, color: "#475569", textTransform: "uppercase" }}>{lbl}</div>
            </div>
          ))}
          {running && (
            <div style={{ background: "#0a1520", border: "1px solid #22c55e44", borderRadius: 8, padding: "6px 14px", textAlign: "center" }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#22c55e", display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ width: 8, height: 8, borderRadius: "50%", background: "#22c55e", display: "inline-block",
                  animation: "pulse 1.2s infinite" }} />
                Cykl #{cycleNum}
              </div>
              <div style={{ fontSize: 10, color: "#475569" }}>aktywne skanowanie</div>
            </div>
          )}
        </div>

        <div style={{ display: "flex", gap: 4 }}>
          {[["scanner","🔍 Skaner"], ["results","📋 Wyniki"], ["chat","💬 Chat AI"], ["settings","⚙️ Ustawienia"]].map(([id, label]) => (
            <button key={id} onClick={() => setTab(id)} style={{
              padding: "8px 16px", borderRadius: 8, border: "none", fontWeight: 600, fontSize: 13,
              background: tab === id ? "#f59e0b" : "#1e293b",
              color: tab === id ? "#0a0f18" : "#64748b",
            }}>{label}</button>
          ))}
        </div>
      </div>

      {/* BODY */}
      <div style={{ flex: 1, padding: 24, maxWidth: 1200, width: "100%", margin: "0 auto" }}>

        {/* ═══ SCANNER ═══ */}
        {tab === "scanner" && (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 280px", gap: 20 }}>

            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>

              {/* Bike selector */}
              <div style={{ background: "#0d1526", border: "1px solid #1a2d4a", borderRadius: 14, padding: 20 }}>
                <div style={{ fontSize: 11, color: "#475569", textTransform: "uppercase", letterSpacing: 0.8, marginBottom: 12 }}>
                  Modele do skanowania
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                  {BIKE_MODELS.map(b => {
                    const sel = selectedBikes.includes(b.id);
                    return (
                      <button key={b.id} onClick={() => setSelectedBikes(prev =>
                        sel ? prev.filter(x => x !== b.id) : [...prev, b.id]
                      )} style={{
                        padding: "7px 14px", borderRadius: 8, fontWeight: 600, fontSize: 13,
                        border: `1px solid ${sel ? "#f59e0b88" : "#1e293b"}`,
                        background: sel ? "#f59e0b18" : "#0f172a",
                        color: sel ? "#f59e0b" : "#475569",
                      }}>{b.label}</button>
                    );
                  })}
                </div>
              </div>

              {/* START / STOP */}
              <div style={{ display: "flex", gap: 10 }}>
                {!running ? (
                  <button onClick={startLoop} style={{
                    flex: 1, padding: "14px 0", borderRadius: 10, border: "none",
                    fontWeight: 800, fontSize: 15,
                    background: "linear-gradient(135deg, #f59e0b, #ef4444)",
                    color: "#080d18",
                  }}>▶ Start — skanuj ciągle</button>
                ) : (
                  <button onClick={stopLoop} style={{
                    flex: 1, padding: "14px 0", borderRadius: 10,
                    border: "1px solid #ef444466", background: "#ef444418",
                    color: "#f87171", fontWeight: 800, fontSize: 15,
                  }}>⏹ Stop</button>
                )}
              </div>

              {/* Log */}
              <div style={{
                background: "#070c17", border: "1px solid #0f1a2e", borderRadius: 14,
                height: 400, overflowY: "auto", padding: 14,
                fontFamily: "monospace", fontSize: 12, lineHeight: 1.7,
              }}>
                {logs.length === 0 && (
                  <div style={{ color: "#1e293b", textAlign: "center", marginTop: 80 }}>
                    Kliknij Start, żeby zacząć…
                  </div>
                )}
                {logs.map((l, i) => (
                  <div key={i} style={{ color: logColors[l.type] || "#475569" }}>
                    <span style={{ color: "#1e3352" }}>{l.time} </span>{l.msg}
                  </div>
                ))}
                <div ref={logsEndRef} />
              </div>
            </div>

            {/* Right panel */}
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>

              {/* Logika */}
              <div style={{ background: "#0d1526", border: "1px solid #1a2d4a", borderRadius: 14, padding: 20 }}>
                <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 14, color: "#94a3b8" }}>🤖 Logika decyzji</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  <div style={{ background: "#0a1f0f", border: "1px solid #22c55e33", borderRadius: 10, padding: 12 }}>
                    <div style={{ color: "#22c55e", fontWeight: 700, fontSize: 12, marginBottom: 4 }}>✅ Gemini mówi TAK</div>
                    <div style={{ fontSize: 11, color: "#475569", lineHeight: 1.5 }}>
                      Typ roweru to <strong>full</strong> lub <strong>dirt</strong> i zysk ≥ minimum — webhook Discord wysłany z typem, ceną, zyskiem i linkiem
                    </div>
                  </div>
                  <div style={{ background: "#1a0f0f", border: "1px solid #ef444433", borderRadius: 10, padding: 12 }}>
                    <div style={{ color: "#f87171", fontWeight: 700, fontSize: 12, marginBottom: 4 }}>❌ Gemini mówi NIE</div>
                    <div style={{ fontSize: 11, color: "#475569", lineHeight: 1.5 }}>
                      Ogłoszenie pominięte, webhook nie wysłany — gdy typ to <strong>"inny"</strong> (np. szosówka, hardtail XC, miejski), odrzucane jest <strong>zawsze</strong>, niezależnie od ceny
                    </div>
                  </div>
                </div>
              </div>

              {/* Status */}
              <div style={{ background: "#0d1526", border: "1px solid #1a2d4a", borderRadius: 14, padding: 20 }}>
                <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 14, color: "#94a3b8" }}>📊 Status</div>
                {[
                  ["Gemini API",    geminiKey      ? "✅ OK" : "❌ Brak", geminiKey      ? "#22c55e" : "#f87171"],
                  ["Discord",       discordWebhook ? "✅ OK" : "❌ Brak", discordWebhook ? "#22c55e" : "#f87171"],
                  ["Aktywne modele",`${selectedBikes.length}/${BIKE_MODELS.length}`, "#f59e0b"],
                  ["Widzianych ID", seenIdsRef.current.size, "#64748b"],
                ].map(([k, v, c]) => (
                  <div key={k} style={{ display: "flex", justifyContent: "space-between", marginBottom: 8, fontSize: 13 }}>
                    <span style={{ color: "#475569" }}>{k}</span>
                    <span style={{ color: c, fontWeight: 600 }}>{v}</span>
                  </div>
                ))}
              <button onClick={() => {
                seenIdsRef.current = new Map();
                localStorage.removeItem("ddf_seen");
                addLog("🗑 Reset — następny cykl przeskanuje wszystko od nowa", "info");
              }} style={{
                width: "100%", marginTop: 10, padding: "7px 0", borderRadius: 8,
                border: "1px solid #1e293b", background: "transparent",

                </div>
                <div style={{ fontSize: 11, color: "#334155", marginTop: 5, lineHeight: 1.5 }}>
                  Gdy Groq nie umie rozpoznać typu ("niepewne") ale ogłoszenie MA podaną cenę — idzie do Gemini tylko jeśli ta cena wynosi co najmniej tyle. Poniżej progu ogłoszenie jest odrzucane bez Gemini (zbyt tanie żeby ryzykować, skoro i tak nie wiadomo co to za rower). Ogłoszenia BEZ ceny zawsze trafiają do listy niepewnych na Discord, niezależnie od tego ustawienia — nie mają z czym porównać progu.
                </div>
              </div>
            </div>

            {/* Strategia */}
            <div style={{ gridColumn: "span 2", background: "#0d1526", border: "1px solid #1a2d4a", borderRadius: 16, padding: 24 }}>
              <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 20, display: "flex", alignItems: "center", gap: 10 }}>
                <span>🎯</span> Strategia oceny
              </div>

              <div>
                <label style={{ fontSize: 11, color: "#475569", display: "block", marginBottom: 6, textTransform: "uppercase", letterSpacing: 0.8 }}>
                  Minimalny zysk (%)
                </label>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <input
                    type="range" min="5" max="100" step="5"
                    value={minProfit}
                    onChange={e => setMinProfit(Number(e.target.value))}
                    style={{ flex: 1, accentColor: "#f59e0b", padding: 0, border: "none", background: "transparent" }}
                  />
                  <div style={{
                    minWidth: 64, textAlign: "center", fontWeight: 800, fontSize: 22, color: "#f59e0b",
                  }}>{minProfit}%</div>
                </div>
                <div style={{ fontSize: 11, color: "#334155", marginTop: 4 }}>
                  Gemini powie TAK tylko gdy szacowany zysk wynosi minimum {minProfit}% ceny zakupu
                </div>
              </div>
            </div>

            {/* Save */}
            <div style={{ gridColumn: "span 2" }}>
              <button onClick={saveSettings} style={{
                width: "100%", padding: "14px 0", borderRadius: 12, border: "none",
                fontWeight: 800, fontSize: 15,
                background: "linear-gradient(135deg, #f59e0b, #ef4444)",
                color: "#080d18",
              }}>💾 Zapisz ustawienia</button>
            </div>

            {/* How it works */}
            <div style={{ gridColumn: "span 2", background: "#0d1526", border: "1px solid #1a3a5f", borderRadius: 16, padding: 24 }}>
              <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 14, color: "#3b82f6" }}>ℹ️ Jak to działa?</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14 }}>
                {[
                  { ico: "🔄", t: "Pętla ciągła",  d: "Skanuje bez przerwy — po każdym pełnym cyklu czeka 60s i zaczyna od nowa" },
                  { ico: "🆕", t: "Tylko nowe",     d: "Każde ogłoszenie trafia do Gemini tylko raz — widziane ID są zapamiętane" },
                  { ico: "🤖", t: "AI (Groq/Gemini)", d: "Rozpoznaje typ (full/dirt/inny) i ocenia czy warto kupić i odsprzedać w Polsce. Typ \"inny\" jest zawsze odrzucany" },
                  { ico: "📨", t: "Discord",        d: "Webhook z ceną, zyskiem i linkiem wysyłany TYLKO gdy Gemini mówi TAK" },
                ].map(s => (
                  <div key={s.t} style={{ background: "#070c17", borderRadius: 12, padding: 16 }}>
                    <div style={{ fontSize: 22, marginBottom: 8 }}>{s.ico}</div>
                    <div style={{ fontWeight: 700, marginBottom: 6, fontSize: 13 }}>{s.t}</div>
                    <div style={{ fontSize: 12, color: "#475569", lineHeight: 1.6 }}>{s.d}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
