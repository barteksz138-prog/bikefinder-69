            addLog(`↩️ Groq: "${typ}", ale tytuł to znany model (${known === "dirt" ? "dirt" : listing.bike}) — decyzję zostawiam analizie AI — ${listing.title}`, "info");
            typ = known === "dirt" ? "dirt" : "niepewne";
            job.knownModel = true;
          }
        }
        // v5.14: Groq „inny”, bo uznał ogłoszenie za samą ramę/część — a tytuł nie mówi o części i cena jest jak za rower
        // (np. „YT capra Industrie”, 1250 €, opis „Rahmen L, Federgabel ZEB…”). Decyzję zostawiamy AI (pełny opis + zdjęcia).
        if (!cachedTrusted && typ === "inny" && !PART_TITLE_RE.test(listing.title) && listing.price != null && listing.price >= minUncertainPrice
          && GROQ_PART_REASON_RE.test(listing._groqReason || "")) {
          addLog(`↩️ Groq: "inny" (uznał za część), ale tytuł nie mówi o części, a cena ${listing.price}€ jak za rower — decyzję zostawiam analizie AI — ${listing.title}`, "info");
          typ = "niepewne";
          job.knownModel = true;
        }
        // Groq niedostępny (brak klucza, błąd, limit) to NIE to samo co niepewny typ — bez progu ceny, prosto do AI
        const classifierDown = typ === "niedostepny";
        if (classifierDown) { phase1Stats.classifierDown++; typ = "niepewne"; }

        if (typ === "stary") {
          phase1Stats.oldBike++;
          addLog(`🚫 Groq: rower oszacowany jako sprzed ${MIN_BIKE_YEAR} — odrzucono — ${listing.title}`, "info");
          rejectJob(job, { typ_roweru: "inny", decyzja: "nie", oplaca_sie: false, krotki_opis: `Groq oszacował rok produkcji jako sprzed ${MIN_BIKE_YEAR} — odrzucone${listing._groqReason ? ` (powód: „${listing._groqReason}”)` : ""}` });
          continue;
        }
        if (typ === "inny" || (typ === "elektryk_gorski" && excludeElektryk)) {
          phase1Stats.groqInny++;
          const label = typ === "elektryk_gorski" ? "elektryk górski (wykluczone w Ustawieniach)" : "inny";
          addLog(`🚫 Groq: typ "${label}" — odrzucono — ${listing.title}`, "info");
          rejectJob(job, { typ_roweru: "inny", decyzja: "nie", oplaca_sie: false, krotki_opis: typ === "elektryk_gorski" ? "Odrzucone — e-MTB wykluczone w Ustawieniach" : `Odrzucone przez Groq (etap 1) — nie full/dirt/elektryk górski${listing._groqReason ? ` (powód: „${listing._groqReason}”)` : ""}` });
          continue;
        }
        // ── Niepewny typ + niska cena → bez analizy (tylko przy PRAWDZIWEJ niepewności Groqa) ──
        if (typ === "niepewne" && !classifierDown && !job.knownModel && listing.price < minUncertainPrice) {
          phase1Stats.priceThreshold++;
          addLog(`🚫 Groq: niepewny typ + cena ${listing.price}€ < ${minUncertainPrice}€ próg — odrzucono — ${listing.title}`, "info");
          rejectJob(job, { typ_roweru: "?", decyzja: "nie", oplaca_sie: false, krotki_opis: `Niepewny typ, cena ${listing.price}€ poniżej progu ${minUncertainPrice}€ — odrzucone bez analizy AI` });
          continue;
        }

        if (typ === "niepewne") phase1Stats.uncertain++; else phase1Stats.confident++;
        job.stage = "analyze";
        job.groqType = typ;
        job.classifierDown = classifierDown;
        persistPending();
      }
    } finally {
      persistPending();
    }
  };

  // ── Etap 2: analiza AI ofert z kolejki (pewne typy najpierw, potem najnowsze) ─────────
  // Oferta znika z kolejki dopiero po analizie albo trwałym odrzuceniu. Ponad limit na cykl, po błędzie
  // (do 3 prób), po STOP albo po wyczerpaniu budżetu — czeka na następny cykl.
  // v5.11 (A): wołane po KAŻDYM wyszukiwaniu (okazja idzie na Discord od razu, a nie po przejrzeniu wszystkich 44)
  // i raz na końcu cyklu (final). cb = wspólny licznik cyklu: analizy, pobrane strony ogłoszeń, zatrzymanie.
  // v6.2: nowy tytuł oferty w kolejce → ocena od początku (etap 1 + analiza, bez zapisanej pierwszej analizy)
  const resetJobForTitle = (j, title, keepDetails = false) => {
    j.rev = (j.rev || 0) + 1; // v6.3: wykonawca AI porównuje — zmiana w trakcie analizy unieważnia jej wynik
    j.listing.title = title;
    j.stage = "new"; j.groqType = null; j.cachedType = null; j.classifierDown = false;
    delete j.knownModel; delete j.recheckedFull; delete j.firstResult; delete j.firstResultKey;
    if (!keepDetails) { delete j.listing.fullDesc; j.listing.images = []; }
  };
  const runStage2 = async (cb, { final = false, worker = false } = {}) => {
    if (cb.halted) return; // brak środków / zły klucz / budżet — w tym cyklu już nie próbujemy
    if (!cb.attempted) cb.attempted = new Set();
    // v5.14: po serii nieudanych analiz (awaria dostawcy AI) — wspólna przerwa zamiast zużywania prób kolejnych ofert
    if (Date.now() < aiPauseUntilRef.current) {
      if (final) addLog(`⏸️ Analizy AI wstrzymane po serii błędów — wznowię ok. ${new Date(aiPauseUntilRef.current).toLocaleTimeString("pl-PL")} (oferty czekają w kolejce)`, "info");
      return;
    }
    const nowTs = Date.now();
    const candidates = [...pendingRef.current.values()]
      .filter(j => j.stage === "analyze")
      // v5.14: jedna próba na ofertę na cykl (stage 2 jest wołany po każdym wyszukiwaniu) i odstęp po nieudanej próbie
      .filter(j => !cb.attempted.has(j.listing.listingId) && !(j.nextAttemptAt > nowTs))
      // v6.3: oferty czekające dłużej niż JOB_AGING_MS idą pierwsze (najstarsze najpierw) — przy stałym napływie nowych
      // starsze i niepewne nie czekają w nieskończoność; dalej pewne typy przed niepewnymi i najnowsze przed starszymi
      .sort((a, b) => {
        const aOld = nowTs - (a.addedAt || 0) > JOB_AGING_MS, bOld = nowTs - (b.addedAt || 0) > JOB_AGING_MS;
        if (aOld !== bOld) return aOld ? -1 : 1;
        if (aOld) return (a.addedAt || 0) - (b.addedAt || 0);
        return ((b.groqType !== "niepewne") - (a.groqType !== "niepewne")) || (b.addedAt - a.addedAt);
      });
    if (candidates.length === 0) return;
    const candIds = new Set(candidates.map(j => j.listing.listingId));
    if (final && candidates.length > maxGeminiPerCycle - cb.analyses) {
      addLog(`⚖️ ${candidates.length} ofert czeka na analizę AI, w tym cyklu zostało ${Math.max(0, maxGeminiPerCycle - cb.analyses)} z ${maxGeminiPerCycle} — reszta poczeka na następny cykl (najpierw pewne typy i najnowsze)`, "info");
    }
    let deferred = 0;
    try {
      for (const job of candidates) {
        if (!runningRef.current) return;
        // v6.3: wykonawca AI — gdy w kolejce pojawiła się nowa oferta, przerywamy i układamy kolejność od nowa
        if (worker && [...pendingRef.current.values()].some(j => j.stage === "analyze" && !candIds.has(j.listing.listingId)
          && !cb.attempted.has(j.listing.listingId) && !(j.nextAttemptAt > Date.now()))) return;
        const revAtStart = job.rev || 0;
        if (!pendingRef.current.has(job.listing.listingId)) continue;
        const listing = job.listing;
        let groqType = job.groqType || "niepewne";

        if (cb.analyses >= maxGeminiPerCycle) { deferred++; continue; }

        // ── Pełny opis i zdjęcia ze strony ogłoszenia (bez nich oferta czeka, zamiast być ocenianą z fragmentu) ──
        // Opis pobrany dawno (oferta długo czekała w kolejce) — pobierz jeszcze raz: cena i dostępność mogły się zmienić
        if (listing.fullDesc && listing.detailsFetchedAt && Date.now() - listing.detailsFetchedAt > DETAILS_MAX_AGE_MS) {
          delete listing.fullDesc;
          listing.images = [];
        }
        const detailsPaused = Date.now() < detailBlockedUntilRef.current;
        // Strona ogłoszenia niedostępna (blokada / błąd) — czekamy do 2 h, potem ocena z fragmentu
        // (a "tak" z samego fragmentu i tak trafia do niepewnych — patrz analyzeWithGemini).
        const waitForDetails = () => {
          if (!job.detailsMissingSince) job.detailsMissingSince = Date.now();
          return Date.now() - job.detailsMissingSince < DETAILS_WAIT_MAX_MS;
        };
        if (!listing.fullDesc && detailsPaused && waitForDetails()) { deferred++; continue; }
        if (!listing.fullDesc && !detailsPaused) {
          if (cb.detailFetches >= MAX_DETAIL_FETCHES_PER_CYCLE) { deferred++; continue; }
          cb.attempted.add(listing.listingId); // v5.14: nieudane pobranie strony nie powtarza się w tym samym cyklu
          const wait = DETAIL_FETCH_DELAY_MS + Math.random() * 2000 - (Date.now() - cb.lastDetailFetchAt);
          if (wait > 0) await sleep(wait);
          if (!runningRef.current) return;
          cb.lastDetailFetchAt = Date.now();
          cb.detailFetches++;
          setAiStatus({ phase: "detail", title: listing.title });
          const det = await fetchListingDetails(listing);
          touchActivity();
          if (!runningRef.current) return;
          if (det.ok) {
            listing.fullDesc = det.desc;
            listing.fullDescTruncated = det.truncated === true;
            listing.images = det.images || [];
            listing.detailsFetchedAt = Date.now();
            if (det.sellerId) listing.sellerId = det.sellerId; // v6.1: do wykrywania duplikatów
            delete job.detailsMissingSince;
            // v6.2 (B4): strona ogłoszenia ma inny tytuł niż karta (zmiana po pobraniu listy albo nieaktualna karta) —
            // liczy się tytuł ze strony: filtry, etap 1 i analiza od początku (świeży opis i zdjęcia zostają)
            if (det.title && normTitle(det.title) !== normTitle(listing.title)) {
              addLog(`✏️ Strona ogłoszenia ma inny tytuł niż lista: „${listing.title}” → „${det.title}” — oceniam od początku`, "info");
              if (listing.cardTitle == null) listing.cardTitle = listing.title;
              resetJobForTitle(job, det.title, true);
              persistPending();
              continue;
            }
            if (job.priceUnconfirmed) {
              delete job.priceUnconfirmed;
              if (det.price == null) {
                addLog(`🚫 Brak ceny także na stronie ogłoszenia — odrzucono bez AI: ${listing.title}`, "info");
                listing.price = null;
                const se = seenIdsRef.current.get(listing.listingId);
                if (se) { se.noPrice = true; persistSeenMap(); }
                rejectJob(job, { typ_roweru: "?", decyzja: "nie", oplaca_sie: false, krotki_opis: "Odrzucone — cena zniknęła z ogłoszenia" });
                continue;
              }
            }
            addLog(`📄 Pełny opis (${det.fullLength} znaków${det.truncated ? `, przycięty do ${DESC_MAX_CHARS}` : ""}, zdjęć: ${listing.images.length}) — ${listing.title}`, "info");
            // v5.14: strona ogłoszenia nie pokazała ceny — nie ufamy cenie z listy wyników. Za pierwszym razem czekamy na
            // ponowne pobranie (następny cykl); za drugim analizujemy, ale ewentualna okazja idzie do niepewnych.
            if (det.price == null) {
              job.detailNoPrice = (job.detailNoPrice || 0) + 1;
              if (job.detailNoPrice === 1) {
                addLog(`⏳ Strona ogłoszenia bez odczytanej ceny (lista: ${listing.price ?? "?"}€) — sprawdzę ponownie w następnym cyklu: ${listing.title}`, "info");
                delete listing.fullDesc; listing.images = [];
                deferred++;
                continue;
              }
              addLog(`⚠️ Strona ogłoszenia znowu bez ceny — analizuję z ceną z listy (${listing.price ?? "?"}€), okazja trafi do niepewnych: ${listing.title}`, "error");
              notifyStatus("detail_price", `⚠️ Program nie odczytuje ceny na stronach ogłoszeń Kleinanzeigen (np. „${listing.title}”) — możliwa zmiana wyglądu strony. Okazje z niepotwierdzoną ceną idą do niepewnych.`);
            } else delete job.detailNoPrice;
            if (det.price != null && det.price !== listing.price) {
              addLog(`💶 Cena na stronie ogłoszenia (${det.price}€) różni się od listy (${listing.price ?? "?"}€) — używam ceny ze strony`, "info");
              listing.price = det.price;
            }
          } else if (det.gone) {
            addLog(`🗑 Ogłoszenie już usunięte — pomijam: ${listing.title}`, "info");
            rejectJob(job, { typ_roweru: groqType === "niepewne" ? "?" : groqType, decyzja: "nie", oplaca_sie: false, krotki_opis: "Ogłoszenie usunięte przed analizą" });
            continue;
          } else if (det.blocked) {
            detailBlockedUntilRef.current = Date.now() + DETAIL_BLOCK_PAUSE_MS;
            addLog(`⛔ Kleinanzeigen blokuje strony ogłoszeń (${det.reason}) — wstrzymuję pobieranie pełnych opisów na 30 min; oferty czekają w kolejce (do 2 h), potem ocena z fragmentu`, "error");
            notifyStatus("detail_blocked", `⛔ Kleinanzeigen blokuje strony ogłoszeń (${det.reason}). Pobieranie opisów wstrzymane na 30 min — oferty czekają w kolejce.`);
            if (waitForDetails()) { deferred++; continue; }
          } else if (!det.doc && waitForDetails()) {
            // błąd sieci / HTTP — spróbujemy w następnym cyklu
            addLog(`⏳ Strona ogłoszenia chwilowo niedostępna (${det.reason}) — spróbuję w następnym cyklu: ${listing.title}`, "info");
            deferred++;
            continue;
          } else {
            addLog(`⚠️ Brak pełnego opisu (${det.reason}) — AI dostaje krótki fragment (okazja z fragmentu trafi do niepewnych): ${listing.title}`, "error");
            if (det.doc && !descDiagLoggedRef.current) {
              descDiagLoggedRef.current = true;
              const ids = [...det.doc.querySelectorAll("[id]")].map(e => e.id).filter(id => /desc|beschreib/i.test(id)).slice(0, 10);
              const cls = [...new Set([...det.doc.querySelectorAll("*")].flatMap(el => [...el.classList]).filter(c => /desc|beschreib/i.test(c)))].slice(0, 10);
              addLog(`🔍 Diagnostyka opisu (skopiuj to do czatu): id=[${ids.join(", ") || "brak"}] · klasy=[${cls.join(", ") || "brak"}]`, "error");
            }
          }
        }

        // ── Po pełnym opisie: ponownie limit ceny i darmowe wykrywacze ──
        const freeReject2 = freeRejectReason(listing);
        if (freeReject2) {
          addLog(`${freeReject2.kind === "price" ? "💸" : "🚫"} Pełny opis: odrzucono bez AI (${freeReject2.msg}) — ${listing.title}`, "info");
          rejectJob(job, { typ_roweru: "inny", decyzja: "nie", oplaca_sie: false, krotki_opis: `Odrzucone bez AI — ${freeReject2.msg}` });
          continue;
        }
        // ── Rocznik oznaczony wprost w pełnym opisie (bez lat podzespołów) ──
        const markedYear = extractMarkedYear(listing.fullDesc);
        if (markedYear != null && markedYear < MIN_BIKE_YEAR) {
          addLog(`🕰️ Pełny opis: rocznik ${markedYear} < ${MIN_BIKE_YEAR} — odrzucono bez AI: ${listing.title}`, "info");
          rejectJob(job, { typ_roweru: "inny", decyzja: "nie", oplaca_sie: false, krotki_opis: `Odrzucone — w pełnym opisie rocznik ${markedYear} (< ${MIN_BIKE_YEAR})` });
          continue;
        }
        // ── "Niepewne" z etapu 1: druga, tania próba Groqa — tym razem z pełnym opisem (raz na ofertę) ──
        if (groqType === "niepewne" && listing.fullDesc && groqClassifierKey && !job.recheckedFull && !job.knownModel) {
          const typ2 = await classifyWithGroq(listing);
          if (!runningRef.current) return;
          job.recheckedFull = true;
          if (typ2 === "inny" || typ2 === "stary" || (typ2 === "elektryk_gorski" && excludeElektryk)) {
            addLog(`🚫 Groq (pełny opis): typ "${typ2}" — odrzucono bez analizy AI: ${listing.title}`, "info");
            rejectJob(job, { typ_roweru: "inny", decyzja: "nie", oplaca_sie: false, krotki_opis: `Odrzucone przez Groq po przeczytaniu pełnego opisu (${typ2})` });
            continue;
          }
          if (["full", "dirt", "elektryk_gorski"].includes(typ2)) {
            groqType = typ2;
            job.groqType = typ2;
            updateSeenType(listing.listingId, typ2);
          }
        }

        // ── Duplikat (v6.1, v6.2): pewny → wynik pierwszego ogłoszenia, bez AI; możliwy → normalna analiza z ostrzeżeniem ──
        const dup = listing.fullDesc ? findDuplicate(listing) : null;
        delete listing._maybeDup;
        if (dup && !dup.sure) {
          listing._maybeDup = `możliwy duplikat ogłoszenia ${dup.key} (${dup.why})`;
        } else if (dup) {
          const { e } = dup;
          linkDuplicate(dup, listing); // przejmuje obserwację ceny i aktywny link (B2)
          const outIds = new Set([dup.key, ...(e.ids || [])].map(String));
          const pendingAlert = e.dec === "tak" ? outboxRef.current.find(o => o.kind === "deal" && outIds.has(String(o.listing?.listingId))) : null;
          // v6.2 (B3): „okazja już zgłoszona” tylko przy potwierdzonej wysyłce; alert w kolejce dostaje nowy link;
          // alert utracony (np. stare ogłoszenie usunięte przed wysyłką) → nowy numer idzie do normalnej analizy
          if (e.dec === "tak" && e.alert !== "sent" && !pendingAlert) {
            addLog(`🔁 Ponowne wystawienie ogłoszenia ${dup.key} (${dup.why}) — wcześniejszy alert nie dotarł, analizuję nowy numer: ${listing.title}`, "info");
          } else {
            let what;
            if (pendingAlert) {
              const oldHref = pendingAlert.listing.href;
              pendingAlert.listing = { ...pendingAlert.listing, listingId: listing.listingId, href: listing.href, price: listing.price ?? pendingAlert.listing.price };
              persistOutbox();
              what = "okazja czeka na wysłanie — podmieniam link na nowy";
              addLog(`🔗 Oczekujący alert: link ${oldHref} → ${listing.href}`, "info");
            } else what = e.dec === "tak" ? "okazja już zgłoszona" : "oceniony wcześniej";
            addLog(`🔁 Duplikat ogłoszenia ${dup.key} (${dup.why}, ten sam tytuł i cena) — bez analizy AI, ${what} (${e.dec}): ${listing.title}`, "info");
            if (["full", "dirt", "elektryk_gorski"].includes(e.typ)) updateSeenType(listing.listingId, e.typ);
            removeJob(listing.listingId);
            persistPending();
            pushResult(listing, { typ_roweru: e.typ || "?", decyzja: e.dec === "tak" ? "nie" : e.dec, oplaca_sie: false,
              krotki_opis: `🔁 Duplikat ogłoszenia ${dup.key} (${dup.why}) — ${what}: ${e.opis || "–"}` }, "skip");
            continue;
          }
        }

        cb.analyses++;
        cb.attempted.add(listing.listingId);
        // v5.14: wznowienie od weryfikacji, gdy pierwsza analiza jest zapisana, a opis / zdjęcia / cena się nie zmieniły
        const cKey = contentKey(listing);
        const resume = job.firstResult && job.firstResultKey === cKey ? job.firstResult : null;
        if (job.firstResult && !resume) { delete job.firstResult; delete job.firstResultKey; }
        setAiStatus({ phase: "ai", title: listing.title });
        const analysis = await analyzeWithGemini(listing, groqType, resume);
        touchActivity();
        // v6.3: w trakcie analizy pętla zbierania zmieniła ofertę (nowy tytuł → ocena od początku) albo usunęła ją z kolejki
        if (!analysis?._aborted && (pendingRef.current.get(listing.listingId) !== job || job.stage !== "analyze" || (job.rev || 0) !== revAtStart)) {
          addLog(`↩️ Oferta zmieniła się w trakcie analizy — wynik pomijam, oceniam ją od nowa: ${listing.title}`, "info");
          continue;
        }
        if ((analysis?._aborted || analysis?._fatal) && analysis._first) {
          job.firstResult = analysis._first; job.firstResultKey = cKey; persistPending();
        }
        if (analysis?._aborted) return; // STOP — oferta zostaje w kolejce
        if (analysis?._budget) {
          cb.halted = true;
          addLog(`💰 ${analysis.reason || "Budżet AI wyczerpany"} — wstrzymuję analizy. ${pendingRef.current.size} ofert czeka w kolejce: zwiększ budżet w Ustawieniach albo poczekaj do 1. dnia miesiąca`, "error");
          notifyStatus("budget", `💰 Budżet AI na ten miesiąc wyczerpany (${(aiSpendRef.current.usd * USD_PLN_RATE).toFixed(2)} z ${aiBudgetPln} zł) — analizy wstrzymane, ${pendingRef.current.size} ofert czeka w kolejce. Zwiększ budżet w Ustawieniach.`);
          return;
        }
        if (analysis?._fatal) {
          cb.halted = true;
          addLog(`⛔ Analizy AI wstrzymane: ${analysis.reason} — oferty czekają w kolejce (${pendingRef.current.size}). Sprawdź klucz API albo doładuj konto; spróbuję ponownie w następnym cyklu.`, "error");
          notifyStatus("ai_fatal", `⛔ Analizy AI wstrzymane — ${analysis.reason}\nOferty czekają w kolejce (${pendingRef.current.size}) i nie przepadną. Sprawdź klucz API albo doładuj konto (console.anthropic.com → Billing / Google AI Studio).`);
          return;
        }
        if (!analysis) {
          job.attempts = (job.attempts || 0) + 1;
          // v5.14: kolejna próba najwcześniej za 10 min, potem za 30 min (krótka awaria nie zużywa wszystkich prób)
          job.nextAttemptAt = Date.now() + (job.attempts === 1 ? 10 : 30) * 60 * 1000;
          aiFailStreakRef.current++;
          if (aiFailStreakRef.current >= 2) {
            aiPauseUntilRef.current = Date.now() + AI_FAIL_PAUSE_MS;
            aiFailStreakRef.current = 0;
            addLog(`⏸️ ${aiName(geminiModel)}: 2 analizy pod rząd nieudane — przerwa w analizach AI na ${Math.round(AI_FAIL_PAUSE_MS / 60000)} min (oferty czekają w kolejce)`, "error");
            notifyStatus("ai_down", `⏸️ Analizy AI nie działają (2 nieudane pod rząd) — przerwa ${Math.round(AI_FAIL_PAUSE_MS / 60000)} min, oferty czekają w kolejce i nie przepadną.`);
          }
          if (job.attempts >= MAX_ANALYSIS_ATTEMPTS) {
            removeJob(listing.listingId);
            addToOutbox({ kind: "uncertain", listing: slimListing(listing), reason: `analiza AI nie powiodła się ${job.attempts}× — sprawdź ręcznie` });
            addLog(`⚠️ Analiza nie powiodła się ${job.attempts}× — przenoszę do niepewnych: ${listing.title}`, "error");
            pushResult(listing, { typ_roweru: "?", decyzja: "niepewne", oplaca_sie: false, krotki_opis: `Analiza AI nie powiodła się ${job.attempts}× — do ręcznego sprawdzenia` }, "error");
          } else {
            addLog(`🔁 Analiza nie powiodła się — oferta zostaje w kolejce (próba ${job.attempts}/${MAX_ANALYSIS_ATTEMPTS}, następna za ${job.attempts === 1 ? 10 : 30} min) — ${listing.title}`, "error");
          }
          persistPending();
          if (Date.now() < aiPauseUntilRef.current) return;
          continue;
        }
        aiFailStreakRef.current = 0;

        // Analiza zakończona — oferta schodzi z kolejki; okazje i niepewne idą do listy "do wysłania"
        removeJob(listing.listingId);
        persistPending();
        if (listing._maybeDup) analysis.ostrzezenia = [analysis.ostrzezenia, listing._maybeDup].filter(Boolean).join("; ").slice(0, 300); // v6.2
        recordAnalyzed(listing, analysis, analysis.decyzja === "tak" && !job.detailNoPrice ? "deal" : analysis.decyzja); // v6.1: indeks do wykrywania duplikatów
        if (analysis.decyzja === "tak" && job.detailNoPrice) {
          const why = `wyglądało na okazję (zysk ~${analysis.przewidywany_zysk}€), ale strona ogłoszenia nie pokazała ceny — cena z listy ${listing.price ?? "?"}€ niepotwierdzona`;
          addLog(`❓ ${why}: ${listing.title}`, "info");
          addToOutbox({ kind: "uncertain", listing: slimListing(listing), reason: why });
          pushResult(listing, { ...analysis, decyzja: "niepewne", krotki_opis: `${why}. ${analysis.krotki_opis || ""}` }, "skip");
        } else if (analysis.decyzja === "tak") {
          addLog(`✅ OKAZJA! [${analysis.typ_roweru}] ${listing.title} | zakup: ${analysis.cena_zakupu_eur ?? "?"}€ → sprzedaż PL: ${analysis.szacowana_sprzedaz_eur ?? "?"}€ | zysk po transporcie: ~${analysis.przewidywany_zysk}€`, "success");
          setStats(st => ({ ...st, deals: st.deals + 1 }));
          const resultId = pushResult(listing, analysis, "deal");
          addToOutbox({ kind: "deal", listing: slimListing(listing), analysis: dealSnapshot(analysis), resultId, contentKey: contentKey(listing, false), foundAt: job.addedAt || Date.now() });
          await flushOutbox({ uncertain: false });
        } else if (analysis.decyzja === "niepewne") {
          addLog(`❓ Niepewne [${analysis.typ_roweru}] — ${listing.title} | zakup: ${analysis.cena_zakupu_eur ?? "?"}€ — ${analysis.krotki_opis || "za mało informacji"}`, "info");
          addToOutbox({ kind: "uncertain", listing: slimListing(listing), reason: analysis.krotki_opis || "za mało informacji" });
          pushResult(listing, analysis, "skip");
        } else {
          const reason = analysis.odrzucenie === "czesc" ? `z opisu: sama część, nie kompletny rower`
            : analysis.odrzucenie === "sztywny" ? `sztywny widelec (bez amortyzacji)`
            : analysis.odrzucenie === "stary" ? `rocznik ${analysis.fakty?.rocznik ?? "?"} sprzed ${MIN_BIKE_YEAR}`
            : analysis.odrzucenie === "ebike" ? `e-bike — wykluczone w Ustawieniach`
            : analysis.odrzucenie === "sklep" ? `nowy rower ze sklepu`
            : analysis.typ_roweru === "inny" ? `typ: inny — odrzucone automatycznie`
            : `zysk za mały`;
          addLog(`⏭ ${aiName(geminiModel)}: NIE opłaca się (${reason}) — [${analysis.typ_roweru}] ${listing.title} | zakup: ${analysis.cena_zakupu_eur ?? "?"}€ → sprzedaż PL: ${analysis.szacowana_sprzedaz_eur ?? "?"}€`, "info");
          // v6.1: zapamiętaj wycenę (sprzedaż + transport) — gdy po spadku ceny zysk spełni próg dla NOWEJ ceny,
          // ogłoszenie wróci do analizy (nawet przy spadku < 20%). Zamiast jednej kwoty „opłaca się do” (v5.14),
          // która przy progach zależnych od ceny bywała zła w obie strony.
          const seenE = seenIdsRef.current.get(listing.listingId);
          if (seenE) {
            seenE.rej = analysis.odrzucenie || (analysis.typ_roweru === "inny" ? "inny" : null); // v6.4
            const w = watchOf(analysis, listing.price);
            seenE.watchSale = w?.watchSale ?? null;
            seenE.watchT = w?.watchT ?? null;
            seenE.nearMax = null;
            persistSeenMap();
          }
          const near = nearDealOf(analysis);
          if (near) {
            analysis.krotki_opis = `${analysis.krotki_opis || ""} 🤏 Na granicy: opłaca się do ${near.maxPrice}€ — proponuj ${near.offer}€.`;
            addLog(`🤏 Na granicy okazji: ${listing.title} — ${listing.price}€, opłaca się do ${near.maxPrice}€, proponuj ${near.offer}€${nearWebhook ? "" : " (ustaw webhook „Na granicy okazji”, żeby dostawać to na Discord)"}`, "info");
            if (nearWebhook) {
              addToOutbox({ kind: "near", listing: slimListing(listing), analysis: dealSnapshot(analysis), near });
              await flushOutbox({ uncertain: false });
            }
          }
          pushResult(listing, analysis, "skip");
        }
        await sleep(5000);
      }
    } finally {
      setAiStatus(null);
      persistPending();
      if (final && deferred > 0) addLog(`⏳ ${deferred} ofert czeka w kolejce na następny cykl (limit ${maxGeminiPerCycle} analiz i ${MAX_DETAIL_FETCHES_PER_CYCLE} stron ogłoszeń na cykl)`, "info");
    }
  };

  // ── One full scan cycle ────────────────────────────────────────────────
  // Zwykła funkcja (nie useCallback): pętla woła zawsze NAJNOWSZĄ wersję przez runCycleRef, więc
  // zmiany w Ustawieniach (zaznaczone modele, budżet, model AI…) działają od następnego cyklu.
  // ── v6.4: NOCNE SPRAWDZANIE CEN ──
  // Wyszukiwania czytają tylko pierwszą stronę wyników (25 najnowszych), więc obniżki starszych ogłoszeń przechodzą
  // niezauważone. W nocy (od godziny z Ustawień, przez NIGHT_WINDOW_H h) skaner zagląda na stronę ogłoszeń, przy których
  // obniżka coś zmienia: z zapamiętaną wyceną (watchSale / nearMax) oraz „za drogich” do górnej granicy z Ustawień.
  // Po NIGHT_BATCH stron na cykl, w tym samym odstępie co inne zapytania (kaSlot) — wyszukiwania działają dalej.
  // Analiza AI tylko wtedy, gdy przy nowej cenie wycena przechodzi próg albo cena zeszła do zakresu zakupu.
  const nightStateRef = useRef((() => { try { return JSON.parse(localStorage.getItem("ddf_night") || "null"); } catch { return null; } })());
  const persistNight = () => safeSetItem("ddf_night", JSON.stringify(nightStateRef.current));
  const nightKey = () => new Date(Date.now() - nightCheckHour * 3600e3).toLocaleDateString("sv-SE"); // jedna „noc” = jeden klucz
  const inNightWindow = () => { const h = new Date().getHours(); return ((h - nightCheckHour + 24) % 24) < NIGHT_WINDOW_H; };
  const nightCandidates = () => {
    const now = Date.now(), out = [];
    for (const [id, e] of seenIdsRef.current) {
      if (e.rej && SEEN_HARD_REJ.has(e.rej)) continue;
      if (now - (e.lastSeenAt || 0) < NIGHT_SKIP_SEEN_MS) continue;
      const watched = e.watchSale != null || e.nearMax != null;
      const overMax = e.overMax && e.price != null && e.price <= nightOverMaxCap;
      if (watched || overMax) out.push({ id, pri: watched ? 0 : 1, price: e.price ?? 0 });
    }
    // najpierw z wyceną, potem „za drogie” od najbliższych limitu zakupu
    return out.sort((a, b) => a.pri - b.pri || a.price - b.price).map(x => x.id);
  };
  const inferBikeLabel = (title) => {
    const t = ` ${String(title || "").toLowerCase().replace(/[^a-z0-9äöüß.]+/g, " ")} `;
    const m = BIKE_MODELS.find(b => !b.isCategory && b.query && b.query.toLowerCase().split(/\s+/).every(w => t.includes(` ${w} `)));
    return m ? m.label : "Nocne sprawdzanie cen";
  };
  const runNightCheck = async () => {
    if (!nightCheckEnabled || !inNightWindow()) return;
    const key = nightKey();
    let st = nightStateRef.current;
    if (!st || st.key !== key) {
      const queue = nightCandidates().slice(0, nightCheckMax);
      st = nightStateRef.current = { key, queue, total: queue.length, checked: 0, drops: 0, queued: 0, gone: 0, startedAt: Date.now(), finishedAt: null };
      persistNight();
      addLog(`🌙 Nocne sprawdzanie cen: ${queue.length} ogłoszeń (z wyceną do obserwacji i „za drogie” do ${nightOverMaxCap} €) — po ${NIGHT_BATCH} na cykl, bez AI, chyba że obniżka coś zmienia`, "info");
    }
    if (st.finishedAt) return;
    let n = 0;
    while (st.queue.length > 0 && n < NIGHT_BATCH && runningRef.current) {
      const id = st.queue.shift(); n++; st.checked++;
      const e = seenIdsRef.current.get(id);
      if (!e) continue;
      setScanStatus({ phase: "night", i: st.checked, n: st.total });
      const href = `https://www.kleinanzeigen.de/s-anzeige/${id}`; // krótki adres przekierowuje na pełny (sprawdzone 13.11.2026)
      const det = await fetchListingDetails({ listingId: id, href, title: "" });
      touchActivity();
      if (!runningRef.current) { st.queue.unshift(id); st.checked--; break; }
      if (det.blocked) { st.queue.unshift(id); st.checked--; addLog(`⛔ Nocne sprawdzanie cen: Kleinanzeigen blokuje (${det.reason || "403"}) — przerywam do następnego cyklu`, "error"); break; }
      if (det.gone) { seenIdsRef.current.delete(id); st.gone++; continue; }
      if (!det.ok || det.price == null) continue;
      e.lastNightAt = Date.now();
      const old = e.price;
      if (old != null && det.price < old) {
        st.drops++;
        const hitWatch = e.watchSale != null && meetsProfit(e.watchSale, e.watchT, det.price);
        const hitLegacy = !hitWatch && e.nearMax != null && det.price <= e.nearMax;
        const intoRange = e.overMax && det.price <= maxBuyPrice && det.price >= minListingPrice;
        e.lowest = e.lowest == null ? det.price : Math.min(e.lowest, det.price);
        e.price = det.price;
        if (hitWatch || hitLegacy || intoRange) {
          const listing = {
            listingId: id, title: det.title || `Ogłoszenie ${id}`, price: det.price, href,
            desc: String(det.desc || "").replace(/\s+/g, " ").slice(0, 300), location: "", bike: inferBikeLabel(det.title), postedAt: null,
            prevPrice: old, _hitWatch: hitWatch || undefined, _hitNearMax: hitLegacy ? e.nearMax : undefined, _night: true,
          };
          e.notifiedAt = det.price; e.overMax = false; e.nearMax = null; e.watchSale = null; e.watchT = null;
          const queued = intoRange ? enqueueJob(listing, "new") : enqueueJob(listing, "price_drop", e.type || null);
          if (queued) {
            st.queued++;
            addLog(`🌙📉 Nocne sprawdzanie: ${listing.title} — ${old}€ → ${det.price}€ (${intoRange ? "zeszła do zakresu zakupu" : "według wcześniejszej wyceny zakup spełnia próg"}) — do analizy`, "info");
          }
        }
      } else if (old == null || det.price !== old) {
        e.price = det.price;
        if (det.price > maxBuyPrice) e.overMax = true;
      }
    }
    if (n > 0) { persistSeenMap(); persistPending(); }
    if (st.queue.length === 0 && !st.finishedAt) {
      st.finishedAt = Date.now();
      addLog(`🌙 Nocne sprawdzanie cen zakończone: sprawdzono ${st.checked}/${st.total} · obniżek ${st.drops} · do analizy ${st.queued} · usuniętych z Kleinanzeigen ${st.gone} (wypadły z pamięci)`, "success");
      if (st.queued > 0) wakeAiWorker();
    }
    persistNight();
  };

  const runOneCycle = async (cycleN) => {
    const cycleStartedAt = Date.now();
    const selBikes = BIKE_MODELS.filter(b => selectedBikes.includes(b.id));
    // v6.3: co cykl zaczynamy od innego wyszukiwania — pierwsze marki na liście nie są stale uprzywilejowane
    const rot = selBikes.length ? (cycleN - 1) % selBikes.length : 0;
    const activeBikes = [...selBikes.slice(rot), ...selBikes.slice(0, rot)];
    addLog(`🔄 Cykl #${cycleN} — sprawdzam ${activeBikes.length} wyszukiwań`, "success");
    addLog(
      groqClassifierKey
        ? `🤖 Etap 1 (Groq) AKTYWNY — model ${GROQ_CLASSIFIER_MODEL}, ${getGroqKeyList().length} klucz(e), limit analiz AI/cykl = ${maxGeminiPerCycle}`
        : `ℹ️ Etap 1 (Groq) WYŁĄCZONY — brak klucza w Ustawieniach, wszystko po czarnej liście idzie prosto do analizy AI`,
      "info"
    );
    if (provider !== "groq") {
      const tierNow = getAiTier();
      addLog(`💰 AI (Gemini/Claude) w tym miesiącu: ${(aiSpendRef.current.usd * USD_PLN_RATE).toFixed(2)} zł z ${aiBudgetPln} zł — tryb: ${TIER_LABELS[tierNow]}`, tierNow === "eco" || tierNow === "stop" ? "error" : "info");
    }
    setScanStatus({ phase: "start" });
    cleanupQueues();
    if (pendingRef.current.size > 0 || outboxRef.current.length > 0) {
      addLog(`📥 Z poprzednich cykli: ${pendingRef.current.size} ofert w kolejce, ${outboxRef.current.length} powiadomień do wysłania`, "info");
    }
    await flushOutbox(); // zaległe powiadomienia (np. Discord nie odpowiadał w poprzednim cyklu)

    const phase1Stats = { blacklist: 0, groqInny: 0, noPrice: 0, priceThreshold: 0, confident: 0, uncertain: 0, oldBike: 0, priceDrops: 0, tooExpensive: 0, tooCheap: 0, freeDetect: 0, classifierDown: 0, skippedOld: 0, queued: 0 };
    const cb = { analyses: 0, detailFetches: 0, lastDetailFetchAt: 0, halted: false, attempted: new Set() }; // wspólny limit analiz/stron na cykl
    cycleBudgetRef.current = cb; // v6.3: wykonawca AI liczy analizy i strony ogłoszeń w ramach bieżącego cyklu
    await runStage1(phase1Stats); // zaległe oferty etapu 1 (np. przerwane STOP-em)
    wakeAiWorker();
    // v6.4: w nocy — porcja sprawdzania cen starszych ogłoszeń (przed wyszukiwaniami tego cyklu)
    try { await runNightCheck(); } catch (e) { addLog(`⚠️ Nocne sprawdzanie cen: błąd ${String(e?.message || e).slice(0, 150)} — spróbuję w następnym cyklu`, "error"); }
    if (!runningRef.current) return;
    await runStage1(phase1Stats); // oferty z nocnego sprawdzania, które zeszły do zakresu zakupu → etap 1
    wakeAiWorker();

    // ── FAZA 1: pobieranie wyników + kolejka + etap 1 (+ od razu analiza nowych ofert) ──
    const scrapePaused = Date.now() < scrapeBlockedUntilRef.current;
    if (scrapePaused) addLog(`⛔ Wyszukiwania wstrzymane po blokadzie Kleinanzeigen — wznowię ok. ${new Date(scrapeBlockedUntilRef.current).toLocaleTimeString("pl-PL")}`, "error");
    let blockStreak = 0, scannedCount = 0, rareSkipped = 0, cardsTotal = 0, searchesWithNew = 0;
    // v6.3: lista może się wydłużyć — podejrzanie puste wyszukiwanie wraca raz na koniec cyklu
    const searchQueue = [...activeBikes];
    for (let bikeIdx = 0; bikeIdx < searchQueue.length && !scrapePaused; bikeIdx++) {
      const bike = searchQueue[bikeIdx];
      const isRetry = bikeIdx >= activeBikes.length;
      if (!runningRef.current) return;
      // v5.11 (A): wyszukiwanie bez nowych ofert od 3 dni sprawdzamy co ok. 10 min — cykl jest krótszy, więc popularne częściej
      const stPre = scanStateRef.current.searches[bike.id];
      if (stPre?.baselineAt && !isRetry) {
        if (stPre.lastNewAt == null) stPre.lastNewAt = Date.now(); // migracja: 3 dni "na start"
        if (Date.now() - stPre.lastNewAt > RARE_SEARCH_AFTER_MS && Date.now() - (stPre.lastScanAt || 0) < RARE_SEARCH_RESCAN_MS) { rareSkipped++; continue; }
      }
      // Odstęp między kolejnymi wyszukiwaniami — bez przerwy wygląda to dla Kleinanzeigen jak bot (captcha)
      if (scannedCount > 0) await sleep(SEARCH_GAP_MS + Math.random() * 1500);
      scannedCount++;
      if (!runningRef.current) return;
      // v5.14: bez rutynowych linii na każde wyszukiwanie (log trzymał przez nie tylko ok. 25 min) — podsumowanie na końcu fazy 1
      setScanStatus({ phase: "search", i: Math.min(bikeIdx + 1, activeBikes.length), n: activeBikes.length, label: isRetry ? `${bike.label} (powtórka)` : bike.label });

      let listings = [];
      let scrapeOk = false, blocked = false, priceBroken = false, suspiciousEmpty = false;
      try {
        const html = await scrapeKleinanzeigen(bike);
        touchActivity();
        listings = parseListings(html, bike.label);
        blocked = listings.blocked === true; // sprawdzić PRZED kopiowaniem tablicy (kopia gubi flagi)
        priceBroken = listings.priceParseBroken === true;
        const pageHeading = listings.pageHeading || "";
        // Usuń duplikaty WEWNĄTRZ tego samego skanu (wyróżnione + zwykłe)
        const uniqueMap = new Map();
        listings.forEach(l => { if (!uniqueMap.has(l.listingId)) uniqueMap.set(l.listingId, l); });
        listings = [...uniqueMap.values()];
        if (listings.length === 0 && !blocked) {
          // v6.3: Kleinanzeigen czasem chwilowo zwraca „keine Ergebnisse” dla popularnej frazy. Gdy ostatnio było tu
          // dużo ogłoszeń, nie uznajemy tego za skan (stan wyszukiwania bez zmian) i powtarzamy raz na końcu cyklu.
          const prev = scanStateRef.current.searches[bike.id]?.lastCards;
          suspiciousEmpty = prev >= EMPTY_SUSPICIOUS_MIN_CARDS;
          addLog(`📋 ${bike.label}: znaleziono 0 ogłoszeń (strona: „${pageHeading || "?"}”, ${html.length} znaków HTML)${suspiciousEmpty
            ? (isRetry ? ` — przy poprzednim skanie było ${prev}; powtórka też pusta — sprawdzę w następnym cyklu` : ` — przy poprzednim skanie było ${prev}; nie liczę tego jako skanu, powtórzę na końcu cyklu`) : ""}`, "error");
          if (suspiciousEmpty && !isRetry) searchQueue.push(bike);
        }
        cardsTotal += listings.length;
        scrapeOk = !blocked && !priceBroken && !suspiciousEmpty; // prawidłowo pusta strona to poprawny wynik; captcha — nie (nie ruszamy stanu wyszukiwania)
      } catch (e) {
        if (!runningRef.current) return;
        if (/Scrape HTTP (403|429)/.test(e.message)) blocked = true;
        addLog(`⚠️ ${bike.label}: błąd scraping — ${e.message}`, "error");
      }
      // ── Bezpiecznik: 2 zablokowane wyszukiwania pod rząd → przerwa we wszystkich zapytaniach do Kleinanzeigen ──
      if (blocked) {
        blockStreak++;
        if (blockStreak >= 2) {
          scrapeBlockedUntilRef.current = Date.now() + SCRAPE_BLOCK_PAUSE_MS;
          detailBlockedUntilRef.current = Math.max(detailBlockedUntilRef.current, scrapeBlockedUntilRef.current);
          addLog(`⛔ Kleinanzeigen blokuje wyszukiwania (2 pod rząd) — przerwa ${Math.round(SCRAPE_BLOCK_PAUSE_MS / 60000)} min we wszystkich zapytaniach, potem wznawiam sam`, "error");
          notifyStatus("scrape_blocked", `⛔ Kleinanzeigen blokuje wyszukiwania (captcha / HTTP 403/429). Skaner robi ${Math.round(SCRAPE_BLOCK_PAUSE_MS / 60000)} min przerwy i wznowi się sam. Jeśli to się powtarza — wyłącz część wyszukiwań albo zrób dłuższą przerwę.`);
          break;
        }
        continue;
      }
      if (scrapeOk) blockStreak = 0;
      if (priceBroken) {
        addLog(`⚠️ ${bike.label}: nie odczytano cen większości ogłoszeń — pomijam to wyszukiwanie w tym cyklu (oferty NIE są oznaczane jako widziane, nic nie przepada)`, "error");
        notifyStatus("price_parse", `⚠️ Program nie odczytuje cen na liście wyników Kleinanzeigen (np. „${bike.label}”) — prawdopodobnie zmienił się wygląd strony. Wyszukiwania z takim wynikiem są pomijane, oferty nie przepadają. Skopiuj z logu linię „🔍 Diagnostyka ceny” do czatu.`);
        continue;
      }
      if (!scrapeOk) continue; // błąd/pusto — nie ruszamy stanu tego wyszukiwania

      const now = Date.now();
      // Wszystkie ogłoszenia z wyników: "widziane teraz" — z pamięci wypadają tylko te niewidziane od 30 dni
      for (const l of listings) { const e = seenIdsRef.current.get(l.listingId); if (e) e.lastSeenAt = now; }
      const fresh = listings.filter(l => !seenIdsRef.current.has(l.listingId));

      // Oferty czekające w kolejce: aktualna cena z listy wyników (mogła się zmienić w czasie czekania)
      let pricesUpdated = 0;
      for (const l of listings) {
        const j = pendingRef.current.get(l.listingId);
        // v6.1: zmieniony tytuł (np. dopisane „defekt”, inny model) — wynik etapu 1 i zapisana pierwsza analiza nieaktualne.
        // v6.2: porównujemy z tytułem z OSTATNIEJ KARTY (cardTitle), bo tytuł oferty mógł już przyjść ze strony ogłoszenia
        // (nowszy niż nieodświeżona karta) — inaczej tytuł przeskakiwałby tam i z powrotem co cykl
        if (j && l.title && normTitle(l.title) !== normTitle(j.listing.cardTitle ?? j.listing.title)) {
          addLog(`✏️ Kolejka: zmiana tytułu „${j.listing.cardTitle ?? j.listing.title}” → „${l.title}” — oceniam od początku`, "info");
          resetJobForTitle(j, l.title);
          j.listing.cardTitle = l.title;
          pricesUpdated++;
        }
        if (j && l.price != null && j.listing.price !== l.price) {
          addLog(`💶 Kolejka: zmiana ceny ${j.listing.price ?? "?"}€ → ${l.price}€ — ${l.title}`, "info");
          j.listing.price = l.price;
          pricesUpdated++;
        } else if (j && l.price == null && j.listing.price != null && !j.priceUnconfirmed) {
          // Cena zniknęła z listy wyników — nie ufamy starej kwocie: przed analizą pobierzemy stronę ogłoszenia
          addLog(`💶 Kolejka: brak ceny w nowym skanie (było ${j.listing.price}€) — sprawdzę na stronie ogłoszenia — ${l.title}`, "info");
          j.priceUnconfirmed = true;
          delete j.listing.fullDesc;
          pricesUpdated++;
        }
      }
      if (pricesUpdated > 0) persistPending();

      // Znane ogłoszenia bez ceny: ustaw punkt odniesienia; droższe niż limit zakupu: flaga overMax.
      // v5.11: ogłoszenie odrzucone za brak ceny, w którym cena się pojawiła — wraca do oceny.
      let baselinesSet = 0;
      const priceAdded = [];
      for (const l of listings) {
        if (l.price == null) continue;
        const e = seenIdsRef.current.get(l.listingId);
        if (!e) continue;
        if (e.noPrice) { e.noPrice = false; e.lowest = l.price; e.price = l.price; priceAdded.push(l); baselinesSet++; continue; }
        if (e.lowest == null) { e.lowest = l.price; e.price = l.price; baselinesSet++; }
        if (l.price > maxBuyPrice && !e.overMax) { e.overMax = true; baselinesSet++; }
      }
      if (baselinesSet > 0) persistSeenMap();

      // ── Pierwsze skanowanie TEGO wyszukiwania (nowa instalacja, nowe wyszukiwanie, "Zacznij od zera") ──
      const st = scanStateRef.current.searches[bike.id];
      if (!st || !st.baselineAt) {
        fresh.forEach(l => saveSeenEntry(l, false));
        persistSeenMap();
        scanStateRef.current.searches[bike.id] = { baselineAt: now, lastScanAt: now, lastNewAt: now, emptyBaseline: listings.length === 0, lastCards: listings.length, urlVersion: SEARCH_URL_VERSION, priceRange: `${minListingPrice}:${maxBuyPrice}` };
        persistScanState();
        addLog(`📌 ${bike.label}: pierwsze skanowanie tego wyszukiwania — zapamiętano ${fresh.length} istniejących ogłoszeń (bez analizy)`, "info");
        await sleep(3000);
        continue;
      }
      // Wyszukiwanie zainicjowane na PUSTEJ stronie, a teraz nagle wiele "nowych" ofert naraz (np. naprawiony
      // parser) — decyduje DATA ofert, jak po długiej przerwie: z ostatnich 24 h idą do analizy, starsze nie.
      const emptyBurst = st.emptyBaseline === true && fresh.length > 5;
      if (st.emptyBaseline && listings.length > 0) delete st.emptyBaseline;

      // ── Po przerwie dłuższej niż 24 h: tylko oferty dodane w ostatnich 24 h (wg daty na karcie) ──
      const gapMs = now - (st.lastScanAt || 0);
      let toQueue = fresh;
      // v6.3: zmiana zakresu cen w Ustawieniach zmienia link — nowo widoczne stare oferty traktujemy jak po zmianie filtra
      const rangeKey = `${minListingPrice}:${maxBuyPrice}`;
      const urlChanged = st.urlVersion !== SEARCH_URL_VERSION || (st.priceRange != null && st.priceRange !== rangeKey); // v6.4: także kategorie (górna cena w linku)
      if ((gapMs > RESUME_WINDOW_MS || emptyBurst || urlChanged) && fresh.length > 0) {
        const recent = fresh.filter(l => l.postedAt != null && now - l.postedAt <= RESUME_WINDOW_MS);
        // Brak daty na karcie ≠ stara oferta: kilka pierwszych bez daty (lista jest od najnowszych) też analizujemy
        const undated = fresh.filter(l => l.postedAt == null).slice(0, RESUME_MAX_UNDATED);
        toQueue = [...recent, ...undated];
        const skipped = fresh.length - toQueue.length;
        if (skipped > 0 || undated.length > 0 || emptyBurst || urlChanged) {
          phase1Stats.skippedOld += skipped;
          addLog(`⏭ ${bike.label}: ${urlChanged ? "nowy filtr wyszukiwania (zakres cen / typ roweru)" : emptyBurst && gapMs <= RESUME_WINDOW_MS ? `wcześniej puste wyszukiwanie — nagle ${fresh.length} ofert` : `przerwa w skanowaniu ${st.lastScanAt ? `ok. ${Math.round(gapMs / 3600000)} h` : "o nieznanej długości"}`} — analizuję ${recent.length} ofert z ostatnich 24 h${undated.length > 0 ? ` + ${undated.length} bez daty` : ""}${skipped > 0 ? `, pomijam ${skipped} starszych (albo bez daty ponad limit ${RESUME_MAX_UNDATED})` : ""}`, "info");
        }
      }
      st.lastScanAt = now;
      st.lastCards = listings.length; // v6.3: do wykrywania podejrzanie pustych wyników
      st.urlVersion = SEARCH_URL_VERSION;
      st.priceRange = rangeKey;
      persistScanState();

      // ── Spadki cen na JUŻ widzianych ogłoszeniach (spadek o co najmniej PRICE_DROP_THRESHOLD) ──
      const freshIds = new Set(fresh.map(l => l.listingId));
      const dropLimit = (base) => base * (1 - PRICE_DROP_THRESHOLD) + 0.01; // "co najmniej 20%" — 1000 € → 800 € też się liczy
      const priceDropped = listings.filter(l => {
        if (freshIds.has(l.listingId) || l.price == null) return false;
        const entry = seenIdsRef.current.get(l.listingId);
        if (!entry) return false;
        if (entry.overMax && l.price <= maxBuyPrice) return true; // wcześniej za drogie, teraz mieści się w limicie
        if (entry.watchSale != null && l.price < (entry.price ?? Infinity) && meetsProfit(entry.watchSale, entry.watchT, l.price)) return true; // v6.1: przy nowej cenie wycena spełnia próg
        if (entry.nearMax != null && l.price <= entry.nearMax && l.price < (entry.price ?? Infinity)) return true; // v5.14 (stare wpisy): spadła do „opłaca się do”
        if (entry.lowest == null) return false;
        if (l.price > dropLimit(entry.lowest)) return false;
        if (entry.notifiedAt != null && l.price > dropLimit(entry.notifiedAt)) return false;
        return true;
      });
      for (const l of priceDropped) {
        const e = seenIdsRef.current.get(l.listingId);
        const before = e.notifiedAt ?? e.price ?? e.lowest; // ostatnia znana cena — pokazujemy ją w alercie ("1200€ → 950€")
        if (before != null && before > l.price) l.prevPrice = before;
        e.lowest = e.lowest == null ? l.price : Math.min(e.lowest, l.price);
        if (e.watchSale != null && meetsProfit(e.watchSale, e.watchT, l.price)) l._hitWatch = true;
        else if (e.nearMax != null && l.price <= e.nearMax) l._hitNearMax = e.nearMax;
        e.notifiedAt = l.price; // ten poziom ceny jest już "obsłużony" — oferta i tak czeka w kolejce do skutku
        e.overMax = false;
        e.nearMax = null;       // nowa analiza ustawi nową wycenę do obserwacji
        e.watchSale = null; e.watchT = null;
        e.price = l.price;
      }

      // Nowe ID zapamiętujemy od razu (to tylko "widziane"); do kolejki trafiają te, które mają być ocenione
      fresh.forEach(l => saveSeenEntry(l, false));
      persistSeenMap(); // zawsze — zapisuje też "ostatnio widziane"
      let queuedNow = 0;
      for (const l of toQueue) if (enqueueJob(l, "new")) queuedNow++;
      for (const l of priceDropped) enqueueJob(l, "price_drop", seenIdsRef.current.get(l.listingId)?.type || null);
      for (const l of priceAdded) enqueueJob(l, "price_added", seenIdsRef.current.get(l.listingId)?.type || null);
      persistPending();
      phase1Stats.queued += queuedNow;
      if (queuedNow > 0 || priceDropped.length > 0 || priceAdded.length > 0) { st.lastNewAt = now; persistScanState(); }

      if (toQueue.length === 0 && priceDropped.length === 0 && priceAdded.length === 0) {
        // brak nowych — bez wpisu w logu (v5.14)
      } else {
        searchesWithNew++;
        if (queuedNow > 0) {
          addLog(`🆕 ${bike.label}: ${queuedNow} nowych ogłoszeń`, "success");
          setStats(s => ({ ...s, scanned: s.scanned + queuedNow }));
        }
        if (priceDropped.length > 0) addLog(`📉 ${bike.label}: ${priceDropped.length} spadków ceny na znanych ogłoszeniach`, "success");
      }

      await runStage1(phase1Stats);
      if (!runningRef.current) return;
      wakeAiWorker(); // v6.3: analiza w tle (wykonawca AI) — wyszukiwania nie czekają na AI
    }
    if (!runningRef.current) return;
    addLog(`🔍 Sprawdzono ${scannedCount} wyszukiwań (${cardsTotal} ogłoszeń na listach${searchesWithNew ? `, nowe lub tańsze w ${searchesWithNew}` : ", nic nowego"})`, "info");
    if (rareSkipped > 0) addLog(`⏩ Pominięto ${rareSkipped} rzadkich wyszukiwań (bez nowych ofert od 3 dni — sprawdzane co ok. ${Math.round(RARE_SEARCH_RESCAN_MS / 60000)} min)`, "info");

    addLog(
      `📊 Podsumowanie etapu 1: 🆕 ${phase1Stats.queued} nowych${phase1Stats.skippedOld ? ` (⏭ ${phase1Stats.skippedOld} starszych niż 24 h pominiętych)` : ""} · 💸 ${phase1Stats.tooExpensive} za drogich (> ${maxBuyPrice}€) · 💸 ${phase1Stats.tooCheap} za tanich (< ${minListingPrice}€) · 🚫 ${phase1Stats.freeDetect} e-bike/sklep (bez AI) · 🚫 ${phase1Stats.blacklist} odrzuconych (czarna lista) · 🕰️ ${phase1Stats.oldBike} odrzuconych (za stary, < ${MIN_BIKE_YEAR}) · 🚫 ${phase1Stats.groqInny} odrzuconych (Groq: inny) · 🚫 ${phase1Stats.priceThreshold} odrzuconych (niepewne + cena < ${minUncertainPrice}€) · 🚫 ${phase1Stats.noPrice} bez ceny (odrzucone) · 📉 ${phase1Stats.priceDrops} spadków ceny${phase1Stats.classifierDown ? ` · ⚠️ ${phase1Stats.classifierDown}× Groq niedostępny (bez progu ceny)` : ""} · ➡️ w kolejce do analizy AI: ${[...pendingRef.current.values()].filter(j => j.stage === "analyze").length}`,
      "success"
    );

    // ── v6.3: analizy AI trwają w tle (wykonawca AI) — tu tylko stan kolejki ──
    const waitingAi = [...pendingRef.current.values()].filter(j => j.stage === "analyze");
    if (waitingAi.length > 0) {
      const oldest = Math.max(...waitingAi.map(j => Date.now() - (j.addedAt || Date.now())));
      const why = Date.now() < aiPauseUntilRef.current ? ` · analizy wstrzymane po błędach do ${new Date(aiPauseUntilRef.current).toLocaleTimeString("pl-PL")}`
        : cb.halted ? " · analizy wstrzymane (budżet / klucz)"
        : cb.analyses >= maxGeminiPerCycle ? ` · limit ${maxGeminiPerCycle} analiz w tym cyklu wyczerpany — reszta w następnym` : " · analizy trwają w tle";
      addLog(`🧠 W kolejce do analizy AI: ${waitingAi.length} (najdłużej czeka ${fmtDuration(oldest)})${why}`, "info");
    }
    await flushOutbox(); // lista niepewnych + ewentualne niewysłane okazje

    const took = Date.now() - cycleStartedAt;
    setLastCycleMs(took);
    const delays = alertDelaysRef.current;
    const avgDelay = delays.length ? delays.reduce((x, y) => x + y, 0) / delays.length : null;
    addLog(`✔ Cykl #${cycleN} zakończony w ${fmtDuration(took)} — czekam 60 s przed kolejnym${pendingRef.current.size ? ` · w kolejce: ${pendingRef.current.size}` : ""}${outboxRef.current.length ? ` · do wysłania: ${outboxRef.current.length}` : ""}${avgDelay != null ? ` · średnio ${fmtDuration(avgDelay)} od wykrycia do alertu (ostatnie ${delays.length})` : ""}`, "info");
  };
  runCycleRef.current = runOneCycle;
  runStage2Ref.current = runStage2; // v6.4 (B1): wykonawca AI zawsze z NAJNOWSZYMI ustawieniami

  // ── v6.3: wykonawca AI — osobny przebieg obok pętli zbierania ofert ──
  // Pętla zbierania pobiera listy wyników, etap 1 (filtry + Groq) i dopisuje oferty do kolejki; wykonawca bierze z kolejki
  // po jednej ofercie (strona ogłoszenia + analiza + weryfikacja + wysyłka). Długa analiza nie wstrzymuje wyszukiwań.
  // Jeden wykonawca naraz; zapytania do Kleinanzeigen obu przebiegów idą przez wspólny odstęp (kaSlot). STOP kończy oba.
  const cycleBudgetRef = useRef(null);
  const aiWakeRef = useRef(null);
  const wakeAiWorker = () => { const w = aiWakeRef.current; aiWakeRef.current = null; if (w) w(); };
  const aiWorkerLoop = async () => {
    while (runningRef.current) {
      const cb = cycleBudgetRef.current;
      if (cb) {
        try { await runStage2Ref.current(cb, { worker: true }); } // v6.4 (B1): nie wersja z chwili Startu
        catch (e) { if (runningRef.current) addLog(`❌ Nieoczekiwany błąd analizy w tle: ${e?.message || e} — oferty zostają w kolejce`, "error"); }
      }
      if (!runningRef.current) break;
      await new Promise(res => { aiWakeRef.current = res; setTimeout(res, 1000); });
    }
  };

  // ── v6.2: jedna aktywna karta skanera (Web Locks) ──
  // Blokada „ddf-scanner” trzymana przez cały czas pracy. Druga karta tego samego adresu w tej samej przeglądarce
  // nie wystartuje (też z autostartu) i zostaje podglądem. Nie chroni przed innym komputerem / przeglądarką / wersją testową.
  const lockReleaseRef = useRef(null);
  const startingRef = useRef(false);
  const [otherTabActive, setOtherTabActive] = useState(false);
  const acquireScanLock = () => new Promise((resolve) => {
    if (typeof navigator === "undefined" || !navigator.locks?.request) { resolve(true); return; } // brak Web Locks — jak dawniej
    navigator.locks.request("ddf-scanner", { ifAvailable: true }, (lock) => {
      if (!lock) { resolve(false); return; }
      resolve(true);
      return new Promise(rel => { lockReleaseRef.current = rel; });
    }).catch(() => resolve(true));
  });
  const releaseScanLock = () => { try { lockReleaseRef.current?.(); } catch {} lockReleaseRef.current = null; };
  useEffect(() => {
    if (typeof navigator === "undefined" || !navigator.locks?.query) return;
    const check = () => {
      if (runningRef.current) { setOtherTabActive(false); return; }
      navigator.locks.query().then(st => setOtherTabActive((st.held || []).some(l => l.name === "ddf-scanner"))).catch(() => {});
    };
    check();
    const t = setInterval(check, 5000);
    return () => clearInterval(t);
  }, []);

  // ── Continuous loop ────────────────────────────────────────────────────
  const startLoop = async () => {
    if (!keyFor(geminiModel)) { addLog(`❌ Brak klucza API (${provider === "groq" ? "Groq" : aiName(geminiModel)}) dla modelu ${geminiModel}`, "error"); setTab("settings"); return; }
    // Model weryfikacji okazji (Gemini/Claude) potrzebuje własnego klucza — bez niego każda okazja kończyłaby jako "niepewne"
    if (provider !== "groq" && !keyFor(strongModel)) { addLog(`❌ Brak klucza ${aiName(strongModel)} — wybrany model weryfikacji okazji to ${strongModel} (Ustawienia)`, "error"); setTab("settings"); return; }
    if (!discordWebhook) { addLog("❌ Brak Discord Webhook",    "error"); setTab("settings"); return; }
    if (runningRef.current || startingRef.current) return;
    startingRef.current = true;
    const gotLock = await acquireScanLock();
    startingRef.current = false;
    if (!gotLock) {
      setOtherTabActive(true);
      addLog("⛔ Skaner już działa w innej karcie tej przeglądarki — tu nie uruchamiam (ta karta jest tylko podglądem). Żeby skanować tutaj, zatrzymaj albo zamknij tamtą kartę.", "error");
      return;
    }
    if (runningRef.current) { releaseScanLock(); return; }
    setOtherTabActive(false);
    reloadPersistedState(); // v6.4 (B4): karta mogła być otwarta wcześniej (podgląd) — skanujemy na AKTUALNYM stanie

    sessionAbortRef.current = typeof AbortController !== "undefined" ? new AbortController() : null;
    runningRef.current = true;
    try { localStorage.setItem("ddf_autorun", "1"); } catch {} // v5.12: po odświeżeniu strony skaner wznowi się sam
    setRunning(true);
    setStopping(false);
    setStats({ scanned: 0, deals: 0, sent: 0 });
    addLog(`🏷️ Wersja aplikacji: ${APP_VERSION}`, "info");
    addLog(`📚 Baza cen wbudowana (${KB.version}): część ogólna + ${Object.keys(KB.chunks).length} wpisów marek — do każdego ogłoszenia AI dostaje część ogólną (stała, w cache) i tylko wpisy marki z ogłoszenia${kbNotes.length > 0 ? ` · przypięte notatki: ${kbNotes.length}` : ""}`, "info");
    if (kbDupCount > 0) addLog(`ℹ️ ${kbDupCount} przypiętych wpisów „BAZA CEN — …” to stare kopie bazy wbudowanej — nie wysyłam ich do AI (możesz je usunąć: Chat → 📌 Baza wiedzy)`, "info");
    addLog("🚀 Uruchamiam skanowanie — wyszukiwania sprawdzane pierwszy raz tylko zapamiętują istniejące oferty; po przerwie do 24 h analizuję wszystko, co się w tym czasie pojawiło (po dłuższej — tylko oferty z ostatnich 24 h)", "success");

    let n = 1;
    cycleBudgetRef.current = null;
    const workerDone = aiWorkerLoop(); // v6.3: analizy AI w tle
    try {
      while (runningRef.current) {
        setCycleNum(n);
        try {
          await runCycleRef.current(n);
        } catch (e) {
          if (runningRef.current) {
            addLog(`❌ Nieoczekiwany błąd w cyklu #${n}: ${e?.message || e} — kolejny cykl za 60 s`, "error");
            notifyStatus("cycle_error", `❌ Nieoczekiwany błąd w cyklu skanowania: ${String(e?.message || e).slice(0, 300)} — skaner działa dalej.`);
          }
        }
        if (!runningRef.current) break;
        setScanStatus({ phase: "pause", until: Date.now() + 60000 });
        await sleepOrStop(60000); // v6.4 (B2): jedno odliczanie zamiast 60 po 1 s
        n++;
      }
    } finally {
      runningRef.current = false;
      wakeAiWorker();
      try { await workerDone; } catch {} // v6.3: czekamy, aż wykonawca AI odda ofertę do kolejki
      cycleBudgetRef.current = null;
      releaseScanLock();
      sessionAbortRef.current = null;
      persistPending();
      persistOutbox();
      setRunning(false);
      setStopping(false);
      addLog(`⏹ Zatrzymano${pendingRef.current.size > 0 ? ` — w kolejce zostało ${pendingRef.current.size} ofert, dokończę je po następnym starcie` : ""}${outboxRef.current.length > 0 ? ` · ${outboxRef.current.length} powiadomień czeka na wysłanie` : ""}`, "info");
    }
  };

  // STOP: kończy bieżący krok (trwające zapytania są przerywane), nic nie wysyła po zatrzymaniu.
  // Oferty w trakcie obsługi zostają w kolejce. Uwaga: przerwanie zapytania po naszej stronie nie zawsze
  // anuluje pracę (i koszt) po stronie dostawcy AI, jeśli zapytanie już do niego dotarło.
  const stopLoop = () => {
    try { localStorage.removeItem("ddf_autorun"); } catch {} // świadomy STOP — bez autostartu po odświeżeniu
    if (autostartTimerRef.current) { clearTimeout(autostartTimerRef.current); autostartTimerRef.current = null; addLog("⏹ Autostart anulowany", "info"); }
    if (!runningRef.current) return;
    runningRef.current = false;
    setStopping(true);
    try { sessionAbortRef.current?.abort(); } catch {}
    wakeAllWaiters(); // v6.4: przerwa i inne oczekiwania kończą się od razu
    wakeAiWorker();
  };

  // v5.12: autostart — jeśli skaner działał przed odświeżeniem/zamknięciem karty, wznawiamy go po 5 s
  const startLoopRef = useRef(null);
  startLoopRef.current = startLoop;
  const autostartTimerRef = useRef(null);
  useEffect(() => {
    let flag = null;
    try { flag = localStorage.getItem("ddf_autorun"); } catch {}
    if (flag !== "1") return;
    addLog("🔁 Autostart: skaner działał przed odświeżeniem strony — wznawiam za 5 s", "info");
    autostartTimerRef.current = setTimeout(() => {
      autostartTimerRef.current = null;
      if (!runningRef.current) startLoopRef.current?.();
    }, 5000);
    return () => { if (autostartTimerRef.current) clearTimeout(autostartTimerRef.current); };
  }, []);

  // "Zacznij od zera": zapomnij widziane ogłoszenia, kolejkę i stan wyszukiwań. Następny start najpierw
  // zapamięta to, co jest teraz na Kleinanzeigen (bez analizy), a od kolejnego cyklu analizuje tylko nowe.
  const resetFromZero = () => {
    if (runningRef.current || otherTabActive) return; // v6.4 (B4): nie czyścimy pamięci, gdy skanuje inna karta
    const ok = window.confirm("Zacząć od zera?\n\nProgram zapomni wszystkie widziane ogłoszenia, wyczyści kolejkę ofert i niewysłane powiadomienia.\nPrzy następnym starcie zapamięta to, co jest teraz na Kleinanzeigen (bez analizy), a od kolejnego cyklu będzie analizował tylko nowe oferty.");
    if (!ok) return;
    seenIdsRef.current = new Map();
    try { localStorage.removeItem("ddf_seen"); } catch {}
    scanStateRef.current = { searches: {} };
    persistScanState();
    pendingRef.current = new Map();
    outboxRef.current = [];
    persistPending();
    persistOutbox();
    addLog("🔄 Od zera — historia ogłoszeń, kolejka i stan wyszukiwań wyczyszczone. Następny start najpierw zapamięta istniejące oferty (bez analizy).", "success");
  };

  const logColors = { info: "#475569", success: "#22c55e", error: "#f87171" };

  // ── RENDER ─────────────────────────────────────────────────────────────
  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>

      {/* HEADER */}
      <div style={{
        background: "#0c1525", borderBottom: "1px solid #1a2d4a",
        padding: "14px 24px",
        display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{
            width: 40, height: 40, borderRadius: 10,
            background: "linear-gradient(135deg, #f59e0b 0%, #ef4444 100%)",
            display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20,
          }}>🚲</div>
          <div>
            <div style={{ fontSize: 17, fontWeight: 800, letterSpacing: -0.5 }}>
              DirtDeal<span style={{ color: "#f59e0b" }}>Finder</span>
            </div>
            <div style={{ fontSize: 10, color: "#334155", letterSpacing: 0.8, textTransform: "uppercase" }}>
              Kleinanzeigen × AI × Discord · {APP_VERSION}
            </div>
          </div>
        </div>

        <div style={{ display: "flex", gap: 16, alignItems: "center" }}>
          {[["🔍", stats.scanned, "Nowe"], ["✅", stats.deals, "Okazje"], ["📨", stats.sent, "Wysłane"]].map(([ico, n, lbl]) => (
            <div key={lbl} style={{ textAlign: "center" }}>
              <div style={{ fontSize: 18, fontWeight: 800 }}>{ico} {n}</div>
              <div style={{ fontSize: 10, color: "#475569", textTransform: "uppercase" }}>{lbl}</div>
            </div>
          ))}
          {!running && otherTabActive && (
            <div data-testid="other-tab" style={{ background: "#1a1408", border: "1px solid #f59e0b55", borderRadius: 8, padding: "6px 14px", fontSize: 11, color: "#f59e0b", maxWidth: 260 }}>
              ⚠️ Skaner działa w innej karcie tej przeglądarki — ta karta jest tylko podglądem
            </div>
          )}
          {running && (
            <div style={{ background: "#0a1520", border: "1px solid #22c55e44", borderRadius: 8, padding: "6px 14px", textAlign: "center" }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#22c55e", display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ width: 8, height: 8, borderRadius: "50%", background: "#22c55e", display: "inline-block",
                  animation: "pulse 1.2s infinite" }} />
                Cykl #{cycleNum}
              </div>
              <ScanStatus statusRef={scanStatusRef} activityRef={lastActivityRef} aiRef={aiStatusRef} />
            </div>
          )}
        </div>

        <div style={{ display: "flex", gap: 4 }}>
          {[["scanner","🔍 Skaner"], ["results","📋 Wyniki"], ["chat","💬 Chat AI"], ["settings","⚙️ Ustawienia"]].map(([id, label]) => (
            <button key={id} onClick={() => setTab(id)} style={{
              padding: "8px 16px", borderRadius: 8, border: "none", fontWeight: 600, fontSize: 13,
              background: tab === id ? "#f59e0b" : "#1e293b",
              color: tab === id ? "#0a0f18" : "#64748b",
            }}>{label}</button>
          ))}
        </div>
      </div>

      {/* BODY */}
      <div style={{ flex: 1, padding: 24, maxWidth: 1200, width: "100%", margin: "0 auto" }}>

        {/* ═══ SCANNER ═══ */}
        {tab === "scanner" && (

              </div>

              <div style={{ marginTop: 20, paddingTop: 20, borderTop: "1px solid #1a2d4a" }}>
                <label style={{ fontSize: 11, color: "#475569", display: "block", marginBottom: 6, textTransform: "uppercase", letterSpacing: 0.8 }}>
                  Koszt transportu jednego roweru (€)
                </label>
                <input type="number" min="0" step="5" value={transportCostEur}
                  onChange={e => setTransportCostEur(Math.max(0, Number(e.target.value) || 0))}
                  style={{ width: 110 }} />
                <div style={{ fontSize: 11, color: "#334155", marginTop: 5, lineHeight: 1.5 }}>
                  Odejmowany od zysku przy każdej wycenie: zysk = sprzedaż w PL − zakup − transport. Jeśli masz transport wpisany w polu „Kontekst” albo w notatce przypiętej w czacie — usuń go stamtąd, żeby AI nie odejmowało go drugi raz.
                </div>
              </div>

              <div style={{ marginTop: 20, paddingTop: 20, borderTop: "1px solid #1a2d4a" }}>
                <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
                  <input type="checkbox" checked={nightCheckEnabled} onChange={e => setNightCheckEnabled(e.target.checked)}
                    style={{ width: 18, height: 18, accentColor: "#f59e0b" }} />
                  <span style={{ fontSize: 13, fontWeight: 600 }}>🌙 Nocne sprawdzanie cen starszych ogłoszeń</span>
                </label>
                <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 10, fontSize: 12, color: "#94a3b8" }}>
                  <label>od godziny <input type="number" min="0" max="23" value={nightCheckHour}
                    onChange={e => setNightCheckHour(Math.min(23, Math.max(0, Math.round(Number(e.target.value) || 0))))} style={{ width: 60 }} /></label>
                  <label>limit stron na noc <input type="number" min="0" step="100" value={nightCheckMax}
                    onChange={e => setNightCheckMax(Math.max(0, Math.round(Number(e.target.value) || 0)))} style={{ width: 80 }} /></label>
                  <label>„za drogie” do (€) <input type="number" min="0" step="50" value={nightOverMaxCap}
                    onChange={e => setNightOverMaxCap(Math.max(0, Math.round(Number(e.target.value) || 0)))} style={{ width: 80 }} /></label>
                </div>
                <div style={{ fontSize: 11, color: "#334155", marginTop: 5, lineHeight: 1.5 }}>
                  Wyszukiwania czytają tylko pierwszą stronę wyników, więc obniżki starszych ogłoszeń przechodzą niezauważone. W nocy (przez {NIGHT_WINDOW_H} h od podanej godziny) skaner otwiera strony ogłoszeń z zapamiętaną wyceną i „za drogich” do podanej kwoty — po {NIGHT_BATCH} na cykl, w tym samym odstępie co inne zapytania. Bez kosztu AI; analiza tylko wtedy, gdy przy nowej cenie zysk przechodzi próg albo cena zeszła do limitu zakupu. Usunięte ogłoszenia wypadają z pamięci.
                </div>
              </div>

              <div style={{ marginTop: 20, paddingTop: 20, borderTop: "1px solid #1a2d4a" }}>
                <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
                  <input type="checkbox" checked={excludeElektryk} onChange={e => setExcludeElektryk(e.target.checked)}
                    style={{ width: 18, height: 18, accentColor: "#f59e0b" }} />
                  <span style={{ fontSize: 13, fontWeight: 600 }}>⚡ Wyklucz elektryki górskie (e-MTB)</span>
                </label>
                <div style={{ fontSize: 11, color: "#334155", marginTop: 6, marginLeft: 28 }}>
                  Gdy zaznaczone — ogłoszenia sklasyfikowane przez Groq jako "elektryk_gorski" są odrzucane od razu na Etapie 1, zanim dotrą do Gemini (zero kosztu). Odznacz, żeby wrócić do analizowania e-MTB.
                </div>
              </div>

              <div style={{ marginTop: 16, paddingTop: 16, borderTop: "1px solid #1a2d4a" }}>
                <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
                  <input type="checkbox" checked={analyzePhotos} onChange={e => setAnalyzePhotos(e.target.checked)}
                    style={{ width: 18, height: 18, accentColor: "#f59e0b" }} />
                  <span style={{ fontSize: 13, fontWeight: 600 }}>📷 Analiza zdjęć (Gemini / Claude)</span>
                </label>
                <div style={{ fontSize: 11, color: "#334155", marginTop: 6, marginLeft: 28 }}>
                  AI dostaje {MAX_PHOTOS_PER_CALL} pierwsze zdjęcia z galerii przy każdej analizie ogłoszenia. Ogłoszenia „niepewne” (dokładniejsza analiza) i okazje (weryfikacja) — wszystkie zdjęcia z ogłoszenia (maks. {MAX_PHOTOS_ALL}). Koszt: ok. 0,3–1 grosza za zwykłą analizę na Haiku / Flash; weryfikacja ze wszystkimi zdjęciami na Sonnecie — do ok. 30 gr więcej. Działa z Gemini i Claude (nie z Groq).
                </div>
              </div>
            </div>

            {/* Save */}
            <div style={{ gridColumn: "span 2" }}>
              <button onClick={() => saveSettings(false)} style={{
                width: "100%", padding: "14px 0", borderRadius: 12, border: "none",
                fontWeight: 800, fontSize: 15,
                background: "linear-gradient(135deg, #f59e0b, #ef4444)",
                color: "#080d18",
              }}>💾 Zapisz ustawienia</button>
            </div>

            {/* How it works */}
            <div style={{ gridColumn: "span 2", background: "#0d1526", border: "1px solid #1a3a5f", borderRadius: 16, padding: 24 }}>
              <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 14, color: "#3b82f6" }}>ℹ️ Jak to działa?</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14 }}>
                {[
                  { ico: "🔄", t: "Pętla ciągła",  d: "Skanuje bez przerwy — po każdym pełnym cyklu czeka 60s i zaczyna od nowa" },
                  { ico: "🆕", t: "Tylko nowe",     d: "Każde ogłoszenie trafia do AI tylko raz — widziane ID są zapamiętane. Oferty czekające na analizę są w kolejce i nie giną przy limicie, błędzie ani STOP. Po przerwie do 24 h analizowane jest wszystko, co się w tym czasie pojawiło" },
                  { ico: "🤖", t: "AI (Groq/Gemini)", d: "Rozpoznaje typ (full/dirt/inny) i ocenia czy warto kupić i odsprzedać w Polsce. Typ \"inny\" jest zawsze odrzucany" },
                  { ico: "📨", t: "Discord",        d: "Webhook z ceną, zyskiem i linkiem wysyłany TYLKO gdy AI mówi TAK. Gdy Discord nie odpowie — powiadomienie czeka i jest ponawiane" },
                ].map(s => (
                  <div key={s.t} style={{ background: "#070c17", borderRadius: 12, padding: 16 }}>
                    <div style={{ fontSize: 22, marginBottom: 8 }}>{s.ico}</div>
                    <div style={{ fontWeight: 700, marginBottom: 6, fontSize: 13 }}>{s.t}</div>
                    <div style={{ fontSize: 12, color: "#475569", lineHeight: 1.6 }}>{s.d}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
