   "text": "BAZA CEN — Dirtówki i slopestyle — MOJE CENY + analiza rynku PL 10.2026 (mają pierwszeństwo przed innymi wpisami o dirtach)\nNajważniejszy jest widelec: wysoka półka (Pike DJ, Bomber DJ od 2020, Fox 36 831, Manitou Circus Pro) zamiast słabszego to ok. +1000–1500 zł — pasmo „Pike DJ / Bomber DJ” obejmuje całą wysoką półkę. Pasmo „słabszy widelec” = Manitou Circus Expert / Comp, Fox 32 831 (lagi 32 mm, także z Kashimą), X-Fusion Slant i inne X-Fusion, RockShox Argyle, stare Marzocchi Dirt Jumper 1–3, Bomber Z2, SR Suntour, RST, RockShox Sektor / Recon / Judy i inne widelce XC, widelce bez nazwy. Widelec nierozpoznany → pasmo „słabszy widelec”. Sztywny widelec → rower odrzucony.\nCzęści Title, Chromag, NOA, Hope, Industry Nine, DT Swiss EX471 podnoszą cenę mocno tylko na droższych ramach; na tańszych (Dartmoor, Rose, Stitched) tylko o ok. 300–500 zł.\nNie ustawiaj sztywnego limitu rynku na 7000 zł. Oferty ponad 7000 zł bywają długo niesprzedane; użyj własnych zakończonych transakcji i osobnego pasma dla ram premium. Cena ofertowa ≠ cena zamkniętej sprzedaży.\n\nNajtańsze dirty — Dartmoor Gamer, Dartmoor Streetfighter, Kellys Whip i podobne (prosty osprzęt, słaby widelec):\n- sprzedaż PL 1500–1800 zł (≈340–410 €)\n\nPółka podstawowa — Canyon Stitched 360 / 360 Pro, Rose The Bruce, Dartmoor Two6player, Specialized P.3, Radon Slush, Marin Alcatraz, NS Movement / Zircus / Metropolis, Propain Trickshot, Beddo i podobne:\n- słabszy widelec seryjny | sprzedaż PL 2300–3000 zł (≈530–690 €)\n- Pike DJ / Bomber DJ, reszta podstawowa | sprzedaż PL 3500–4000 zł (≈800–920 €), starsze roczniki bliżej dolnej granicy — MOJA CENA\n- Pike DJ / Bomber DJ + drogie części | sprzedaż PL 3800–4800 zł (≈870–1100 €) — MOJA CENA\n\nPółka średnia — NS Decade, Commencal Absolut, YT Dirt Love:\n- słabszy widelec | sprzedaż PL 2500–3300 zł (≈570–760 €)\n- Pike DJ / Bomber DJ, reszta podstawowa | sprzedaż PL 4200–5000 zł (≈970–1150 €)\n- Pike DJ / Bomber DJ + drogie części | sprzedaż PL 5000–6200 zł (≈1150–1430 €)\n- sama rama NS Decade | szacunek PL 1400–1900 zł (≈320–440 €) — tylko orientacyjnie, zależy od generacji i stanu; brak potwierdzonej ceny zamkniętej transakcji\n\nPółka droższa — Trek Ticket (DJ), Santa Cruz Jackal:\n- kompletny rower, podstawowy osprzęt | sprzedaż PL 5500–6000 zł (≈1260–1380 €) — MOJA CENA\n- z drogimi częściami | sprzedaż PL 5800–6500 zł (≈1330–1490 €)\n- sama rama Trek Ticket | nie przyjmować 5 000 zł jako wartości bazowej; orientacyjnie 2500–3500 zł (≈570–800 €), zależnie od rocznika/stanu; brak potwierdzonej transakcji ramy\n\nFulle do slopestyle'u:\n- Canyon Stitched 720 | sprzedaż PL 5000–6000 zł (≈1150–1380 €)\n- weryfikacja: oferty Stitched 720 6100–8999 zł (n≈6) to ceny żądane, nie potwierdzone sprzedaże; użytkownik sprzedał swój Stitched 720 za 5800 zł.\n\nROCZNIKI — bike checki seryjnych wersji (rocznik | widelec / amortyzator / napęd / hamulce | koła | cena nowego w walucie źródła):\n## Canyon Stitched 360 Pro (dirt, single speed)\n- 2020 | RockShox Pike DJ 100 / SRAM Guide T | 26\" | nowy €1399\n- 2022 | Marzocchi Bomber DJ 100 / Guide T | 26\" | nowy €1499\n- 2024 | Marzocchi Bomber DJ 100 / SRAM Level T | 26\" | nowy €1399"

// Data dodania z karty ogłoszenia na liście wyników: "Heute, 14:22", "Gestern, 09:10", "07.11.2026",
// "vor 5 Minuten". Zwraca znacznik czasu albo null (nie udało się odczytać).
const parseCardDate = (article, jsonLd) => {
  const now = new Date();
  for (const el of article.querySelectorAll("div, span, p, time, li, small")) {
    if (el.closest("script, style")) continue;
    const t = (el.textContent || "").replace(/\s+/g, " ").trim();
    if (!t || t.length > 30) continue;
    let m = t.match(/^(Heute|Gestern)(?:,?\s*(\d{1,2}):(\d{2}))?(?:\s*Uhr)?$/i);
    if (m) {
      const yesterday = /gestern/i.test(m[1]);
      if (m[2] == null) return now.getTime() - (yesterday ? 12 : 0) * 3600 * 1000;
      const d = new Date(now);
      if (yesterday) d.setDate(d.getDate() - 1);
      d.setHours(Number(m[2]), Number(m[3]), 0, 0);
      return d.getTime();
    }
    m = t.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
    if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]), 12).getTime();
    m = t.match(/^vor\s+(\d+)\s+(Minute|Minuten|Stunde|Stunden|Tag|Tagen)$/i);
    if (m) return now.getTime() - Number(m[1]) * (/^min/i.test(m[2]) ? 60e3 : /^stund/i.test(m[2]) ? 3600e3 : 86400e3);
  }
  const ts = Date.parse(article.querySelector("time[datetime]")?.getAttribute("datetime") || jsonLd?.datePosted || "");
  return Number.isFinite(ts) ? ts : null;
};

// v6.3: naprawa typowych błędów składni JSON od modelu — cudzysłów w tekście bez \ (np. „27,5"”), znak nowej linii
// w tekście, brakujący przecinek między polami, przecinek przed } lub ]. Cudzysłów zamyka tekst tylko wtedy, gdy
// po nim (pomijając spacje) stoi , } ] albo : — w przeciwnym razie traktujemy go jako znak w tekście.
const repairJsonText = (src) => {
  let out = "", inStr = false;
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (!inStr) { out += c; if (c === '"') inStr = true; continue; }
    if (c === "\\") { out += c + (src[i + 1] ?? ""); i++; continue; }
    if (c === "\n") { out += "\\n"; continue; }
    if (c === "\r") continue;
    if (c === "\t") { out += "\\t"; continue; }
    if (c === '"') {
      let j = i + 1;
      while (j < src.length && /[ \t\r\n]/.test(src[j])) j++;
      const newField = src[j] === '"' && /\n/.test(src.slice(i + 1, j)); // „"x"⏎"b": …” — brakujący przecinek, nie cudzysłów w tekście
      if (j >= src.length || ",}]:".includes(src[j]) || newField) { out += c; inStr = false; }
      else out += '\\"';
      continue;
    }
    out += c;
  }
  return out
    .replace(/("|\d|true|false|null|\}|\])(\s*\n\s*)(")/g, "$1,$2$3") // brakujący przecinek przed kolejnym polem
    .replace(/,(\s*[}\]])/g, "$1");                                     // przecinek przed } / ]
};

  const s = Math.round(ms / 1000);
  return s >= 60 ? `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, "0")} s` : `${s} s`;
};

  if (vt === "sprzeczny") return { material: null, conflict: true, evidence: ev("tytuł", tt) };
  if (vd === "sprzeczny") return { material: null, conflict: true, evidence: ev("opis", td) };
  return { material: null, conflict: false, evidence: null };

const FRAME_SOURCES = ["tekst", "napis", "wyglad", "nieznany"];

  const o = r && typeof r === "object" ? r : {};
  const material = ["karbon", "alu", "nie_wiem"].includes(o.material) ? o.material : null;
  const zrodlo = FRAME_SOURCES.includes(o.zrodlo) ? o.zrodlo : "nieznany";
  const dowod = typeof o.dowod === "string" && o.dowod.trim() && !/^(null|brak|none|-)$/i.test(o.dowod.trim()) ? o.dowod.trim().slice(0, 160) : null;
  const v = typeof o.sprzedaz_alu_eur === "number" ? o.sprzedaz_alu_eur : (typeof o.sprzedaz_alu_eur === "string" && /^\s*\d+([.,]\d+)?\s*$/.test(o.sprzedaz_alu_eur) ? parseFloat(o.sprzedaz_alu_eur.replace(",", ".")) : null);
  return { material, zrodlo, dowod, sprzedaz_alu_eur: Number.isFinite(v) && v > 0 ? v : null };

const FRAME_ALU_FACTOR = 0.8;

// Tekst „alu” (albo napis alu sprzeczny z tekstem) → wycena alu (priceAsAlu). Karbon tylko z wyglądu → zostaje karbon, ale possibleCarbon
// i saleAlu = wartość wersji alu (do pokazania w alercie).
const resolveFrameMaterial = (text, rama, sale) => {
  const ai = rama.material, src = rama.zrodlo;
  let final, source, warn = null, possibleCarbon = false;
  if (text.material) {
    final = text.material; source = "tekst";
    if (ai && ai !== "nie_wiem" && ai !== text.material && src === "napis") {
      warn = `napis na ramie wskazuje ${ai === "karbon" ? "karbon" : "alu"}, a tekst ogłoszenia ${text.material} — sprawdź materiał`;
      if (ai === "alu") final = "alu"; // przy sprzeczności liczymy ostrożniej
    }
  } else if (ai === "karbon" && src === "napis") {
    final = "karbon"; source = "napis";
  } else if (ai === "karbon") {
    possibleCarbon = true; source = "wyglad"; final = "karbon";
  } else {
    final = ai || "nie_wiem"; source = ai ? src : "nieznany";
  }
  const priceAsAlu = ai === "karbon" && final === "alu" && sale != null && sale > 0;
  const saleAlu = !(priceAsAlu || possibleCarbon) || sale == null || !(sale > 0) ? null
    : rama.sprzedaz_alu_eur != null && rama.sprzedaz_alu_eur < sale ? rama.sprzedaz_alu_eur : Math.round(sale * FRAME_ALU_FACTOR);
  return { final, source, warn, possibleCarbon, priceAsAlu, saleAlu };
};

// Osobny komponent z własnym zegarem (1 s), żeby co sekundę nie przerysowywać całej aplikacji.
function ScanStatus({ statusRef, activityRef, aiRef }) {
  const [, setTick] = useState(0);
  useEffect(() => { const t = setInterval(() => setTick(x => x + 1), 1000); return () => clearInterval(t); }, []);
  const st = statusRef.current || {};
  const now = Date.now();
  const ago = activityRef.current ? Math.max(0, Math.round((now - activityRef.current) / 1000)) : null;
  let main = "aktywne skanowanie";
  if (st.phase === "start") main = "początek cyklu — zaległe powiadomienia i kolejka";
  else if (st.phase === "search") main = `Wyszukiwanie ${st.i}/${st.n}: ${st.label}`;
  else if (st.phase === "detail") main = `Strona ogłoszenia: ${st.title}`;
  else if (st.phase === "night") main = `🌙 Nocne sprawdzanie cen ${st.i}/${st.n}`;
  else if (st.phase === "ai") main = `Analiza AI: ${st.title}`;
  else if (st.phase === "pause") {
    const left = Math.round((st.until - now) / 1000);
    main = left >= 0 ? `przerwa — następny cykl za ${left} s` : `przerwa przedłuża się o ${-left} s`;
  }
  const ai = aiRef?.current; // v6.3: wykonawca AI pracuje równolegle z wyszukiwaniami
  const aiTxt = ai?.phase === "ai" ? `Analiza AI: ${ai.title}` : ai?.phase === "detail" ? `Strona ogłoszenia: ${ai.title}` : null;
  const late = (st.phase === "pause" && now - st.until > 20000) || (ago != null && ago > 180);
  return (
    <div style={{ fontSize: 10, color: "#64748b", maxWidth: 280, textAlign: "left", lineHeight: 1.4 }}>
      <div style={{ whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }} title={main} data-testid="scan-status">{main}</div>
      {aiTxt && <div style={{ whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }} title={aiTxt} data-testid="ai-status">{aiTxt}</div>}
      {ago != null && <div>ostatnia aktywność {ago} s temu</div>}
      {late && <div style={{ color: "#f59e0b" }}>⚠️ opóźnienie — Chrome może spowalniać kartę w tle (Ustawienia → Wydajność → zawsze aktywna)</div>}
    </div>
  );
}

  const DEFAULT_FILTER_KEYWORDS = "Rennrad, Gravel, Trekkingrad, Hollandrad, Cityrad, Stadtrad, Kinderfahrrad, Laufrad, Klapprad, Liegerad, Dreirad, Rollator, Ersatzteile, Einzelteile, nur Rahmen, Rahmen only, Rahmenset, Bastlerrad, Schrott, gesucht, Kinder, Jugend, 12 Zoll, 16 Zoll, 20 Zoll, 24 Zoll, Damenrad, Herrenrad, Tourenrad, Reiserad, Crossrad, Fitnessbike, Fixie, BMX Freestyle, Faltrad, Lastenrad, Cargobike, Seniorenrad, Elektroroller, E-Scooter, Escooter, Motorroller, Tretroller, Kickscooter, Balance Bike, Laufrädchen, Fahrradanhänger, Kinderanhänger, Kinderwagen, Fahrradträger, Rollstuhl, Vermietung, Verleih, Miete, Tausch gegen, Deko, Bastelobjekt, Spielzeugrad, Puky, Kettcar, Dreiradwagen";
  // v5.6: "Singlespeed" odrzucał dirty (to zwykle singlespeedy) — usuwamy je raz także z zapisanej listy.
  const [filterKeywords, setFilterKeywords] = useState(() => {
    const saved = cfg.filterKeywords;
    if (saved == null) return DEFAULT_FILTER_KEYWORDS;
    if (cfg.filterMigratedV56) return saved;
    const list = saved.split(/[,\n]/).map(x => x.trim()).filter(Boolean);
    return list.some(x => x.toLowerCase() === "singlespeed") ? list.filter(x => x.toLowerCase() !== "singlespeed").join(", ") : saved;
  });
  const [selectedBikes,  setSelectedBikes]  = useState(() => {
    const saved = cfg.selectedBikes;
    if (!saved || saved.length === 0) return BIKE_MODELS.map(b => b.id);
    // Stara konfiguracja mogła mieć zaznaczoną kategorię "cat_mountainbike", której już nie ma
    // (zastąpiona listą konkretnych modeli) — po odfiltrowaniu nieistniejących id, jeśli nic nie
    // zostało, wybierz WSZYSTKIE nowe modele zamiast zostawić pustą, milczącą listę.
    const filtered = saved.filter(id => BIKE_MODELS.some(b => b.id === id));
    if (filtered.length === 0) return BIKE_MODELS.map(b => b.id);
    // Nowe pozycje listy (nieznane w zapisanej konfiguracji) — domyślnie włączone
    const known = Array.isArray(cfg.knownBikes)
      ? cfg.knownBikes
      : BIKE_MODELS.map(b => b.id).filter(id => !BIKES_ADDED_AFTER_V51.includes(id));
    const added = BIKE_MODELS.map(b => b.id).filter(id => !known.includes(id) && !filtered.includes(id));
    return [...filtered, ...added];
  });

  const [logs,     setLogs]     = useState([]);
  // v5.14: Wyniki przeżywają odświeżenie strony (ostatnie RESULTS_MAX, w skróconej postaci) — wcześniej żyły tylko w pamięci karty
  const [results,  setResults]  = useState(() => {
    try { const r = JSON.parse(localStorage.getItem("ddf_results") || "[]"); return Array.isArray(r) ? r.filter(x => x?.listing && x?.analysis) : []; } catch { return []; }
  });
  const [running,  setRunning]  = useState(false);
  const [stats,    setStats]    = useState({ scanned: 0, deals: 0, sent: 0 });
  const [cycleNum, setCycleNum] = useState(0);

  // ── Chat state ─────────────────────────────────────────────────────────
  const [chatMessages, setChatMessages] = useState(() => {
    try { return JSON.parse(localStorage.getItem("ddf_chat") || "[]"); } catch { return []; }
  });
  const [chatInput, setChatInput]   = useState("");
  const [chatLoading, setChatLoading] = useState(false);
  const [showKnowledgePanel, setShowKnowledgePanel] = useState(false);
  const chatEndRef = useRef(null);

  useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [chatMessages]);

  // ── v6.4 (B8): zapis do pamięci przeglądarki z obsługą przepełnienia ──
  // Wcześniej każdy zapis był w cichym try/catch — po zapełnieniu limitu (ok. 5 mln znaków) skaner pracował dalej
  // na danych z pamięci karty, a po odświeżeniu analizował i wysyłał to samo drugi raz. Teraz: przycięcie czatu,
  // wyników i dziennika, ponowna próba, a gdy dalej się nie da — ostrzeżenie w logu i na kanale „problemy”.
  const storageWarnAtRef = useRef(0);
  const safeSetItem = (key, value) => {
    try { localStorage.setItem(key, value); return true; } catch {}
    const trims = [];
    const trim = (k, keep, fromStart = false) => {
      try {
        const arr = JSON.parse(localStorage.getItem(k) || "null");
        if (Array.isArray(arr) && arr.length > keep) { localStorage.setItem(k, JSON.stringify(fromStart ? arr.slice(0, keep) : arr.slice(-keep))); trims.push(k); }
      } catch {}
    };
    trim("ddf_chat", 30); trim("ddf_results", 50, true); trim("ddf_events", 50);
    try {
      localStorage.setItem(key, value);
      addLog(`💾 Pamięć przeglądarki była pełna — przycięto ${trims.join(", ") || "nic"}; zapis „${key}” się udał`, "error");
      return true;
    } catch {}
    if (Date.now() - storageWarnAtRef.current > 10 * 60 * 1000) {
      storageWarnAtRef.current = Date.now();
      const msg = `💾 Pamięć przeglądarki pełna — nie udało się zapisać „${key}” (${Math.round(storageUsedChars() / 1e4) / 100} mln znaków zajęte). Po odświeżeniu karty skaner może analizować i wysyłać te same oferty drugi raz. Wyczyść czat (Ustawienia) albo użyj „Zacznij od zera”.`;
      addLog(msg, "error");
      notifyStatus("storage_full", msg);
    }
    return false;
  };
  const storageUsedChars = () => { let n = 0; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); n += k.length + (localStorage.getItem(k) || "").length; } } catch {} return n; };
  const saveChatHistory = (msgs) => {
    safeSetItem("ddf_chat", JSON.stringify(msgs.slice(-200)));
  };

  const savePriceKnowledge = (entries) => {
    try { localStorage.setItem("ddf_price_knowledge", JSON.stringify(entries)); } catch {}
    setPriceKnowledge(entries);
  };

  const addKnowledgeFromMessage = (content) => {
    const entry = { id: Date.now() + Math.random(), text: content.trim(), addedAt: new Date().toLocaleString("pl-PL") };
    savePriceKnowledge([...priceKnowledge, entry]);
  };

  const removeKnowledgeEntry = (id) => {
    savePriceKnowledge(priceKnowledge.filter(e => e.id !== id));
  };

  // Notatki przypięte w czacie, które trafiają do AI (bez starych kopii wbudowanej bazy — patrz isKbDuplicate)
  const kbNotes = priceKnowledge.filter(e => !isKbDuplicate(e.text));
  const kbDupCount = priceKnowledge.length - kbNotes.length;
  const [kbOpenId, setKbOpenId] = useState(null); // który wpis bazy wbudowanej jest rozwinięty w panelu

  const runningRef   = useRef(false);
  const runCycleRef  = useRef(null);
  const runStage2Ref = useRef(null);  // v6.4 (B1): jak runCycleRef — wykonawca AI woła najnowszą wersję runStage2  // zawsze NAJNOWSZA wersja runOneCycle — zmiana ustawień działa od następnego cyklu
  const sessionAbortRef = useRef(null); // przerywa trwające zapytania (AI, Kleinanzeigen) po kliknięciu STOP
  const groqKeyIndexRef = useRef(0); // wskaźnik round-robin do rotacji kluczy Groq między wywołaniami
  const groqKeyCooldownsRef = useRef({}); // { [apiKey]: timestampMs } — cooldown PER KLUCZ po dziennym limicie (TPD)

  // ── Gemini explicit context caching ─────────────────────────────────────────────────────
  // Duży statyczny blok promptu (cennik/reguły osprzętu, patrz analyzeWithGemini) jest identyczny
  // w wielu wywołaniach pod rząd — zamiast wysyłać go za każdym razem, cache'ujemy go RAZ po stronie
  // Google i tylko odwołujemy się do niego nazwą (odczyt z cache ~10% ceny bazowej input).
  // Klucz w mapie = `${model}|${wariant}|${hash statycznego tekstu}` — osobny cache dla:
  //  - każdego modelu Gemini (cache jest przypisany do konkretnego modelu, nie da się dzielić),
  //  - wariantu typeSection (typ już zaufany z Groqa vs. Gemini musi sam rozpoznać typ),
  //  - treści cennika/bazy wiedzy (gdy zmienisz cennik w Ustawieniach, hash się zmieni i zrobimy nowy cache).
  // cacheMapRef: { [key]: { name, expiresAt } }
  // cacheFailCooldownRef: { [key]: timestampMs } — jeśli tworzenie cache zawiedzie (np. prompt za
  // krótki wg progu Google — dokumentacja jest w tej kwestii niespójna, 2048 vs 32768 tokenów),
  // NIE próbujemy ponownie przy każdym kolejnym ogłoszeniu — czekamy chwilę i po prostu wysyłamy
  // pełny prompt bez cache (dokładnie tak jak działało to wcześniej, zero regresji).
  const cacheMapRef = useRef({});
  const cacheFailCooldownRef = useRef({});
  const logsEndRef  = useRef(null);

  const priceDiagLoggedRef = useRef(false); // szczegółowa diagnostyka parsera cen — tylko raz na sesję
  const descDiagLoggedRef  = useRef(false); // diagnostyka parsera pełnego opisu — tylko raz na sesję
  const detailBlockedUntilRef = useRef(0);  // bezpiecznik: do kiedy NIE pobieramy stron ogłoszeń (po blokadzie)
  const scrapeBlockedUntilRef = useRef(0);  // v5.11: do kiedy NIE odpytujemy wyszukiwań (po 2 blokadach pod rząd)
  const aiFailStreakRef = useRef(0);        // v5.14: nieudane analizy AI pod rząd (awaria dostawcy)
  const alertDelaysRef = useRef([]); // v6.3: ostatnie czasy „wykrycie → alert” (podsumowanie cyklu)
  const scanStatusRef = useRef({ phase: "idle" }); // v6.1: co skaner robi teraz (linia stanu w nagłówku)
  const lastActivityRef = useRef(0);               // v6.1: ostatnie zapytanie / odpowiedź (Kleinanzeigen, AI)
  const setScanStatus = (st) => { scanStatusRef.current = st; lastActivityRef.current = Date.now(); };
  const aiStatusRef = useRef(null); // v6.3: osobna linia — co robi wykonawca AI (działa równolegle z wyszukiwaniami)
  const setAiStatus = (st) => { aiStatusRef.current = st; if (st) lastActivityRef.current = Date.now(); };
  const touchActivity = () => { lastActivityRef.current = Date.now(); };
  const aiPauseUntilRef = useRef(0);        // v5.14: do kiedy nie próbujemy analiz AI po serii błędów

  // Zapamiętaj widziane ogłoszenia między restartami — ID + historia ceny (do wykrywania spadków).
  // Format w localStorage: tablica obiektów {id, price, lowest, notifiedAt, type}.
  // MIGRACJA: stary format to goła tablica ID-stringów — każdy taki wpis dostaje
  // {price:null, lowest:null, ...} (brak punktu odniesienia), żeby pierwszy skan po
  // aktualizacji NIE strzelił fałszywym "spadkiem ceny" dla wszystkiego naraz.
  const PRICE_DROP_THRESHOLD = 0.20; // spadek o min. 20% na znanym ogłoszeniu = istotna obniżka
  const SEEN_MAX = 15000; // v5.11: było 4000 — przy 44 wyszukiwaniach limit kończył się po kilku dniach
  // v5.11: klucz = numer ogłoszenia (stare wpisy z całym linkiem są przeliczane), lastSeenAt = kiedy ostatnio
  // ogłoszenie było w wynikach — z pamięci wypadają ogłoszenia niewidziane od 30 dni, a nie najdawniej dodane.
  const loadSeenMap = () => {
    const map = new Map();
    const now = Date.now();
    try {
      const raw = JSON.parse(localStorage.getItem("ddf_seen") || "[]");
      for (const item of Array.isArray(raw) ? raw : []) {
        const rawId = typeof item === "string" ? item : item?.id;
        if (!rawId) continue;
        const id = listingIdFromHref(rawId) || rawId;
        const e = typeof item === "string"
          ? { price: null, lowest: null, notifiedAt: null, type: null }
          : { price: item.price ?? null, lowest: item.lowest ?? null, notifiedAt: item.notifiedAt ?? null, type: item.type ?? null,
              overMax: item.overMax === true, noPrice: item.noPrice === true, nearMax: Number.isFinite(item.nearMax) ? item.nearMax : null,
              watchSale: Number.isFinite(item.watchSale) ? item.watchSale : null, watchT: Number.isFinite(item.watchT) ? item.watchT : null,
              rej: typeof item.rej === "string" ? item.rej : null, lastNightAt: Number.isFinite(item.lastNightAt) ? item.lastNightAt : null };
        e.lastSeenAt = Number.isFinite(item?.lastSeenAt) ? item.lastSeenAt : now;
        const prev = map.get(id);
        if (prev) { // ten sam rower zapamiętany pod dwoma linkami (sprzedawca zmienił tytuł) — scalamy
          prev.lowest = prev.lowest == null ? e.lowest : e.lowest == null ? prev.lowest : Math.min(prev.lowest, e.lowest);
          prev.price = prev.price ?? e.price;
          prev.type = prev.type || e.type;
          prev.notifiedAt = prev.notifiedAt ?? e.notifiedAt;
          prev.lastSeenAt = Math.max(prev.lastSeenAt, e.lastSeenAt);
        } else map.set(id, e);
      }
    } catch {}
    return map;
  };
  const seenIdsRef = useRef(null);
  if (seenIdsRef.current === null) seenIdsRef.current = loadSeenMap(); // wczytaj RAZ, nie przy każdym renderze

  // ── Kolejka ofert (pending) ────────────────────────────────────────────────────────────
  // job = { listing, source: "new"|"price_drop", cachedType, stage: "new"|"analyze", groqType,
  //         classifierDown, attempts, addedAt }. "new" = czeka na filtry i Groq, "analyze" = na analizę AI.
  const loadPending = () => {
    const map = new Map();
    try {
      const raw = JSON.parse(localStorage.getItem("ddf_pending") || "[]");
      for (const j of Array.isArray(raw) ? raw : []) {
        if (!j?.listing?.listingId) continue;
        j.listing.listingId = listingIdFromHref(j.listing.href) || listingIdFromHref(j.listing.listingId) || j.listing.listingId; // v5.11: numer ogłoszenia
        map.set(j.listing.listingId, { attempts: 0, stage: "new", ...j });
      }
    } catch {}
    return map;
  };
  const pendingRef = useRef(null);
  if (pendingRef.current === null) pendingRef.current = loadPending();

  // ── Powiadomienia do wysłania (outbox): okazje i lista "niepewnych" ─────────────────────
  // item = { id, kind: "deal"|"uncertain", listing, analysis?, reason?, resultId?, addedAt, tries }
  const outboxRef = useRef(null);
  if (outboxRef.current === null) {
    try {
      const raw = JSON.parse(localStorage.getItem("ddf_outbox") || "[]");
      outboxRef.current = Array.isArray(raw) ? raw : [];
      for (const o of outboxRef.current) if (o?.listing) o.listing.listingId = listingIdFromHref(o.listing.href) || o.listing.listingId;
    }
    catch { outboxRef.current = []; }
  }

  // ── Stan wyszukiwań: kiedy każde wyszukiwanie zapamiętało istniejące oferty i kiedy było ostatnio sprawdzone ──
  // Migracja z v5.5 i starszych: jest historia widzianych ID, ale nie ma stanu wyszukiwań → wszystkie
  // wyszukiwania traktujemy jako już zainicjowane, z nieznanym czasem ostatniego skanu (reguła 24 h).
  const scanStateRef = useRef(null);
  if (scanStateRef.current === null) {
    let st = null;
    try { st = JSON.parse(localStorage.getItem("ddf_scan_state") || "null"); } catch {}
    if (!st || typeof st.searches !== "object" || st.searches === null) {
      st = { searches: {} };
      if (seenIdsRef.current.size > 0) for (const b of BIKE_MODELS) st.searches[b.id] = { baselineAt: Date.now(), lastScanAt: 0 };
    }
    scanStateRef.current = st;
  }

  // v6.4 (B4): wczytanie stanu od nowa z localStorage — po przejęciu skanowania przez tę kartę (inna karta mogła
  // w tym czasie zapisać widziane ogłoszenia, kolejkę, powiadomienia, stan wyszukiwań i licznik kosztów)
  const reloadPersistedState = () => {
    seenIdsRef.current = loadSeenMap();
    pendingRef.current = loadPending();
    try {
      const raw = JSON.parse(localStorage.getItem("ddf_outbox") || "[]");
      outboxRef.current = Array.isArray(raw) ? raw : [];
      for (const o of outboxRef.current) if (o?.listing) o.listing.listingId = listingIdFromHref(o.listing.href) || o.listing.listingId;
    } catch { outboxRef.current = []; }
    try {
      const st = JSON.parse(localStorage.getItem("ddf_scan_state") || "null");
      if (st && typeof st.searches === "object" && st.searches !== null) scanStateRef.current = st;
    } catch {}
    try {
      const sp = JSON.parse(localStorage.getItem("ddf_ai_spend") || "null");
      if (sp && sp.month === currentMonthKey() && Number.isFinite(sp.usd)) { aiSpendRef.current = sp; setAiSpend({ ...sp }); }
    } catch {}
    setQueueInfo({ pending: pendingRef.current.size, outbox: outboxRef.current.length });
  };
  const persistPending = () => {
    try {
      const arr = [...pendingRef.current.values()].slice(-PENDING_MAX).map(j => ({ ...j, listing: slimListing(j.listing) }));
      safeSetItem("ddf_pending", JSON.stringify(arr));
    } catch {}
    setQueueInfo({ pending: pendingRef.current.size, outbox: outboxRef.current.length });
  };
  const persistOutbox = () => {
    safeSetItem("ddf_outbox", JSON.stringify(outboxRef.current.slice(-OUTBOX_MAX)));
    setQueueInfo({ pending: pendingRef.current.size, outbox: outboxRef.current.length });
  };
  const persistScanState = () => {
    safeSetItem("ddf_scan_state", JSON.stringify(scanStateRef.current));
  };
  // Dodaj ofertę do kolejki (jeśli już w niej jest — tylko zaktualizuj cenę)
  const enqueueJob = (listing, source, cachedType = null) => {
    const ex = pendingRef.current.get(listing.listingId);
    if (ex) { if (listing.price != null) ex.listing.price = listing.price; return false; }
    pendingRef.current.set(listing.listingId, {
      listing: { ...listing }, source, cachedType, stage: "new", groqType: null, classifierDown: false, attempts: 0, addedAt: Date.now(),
    });
    return true;
  };
  const removeJob = (id) => { pendingRef.current.delete(id); };
  // v5.12: znany model w tytule — "dirt" (znana dirtówka) albo "model" (wszystkie słowa wyszukiwania modelu są w tytule)
  const knownModelInTitle = (listing) => {
    const t = String(listing.title || "").toLowerCase();
    if (DIRT_MODEL_RE.test(t)) return "dirt";
    // v6.4: marka + model z listy BRAND_MODEL_NAMES w tytule — niezależnie od tego, które wyszukiwanie znalazło ofertę
    // (ta sama oferta przychodzi też z „Dirt”, „Giant” itd., a wtedy etykieta wyszukiwania nie mówi nic o marce)
    const KB_KEY = { ns_bikes: "ns", evil: "evil_intense_raaw", intense: "evil_intense_raaw", raaw: "evil_intense_raaw" };
    for (const [id, re] of Object.entries(BRAND_MODEL_NAMES)) {
      const brandRe = KB_BRAND_PATTERNS[KB_KEY[id] || id];
      if (brandRe && brandRe.test(listing.title || "") && re.test(t)) return "model";
    }
    const b = BIKE_MODELS.find(x => x.label === listing.bike);
    if (b?.isCategory && BRAND_MODEL_NAMES[b.id]) return BRAND_MODEL_NAMES[b.id].test(t) ? "model" : null; // v6.4: Giant (link kategorii)
    if (!b || b.isCategory || !b.query) return null;
    const clean = (s) => s.replace(/[^a-z0-9äöüß.]+/g, " ");
    const words = clean(b.query.toLowerCase()).split(" ").filter(Boolean);
    if (words.length < 2 || BRAND_MODEL_NAMES[b.id]) {
      // v6.4: wyszukiwanie całej marki — znany model to nazwa modelu tej marki w tytule (np. „YT Capra Carbon”;
      // 13.11 Groq odrzucił ją jako „hardtail”). Sama marka bez modelu dalej nie wystarcza.
      const models = BRAND_MODEL_NAMES[b.id];
      if (!models) return null;
      return models.test(t) ? "model" : null;
    }
    const norm = ` ${clean(t)} `;
    return words.every(w => norm.includes(` ${w} `) || norm.includes(w)) ? "model" : null;
  };
  useEffect(() => { setQueueInfo({ pending: pendingRef.current.size, outbox: outboxRef.current.length }); }, []);
  const addToOutbox = (item) => {
    outboxRef.current.push({ id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`, addedAt: Date.now(), tries: 0, ...item });
    persistOutbox();
  };

  const persistSeenMap = () => {
    try {
      const m = seenIdsRef.current;
      const now = Date.now();
      for (const [id, d] of m) if (now - (d.lastSeenAt || 0) > SEEN_TTL_MS) m.delete(id);
      if (m.size > SEEN_MAX) { // ponad limit — wypadają najdawniej WIDZIANE (nie najdawniej dodane)
        [...m.entries()].sort((a, b) => (a[1].lastSeenAt || 0) - (b[1].lastSeenAt || 0))
          .slice(0, m.size - SEEN_MAX).forEach(([id]) => m.delete(id));
      }
      const arr = [...m.entries()].map(([id, d]) => {
        const o = { id };
        for (const k of ["price", "lowest", "notifiedAt", "type", "lastSeenAt", "nearMax", "watchSale", "watchT", "rej", "lastNightAt"]) if (d[k] != null) o[k] = d[k];
        if (d.overMax) o.overMax = true;
        if (d.noPrice) o.noPrice = true;
        return o;
      });
      safeSetItem("ddf_seen", JSON.stringify(arr));
    } catch {}
  };

  // Nowo odkryte ogłoszenie — zapamiętaj z ceną z chwili pierwszego zobaczenia jako punkt odniesienia.
  const saveSeenEntry = (listing, persist = true) => {
    seenIdsRef.current.set(listing.listingId, {
      price: listing.price ?? null, lowest: listing.price ?? null, notifiedAt: null, type: null, lastSeenAt: Date.now(),
      // Droższe niż limit zakupu — zapamiętujemy, żeby sprawdzić ponownie, gdy cena spadnie poniżej limitu
      overMax: listing.price != null && listing.price > maxBuyPrice,
    });
    if (persist) persistSeenMap();
  };

  // Po udanej klasyfikacji Etapu 1 — zapamiętaj typ, żeby przy kolejnym spadku ceny pominąć Groq.
  const updateSeenType = (id, typ) => {
    const e = seenIdsRef.current.get(id);
    if (e) { e.type = typ; persistSeenMap(); }
  };

  useEffect(() => { logsEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [logs]);
  useEffect(() => {
    const t = setTimeout(() => {
      const slimA = (a) => { const o = { ...a }; delete o._first; if (typeof o.krotki_opis === "string") o.krotki_opis = o.krotki_opis.slice(0, 700); return o; };
      const arr = results.slice(0, RESULTS_MAX).map(r => ({ id: r.id, status: r.status, timestamp: r.timestamp, at: r.at, listing: slimListing(r.listing), analysis: slimA(r.analysis || {}) }));
      try { localStorage.setItem("ddf_results", JSON.stringify(arr)); } catch { try { localStorage.setItem("ddf_results", JSON.stringify(arr.slice(0, 50))); } catch {} }
    }, 1000);
    return () => clearTimeout(t);
  }, [results]);

  const saveSettings = (silent = false) => {
    const data = { geminiKey, claudeKey, strongModel, geminiModel, geminiChatName, discordWebhook, discordThread, uncertainWebhook, statusWebhook, nearWebhook, filterKeywords, groqClassifierKey, maxGeminiPerCycle, minUncertainPrice, minListingPrice, selectedBikes, knownBikes: BIKE_MODELS.map(b => b.id), provider, minProfit, profitTiers, excludeElektryk, analyzePhotos, maxBuyPrice, aiBudgetPln, transportCostEur, nightCheckEnabled, nightCheckHour, nightCheckMax, nightOverMaxCap, filterMigratedV56: true };
    try { localStorage.setItem("ddf_cfg", JSON.stringify(data)); } catch {}
    if (!silent) addLog("💾 Ustawienia zapisane", "success");
  };
  // v5.11: ustawienia zapisują się same chwilę po każdej zmianie (wcześniej tylko przyciskiem — odświeżenie strony je gubiło)
  const settingsReadyRef = useRef(false);
  useEffect(() => {
    if (!settingsReadyRef.current) { settingsReadyRef.current = true; return; }
    const t = setTimeout(() => saveSettings(true), 600);
    return () => clearTimeout(t);
  }, [geminiKey, claudeKey, strongModel, geminiModel, geminiChatName, discordWebhook, discordThread, uncertainWebhook, statusWebhook, nearWebhook, filterKeywords, groqClassifierKey, maxGeminiPerCycle, minUncertainPrice, minListingPrice, selectedBikes, provider, minProfit, profitTiers, excludeElektryk, analyzePhotos, maxBuyPrice, aiBudgetPln, transportCostEur, nightCheckEnabled, nightCheckHour, nightCheckMax, nightOverMaxCap]);

  // ── Licznik wydatków na Gemini (z danych zużycia zwracanych przez Google) ─────────────
  // Liczony w tej przeglądarce, osobno dla każdego miesiąca kalendarzowego.
  const currentMonthKey = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };
  const freshSpend = () => ({ month: currentMonthKey(), usd: 0, calls: 0 });
  const aiSpendRef = useRef((() => {
    try {
      const sp = JSON.parse(localStorage.getItem("ddf_ai_spend") || "null");
      if (sp && sp.month === currentMonthKey() && Number.isFinite(sp.usd)) return sp;
    } catch {}
    return freshSpend();
  })());
  const [aiSpend, setAiSpend] = useState(aiSpendRef.current);
  // v5.14: koszt także w podziale na etapy (analiza / dokładna / weryfikacja / czat / cache) i tokeny — widać, co naprawdę kosztuje
  const addAiCostUsd = (usd, stage = "inne", u = null, nImages = 0) => {
    if (!(usd > 0)) return;
    if (aiSpendRef.current.month !== currentMonthKey()) aiSpendRef.current = freshSpend();
    const sp = aiSpendRef.current;
    sp.usd += usd; sp.calls += 1;
    if (!sp.byStage || typeof sp.byStage !== "object") sp.byStage = {};
    const b = sp.byStage[stage] || (sp.byStage[stage] = { usd: 0, calls: 0, inTok: 0, cacheRead: 0, cacheWrite: 0, outTok: 0, imgs: 0 });
    b.usd += usd; b.calls += 1; b.imgs += nImages || 0;
    if (u) {
      b.inTok += u.promptTokenCount || 0; b.cacheRead += u.cachedContentTokenCount || 0;
      b.cacheWrite += u.cacheWriteTokenCount || 0; b.outTok += (u.candidatesTokenCount || 0) + (u.thoughtsTokenCount || 0);
    }
    safeSetItem("ddf_ai_spend", JSON.stringify(sp));
    setAiSpend({ ...sp });
  };
  // Koszt jednego wywołania z usageMetadata Gemini (promptTokenCount obejmuje też tokeny z cache).
  // Claude: proxy zwraca ten sam kształt + cacheWriteTokenCount (zapis do cache, płatny osobno).
  const geminiCallCostUsd = (model, u) => {
    if (!u) return 0;
    const pr = GEMINI_PRICES[model] || GEMINI_PRICE_FALLBACK;
    const prompt = u.promptTokenCount || 0;
    const cached = Math.min(u.cachedContentTokenCount || 0, prompt);
    const written = Math.min(u.cacheWriteTokenCount || 0, prompt - cached);
    const out = (u.candidatesTokenCount || 0) + (u.thoughtsTokenCount || 0);
    return ((prompt - cached - written) * pr.in + cached * pr.cached + written * (pr.write ?? pr.in) + out * pr.out) / 1e6;
  };
  // Dostawca i klucz dla danego modelu (Groq / Gemini / Claude)
  const providerFor = (model) => provider === "groq" ? "groq" : isClaudeModel(model) ? "anthropic" : "gemini";
  const keyFor = (model) => provider !== "groq" && isClaudeModel(model) ? claudeKey : geminiKey;
  // Tryb pracy wg wydatków: "premium" (w tempie budżetu) → "normal" (wydatki wyprzedzają tempo) →
  // "eco" (budżet wyczerpany). Tempo = budżet rozłożony równo na dni miesiąca + zapas jednego dnia,
  // żeby pieniądze nie zniknęły w pierwszym tygodniu.
  const getAiTier = () => {
    if (aiSpendRef.current.month !== currentMonthKey()) aiSpendRef.current = freshSpend();
    const budgetUsd = (Number(aiBudgetPln) || 0) / USD_PLN_RATE;
    const spent = aiSpendRef.current.usd;
    if (budgetUsd <= 0 || spent >= budgetUsd) return "stop";
    if (spent >= budgetUsd * ECO_FROM_BUDGET_SHARE) return "eco";
    const now = new Date();
    const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const elapsedDays = now.getDate() - 1 + (now.getHours() + now.getMinutes() / 60) / 24;
    return spent <= budgetUsd * Math.min(1, (elapsedDays + 1) / daysInMonth) ? "premium" : "normal";
  };
  const TIER_LABELS = { premium: "premium", normal: "normalny", eco: "oszczędny", stop: "wstrzymany — budżet wyczerpany" };
  // Twardy limit budżetu: przed KAŻDYM płatnym wywołaniem AI sprawdzamy, czy zmieści się w budżecie
  // razem z rezerwą na jego maksymalny koszt (pełny limit tokenów odpowiedzi). Groq nie jest wliczany.
  const estimateCallCostUsd = (model, promptChars, maxOutputTokens, nImages) => {
    const pr = GEMINI_PRICES[model] || GEMINI_PRICE_FALLBACK;
    const imgTokens = isClaudeModel(model) ? 1600 : /gemini-3|flash-latest/i.test(model || "") ? 1120 : 1300;
    const inTokens = (promptChars || 0) / 3 + (nImages || 0) * imgTokens;
    return (inTokens * pr.in + (maxOutputTokens || 2048) * pr.out) / 1e6;
  };
  const budgetAllows = (estUsd) => {
    if (aiSpendRef.current.month !== currentMonthKey()) aiSpendRef.current = freshSpend();
    return aiSpendRef.current.usd + estUsd <= (Number(aiBudgetPln) || 0) / USD_PLN_RATE;
  };

  // v5.12: dziennik ważnych zdarzeń (błędy, blokady, wysłane alerty, start/stop) — w localStorage, przeżywa odświeżenie
  const [events, setEvents] = useState(() => { try { const e = JSON.parse(localStorage.getItem("ddf_events") || "[]"); return Array.isArray(e) ? e : []; } catch { return []; } });
  const [showEvents, setShowEvents] = useState(false);
  const addLog = useCallback((msg, type = "info") => {
    setLogs(prev => [...prev.slice(-499), {
      time: new Date().toLocaleTimeString("pl-PL"), msg, type,
    }]);
    if (type === "error" || EVENT_RE.test(String(msg))) {
      setEvents(prev => {
        const next = [...prev.slice(-(EVENTS_MAX - 1)), { t: new Date().toLocaleString("pl-PL"), msg: String(msg).slice(0, 400), type }];
        try { localStorage.setItem("ddf_events", JSON.stringify(next)); } catch {}
        return next;
      });
    }
  }, []);

  // ── Proxy API calls ────────────────────────────────────────────────────
  // Sygnał przerwania: limit czasu + (opcjonalnie) STOP sesji skanowania
  const requestSignal = (timeoutMs, withSession) => {
    const signals = [];
    if (typeof AbortSignal !== "undefined" && typeof AbortSignal.timeout === "function") signals.push(AbortSignal.timeout(timeoutMs));
    if (withSession && sessionAbortRef.current) signals.push(sessionAbortRef.current.signal);
    if (signals.length <= 1) return signals[0];
    return typeof AbortSignal.any === "function" ? AbortSignal.any(signals) : signals[0];
  };
  const callProxy = async (body, { timeoutMs = AI_FETCH_TIMEOUT_MS, session = false } = {}) => {
    const resp = await fetch("/api/gemini", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: requestSignal(timeoutMs, session),
    });
    const ct = resp.headers.get("content-type") || "";
    if (!ct.includes("application/json")) {
      throw new Error(`Proxy zwróciło HTML zamiast JSON (HTTP ${resp.status}) — sprawdź czy plik api/gemini.js jest wgrany na serwer`);
    }
    return resp.json();
  };

  // Wywołanie AI — obsługuje Gemini i Groq przez backend proxy /api/gemini
  // overrides: opcjonalne nadpisania generationConfig (używane przy eskalacji do "myślenia" — patrz analyzeWithGemini)
  // cachedContent (opcjonalnie) — nazwa explicit cache (patrz analyzeWithGemini/getCachedContentName).
  // Gdy podana, "prompt" powinien zawierać TYLKO dynamiczną część (bez powtarzania cache'owanej treści).
  // modelOverride (opcjonalnie) — inny model Gemini niż wybrany w Ustawieniach (np. mocniejszy do weryfikacji okazji).
  // imageUrls (opcjonalnie) — adresy zdjęć z ogłoszenia; serwer pobiera je i dokleja do zapytania (tylko Gemini).
  // cachePrefix (opcjonalnie) — statyczna część promptu (baza cen + reguły), wysyłana PRZED "prompt".
  // Gemini/Groq dostają ją sklejoną z resztą; Claude jako osobny blok ze znacznikiem cache.
  // cacheable=false — stała część bez znacznika cache Claude (rzadko używany model weryfikacji: zapis do cache kosztuje 2× i zwykle się nie zwraca)
  const callGemini = async (prompt, overrides = {}, cachedContent = null, modelOverride = null, imageUrls = null, cachePrefix = null, cacheable = true, stage = "analiza") => {
    touchActivity(); // v6.1: linia stanu — każdy etap analizy (pierwsza, dokładna, weryfikacja) to aktywność
    const model = modelOverride || geminiModel;
    const prov = providerFor(model);
    const apiKey = keyFor(model);
    if (!apiKey) throw new Error(prov === "anthropic" ? "Brak klucza Claude (Anthropic) — wpisz go w Ustawieniach" : "Brak klucza API Gemini — wpisz go w Ustawieniach");
    const fullText = cachePrefix ? `${cachePrefix}\n\n${prompt}` : prompt;
    if (prov !== "groq") {
      const maxOut = overrides.maxOutputTokens || 600;
      let est = estimateCallCostUsd(model, fullText.length, maxOut, Array.isArray(imageUrls) ? imageUrls.length : 0);
      // Claude: najgorszy przypadek — cała stała część promptu zapisywana do cache (zapis 1 h jest droższy od zwykłego wejścia)
      const prC = GEMINI_PRICES[model];
      if (isClaudeModel(model) && cachePrefix && cacheable && prC?.write) est += (cachePrefix.length / 3) * (prC.write - prC.in) / 1e6;
      if (!budgetAllows(est)) {
        const err = new Error(`budżet AI na ten miesiąc wyczerpany (${(aiSpendRef.current.usd * USD_PLN_RATE).toFixed(2)} z ${aiBudgetPln} zł)`);
        err.budget = true;
        throw err;
      }
    }
    const data = await callProxy({
      provider: prov,
      model,
      apiKey,
      ...(prov !== "groq" && Array.isArray(imageUrls) && imageUrls.length > 0 ? { imageUrls } : {}),
      // Stała część (cacheControl) jako osobny blok — proxy wstawia zdjęcia ZA nią, przed danymi ogłoszenia,
      // żeby wspólny początek promptu (i cache) był taki sam dla wszystkich ogłoszeń. Dla Gemini znacznik jest usuwany.
      messages: prov === "groq"
        ? [{ role: "user", content: fullText }]
        : cachePrefix
          ? [{ role: "user", parts: [{ text: cachePrefix, ...(cacheable ? { cacheControl: true } : {}) }, { text: prompt }] }]
          : [{ role: "user", parts: [{ text: fullText }] }],
      ...(cachedContent ? { cachedContent } : {}),
      // Groq/GPT-OSS: "gałki" myślenia Gemini (pierwsza próba vs eskalacja) tłumaczymy na poziom
      // rozumowania GPT-OSS — pierwsza próba "low", eskalacja (thinkingBudget -1 / wyższy level) "medium".
      generationConfig: provider === "groq"
        ? {
            temperature: 0.3, maxOutputTokens: 600, ...overrides,
            reasoningEffort: overrides.reasoningEffort
              || ((overrides.thinkingBudget === -1 || ["medium", "high"].includes(overrides.thinkingLevel)) ? "medium" : "low"),
          }
        : { temperature: 0.3, maxOutputTokens: 600, responseMimeType: "application/json", ...overrides },
    }, { session: true });
    if (data?.error) throw new Error(data.error?.message || JSON.stringify(data.error));
    if (provider === "groq") {
      const choice = data?.choices?.[0];
      const text = choice?.message?.content || "";
      // Ucięta odpowiedź ("length") zgłaszana jak u Gemini (MAX_TOKENS) — dzięki temu działa
      // istniejące ponawianie z większym limitem w attemptAnalysis, zamiast udawać kompletną.
      const finishReason = choice?.finish_reason === "length" ? "MAX_TOKENS" : "STOP";
      return { candidates: [{ content: { parts: [{ text }] }, finishReason }] };
    }
    if (data?.usageMetadata) {
      const u = data.usageMetadata, usd = geminiCallCostUsd(model, u);
      const nImg = Number(data.imagesAttached) || 0;
      addAiCostUsd(usd, stage, u, nImg);
      // v5.14: koszt KAŻDEGO zapytania w logu — tokeny wejścia (w tym z cache i zapis do cache), wyjścia (z myśleniem), zdjęcia
      addLog(`💲 ${model} [${stage}]: wejście ${u.promptTokenCount || 0} tok (z cache ${u.cachedContentTokenCount || 0}${u.cacheWriteTokenCount ? `, zapis do cache ${u.cacheWriteTokenCount}` : ""}), wyjście ${(u.candidatesTokenCount || 0) + (u.thoughtsTokenCount || 0)} tok${nImg ? `, zdjęć ${nImg}` : ""} → ${(usd * USD_PLN_RATE * 100).toFixed(2)} gr`, "info");
    }
    return data;
  };

  const sendChatMessage = async () => {
    if (!chatInput.trim() || chatLoading) return;
    if (!keyFor(geminiModel)) { alert(`Wpisz klucz API ${provider === "groq" ? "Groq" : aiName(geminiModel)} w Ustawieniach, żeby korzystać z chatu.`); return; }
    const userMsg = { role: "user", content: chatInput.trim(), time: new Date().toLocaleTimeString("pl-PL") };
    const newMsgs = [...chatMessages, userMsg];
    setChatMessages(newMsgs);
    setChatInput("");
    setChatLoading(true);

    try {
      let responseText = "";

      // Baza cen w czacie: część ogólna + wpisy marek, o których mowa w ostatnich wiadomościach.
      // Gdy rozmowa nie wymienia żadnej marki z bazy (pytanie ogólne) — cała baza.
      const recentChat = newMsgs.slice(-8).map(m => m.content).join("\n");
      let chatKbIds = selectKbChunkIds([recentChat], null);
      const chatKbAll = chatKbIds.length === 0;
      if (chatKbAll) chatKbIds = Object.keys(KB.chunks);
      const knowledgeBlock = `Oto Twoja baza cen rowerów (wbudowana w aplikację, ${KB.version}): ceny SPRZEDAŻY w Polsce w zł z przeliczeniem na euro (kurs ${EUR_PLN_RATE}), zbudowane z analizy rynku i realnych transakcji użytkownika. Korzystaj z niej zawsze, gdy oceniasz wartość roweru lub odpowiadasz na pytania o ceny. Wpis konkretnego modelu ma pierwszeństwo przed wyceną kategorii z części ogólnej.\n`
        + `Dołączone wpisy marek: ${chatKbAll ? "wszystkie" : kbChunkNames(chatKbIds)}${chatKbAll ? "" : " (pozostałe marki są w bazie, ale nie dołączono ich do tej rozmowy — jeśli pytanie dotyczy innej marki, powiedz, że wyceniasz z części ogólnej)"}.\n\n`
        + `${KB.core}\n\n${kbChunksText(chatKbIds)}\n\n`
        + (kbNotes.length > 0 ? `Notatki użytkownika (realne transakcje i uwagi — mają pierwszeństwo przed bazą; kwoty sprzedaży w PL bez waluty to złotówki):\n${kbNotes.map((e, i) => `${i + 1}. ${e.text}`).join("\n")}\n\n` : "")
        + `---\n\n`;

      // Ostatnie 20 wiadomości bez komunikatów o błędach; pierwsza musi być od użytkownika (wymóg Claude)
      const historyForApi = newMsgs.filter(m => !m.isError).slice(-20);
      while (historyForApi.length > 1 && historyForApi[0].role !== "user") historyForApi.shift();
      if (knowledgeBlock) {
        // Wstrzyknij bazę wiedzy jako kontekst do pierwszej wiadomości w wysyłce (nie zapisujemy tego w widocznej historii)
        historyForApi[0] = { ...historyForApi[0], content: knowledgeBlock + historyForApi[0].content };
      }

      const messages = provider === "groq"
        ? historyForApi.map(m => ({ role: m.role === "assistant" ? "assistant" : "user", content: m.content }))
        : historyForApi.map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] }));

      if (provider !== "groq") {
        const est = estimateCallCostUsd(geminiModel, JSON.stringify(messages).length, isClaudeModel(geminiModel) ? 16000 : 8192, 0);
        if (!budgetAllows(est)) throw new Error(`Budżet AI na ten miesiąc wyczerpany (${(aiSpendRef.current.usd * USD_PLN_RATE).toFixed(2)} z ${aiBudgetPln} zł) — zwiększ go w Ustawieniach`);
      }
      const data = await callProxy({
        provider: providerFor(geminiModel),
        model: geminiModel,
        apiKey: keyFor(geminiModel),
        messages,
        generationConfig: { temperature: 0.7, maxOutputTokens: 8192 },
      });
      if (data?.error) throw new Error(data.error?.message || JSON.stringify(data.error));
      if (provider === "groq") {
        responseText = data?.choices?.[0]?.message?.content || "(brak odpowiedzi)";
      } else {
        responseText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "(brak odpowiedzi)";
        if (data?.usageMetadata) addAiCostUsd(geminiCallCostUsd(geminiModel, data.usageMetadata), "czat", data.usageMetadata);
      }
      const aiMsg = { role: "assistant", content: responseText, time: new Date().toLocaleTimeString("pl-PL") };
      const finalMsgs = [...newMsgs, aiMsg];
      setChatMessages(finalMsgs);
      saveChatHistory(finalMsgs);
    } catch (e) {
      const errMsg = { role: "assistant", content: `⚠️ Błąd: ${e.message}`, time: new Date().toLocaleTimeString("pl-PL"), isError: true };
      const finalMsgs = [...newMsgs, errMsg];
      setChatMessages(finalMsgs);
      saveChatHistory(finalMsgs);
    } finally {
      setChatLoading(false);
    }
  };

  // Zawsze zwraca { ok, status, retryAfter, error } — nigdy nie rzuca. ok=true tylko po potwierdzeniu przez Discorda.
  const postDiscord = async (webhookUrl, threadId, payload) => {
    try {
      const resp = await fetch("/api/discord", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ webhookUrl, threadId, payload }),
        signal: requestSignal(DISCORD_TIMEOUT_MS, false),
      });
      const data = await resp.json().catch(() => null);
      if (!data || typeof data !== "object") return { ok: false, status: resp.status, retryAfter: null, error: "niepoprawna odpowiedź proxy (sprawdź, czy api/discord.js jest wgrany)" };
      return { ok: data.ok === true, status: data.status ?? resp.status, retryAfter: data.retryAfter ?? null, error: data.error ?? null };
    } catch (e) {
      return { ok: false, status: 0, retryAfter: null, error: e?.message || "błąd sieci" };
    }
  };
  const callDiscord = (payload) => postDiscord(discordWebhook, discordThread, payload);
  // v5.11: komunikat o problemie (brak środków AI, blokada, budżet…) — na webhook statusu albo, gdy pusty, na kanał okazji.
  // Ten sam rodzaj problemu najwyżej co 6 h, żeby nie zasypać kanału.
  const statusNotifiedRef = useRef({});
  const notifyStatus = async (kind, text) => {
    const url = statusWebhook || discordWebhook;
    if (!url) return;
    const now = Date.now();
    if (now - (statusNotifiedRef.current[kind] || 0) < STATUS_NOTIFY_COOLDOWN_MS) return;
    statusNotifiedRef.current[kind] = now;
    const r = await postDiscord(url, statusWebhook ? "" : discordThread, { content: `⚙️ **DirtDealFinder — problem** (${new Date().toLocaleString("pl-PL")})\n${text}`.slice(0, 1900) });
    if (!r.ok) { statusNotifiedRef.current[kind] = 0; addLog(`⚠️ Nie udało się wysłać komunikatu o problemie na Discord (${describeDiscordError(r)})`, "error"); }
  };
  const callNearDiscord = (payload) => nearWebhook
    ? postDiscord(nearWebhook, "", payload)
    : Promise.resolve({ ok: false, status: 0, retryAfter: null, error: "brak webhooka „na granicy”" });
  const callUncertainDiscord = (payload) => uncertainWebhook
    ? postDiscord(uncertainWebhook, "", payload)
    : Promise.resolve({ ok: false, status: 0, retryAfter: null, error: "brak webhooka niepewnych" });
  const describeDiscordError = (r) => [401, 403, 404].includes(r.status)
    ? `webhook nieprawidłowy albo usunięty (HTTP ${r.status}) — sprawdź Ustawienia`
    : r.status === 429 ? `limit wiadomości Discorda${r.retryAfter != null ? ` (spróbuj za ${Math.ceil(r.retryAfter)} s)` : ""}`
    : r.status === 0 ? (r.error || "błąd sieci") : `HTTP ${r.status}${r.error ? `: ${r.error}` : ""}`;

  // Filtr słów kluczowych — odrzuca ogłoszenie ZANIM trafi do Gemini (zero kosztu)
  const getFilterKeywordList = () =>
    filterKeywords.split(/[,\n]/).map(s => s.trim().toLowerCase()).filter(Boolean);

  // Słowa z listy sprawdzamy w TYTULE i tylko jako całe słowa. W opisie — wyłącznie jednoznaczne zwroty
  // o sprzedaży samej ramy (opis kompletnego roweru normalnie wymienia "Laufradsatz", "Ersatzteile" itd.).
  const matchesFilterKeyword = (listing) => {
    const title = listing.title || "";
    for (const kw of getFilterKeywordList()) {
      if (kw && keywordRe(kw).test(title)) return kw;
    }
    const desc = String(listing.desc || "");
    if (DESC_COMPLETE_BIKE_RE.test(desc)) return null; // opis mówi o kompletnym rowerze — nie odrzucamy z opisu
    for (const m of desc.matchAll(DESC_PARTS_ONLY_RE)) {
      if (DESC_NEGATION_BEFORE_RE.test(desc.slice(Math.max(0, m.index - 12), m.index))) continue; // "nicht nur Rahmen"
      return `${m[0]} (w opisie)`;
    }
    return null;
  };

  // ── Filtr roku — odrzuca stare rowery (< MIN_BIKE_YEAR) ZANIM trafią choćby do Groqa ─────────
  // Działa w 2 krokach (patrz użycie w pętli fazy 1):
  //  1) checkListingYearBlock(listing) — lokalny regex na TYTULE, zero kosztu, zero API.
  //     Jeśli w tytule jest jawny rok < MIN_BIKE_YEAR albo słowo "retro"/"vintage"/itp. → odrzuć od razu,
  //     ogłoszenie nawet nie dotrze do Groqa.
  //  2) Jeśli tytuł NIE ma roku ani słowa retro — puszczamy dalej do Groqa, który w Etapie 1 SAM
  //     dodatkowo spróbuje oszacować rok na podstawie modelu/wersji (patrz prompt w classifyWithGroq).
  //     Jeśli Groq oszacuje rok < MIN_BIKE_YEAR → odpowiada "stary" i też nie idzie do Gemini.
  //     Jeśli Groq nie da rady oszacować → normalna klasyfikacja typu, idzie dalej do Gemini,
  //     gdzie rok produkcji jest ostatnią linią obrony (patrz prompt Etapu 2 w analyzeWithGemini).
  const MIN_BIKE_YEAR = 2017;

  const RETRO_KEYWORDS = [
    "retro", "vintage", "oldschool", "old school", "klassiker", "youngtimer",
    "oldtimer", "classic bike", "classic mtb"
  ];
  // "70er/80er/90er" (lata 70./80./90.) tylko jako osobne słowo — "170er", "180er", "190er" to skok zawieszenia, nie retro
  const RETRO_DECADE_RE = /(?<![\d.,])(?:70|80|90)er\b/i;

  // Wyciąga rok z tytułu — najpierw próbuje jawnych wzorców roku produkcji (Bj., Baujahr, MY, Modelljahr),
  // dopiero potem "gołego" 4-cyfrowego tokenu w zakresie 1970-2035 (odfiltrowując ceny typu "1800€").
  const extractYearFromTitle = (title) => {
    if (!title) return null;
    const t = title;

    const explicitPatterns = [
      /\bB(?:au)?j(?:ahr)?\.?\s*(\d{4})\b/i,   // Bj. 2016 / Baujahr 2016
      /\bMY\s*'?(\d{2,4})\b/,                   // MY19 / MY 2019 — celowo BEZ flagi i (małe "my" to zwykłe angielskie słowo)
      /\bModelljahr\s*(\d{4})\b/i,
    ];
    for (const re of explicitPatterns) {
      const m = t.match(re);
      if (m) {
        let y = parseInt(m[1], 10);
        if (y < 100) y += y < 50 ? 2000 : 1900; // MY19 -> 2019, MY99 -> 1999
        if (y >= 1970 && y <= 2035) return y;
      }
    }

    // Gołe 4 cyfry — pomijamy liczby, które są ceną albo przebiegiem ("2000 km", "NP 2000 Euro", "VB 2000", "1800€").
    // Z kilku lat bierzemy NAJNOWSZY ("2016 / Umbau 2019") — wynik służy tylko do twardego odrzucenia starego roweru.
    const years = [];
    for (const m of t.matchAll(/\b(19[7-9]\d|20[0-3]\d)\b/g)) {
      const idx = m.index ?? 0;
      const after = t.slice(idx + m[0].length, idx + m[0].length + 12);
      const before = t.slice(Math.max(0, idx - 12), idx);
      if (/^\s*(?:€|\$|eur\b|euro|,-|\.-|km\b|kilometer|vb\b|wh\b|mm\b|kg\b|g\b|zoll)/i.test(after)) continue;
      if (/(?:\bnp|neupreis|uvp|\bvb|preis|f[üu]r|\bnur|\bab|ca\.?|€|\$)\s*:?\s*$/i.test(before)) continue;
      years.push(parseInt(m[1], 10));
    }
    return years.length > 0 ? Math.max(...years) : null;
  };

  const checkListingYearBlock = (listing) => {
    const title = listing.title || "";
    const titleLower = title.toLowerCase();

    const retroHit = RETRO_KEYWORDS.find(kw => titleLower.includes(kw)) || (title.match(RETRO_DECADE_RE) || [])[0];
    if (retroHit) return { blocked: true, reason: `słowo "${retroHit}" w tytule` };

    const year = extractYearFromTitle(title);
    if (year != null && year < MIN_BIKE_YEAR) {
      return { blocked: true, reason: `rok ${year} < ${MIN_BIKE_YEAR}` };
    }
    return { blocked: false };
  };

  // Ścisła wersja dla PEŁNEGO opisu (faza 2): tylko JAWNIE oznaczony rocznik (Baujahr / Bj. /
  // Jahrgang / Modelljahr / MY). Bez "gołych" lat i słów typu "Klassiker" — w długim opisie dają
  // za dużo fałszywych trafień ("Gabel von 2015 nachgerüstet" w rowerze z 2020, "ein Klassiker").
  // ── Darmowe wykrywacze na tekście ogłoszenia (zero kosztu AI) ──────────────────────────
  // E-bike: tylko twarde dowody napędu (pojemność akumulatora w Wh, znane silniki, "Motor:").
  // Same słowa "E-Bike"/"Pedelec" liczą się tylko w TYTULE — w opisie bywa np. "kein E-Bike".
  const detectEbike = (listing) => {
    const title = listing.title || "";
    const text = `${title}\n${listing.fullDesc || listing.desc || ""}`;
    const m = text.match(/\b\d{3,4}\s?Wh\b/i)
      || text.match(/\b(?:Fazua|Bosch\s+(?:Performance|CX|SX|Smart\s?System)|Shimano\s+(?:Steps|EP\s?8|EP\s?801|EP\s?600|E\s?8000|E\s?7000)|Brose\s+(?:Drive|Mag)|Yamaha\s+PW|TQ\s+HPR|Bafang|DJI\s+Avinox|Akkukapazit[äa]t)\b|\bMotor\s*:\s*\S/i)
      || title.match(/\b(?:E-?MTB|E-?Bike|Pedelec|E-?Fully|E-?Mountainbike|Turbo\s+Levo|Kenevo|Levo\s+SL)\b/i);
    return m ? m[0].trim() : null;
  };
  // Nowy rower ze sklepu = cena detaliczna, na odsprzedaży się nie zarobi. Wymaga OBU sygnałów:
  // sklepu i stanu "nowy" — sklepy sprzedają też używane rowery, te zostawiamy do oceny AI.
  const detectNewFromShop = (listing) => {
    const text = `${listing.title || ""}\n${listing.fullDesc || listing.desc || ""}`;
    const shop = text.match(/\b(?:Online-?Shop|Onlineshop)\b|in unserem (?:Online-?)?(?:Shop|Laden|Geschäft)|Lieferzeit\s*:\s*\d|verfügbare\s+Größen|\b(?:inkl|zzgl)\.?\s*(?:\d{1,2}\s*%\s*)?MwSt/i);
    if (!shop) return null;
    const isNew = text.match(/Zustand\s*:?\s*Neu\b|\bfabrikneu\b|\boriginalverpackt\b|\bNeurad\b|\bNeufahrzeug\b/i);
    return isNew ? `${shop[0].trim()} + ${isNew[0].trim()}` : null;
  };
  // Jeden powód odrzucenia bez AI (cena/e-bike/sklep) albo null
  const freeRejectReason = (listing) => {
    if (listing.price != null && listing.price > maxBuyPrice) return { kind: "price", msg: `cena ${listing.price}€ powyżej limitu zakupu ${maxBuyPrice}€` };
    if (listing.price != null && listing.price < minListingPrice) return { kind: "cheap", msg: `cena ${listing.price}€ poniżej minimum ${minListingPrice}€` };
    const eb = excludeElektryk ? detectEbike(listing) : null;
    if (eb) return { kind: "ebike", msg: `e-bike (wykryto: "${eb}")` };
    const shop = detectNewFromShop(listing);
    if (shop) return { kind: "shop", msg: `nowy rower ze sklepu (wykryto: "${shop}")` };
    return null;
  };

  // Rocznik oznaczony wprost w pełnym opisie (Baujahr / Bj. / Jahrgang / Modelljahr / MY).
  // Lata opisane przy podzespole ("Gabel Baujahr 2015") są pomijane; gdy zostaje kilka lat — bierzemy
  // NAJNOWSZY, bo ten wynik służy tylko do twardego odrzucenia starego roweru (lepiej nie odrzucić, niż odrzucić dobry).
  const extractMarkedYear = (text) => {
    if (!text) return null;
    const maxYear = new Date().getFullYear() + 1;
    const years = [];
    const take = (m, raw) => {
      let y = parseInt(raw, 10);
      if (y < 100) y += 2000;
      if (y < 1980 || y > maxYear) return;
      if (numberContext(text, m.index) === "component") return;
      years.push(y);
    };
    // v6.4 (B7): „Baujahr 2016/2017” / „Bj. 2016-17” — liczy się PÓŹNIEJSZY rok (jak w tytule), nie wcześniejszy
    for (const m of text.matchAll(/\b(?:Baujahr|Bj|Jahrgang|Modell?jahr)\.?:?\s*(?:ca\.?\s*|etwa\s*)?(\d{4})(?:\s*[\/–-]\s*(\d{4}|\d{2})\b)?\b/gi)) {
      take(m, m[1]);
      if (m[2]) take(m, m[2].length === 2 ? m[1].slice(0, 2) + m[2] : m[2]);
    }
    for (const m of text.matchAll(/\bMY\.?\s*'?(\d{2}|\d{4})\b/g)) take(m, m[1]); // tylko wielkie "MY"
    return years.length > 0 ? Math.max(...years) : null;
  };

  // Biała lista — zwraca true jeśli ogłoszenie zawiera CHOĆ JEDNO wymagane słowo (sygnał full/dirt).
  // Jeśli lista jest pusta, filtr jest wyłączony (przepuszcza wszystko, jak dotychczas).
  // llama-3.3-70b-versatile został wyłączony przez Groq 16.08.2026 — gpt-oss-120b to oficjalny zamiennik.
  // Model z rozumowaniem: mocny w niuansach (część vs cały rower, szacowanie roku). Wysiłek "low" wystarcza
  // do klasyfikacji i trzyma koszt nisko. Tańsza alternatywa: "openai/gpt-oss-20b".
  const GROQ_CLASSIFIER_MODEL = "openai/gpt-oss-120b";

  // Czas oczekiwania z komunikatu Groqa: "7.66s", "350ms", "3m35.2s", "7h12m3.5s".
  // Wcześniejszy regex łapał tylko pierwszą liczbę, więc np. "7h12m" dawało domyślne 2 min.
  const parseGroqWaitMs = (msg, fallbackMs) => {
    // Wariant "ms" MUSI być pierwszy — druga gałąź może dopasować pusty tekst i by go przesłoniła.
    const m = (msg || "").match(/try again in ([\d.]+ms|(?:\d+h)?(?:\d+m(?!s))?(?:[\d.]+s)?)/i);
    const s = ((m && m[1]) || "").toLowerCase();
    if (!s) return fallbackMs;
    if (/^[\d.]+ms$/.test(s)) return parseFloat(s);
    const h = Number((s.match(/(\d+)h/) || [])[1] || 0);
    const mi = Number((s.match(/(\d+)m(?!s)/) || [])[1] || 0);
    const sec = Number((s.match(/([\d.]+)s/) || [])[1] || 0);
    const total = (h * 3600 + mi * 60 + sec) * 1000;
    return total > 0 ? total : fallbackMs;
  };

  // ── Etap 1: szybka, "głupia" klasyfikacja typu roweru przez Groq ──────────
  // Cel: odrzucić ewidentnie nietrafione typy (szosówki, miejskie, dziecięce, części...) BEZ
  // wysyłania ich do drogiej/limitowanej analizy Gemini. Lekki prompt = minimalne zużycie
  // tokenów na zapytanie, więc nie zapycha limitu TPM Groqa tak jak zrobiłby to pełny prompt z cennikiem.
  // Gdy Groq nie jest pewien typu (lub wystąpi błąd/limit) — NIE odrzucamy, tylko oznaczamy jako
  // "niepewne" i przepuszczamy dalej z niższym priorytetem (patrz Faza 2 w runOneCycle).
  // Parsuje pole klucza Groq — akceptuje jeden klucz LUB kilka (każdy w nowej linii lub po przecinku).
  // Kilka kluczy = kilka NIEZALEŻNYCH dziennych budżetów 500k tokenów (Groq liczy limit per klucz/konto).
  const getGroqKeyList = () =>
    [...new Set(groqClassifierKey.split(/[\n,]/).map(s => s.trim()).filter(Boolean))];

  const classifyWithGroq = async (listing) => {
    const keys = getGroqKeyList();
    if (keys.length === 0) return "niedostepny"; // brak klucza = etap 1 wyłączony — wszystko idzie do analizy AI

    // ── Wiele kluczy Groq + cooldown PER KLUCZ po dziennym limicie tokenów (TPD) ──────────────
    // UWAGA: limity Groqa liczą się na ORGANIZACJĘ (konto), nie na klucz — kilka kluczy z jednego
    // konta dzieli ten sam limit. Darmowy limit GPT-OSS to ok. 200k tokenów/dzień na model.
    // Najprościej zwiększyć go podpinając kartę (koszt rzędu 1-3 $/mies.). Klucze są używane rotacyjnie (round-robin) między
    // wywołaniami, więc obciążenie rozkłada się równo i żaden klucz nie wyczerpuje się sam pierwszy.
    // Gdy dany klucz dostanie błąd "tokens per day" — dostaje WŁASNY cooldown (nie blokuje innych
    // kluczy) i w TYM SAMYM wywołaniu od razu próbujemy KOLEJNEGO klucza z listy, zamiast czekać.
    // Dopiero gdy WSZYSTKIE klucze są w cooldownie, przepuszczamy jako "niepewne" bez wywołania API.
    const now = Date.now();
    const startIdx = groqKeyIndexRef.current % keys.length;
    groqKeyIndexRef.current = (groqKeyIndexRef.current + 1) % keys.length; // rotacja na następne wywołanie
    const ordered = keys.map((_, i) => keys[(startIdx + i) % keys.length]);
    const usableKeys = ordered.filter(k => (groqKeyCooldownsRef.current[k] || 0) <= now);

    if (usableKeys.length === 0) {
      const soonest = Math.min(...keys.map(k => groqKeyCooldownsRef.current[k] || 0));
      const remainingSec = Math.max(0, Math.ceil((soonest - now) / 1000));
      addLog(`⏸️ Groq: wszystkie klucze (${keys.length}) w cooldownie (TPD) — pomijam wywołanie, najbliższy wznowi za ~${remainingSec}s — ${listing.title}`, "info");
      notifyStatus("groq_tpd", `⏸️ Groq (etap 1): dzienny limit tokenów wyczerpany na wszystkich kluczach — oferty idą do analizy AI bez wstępnej klasyfikacji (drożej). Wznowienie za ok. ${Math.ceil(remainingSec / 60)} min.`);
      return "niedostepny";
    }

    const prompt = `Klasyfikator ogłoszeń rowerowych. Na podstawie tytułu i opisu określ TYLKO typ roweru.

Typy:
- full — PEŁNE zawieszenie (amortyzator z tyłu + widelec z przodu): enduro/trail/all-mountain/downhill.
- dirt — dirt jump/slopestyle/pumptrack, sztywny hardtail do skoków.
- elektryk_gorski — elektryczny rower górski/e-MTB (napęd + charakter trail/enduro). NIE miejski e-bike.
- inny — reszta: szosówka, gravel, trekking, miejski, dziecięcy, hardtail XC bez cech dirtowych, części, miejski e-bike.

ZASADA: samo słowo "Mountainbike"/"MTB" w tytule BEZ dowodu na pełne zawieszenie = zwykle TANI HARDTAIL, czyli "inny", NIE "full"! Klasyfikuj jako "full" TYLKO gdy jest konkretny dowód: "vollgefedert"/"Fully"/"full suspension", wzmianka o amortyzatorze/zawieszeniu z tyłu ("Dämpfer", "Federung hinten", "Hinterbau"), lub znany model full: Canyon Torque/Spectral/Strive/Neuron/Nerve, Trek Fuel/Slash/Remedy, Specialized Stumpjumper/Enduro/Camber, Cube Stereo/AMS, Santa Cruz, YT, Commencal, Radon Swoop/Slide, Ghost Riot/SL AMR, Focus Jam/Sam/Thron.

ZNANE HARDTAILE (= "inny", nie "full"): Trek Marlin/Roscoe/X-Caliber, Cube Aim/Access/Acid/Analog/Attention/Reaction, BULLS Sharptail/Copperhead/Wildtail/Six50, Rockrider/Rockride (Decathlon, wszystkie ST-serie), Specialized Rockhopper/Pitch/Chisel/Hardrock, Scott Aspect/Scale, Merida Big Nine/Seven/Trail, Ghost Kato/Lanao, Giant Talon/ATX, KTM Chicago/Ultra, Focus Whistler/Raven.

ZNANE DIRTY / SLOPESTYLE (= "dirt" — sztywny tył i koła 26" są tu NORMALNE): Rose The Bruce, Dartmoor Two6Player / Gamer / Shine, Canyon Stitched 360 (Stitched 720 to full do slopestyle'u → full), Specialized P.3 / P.26 / P.24 / P.Slope, NS Bikes Movement / Zircus / Metropolis / Decade / Capital, YT Dirt Love, Commencal Absolut, Radon Slush, Marin Alcatraz, Propain Trickshot, Trek Ticket, Santa Cruz Jackal, Scott Voltage YZ, Norco Rampage, Kona Shonky, Cube Flying Circus. Widelec dirtowy (Manitou Circus, RockShox Pike DJ / Argyle, Marzocchi DJ) albo słowa "Dirt", "Dirtjump", "Slopestyle", "Pumptrack" przy rowerze = dirt. Motocykl / cross spalinowy albo elektryczny "Dirt Bike" z silnikiem (W, km/h, Motocross) = inny.

E-BIKE: sygnały napędu ("E-Bike","Akku","Motor",Bosch/Shimano Steps/Brose/Yamaha, przebieg w km, "E1.5"/"E-8"). Z charakterem górskim (zawieszenie/MTB/teren) → elektryk_gorski. Z charakterem miejskim/touring (koszyk, błotniki, "City"/"Trekking") → inny.

CZĘŚCI vs CAŁY ROWER — WAŻNE: samo wymienienie konkretnych komponentów w opisie CAŁEGO roweru na sprzedaż (np. "z widelcem RockShox Pike, kołami Mavic, hamulcami Code") to NORMALNY opis wyposażenia — dalej klasyfikuj normalnie po typie zawieszenia. Odpowiedz "inny" TYLKO gdy z tytułu/opisu WPROST wynika, że przedmiotem ogłoszenia jest SAMA CZĘŚĆ, nie cały rower — np. "verkaufe nur Rahmen", "biete Gabel/Dämpfer/Laufradsatz an", "Ersatzteil", "Teile vom [model]", "nur Rahmenset", "Einzelteile", tytuł zaczynający się od nazwy komponentu bez wzmianki że to kompletny rower. "Rahmen L" / "Rahmengröße M" / "Rahmen 48 cm" to ROZMIAR RAMY całego roweru, NIE sprzedaż samej ramy. Opis wymieniający ramę RAZEM z widelcem, amortyzatorem, napędem, hamulcami i oponami (lista osprzętu) = KOMPLETNY ROWER. W razie wątpliwości (nie jest jasne czy to część czy cały rower) → niepewne, NIE inny.

ROK PRODUKCJI: odpowiedz jednym słowem "stary" (zamiast typu) TYLKO wtedy, gdy tytuł/opis daje KONKRETNY dowód, że rower jest sprzed 2017: podany rok, koła 26" w rowerze enduro/trail/fullu (w dirtach 26" to standard — to NIE jest dowód wieku), napęd 3x/2x, hamulce V-Brake, nazwa wyraźnie starej generacji. Sama nazwa modelu (np. "Rose The Bruce", "NS Capital", "Trek Fuel EX") bez takiego dowodu to NIE powód — klasyfikuj normalnie; wiek oceni dokładniejsza analiza.

Brak wystarczających informacji → odpowiedz: niepewne

Tytuł: ${listing.title}
Opis: ${listing.fullDesc || listing.desc}

FORMAT ODPOWIEDZI: Najpierw, w JEDNEJ linii, krótkie uzasadnienie (maks. 15 słów) — co przeważyło o klasyfikacji. Następnie w OSTATNIEJ, OSOBNEJ linii podaj WYŁĄCZNIE jedno słowo z: full/dirt/elektryk_gorski/inny/niepewne/stary — nic więcej w tej linii, żadnej kropki ani komentarza.`;

    addLog(`🔎 Groq: klasyfikuję — ${listing.title}${listing.price != null ? ` (${listing.price}€)` : ""}${keys.length > 1 ? ` [klucz ${ordered.indexOf(usableKeys[0]) + 1}/${keys.length}]` : ""}`, "info");

    // Pętla PO KLUCZACH — gdy aktualny klucz trafi TPD, próbujemy od razu następnego dostępnego,
    // zamiast czekać. Wewnątrz każdego klucza działa krótki retry z backoffem na zwykły RPM 429.
    for (const apiKey of usableKeys) {
      for (let attempt = 1; attempt <= 3; attempt++) {
        const startedAt = Date.now();
        try {
          const data = await callProxy({
            provider: "groq",
            model: GROQ_CLASSIFIER_MODEL,
            apiKey,
            messages: [{ role: "user", content: prompt }],
            // GPT-OSS najpierw "myśli" (tokeny rozumowania liczą się do limitu) — przy 100 odpowiedź
            // byłaby zwykle pusta. 1024 + wysiłek "low" = szybko i tanio, płaci się za faktyczne zużycie.
            generationConfig: { temperature: 0.1, maxOutputTokens: 1024, reasoningEffort: "low" },
          }, { session: true, timeoutMs: 60000 });
          const ms = Date.now() - startedAt;

          if (data?.error) {
            const msg = data.error?.message || "błąd";
            const isDailyLimit = /tokens per day|TPD/i.test(msg);
            const isRateLimit = /rate limit|429|too many requests/i.test(msg);

            if (isDailyLimit) {
              // Dzienny budżet TEGO klucza wyczerpany — cooldown TYLKO dla niego, inne klucze
              // (jeśli są) próbujemy dalej w tym samym wywołaniu, bez czekania.
              const waitMs = parseGroqWaitMs(msg, 120000); // domyślnie 2 min, jeśli nie uda się sparsować
              groqKeyCooldownsRef.current[apiKey] = Date.now() + waitMs + 5000; // +5s zapasu
              const keyLabel = keys.length > 1 ? ` (klucz #${keys.indexOf(apiKey) + 1}/${keys.length})` : "";
              addLog(`⏸️ Groq${keyLabel}: dzienny limit tokenów (TPD) wyczerpany — cooldown ~${Math.ceil((waitMs + 5000) / 1000)}s dla tego klucza${keys.length > 1 ? ", próbuję kolejnego klucza" : ", wszystko dalej idzie jako \"niepewne\""} — ${msg}`, "error");
              break; // przerwij retry na TYM kluczu, przejdź do kolejnego klucza w pętli zewnętrznej
            }

            if (isRateLimit && attempt < 3) {
              const waitMs = parseGroqWaitMs(msg, 3000);
              addLog(`⏳ Groq: limit RPM osiągnięty — czekam ${Math.ceil((waitMs + 300) / 1000)}s, próba ${attempt + 1}/3 — ${listing.title}`, "error");
              await sleep(waitMs + 300);
              continue; // ponów na tym samym kluczu
            }
            addLog(`⚠️ Groq klasyfikator: ${msg} (${ms}ms) — klasyfikator niedostępny, przepuszczam do analizy AI`, "error");
            return "niedostepny";
          }

          const raw = (data?.choices?.[0]?.message?.content || "").toLowerCase().trim();
          // Bierzemy TYLKO ostatnią niepustą linię — reszta to opcjonalne krótkie uzasadnienie
          // (patrz prompt: "najpierw uzasadnienie, w OSTATNIEJ linii wyłącznie słowo klasyfikacji").
          // Gdyby patrzeć na cały tekst, wzmianka o innym typie w uzasadnieniu (np. "to nie dirt,
          // tylko full") mogłaby zostać błędnie złapana jako pierwsze pasujące słowo.
          const rawLines = raw.split("\n").map(l => l.trim()).filter(Boolean);
          const lastLine = rawLines.length ? rawLines[rawLines.length - 1] : raw;
          let typ;
          if (lastLine.includes("stary")) typ = "stary";
          else if (lastLine.includes("elektryk")) typ = "elektryk_gorski";
          else if (lastLine.includes("dirt")) typ = "dirt";
          else if (lastLine.includes("full")) typ = "full";
          else if (lastLine.includes("inny")) typ = "inny";
          else typ = "niepewne";

          const icon = { full: "🟢", dirt: "🟠", elektryk_gorski: "⚡", inny: "⚫", niepewne: "❓", stary: "🕰️" }[typ];
          const rawNote = !["full", "dirt", "elektryk_gorski", "inny", "niepewne", "stary"].includes(lastLine) && lastLine && typ === "niepewne"
            ? ` (Groq odpowiedział niejednoznacznie: "${lastLine.slice(0, 40)}")`
            : "";
          // Krótkie uzasadnienie (jeśli Groq je dodał, patrz format promptu) — pomaga debugować klasyfikacje
          const reasonLine = rawLines.length > 1 ? rawLines.slice(0, -1).join(" ").slice(0, 80) : "";
          const reasonNote = reasonLine ? ` — powód: "${reasonLine}"` : "";
          addLog(`${icon} Groq (${ms}ms): typ="${typ}"${rawNote}${reasonNote} — ${listing.title}`, "info");
          listing._groqReason = reasonLine || null; // v5.12: powód pokazujemy w Wynikach przy odrzuceniu
          return typ;
        } catch (e) {
          const ms = Date.now() - startedAt;
          if (!runningRef.current) return "niedostepny"; // STOP — zapytanie przerwane
          if (attempt < 3) {
            addLog(`⏳ Groq: błąd sieci (${e.message}, ${ms}ms) — ponawiam za 2s, próba ${attempt + 1}/3 — ${listing.title}`, "error");
            await sleep(2000);
            continue;
          }
          addLog(`⚠️ Groq klasyfikator: ${e.message} (${ms}ms) — klasyfikator niedostępny, przepuszczam do analizy AI`, "error");
          return "niedostepny"; // błąd Groqa po 3 próbach → nie odrzucaj, przepuść dalej (bez progu ceny dla "niepewnych")
        }
      } // koniec pętli prób (RPM retry) dla jednego klucza
    } // koniec pętli po kluczach — tu trafiamy tylko gdy WSZYSTKIE dostępne klucze skończyły się na TPD
    addLog(`⚠️ Groq: wszystkie dostępne klucze (${usableKeys.length}/${keys.length}) trafiły dzienny limit w tym wywołaniu — przepuszczam do analizy AI — ${listing.title}`, "error");
    return "niedostepny";
  };

  // v6.3: wspólna kolejka zapytań do Kleinanzeigen — wyszukiwania (pętla zbierania) i strony ogłoszeń (wykonawca AI,
  // zaległe okazje) biegną równolegle, ale do portalu idą po kolei, z odstępem KA_MIN_GAP_MS + losowo do 2 s
  const kaNextAtRef = useRef(0);
  const kaChainRef = useRef(Promise.resolve());
  const kaSlot = () => {
    const p = kaChainRef.current.then(async () => {
      const wait = kaNextAtRef.current - Date.now();
      if (wait > 0) await sleep(wait);
      kaNextAtRef.current = Date.now() + KA_MIN_GAP_MS + Math.random() * 2000;
    });
    kaChainRef.current = p.catch(() => {});
    return p;
  };
  // v6.3: zakres cen po stronie portalu — pierwsza strona wyników mieści więcej ofert, które i tak nas interesują.
  // v6.4: „anzeige:angebote” (bez ogłoszeń „Suche …”) we wszystkich linkach i górna cena także w linkach kategorii
  // (Giant, Dirt, Dirtbike) — sprawdzone na żywo 13.11.2026 (25 kart, ceny w zakresie, 0 „Suche”)
  const searchUrlFor = (bike) => bike.isCategory
    ? bike.categoryUrl.replace("/s-fahrraeder/", "/s-fahrraeder/anzeige:angebote/").replace(/preis:(\d+):\//, `preis:$1:${maxBuyPrice}/`)
    : `https://www.kleinanzeigen.de/s-fahrraeder/anzeige:angebote/preis:${minListingPrice}:${maxBuyPrice}/${encodeURIComponent(bike.query)}/k0c217+fahrraeder.type_s:(ebike%2Cmountainbike)`;
  const scrapeKleinanzeigen = async (bike) => {
    // Kategorie mają gotowy URL z filtrem Kleinanzeigen (np. type_s:mountainbike)
    // Modele/marki konkretne używają wyszukiwania po frazie + DOPIĘTEGO filtra
    // "fahrraeder.type_s:mountainbike" — to ogranicza wyniki TYLKO do ogłoszeń otagowanych
    // przez sprzedającego jako rower górski, więc np. "Giant"/"Marin"/"Norco" (marki które
    // robią też szosówki/miejskie) nie zaśmiecają wyników niezwiązanymi typami rowerów.
    // Format zweryfikowany na realnych URL-ach Kleinanzeigen: /s-fahrraeder/{fraza}/k0c217+fahrraeder.type_s:mountainbike
    const url = searchUrlFor(bike);
    // v5.12: typ "Mountainbike" ORAZ "E-Bike" — sam Mountainbike gubił wszystkie e-MTB (np. Torque:ON, Heckler)
    await kaSlot();
    if (!runningRef.current) throw new Error("zatrzymano");
    const resp = await fetch(`/api/scrape?url=${encodeURIComponent(url)}`, { signal: requestSignal(SCRAPE_TIMEOUT_MS, true) });
    if (!resp.ok) throw new Error(`Scrape HTTP ${resp.status}`);
    return resp.text();
  };

  // Kwota z tekstu. requireEuro=true wymaga znaku "€" za liczbą — chroni przed złapaniem
  // przypadkowej liczby (np. "27,5 Zoll", "-20%") gdy szukamy poza właściwym elementem ceny.
  const toPrice = (txt, requireEuro) => {
    if (!txt) return null;
    const re = requireEuro
      ? /(\d{1,3}(?:\.\d{3})+|\d+)(?:,\d{1,2})?\s*€/
      : /(\d{1,3}(?:\.\d{3})+|\d+)(?:,\d{1,2})?/;
    const m = txt.match(re);
    if (!m) return null;
    const val = parseInt(m[1].replace(/\./g, ""), 10);
    return Number.isFinite(val) && val > 0 ? val : null;
  };

  // ── Pełny opis ze strony ogłoszenia ────────────────────────────────────
  // Lista wyników ma tylko ucięty fragment opisu — pełny tekst jest wyłącznie na stronie ogłoszenia.
  // Pobieramy go TYLKO dla rowerów, które przeszły wszystkie tanie filtry i idą do analizy AI
  // (faza 2), z odstępem między zapytaniami, limitem na cykl i bezpiecznikiem na wypadek blokady.
  const DETAIL_FETCH_DELAY_MS = 4000;            // min. odstęp między stronami ogłoszeń (+ losowo do 2 s)
  const MAX_DETAIL_FETCHES_PER_CYCLE = 15;       // twardy limit pobrań na cykl; oferty ponad limit czekają w kolejce (nie są oceniane z fragmentu)
  const DESC_MAX_CHARS = 6000;                   // dłuższe opisy przycinamy (koszt tokenów) — 6000 znaków to ok. 2 tys. tokenów
  const DETAIL_BLOCK_PAUSE_MS = 30 * 60 * 1000;  // po wykryciu blokady: 30 min przerwy w pobieraniu

  // Cena na stronie ogłoszenia: element ceny → mikrodane (itemprop/meta) → JSON-LD. Wcześniej tylko #viewad-price,
  // więc zmiana układu strony wyglądała jak "cena zniknęła".
  const priceFromDetailDoc = (doc) => {
    const p1 = toPrice(doc.querySelector("#viewad-price, [id*='viewad-price']")?.textContent, false);
    if (p1 != null) return p1;
    for (const el of doc.querySelectorAll('meta[itemprop="price"], [itemprop="price"][content], meta[property="product:price:amount"]')) {
      const v = parseFloat(String(el.getAttribute("content") || "").replace(",", "."));
      if (Number.isFinite(v) && v > 0) return Math.round(v);
    }
    for (const s of doc.querySelectorAll('script[type="application/ld+json"]')) {
      try {
        const j = JSON.parse(s.textContent);
        for (const it of (Array.isArray(j) ? j : [j])) {
          const offers = Array.isArray(it?.offers) ? it.offers[0] : it?.offers;
          const v = parseFloat(String(offers?.price ?? "").replace(",", "."));
          if (Number.isFinite(v) && v > 0) return Math.round(v);
        }
      } catch {}
    }
    return null;
  };

  const fetchListingDetails = async (listing) => {
    if (!/^https:\/\/(www\.)?kleinanzeigen\.de\//.test(listing.href || "")) {
      return { ok: false, reason: "link spoza Kleinanzeigen" };
    }
    await kaSlot(); // v6.3: wspólny odstęp z wyszukiwaniami
    let resp, html;
    try {
