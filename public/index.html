      resp = await fetch(`/api/scrape?url=${encodeURIComponent(listing.href)}`, { signal: requestSignal(SCRAPE_TIMEOUT_MS, true) });
      if (resp.status === 403 || resp.status === 429) return { ok: false, blocked: true, reason: `HTTP ${resp.status}` };
      if (resp.status === 404 || resp.status === 410) return { ok: false, gone: true, reason: "ogłoszenie usunięte" };
      if (!resp.ok) return { ok: false, reason: `HTTP ${resp.status}` };
      html = await resp.text();
    } catch (e) {
      return { ok: false, reason: `błąd sieci: ${e.message}` };
    }
    const doc = new DOMParser().parseFromString(html, "text/html");

    // v5.12: usunięte ogłoszenie — Kleinanzeigen odpowiada 200 i pokazuje stronę kategorii z INNYMI ofertami
    // (ich opisy są w JSON-LD, więc wcześniej program brał opis cudzego roweru). Rozpoznajemy po braku
    // elementów strony ogłoszenia i adresie kanonicznym, który nie prowadzi do /s-anzeige/.
    const canon = doc.querySelector('link[rel="canonical"]')?.getAttribute("href") || "";
    const hasAdMarkup = !!doc.querySelector("#viewad-main, #viewad-title, #viewad-description-text");
    if (!hasAdMarkup && !/\/s-anzeige\//.test(canon)) {
      const bodyTxt = (doc.body?.textContent || "").toLowerCase();
      if (/captcha|robot|zugriff verweigert|access denied/.test(bodyTxt)) return { ok: false, blocked: true, reason: "strona blokady/captcha" };
      if (canon) return { ok: false, gone: true, reason: "ogłoszenie usunięte (Kleinanzeigen pokazuje inne oferty)" };
      return { ok: false, reason: "nie rozpoznano strony ogłoszenia" };
    }

    // Opis — warstwowo. Osobne zapytania zamiast jednej listy selektorów: querySelector z listą
    // zwraca PIERWSZY w kolejności dokumentu, a pusty <meta itemprop="description"> w <head>
    // wygrałby z właściwym opisem w treści strony.
    let desc = "";
    const descEl = doc.querySelector("#viewad-description-text") || doc.querySelector("[itemprop=description]:not(meta)");
    if (descEl) {
      descEl.querySelectorAll("br").forEach(br => br.replaceWith("\n")); // zachowaj podział linii
      desc = descEl.textContent || "";
    }
    if (!desc.trim()) {
      for (const s of doc.querySelectorAll('script[type="application/ld+json"]')) {
        try {
          const j = JSON.parse(s.textContent);
          for (const it of (Array.isArray(j) ? j : [j])) {
            if (typeof it?.description === "string" && it.description.length > desc.length) desc = it.description;
          }
        } catch {}
      }
    }
    if (!desc.trim()) desc = doc.querySelector('meta[itemprop="description"]')?.getAttribute("content") || "";
    desc = desc.replace(/[ \t]+/g, " ").replace(/\n\s*\n\s*\n+/g, "\n\n").trim();

    if (!desc) {
      // Sygnały blokady/usunięcia sprawdzamy TYLKO gdy nie ma opisu — inaczej słowo "robot"
      // albo "gelöscht" w treści zwykłego ogłoszenia dałoby fałszywy alarm.
      const bodyText = (doc.body?.textContent || "").toLowerCase();
      if (/captcha|robot|zugriff verweigert|access denied/.test(bodyText)) {
        return { ok: false, blocked: true, reason: "strona blokady/captcha" };
      }
      if (/nicht mehr verfügbar|wurde gelöscht|anzeige ist abgelaufen/.test(bodyText)) {
        return { ok: false, gone: true, reason: "ogłoszenie usunięte" };
      }
      return { ok: false, reason: "nie znaleziono opisu na stronie", doc };
    }

    return {
      ok: true,
      desc: desc.length > DESC_MAX_CHARS ? desc.slice(0, DESC_MAX_CHARS) + "…" : desc,
      truncated: desc.length > DESC_MAX_CHARS,
      fullLength: desc.length,
      price: priceFromDetailDoc(doc),
      images: extractListingImages(doc),
      // v6.1: tytuł ze strony (porównanie zaległych okazji) i numer sprzedawcy (wykrywanie duplikatów)
      title: (doc.querySelector("#viewad-title")?.textContent || "").replace(/\s+/g, " ").trim(),
      sellerId: sellerIdFromDoc(doc),
    };
  };
  // v6.1: numer sprzedawcy z bloku kontaktu — link „wszystkie ogłoszenia” /s-bestandsliste.html?userId=NNN
  const sellerIdFromDoc = (doc) => {
    const a = doc.querySelector('#viewad-contact a[href*="userId="]') || doc.querySelector('a[href*="s-bestandsliste.html?userId="]');
    const m = String(a?.getAttribute("href") || "").match(/userId=(\d+)/);
    return m ? m[1] : null;
  };

  // ── Zdjęcia z galerii ogłoszenia ───────────────────────────────────────
  // Adresy typu https://img.kleinanzeigen.de/api/v1/prod-ads/images/<xx>/<uuid>?rule=$_59.AUTO
  // (galeria) albo ?rule=$_1.AUTO (miniatury). Ujednolicamy do "$_59.JPG" — ten sam rozmiar co
  // galeria na stronie, zawsze JPEG (format "AUTO" bywa WebP/AVIF zależnie od przeglądarki).
  // Kolejność = kolejność w galerii (pierwsze zdjęcie zwykle pokazuje cały rower).
  // Najpierw og:image (= pierwsze zdjęcie galerii) i galeria; dopiero gdy galerii nie znaleziono
  // (Kleinanzeigen zmienił układ strony) — wszystkie <img> z adresem zdjęcia ogłoszenia.
  const IMG_RE = /^https:\/\/img\.kleinanzeigen\.de\/api\/v1\/prod-ads\/images\/[0-9a-f]{2}\/[0-9a-f-]{36}/i;
  const extractListingImages = (doc) => {
    const out = [];
    const add = (u) => {
      const m = String(u || "").trim().match(IMG_RE);
      if (!m) return;
      const url = `${m[0]}?rule=$_59.JPG`;
      if (!out.includes(url)) out.push(url);
    };
    const fromImg = (img) => { add(img.getAttribute("src")); add(img.getAttribute("data-imgsrc")); add(img.getAttribute("data-src")); };
    add(doc.querySelector('meta[property="og:image"]')?.getAttribute("content"));
    // Tylko kontenery galerii TEGO ogłoszenia — nigdy wszystkie <img> ze strony (polecane oferty, reklamy).
    doc.querySelectorAll([
      ".galleryimage-element img", "#viewad-image", "#viewad-thumbnail-list img", ".galleryimage-large img",
      "#viewad-gallery img", "[data-testid*='gallery'] img", "[class*='gallery'] img", "[id*='gallery'] img",
    ].join(", ")).forEach(img => { if (!img.closest("[class*='recommend'], [class*='similar'], [id*='recommend'], aside, article.aditem")) fromImg(img); });
    return out.slice(0, MAX_PHOTOS_ALL);
  };

  // ── HTML parser ────────────────────────────────────────────────────────
  const parseListings = (html, bikeLabel) => {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");
    const items = [];

    // v6.4 (B3): blokadę/captchę rozpoznajemy dopiero na stronie BEZ żadnej karty ogłoszenia (niżej) — wcześniej słowo
    // „robot” w treści karty („Mähroboter”, „Saugroboter”) dawało fałszywą captchę i 20 min przerwy
    const bodyText = doc.body?.innerText || doc.body?.textContent || "";

    // Próbuj różne selektory — Kleinanzeigen zmienia strukturę
    const articles = doc.querySelectorAll("article.aditem, li.aditem, [data-adid], .ad-listitem");

    let firstNoPriceArticle = null; // do diagnostyki, gdy parser przestaje znajdować ceny

    articles.forEach(article => {
      // Link i ID — najważniejsze
      const linkEl = article.querySelector("a[href*='/s-anzeige/'], a[href*='/anzeige/']");
      if (!linkEl) return;
      const href = linkEl.getAttribute("href").startsWith("http")
        ? linkEl.getAttribute("href")
        : "https://www.kleinanzeigen.de" + linkEl.getAttribute("href");

      // Numer ogłoszenia z linku (…/<numer>-217-<miejsce>), awaryjnie z data-adid karty, dopiero potem cały link
      const adid = article.getAttribute("data-adid") || "";
      const listingId = listingIdFromHref(href) || (/^\d{6,12}$/.test(adid) ? adid : null) || href;

      // ── Układ strony: od ~09.2026 Kleinanzeigen serwuje wyniki w nowym układzie (Astro/Tailwind):
      // karta = article[data-adid], tytuł = h3, opis = <p> zaraz za h3, cena = p.text-title3
      // (pierwsza = aktualna; przekreślona stara cena po obniżce jest pomijana). Stary układ
      // (aditem-main--*) zostaje jako PIERWSZY wybór — na wypadek, gdyby część stron była po staremu.
      const jsonLd = (() => {
        for (const sc of article.querySelectorAll('script[type="application/ld+json"]')) {
          try { const j = JSON.parse(sc.textContent); if (j && typeof j === "object") return j; } catch {}
        }
        return null;
      })();
      // Przekreślona (stara) cena — pomijamy przy szukaniu aktualnej
      const isStruck = (el) => !!el.closest("del, s, [class*=line-through], [class*=strike]");

      // Tytuł: h3 (nowy układ) → stare selektory → JSON-LD karty
      const titleEl = article.querySelector("h3")
        || article.querySelector("h2, .ellipsis, .aditem-main--middle--headline, [class*=headline]");
      const title = titleEl?.textContent?.trim() || jsonLd?.title?.trim() || linkEl.textContent.trim();
      if (!title) return;

      // Cena — od najpewniejszego źródła:
      // 1) stara, znana klasa elementu ceny
      let price = toPrice(article.querySelector(".aditem-main--middle--price-shipping--price")?.textContent, false);
      // 2) nowy układ: pierwszy NIEprzekreślony p.text-title3 (tekst musi wyglądać na cenę)
      if (price == null) {
        for (const el of article.querySelectorAll("p.text-title3")) {
          if (isStruck(el)) continue;
          const t = el.textContent || "";
          if (/€|VB|verschenken/i.test(t)) { price = toPrice(t, false); break; }
        }
      }
      // 3) dowolny element z "price" w klasie, zawierający kwotę z "€"
      if (price == null) {
        for (const el of article.querySelectorAll("[class*=price]")) {
          if (isStruck(el)) continue;
          price = toPrice(el.textContent, true);
          if (price != null) break;
        }
      }
      // 4) element, którego CAŁY tekst to cena (np. "1.550 € VB") — niezależny od nazw klas.
      //    Celowo NIE przeszukujemy całego tekstu karty: w opisie i w ukrytym bloku danych (JSON-LD)
      //    bywają inne kwoty, np. "Neupreis 3.000 €", które dałyby fałszywą cenę.
      if (price == null) {
        for (const el of article.querySelectorAll("p, span, div, strong, b")) {
          if (el.closest("script, style") || isStruck(el)) continue;
          const t = (el.textContent || "").trim();
          if (/^(\d{1,3}(?:\.\d{3})+|\d+)(?:,\d{1,2})?\s*€(?:\s*VB)?$/.test(t)) { price = toPrice(t, true); break; }
        }
      }
      if (price == null && !firstNoPriceArticle) firstNoPriceArticle = article;

      // Opis: stara klasa → <p> zaraz za tytułem (nowy układ, ale nie element ceny) → JSON-LD karty
      let descEl = article.querySelector("[class*=description], .aditem-main--middle--description");
      if (!descEl) {
        const afterTitle = article.querySelector("h3 + p");
        if (afterTitle && !afterTitle.matches(".text-title3")) descEl = afterTitle;
      }
      // v5.12: <p> na karcie to ok. 100 znaków, JSON-LD karty ma ok. 300 — Groq dostaje dłuższy fragment
      const descShort = descEl?.textContent?.trim() || "";
      const descLd = typeof jsonLd?.description === "string" ? jsonLd.description.trim() : "";
      const desc = descLd.length > descShort.replace(/(\.\.\.|…)\s*$/, "").length ? descLd : descShort;
      const locEl  = article.querySelector("[class*=locality], [class*=location], .aditem-main--top--left");

      items.push({
        listingId, title, price, href,
        desc,
        // v5.14: nowy układ — lokalizacja to <span> „51570 Windeck” (kod pocztowy + miasto), bez nazwy klasy
        location: locEl?.textContent?.trim()
          || [...article.querySelectorAll("span")].map(e => (e.textContent || "").replace(/\s+/g, " ").trim()).find(t => /^\d{5}\s+\S/.test(t) && t.length <= 60)
          || "",
        bike:     bikeLabel,
        postedAt: parseCardDate(article, jsonLd), // data dodania z karty (Heute/Gestern/dd.mm.rrrr) albo null
      });
    });

    // Diagnostyka: większość sprzedających podaje cenę, więc gdy połowa+ ogłoszeń jej "nie ma",
    // to najpewniej parser nie pasuje do aktualnego HTML-a Kleinanzeigen.
    const noPriceCount = items.filter(i => i.price == null).length;
    if (items.length >= 4 && noPriceCount / items.length >= 0.5) {
      items.priceParseBroken = true; // v5.11: takie wyszukiwanie pomijamy w tym cyklu — inaczej wszystko odpadłoby jako "brak ceny"
      addLog(`⚠️ Parser: ${noPriceCount}/${items.length} ogłoszeń bez odczytanej ceny (${bikeLabel}) — możliwa zmiana HTML Kleinanzeigen`, "error");
      if (firstNoPriceArticle && !priceDiagLoggedRef.current) {
        priceDiagLoggedRef.current = true;
        // Najkrótsze elementy z "€" (z tagiem i klasami) + tekst karty BEZ skryptów — to wystarczy,
        // żeby dopasować parser do nowego układu.
        const euroEls = [...firstNoPriceArticle.querySelectorAll("*")]
          .filter(el => el.children.length === 0 && !el.closest("script, style") && /€/.test(el.textContent || ""))
          .slice(0, 5)
          .map(el => `${el.tagName.toLowerCase()}.${(el.getAttribute("class") || "").trim().split(/\s+/).join(".")}="${(el.textContent || "").trim().slice(0, 30)}"`);
        const clean = firstNoPriceArticle.cloneNode(true);
        clean.querySelectorAll("script, style").forEach(n => n.remove());
        const cardText = (clean.textContent || "").replace(/\s+/g, " ").trim().slice(0, 300);
        addLog(`🔍 Diagnostyka ceny (skopiuj to do czatu): elementy z € = [${euroEls.join(" | ") || "brak"}] · tekst="${cardText}"`, "error");
      }
    }

    if (items.length === 0 && doc.querySelectorAll("article[data-adid], article.aditem, li.ad-listitem").length === 0
      && (/captcha|robot|blocked/.test(bodyText) || /zugriff verweigert|access denied/i.test(bodyText))) {

• rocznik — rok modelowy. Opis go podaje (Baujahr/Bj./Modelljahr/MY) → "podany". Jeśli nie, OSZACUJ z nazwy i generacji modelu oraz osprzętu → "oszacowany": użyj części ogólnej bazy (ROZPOZNAWANIE ROCZNIKA — daty wprowadzenia podzespołów) i bike checków modelu we wpisach marki — porównaj osprzęt z opisu z seryjnym osprzętem kolejnych roczników. Dodatkowe wskazówki: koła 26" w enduro/trail = zwykle do 2014–2016 (wyjątek: dirt jump, gdzie 26" to standard do dziś); 650B/27,5" opisywane jako nowość albo cytowany test z tamtych lat = ok. 2014-2016; Fox CTD = 2013-2015; oś Boost = od ok. 2016. Gdy pasuje kilka lat — wpisz najstarszy pasujący, ALE gdy pasujący przedział obejmuje zarówno lata sprzed ${MIN_BIKE_YEAR}, jak i ${MIN_BIKE_YEAR} lub późniejsze — wpisz ${MIN_BIKE_YEAR} (cenę i tak licz z najniższego pasma); rocznik sprzed ${MIN_BIKE_YEAR} wpisuj tylko wtedy, gdy rower na pewno jest starszy. "Jak nowy"/"neuwertig" NIE mówi nic o roczniku — stary rower też bywa zadbany. Gdy naprawdę nie masz żadnych przesłanek → null i "brak". Brak rocznika w ogłoszeniu to norma (podaje go mało kto) — sam w sobie NIE jest powodem do "niepewne".
• PRZEDNIA PRZERZUTKA = ROWER STARY: przednia przerzutka (niem. „Umwerfer”) albo 2–3 tarcze przy korbie (np. 2x10, 2x11, 3x9, „2-fach”, „3-fach”, korba 36/26) w fullu albo e-MTB — widoczne na zdjęciu albo podane w opisie — oznacza rower sprzed ${MIN_BIKE_YEAR}: wpisz rocznik "oszacowany" najpóźniej ${MIN_BIKE_YEAR - 1} (zakres kończący się najpóźniej na ${MIN_BIKE_YEAR - 1}). Wyjątek TYLKO z dowodem w tytule/opisie: rocznik ${MIN_BIKE_YEAR}+ PODANY w ogłoszeniu (wygrywa podany) albo — przy modelach, które według bike checków w bazie miały seryjnie 2x także później (np. Trek Fuel EX 9.8 2017–2018 z XT 2x11) — wprost napisane cechy nowszej ramy (np. „Boost”, „130 mm”). Ze zdjęcia nowszej ramy nie rozpoznasz — bez dowodu w opisie przednia przerzutka = rower sprzed ${MIN_BIKE_YEAR}, także w Fuel EX 9.8. Przeróbka napędu na 1x nie odmładza ramy.
• e_bike — true, jeśli rower ma silnik i akumulator (Wh, Motor, Fazua, Bosch, Shimano Steps/EP, Brose, Yamaha, TQ).
• sprzedawca — "sklep" (Onlineshop, Lieferzeit, MwSt, wiele dostępnych rozmiarów, sklepowe warunki sprzedaży), "prywatny" albo "nieznany".
• stan — "nowy" (nieużywany, np. ze sklepu), "jak_nowy", "uzywany" albo "uszkodzony".
• cena_nowego_eur — cena nowego roweru podana w opisie (Neupreis/NP/UVP/"kostete neu"), w euro; brak → null.
• kompletny_rower — false tylko wtedy, gdy sprzedawana jest sama rama/część.

    // ── Dynamiczna część promptu — TYLKO to zmienia się między wywołaniami. Gdy mamy aktywny
    // explicit cache dla staticPrefix (patrz niżej), wysyłamy do Gemini WYŁĄCZNIE ten fragment
    // jako "contents", a cache pokrywa całą resztę (persona/cennik/reguły/schemat JSON powyżej).
    let dynamicSuffix = `${kbSection}
${typeHint}
=== OGŁOSZENIE DO OCENY ===
Tytuł: ${listing.title}
Cena z ogłoszenia: ${listing.price != null ? listing.price + "€" : "BRAK CENY"}
Minimalny zysk dla tej ceny zakupu: ${minProfitFor(listing.price)}% ceny zakupu, po odjęciu transportu (progi: ${tiersTxt()})
${frameTextLine}
Lokalizacja: ${listing.location}
${listing.fullDesc
  ? `Opis (PEŁNY, ze strony ogłoszenia${listing.fullDescTruncated ? ` — bardzo długi, przycięty do ${DESC_MAX_CHARS} znaków` : ""} — główne źródło informacji o stanie, osprzęcie i roczniku):\n${listing.fullDesc}`
  : `Opis (tylko krótki fragment z listy wyników — pełny opis był niedostępny): ${listing.desc}`}
Model/kategoria wyszukiwania: ${listing.bike}

Przeanalizuj to ogłoszenie i odpowiedz w formacie JSON dokładnie wg schematu podanego wyżej (nic poza JSON).`;

    // v5.14: AI rozpoznało dirta, którego wcześniej nikt nie rozpoznał → do dalszych analiz dołączamy wpis bazy o dirtach

    const addDirtKb = () => {
      if (kbIds.includes("dirt")) return;
      kbIds = ["dirt", ...kbIds];
      const next = buildKbSection(kbIds);
      dynamicSuffix = next + dynamicSuffix.slice(kbSection.length);
      kbSection = next;

    addLog(`🤖 ${provider === "groq" ? "Groq" : aiName(geminiModel)} (etap 2): analizuję — ${listing.title}${listing.price != null ? ` za ${listing.price}€` : ""} | typ z etapu 1: ${groqType} | baza: ${kbIds.length > 0 ? kbChunkNames(kbIds) : "tylko część ogólna"}`, "info");

    // ── Explicit context cache — spróbuj dostać nazwę cache dla tego modelu+wariantu staticPrefix.
    // Zwraca null gdy: cache się nie udało utworzyć (np. za mało tokenów wg progu Google — patrz
    // komentarz w api/gemini.js), jesteśmy w cooldownie po ostatniej nieudanej próbie, albo trwa
    // właśnie tworzenie. W KAŻDYM z tych przypadków po prostu wysyłamy PEŁNY prompt jak dotychczas —
    // zero regresji funkcjonalnej, cache to czysta optymalizacja kosztu.
    const cacheKey = `${geminiModel}|${hashStr(geminiKey)}|${hashStr(staticPrefix)}`;
    const getCachedContentName = async () => {
      if (provider === "groq" || isClaudeModel(geminiModel)) return null; // explicit cache tylko Gemini (Claude: znacznik cache w zapytaniu)
      const now = Date.now();
      const existing = cacheMapRef.current[cacheKey];
      if (existing && existing.expiresAt > now) return existing.name;

      const cooldownUntil = cacheFailCooldownRef.current[cacheKey];
      if (cooldownUntil && cooldownUntil > now) return null;
      const cachePr = GEMINI_PRICES[geminiModel] || GEMINI_PRICE_FALLBACK;
      if (!budgetAllows(Math.round(staticPrefix.length / 3) * (cachePr.in + cachePr.storage) / 1e6)) return null;

      try {
        const ttlSeconds = 3300; // 55 min
        const data = await callProxy({
          action: "createCache",
          provider: "gemini",
          model: geminiModel,
          apiKey: geminiKey,
          messages: [{ role: "user", parts: [{ text: staticPrefix }] }],
          ttlSeconds,
        }, { session: true });
        if (data?.error || !data?.name) {
          // Najczęstsza przyczyna: staticPrefix poniżej minimalnego progu tokenów dla explicit

          cacheFailCooldownRef.current[cacheKey] = now + 10 * 60 * 1000;
          return null;

          expiresAt: now + (ttlSeconds - 120) * 1000, // margines bezpieczeństwa 2 min przed realnym wygaśnięciem

    const attemptAnalysis = async (overrides, opts = {}) => {

            try {
              parsed = JSON.parse(fixed);
              addLog(`🩹 ${aiName(modelForCall || geminiModel)}: naprawiono składnię JSON w odpowiedzi (${e1.message.slice(0, 80)}) — ${listing.title}`, "info");
            } catch {
              const err = new Error(e1.message);
              err.badJson = !/unterminated string|unexpected end of json/i.test(e1.message); // ucięty JSON obsługuje osobna ścieżka niżej
              throw err;
            }
          }

          // ── KROK 1: FAKTY — normalizacja. Na nich opierają się twarde reguły niżej: liczy je program,
          // a nie model, bo modele dużo pewniej wyciągają pojedyncze fakty, niż oceniają całość naraz.
          const f = (parsed.fakty && typeof parsed.fakty === "object") ? parsed.fakty : {};
          const toNum = (v) => typeof v === "number" && Number.isFinite(v) ? v
            : (typeof v === "string" && /^\s*\d+([.,]\d+)?\s*$/.test(v) ? parseFloat(v.replace(",", ".")) : null);
          let rocznik = toNum(f.rocznik);
          if (rocznik != null && (rocznik < 1980 || rocznik > new Date().getFullYear() + 1)) rocznik = null;
          if (rocznik != null) rocznik = Math.round(rocznik);
          const rocznikZrodlo = rocznik == null ? "brak" : (f.rocznik_zrodlo === "podany" ? "podany" : "oszacowany");
          const zakresM = typeof f.rocznik_zakres === "string" ? f.rocznik_zakres.match(/^\s*(\d{4})\s*[–-]\s*(\d{4})\s*$/) : null;
          // v6.4 (B7): oszacowany rocznik z zakresem sięgającym ${MIN_BIKE_YEAR}+ (np. 2016, zakres 2016–2019) = ${MIN_BIKE_YEAR}
          // — tak każe prompt (KROK 1), ale model czasem wpisuje najstarszy rok; bez tego dobry rower szedł do „stary”
          if (rocznikZrodlo === "oszacowany" && rocznik != null && rocznik < MIN_BIKE_YEAR && zakresM && +zakresM[1] <= +zakresM[2] && +zakresM[2] >= MIN_BIKE_YEAR) {
            addLog(`ℹ️ Oszacowany rocznik ${rocznik}, ale zakres ${zakresM[1]}–${zakresM[2]} sięga ${MIN_BIKE_YEAR} — liczę ${MIN_BIKE_YEAR} (zasada z promptu) — ${listing.title}`, "info");
            rocznik = MIN_BIKE_YEAR;
          }
          const fakty = {
            rocznik, rocznik_zrodlo: rocznikZrodlo,
            rocznik_zakres: rocznikZrodlo === "oszacowany" && zakresM && +zakresM[1] <= +zakresM[2]
              ? (zakresM[1] === zakresM[2] ? zakresM[1] : `${zakresM[1]}–${zakresM[2]}`) : null,
            e_bike: f.e_bike === true,
            sprzedawca: ["prywatny", "sklep"].includes(f.sprzedawca) ? f.sprzedawca : "nieznany",
            stan: ["nowy", "jak_nowy", "uzywany", "uszkodzony"].includes(f.stan) ? f.stan : null,
            cena_nowego_eur: (() => { const v = toNum(f.cena_nowego_eur); return v != null && v > 200 ? v : null; })(),
            kompletny_rower: f.kompletny_rower !== false,
          };
          parsed.fakty = fakty;

          // Typ: zaufany z Etapu 1 albo z odpowiedzi Gemini. Rower z silnikiem nie jest zwykłym full/dirt.
          // Gdy AI (np. po obejrzeniu zdjęć) widzi inny typ niż Groq — zapamiętujemy sprzeczność; okazja z taką
          // sprzecznością nie idzie jako "tak", tylko do ręcznego sprawdzenia (niżej).
          const modelTyp = ["full", "dirt", "elektryk_gorski", "inny"].includes(parsed.typ_roweru) ? parsed.typ_roweru : null;
          const typeConflict = typeIsTrusted && modelTyp != null && modelTyp !== groqType && !(modelTyp === "elektryk_gorski" && f.e_bike === true);
          // v5.11: przy sprzeczności Groq vs AI przyjmujemy typ od AI (widzi pełny opis i zdjęcia); okazja i tak przechodzi weryfikację
          let typ = typeIsTrusted
            ? (typeConflict ? modelTyp : groqType)
            : (["full", "dirt", "elektryk_gorski"].includes(parsed.typ_roweru) ? parsed.typ_roweru : "inny");
          if (typeConflict) addLog(`ℹ️ Sprzeczne rozpoznanie typu: Etap 1 (Groq) „${groqType}”, analiza AI${images ? " ze zdjęciami" : ""} „${modelTyp}” — przyjmuję typ od AI — ${listing.title}`, "info");
          if (fakty.e_bike && (typ === "full" || typ === "dirt")) {
            addLog(`⚡ Gemini: z opisu wynika e-bike — zmieniam typ "${typ}" na "elektryk_gorski" — ${listing.title}`, "info");
            typ = "elektryk_gorski";
          }
          parsed.typ_roweru = typ;

          parsed.decyzja = ["tak", "nie", "niepewne"].includes(parsed.decyzja) ? parsed.decyzja : "nie";
          const rawUncertainCat = parsed.niepewne_kategoria;
          parsed.niepewne_kategoria = UNCERTAIN_LABELS[parsed.niepewne_kategoria] ? parsed.niepewne_kategoria : null;
          if (typeof parsed.powod_decyzji === "string") parsed.powod_decyzji = parsed.powod_decyzji.trim().slice(0, 220);
          const markUncertain = (kat, powod) => { parsed.decyzja = "niepewne"; parsed.niepewne_kategoria = kat; parsed.powod_decyzji = powod; };

          // ── v5.13: WIDELEC — model + źródło (napis / opis / wygląd / nieznany) ──
          parsed.widelec = normalizeFork(parsed.widelec);

          // ── TWARDE ODRZUCENIA Z FAKTÓW (kolejność = priorytet komunikatu) ──
          parsed.odrzucenie = !fakty.kompletny_rower ? "czesc"
            : (typ === "dirt" && parsed.widelec.sztywny) ? "sztywny"
            // v5.14: w dircie tylko rocznik PODANY w ogłoszeniu (oszacowany rocznik dirta bywa losowy — 26" i proste ramy to tam norma)
            : (rocznik != null && rocznik < MIN_BIKE_YEAR && !(typ === "dirt" && rocznikZrodlo !== "podany")) ? "stary"
            : (typ === "elektryk_gorski" && excludeElektryk) ? "ebike"
            : (fakty.sprzedawca === "sklep" && fakty.stan === "nowy") ? "sklep"
            : null;
          if (typ === "inny" || parsed.odrzucenie) parsed.decyzja = "nie";

          // ── CENA ZAKUPU = CENA Z OGŁOSZENIA, nie to, co "odczytało" Gemini ──
          // Parser zna prawdziwą cenę z Kleinanzeigen; model potrafi ją źle przepisać (np. wziąć
          // "Neupreis" albo inną liczbę z opisu). Cała matematyka zysku niżej liczy się od ceny z ogłoszenia.
          if (listing.price != null) {
            if (typeof parsed.cena_zakupu_eur === "number" && Math.abs(parsed.cena_zakupu_eur - listing.price) > 1) {
              addLog(`⚠️ Gemini podał cenę zakupu ${parsed.cena_zakupu_eur}€, a ogłoszenie ma ${listing.price}€ — liczę od ceny z ogłoszenia — ${listing.title}`, "error");
            }
            parsed.cena_zakupu_eur = listing.price;
          }
          const cenaNum = typeof parsed.cena_zakupu_eur === "number" ? parsed.cena_zakupu_eur : null;
          const progZysku = minProfitFor(cenaNum ?? listing.price); // v6: próg zależny od ceny zakupu
          let sprzedazNum = toNum(parsed.szacowana_sprzedaz_eur);

          // ── v6.5: MATERIAŁ RAMY — tekst ogłoszenia > czytelny napis na ramie > wygląd. Tekst „alu” wygrywa z oceną AI;
          // karbon z samego wyglądu zostaje karbonem, ale z ostrzeżeniem i zyskiem w wersji alu (niżej).
          const ramaAi = normalizeFrame(parsed.rama);
          const fr = resolveFrameMaterial(frameText, ramaAi, sprzedazNum);
          let sprzedazKarbon = null;
          if (fr.priceAsAlu && !parsed.odrzucenie && typ !== "inny") {
            sprzedazKarbon = sprzedazNum;
            const viaFactor = ramaAi.sprzedaz_alu_eur == null || ramaAi.sprzedaz_alu_eur >= sprzedazNum;
            addLog(`🧱 ${aiName(modelForCall || geminiModel)}: wycena jak karbon (${FRAME_SOURCE_LABELS[ramaAi.zrodlo] || ramaAi.zrodlo}${ramaAi.dowod ? `: ${ramaAi.dowod}` : ""}), ale ${fr.source === "tekst" ? `tekst ogłoszenia mówi „${fr.final}” (${frameText.evidence})` : "napis przeczy tekstowi"} — liczę wersję alu: ${sprzedazNum}€ → ${fr.saleAlu}€${viaFactor ? ` (${Math.round(FRAME_ALU_FACTOR * 100)}% wyceny karbonu)` : ""} — ${listing.title}`, "info");
            sprzedazNum = fr.saleAlu;
          }
          parsed.rama = { material: fr.final, zrodlo: fr.source, dowod: ramaAi.dowod,
            ...(fr.possibleCarbon ? { possibleCarbon: true, ...(fr.saleAlu != null ? { sprzedaz_alu_eur: fr.saleAlu } : {}) } : {}),
            ...(sprzedazKarbon != null ? { sprzedaz_karbon_eur: sprzedazKarbon } : {}) };

          // ── "CENA NOWEGO" Z OPISU: regex (pewniejszy) albo fakt od modelu ──
          // Pomijamy kwoty opisane przy podzespole ("neue Gabel, Neupreis 1.000 €") i kwoty niższe od ceny
          // zakupu (cena nowego CAŁEGO roweru nie bywa niższa od ceny używanego). Z kilku kwot — najwyższa.
          const extractNewPriceFromDesc = (text, askPrice) => {
            if (!text) return null;
            const patterns = [
              /neupreis\D{0,15}?(\d[\d.,]*)\s*€/i,
              /\bNP\.?\s*:?\s*(\d[\d.,]*)\s*€/,          // "NP 3.900,00 €" — celowo bez /i (małe "np." to polskie "na przykład")
              /\buvp\D{0,15}?(\d[\d.,]*)\s*€/i,
              /listenpreis\D{0,15}?(\d[\d.,]*)\s*€/i,
              /original\w*\s*(?:verkaufs|kauf)?preis\w*\D{0,15}?(\d[\d.,]*)\s*€/i,
              /verkaufspreis\s+betrug\D{0,15}?(\d[\d.,]*)\s*€/i,
              /kostete\s+neu\D{0,15}?(\d[\d.,]*)\s*€/i,
              /neu\s+f[üu]r\D{0,10}?(\d[\d.,]*)\s*€/i,
              /cena\s+nowego\D{0,15}?(\d[\d.,]*)\s*(?:€|eur)/i,
              /nowy\D{0,10}?(\d[\d.,]*)\s*(?:€|eur)/i,
            ];
            const found = [];
            for (const re of patterns) {
              for (const m of text.matchAll(new RegExp(re.source, re.flags.includes("g") ? re.flags : re.flags + "g"))) {
                const num = parseFloat(m[1].replace(/\./g, "").replace(",", "."));
                if (!Number.isFinite(num) || num <= 200) continue;           // przypadkowe małe liczby
                if (askPrice != null && num <= askPrice) continue;            // niższa od ceny zakupu → raczej część
                if (numberContext(text, m.index) === "component") continue;  // kwota przy podzespole
                found.push(num);
              }
            }
            return found.length > 0 ? Math.max(...found) : null;
          };
          const descNewPrice = extractNewPriceFromDesc(`${listing.title || ""}\n${listing.fullDesc || listing.desc || ""}`, listing.price);
          const modelNewPrice = fakty.cena_nowego_eur != null && (listing.price == null || fakty.cena_nowego_eur > listing.price) ? fakty.cena_nowego_eur : null;
          const newPrice = descNewPrice ?? modelNewPrice;

          // ── LIMIT WG WIEKU: używany rower nie sprzeda się drożej niż określony % ceny nowego ──
          let capped = false;
          if (newPrice != null && rocznik != null && sprzedazNum != null) {
            const age = Math.max(0, new Date().getFullYear() - rocznik);
            const cap = Math.round(newPrice * ageCapFactor(age));
            if (sprzedazNum > cap) {
              addLog(`📐 Gemini: szacunek sprzedaży ${sprzedazNum}€ ponad limit dla roweru w wieku ${age} lat (${Math.round(ageCapFactor(age) * 100)}% ceny nowego ${newPrice}€ = ${cap}€) — przycinam — ${listing.title}`, "info");
              sprzedazNum = cap;
              capped = true;
            }
          } else if (newPrice != null && rocznik == null && sprzedazNum != null) {
            const cap = Math.round(newPrice * UNKNOWN_YEAR_CAP);
            if (sprzedazNum > cap) {
              addLog(`📐 Gemini: rocznik nieznany — szacunek ${sprzedazNum}€ ponad ${Math.round(UNKNOWN_YEAR_CAP * 100)}% ceny nowego z opisu (${newPrice}€ → ${cap}€) — przycinam — ${listing.title}`, "info");
              sprzedazNum = cap;
              capped = true;
            }
          }
          parsed.szacowana_sprzedaz_eur = sprzedazNum;

          // ── ZYSK LICZY PROGRAM, nie model (modele potrafią podać niespójne trzy liczby) ──
          // Zysk = sprzedaż − zakup − transport (Ustawienia → Strategia). Gdy model zapomniał o transporcie albo
          // odjął go sam — po prostu liczymy po swojemu; komunikat tylko przy liczbach niepasujących do żadnego wzoru.
          const transport = Math.max(0, Number(transportCostEur) || 0);
          const zyskLiczony = (cenaNum != null && sprzedazNum != null) ? Math.round((sprzedazNum - cenaNum - transport) * 100) / 100 : null;
          if (!capped && zyskLiczony != null && typeof parsed.przewidywany_zysk === "number"
            && Math.abs(zyskLiczony - parsed.przewidywany_zysk) > 1 && Math.abs(zyskLiczony + transport - parsed.przewidywany_zysk) > 1) {
            addLog(`⚠️ ${aiName(modelForCall || geminiModel)}: niespójna matematyka — podał zysk ${parsed.przewidywany_zysk}€ przy zakupie ${cenaNum}€ / sprzedaży ${sprzedazNum}€ / transporcie ${transport}€ (powinno być ${zyskLiczony}€) — liczę po swojemu — ${listing.title}`, "info");
          }
          parsed.przewidywany_zysk = zyskLiczony;
          parsed.transport_eur = transport;

          // ── Brak rocznika sam w sobie NIE jest powodem do "niepewne" ──
          // Gdy model i tak tak odpowie, a podał liczby — decyzję liczymy z liczb (każde "tak" i tak
          // przechodzi potem weryfikację). Bez liczb — to po prostu za mało informacji w opisie.
          if (parsed.decyzja === "niepewne" && rawUncertainCat === "brak_rocznika") {
            if (cenaNum != null && cenaNum > 0 && zyskLiczony != null) {
              parsed.decyzja = (zyskLiczony / cenaNum) * 100 >= progZysku ? "tak" : "nie";
              addLog(`ℹ️ Gemini: "niepewne" tylko z powodu braku rocznika — decyduję z liczb: "${parsed.decyzja}" — ${listing.title}`, "info");
            } else {
              parsed.niepewne_kategoria = "za_malo_opisu";
            }
          }

          // ── v5.12: "NIEPEWNE" tylko dlatego, że wyszło blisko progu — liczby są kompletne, zysk < próg → "nie"
          // (dzięki temu oferta trafia do "na granicy" z propozycją ceny, a nie do listy niepewnych)
          if (parsed.decyzja === "niepewne" && (!parsed.niepewne_kategoria || parsed.niepewne_kategoria === "inne") && !parsed.odrzucenie
            && typ !== "inny" && cenaNum > 0 && zyskLiczony != null && (zyskLiczony / cenaNum) * 100 < progZysku) {
            addLog(`ℹ️ ${aiName(modelForCall || geminiModel)}: "niepewne", ale liczby są kompletne — zysk ${((zyskLiczony / cenaNum) * 100).toFixed(1)}% < próg ${progZysku}% → "nie" (sprawdzę „na granicy”) — ${listing.title}`, "info");
            parsed.decyzja = "nie";
            parsed.niepewne_kategoria = null;
          }

          // ── v6.4: "NIEPEWNE" tylko dlatego, że zysk wyszedł TUŻ NAD progiem (liczby kompletne, bez twardego powodu) —
          // w pierwszej analizie → "tak", czyli weryfikacja mocniejszym modelem ze wszystkimi zdjęciami (wcześniej taka oferta
          // szła do listy niepewnych bez weryfikacji, choć oferta tuż POD progiem dostawała „na granicy” z propozycją ceny).
          // U weryfikatora zostaje „niepewne” — niech oceni człowiek.
          if (parsed.decyzja === "niepewne" && !opts.verify && (!parsed.niepewne_kategoria || parsed.niepewne_kategoria === "inne") && !parsed.odrzucenie
            && typ !== "inny" && cenaNum > 0 && sprzedazNum != null && zyskLiczony != null && (zyskLiczony / cenaNum) * 100 >= progZysku
            // tylko „tuż nad progiem” (do 10 pp nad progiem albo powód mówi o progu) — inne wątpliwości (np. możliwe
            // uszkodzenie przy dużym zysku) idą jak dawniej: najpierw tańsza dokładna analiza ze wszystkimi zdjęciami
            && ((zyskLiczony / cenaNum) * 100 < progZysku + 10 || /próg|progu|blisko|tuż nad/i.test(String(parsed.powod_decyzji || "")))) {
            addLog(`ℹ️ ${aiName(modelForCall || geminiModel)}: "niepewne" tuż nad progiem — zysk ${((zyskLiczony / cenaNum) * 100).toFixed(1)}% ≥ próg ${progZysku}% → "tak", sprawdzi weryfikacja — ${listing.title}`, "info");
            parsed.decyzja = "tak";
            parsed.niepewne_kategoria = null;
          }

          // ── "NIE" przy zysku ≥ progu (bez twardego powodu): liczby decydują. W pierwszej analizie → "tak" (sprawdzi
          // weryfikacja); u weryfikatora → do niepewnych (sam sobie przeczy — niech oceni człowiek).
          if (parsed.decyzja === "nie" && !parsed.odrzucenie && typ !== "inny" && cenaNum > 0 && zyskLiczony != null
            && (zyskLiczony / cenaNum) * 100 >= progZysku) {
            const pctTxt = ((zyskLiczony / cenaNum) * 100).toFixed(1);
            if (opts.verify) {
              addLog(`⚠️ Weryfikator: "nie", ale z jego własnej wyceny zysk ${pctTxt}% (próg ${progZysku}%) — do ręcznego sprawdzenia — ${listing.title}`, "error");
              markUncertain("inne", `weryfikator napisał „nie”, ale z jego wyceny zysk ~${zyskLiczony}€ (${pctTxt}%)${parsed.powod_decyzji ? ` — ${parsed.powod_decyzji}` : ""}`.slice(0, 220));
            } else {
              addLog(`ℹ️ ${aiName(modelForCall || geminiModel)}: decyzja "nie", ale z liczb wychodzi zysk ${pctTxt}% (próg ${progZysku}%) — liczby decydują: "tak", sprawdzi weryfikacja — ${listing.title}`, "info");
              parsed.decyzja = "tak";
            }
          }

          // ── "TAK" MUSI SIĘ OBRONIĆ: kompletne liczby i próg zysku ──
          if (parsed.decyzja === "tak") {
            if (cenaNum == null || sprzedazNum == null || cenaNum <= 0) {
              addLog(`⚠️ Gemini: decyzja "tak" bez kompletnych liczb (zakup/sprzedaż) — zmieniam na "niepewne" — ${listing.title}`, "error");
              markUncertain("inne", "brak kompletnych liczb do policzenia zysku");
            } else if ((zyskLiczony / cenaNum) * 100 < progZysku) {
              addLog(`⚠️ Gemini: decyzja "tak" ale policzony zysk to tylko ${((zyskLiczony / cenaNum) * 100).toFixed(1)}% (próg ${progZysku}%) — zmieniam na "nie" — ${listing.title}`, "error");
              parsed.decyzja = "nie";
            }
          }
          if (typeConflict) parsed._typeConflict = modelTyp;
          if (parsed.decyzja === "niepewne" && !parsed.niepewne_kategoria) parsed.niepewne_kategoria = "inne";
          if (parsed.decyzja !== "niepewne") parsed.niepewne_kategoria = null;

          // Kompatybilność wsteczna — pole oplaca_sie używane w Discord embed / wynikach
          parsed.oplaca_sie = parsed.decyzja === "tak";

          // ── Opis wyniku budujemy z liczb i faktów; dla "niepewne" konkretny powód jest NA POCZĄTKU ──
          const cena = parsed.cena_zakupu_eur;
          const sprzedaz = parsed.szacowana_sprzedaz_eur;
          const zysk = parsed.przewidywany_zysk;
          const rokTxt = `rocznik ${fmtYear(fakty)}`;
          if (parsed.decyzja === "tak") {
            parsed.krotki_opis = `Zakup ${cena}€ → szacowana sprzedaż PL ${sprzedaz}€ → zysk ~${zysk}€ po transporcie (${transport}€) · ${rokTxt}.`;
          } else if (parsed.decyzja === "niepewne") {
            const label = UNCERTAIN_LABELS[parsed.niepewne_kategoria] || UNCERTAIN_LABELS.inne;
            parsed.krotki_opis = `${label}${parsed.powod_decyzji ? ` — ${parsed.powod_decyzji}` : ""}${cena != null ? ` (zakup ${cena}€)` : " (brak ceny)"}`;
          } else if (parsed.odrzucenie === "czesc") {
            parsed.krotki_opis = `Z opisu: sama część/rama, nie kompletny rower — odrzucone.`;
          } else if (parsed.odrzucenie === "sztywny") {
            parsed.krotki_opis = `Sztywny widelec (bez amortyzacji) — odrzucone.`;
          } else if (parsed.odrzucenie === "stary") {
            parsed.krotki_opis = `${rocznikZrodlo === "podany" ? "Podany" : "Oszacowany"} rocznik ${rocznik} (< ${MIN_BIKE_YEAR}) — odrzucone.`;
          } else if (parsed.odrzucenie === "ebike") {
            parsed.krotki_opis = `E-bike — wykluczone w Ustawieniach.`;
          } else if (parsed.odrzucenie === "sklep") {
            parsed.krotki_opis = `Nowy rower ze sklepu (cena detaliczna) — odrzucone.`;
          } else if (typ === "inny") {
            parsed.krotki_opis = `Typ roweru: inny (nie full/dirt/elektryk górski) — odrzucone automatycznie.`;
          } else {
            parsed.krotki_opis = sprzedaz != null
              ? `Zakup ${cena}€ → szacowana sprzedaż PL ${sprzedaz}€ — zysk za mały (~${zysk}€ po transporcie ${transport}€, próg ${progZysku}%) · ${rokTxt}.`
              : `Zakup ${cena ?? "?"}€ — zysk za mały lub transakcja się nie opłaca.`;
          }
          if (parsed.powod_decyzji && parsed.decyzja !== "niepewne") {
            parsed.krotki_opis += ` (${parsed.powod_decyzji})`;

8. ZDJĘCIA — dołączono wszystkie zdjęcia z ogłoszenia (${allPhotos.length}). Czy pokazują TEN rower z opisu (model, generacja, karbon/alu, osprzęt), bez widocznych uszkodzeń (sprawdź też dalsze zdjęcia i zbliżenia)? Zdjęcia katalogowe zamiast prawdziwych → tylko wpis w "ostrzezenia", nie zmiana decyzji.` : ""}${typeConflictNote ? `
9. TYP ROWERU — ${typeConflictNote}. Rozstrzygnij typ na podstawie zdjęć i opisu i napisz w "powod_decyzji", co o tym przesądza. Jeśli nie da się tego jednoznacznie ustalić — decyzja "niepewne".` : ""}
Wycenę sprzedaży zrób SAMODZIELNIE — nie przepisuj jej z wcześniejszej analizy. Decyzja "tak" tylko wtedy, gdy żaden punkt nie podważa okazji. Odpowiedz w tym samym formacie JSON co wyżej (z polem "fakty").`;
    addLog(`🕵️ Weryfikacja okazji — adwokat diabła (${stepLabel(plan.ver)}${allPhotos.length > 0 ? `, wszystkie zdjęcia: ${allPhotos.length}` : ""}${typeConflictNote ? ", do rozstrzygnięcia: sprzeczny typ" : ""}) — ${listing.title}`, "info");
    const [verOv, verOpts] = stepConfig(plan.ver);
    const verified = await attemptAnalysis(verOv, { ...verOpts, extra: verifyNote, images: allPhotos.length > 0 ? allPhotos : null, verify: true, stage: "weryfikacja" });
    if (verified?._aborted || verified?._fatal) return { ...verified, _first: current }; // v5.14: wznowimy od weryfikacji
    if (verified?._budget) {
      // Nie wysyłamy niezweryfikowanej okazji, ale też jej nie chowamy do przyszłego miesiąca — do ręcznego sprawdzenia
      addLog(`💰 Weryfikacja okazji niemożliwa — budżet AI wyczerpany — przenoszę do niepewnych — ${listing.title}`, "error");
      return { ...current, decyzja: "niepewne", oplaca_sie: false, niepewne_kategoria: "inne",
        krotki_opis: `${UNCERTAIN_LABELS.inne} — okazja NIEZWERYFIKOWANA (budżet AI wyczerpany): ${current.krotki_opis}` };
    }
    if (!verified) {
      // Okazja, której nie udało się potwierdzić, to z definicji okazja niepewna — do ręcznego sprawdzenia
      addLog(`⚠️ Weryfikacja okazji nie powiodła się — przenoszę do niepewnych — ${listing.title}`, "error");
      return { ...current, decyzja: "niepewne", oplaca_sie: false, niepewne_kategoria: "inne",
        krotki_opis: `${UNCERTAIN_LABELS.inne} — okazja NIEZWERYFIKOWANA (weryfikacja się nie udała): ${current.krotki_opis}` };
    }
    verified._verified = true;
    // Co weryfikator faktycznie widział — "potwierdzone" nie może sugerować obejrzenia zdjęć, których nie było
    verified._verifyMode = verified._photos > 0 ? `ze zdjęciami (${verified._photos < allPhotos.length ? `${verified._photos} z ${allPhotos.length}` : verified._photos}) i pełnym opisem`
      : allPhotos.length > 0 ? "TYLKO z opisu — zdjęć nie udało się pobrać"
      : "TYLKO z opisu — brak zdjęć w ogłoszeniu (albo analiza zdjęć wyłączona)";
    if (verified.decyzja === "tak" && typeConflictNote) {
      verified._verifyMode += ` · sprzeczny typ rozstrzygnięty: „${verified.typ_roweru}” (Groq: „${groqType}”)`;
    }
    if (verified.decyzja === "tak") {
      verified.krotki_opis = `${verified.krotki_opis} ✔ potwierdzone weryfikacją (${verified._verifyMode})`;
      addLog(`🕵️ Weryfikacja: okazja POTWIERDZONA (${verified._verifyMode}) — ${listing.title}`, verified._photos > 0 ? "success" : "error");
    } else {
      addLog(`🕵️ Weryfikacja obaliła okazję → "${verified.decyzja}"${verified.powod_decyzji ? ` (${verified.powod_decyzji})` : ""} — ${listing.title}`, "info");
    }
    return verified;
  };

  // ── Discord embed ──────────────────────────────────────────────────────
  const sendToDiscord = async (listing, analysis) => {
    const typLabel = TYPE_LABELS[analysis.typ_roweru]?.label || analysis.typ_roweru || "–";
    const embed = {
      title: `🚲 OKAZJA: ${listing.title}`,
      url: listing.href,
      color: 0x22c55e,
      fields: [
        { name: "🚴 Typ roweru",        value: `**${typLabel}**`, inline: true },
        { name: "💰 Cena z ogłoszenia", value: listing.price != null ? `**${listing.price}€**` : "brak", inline: true },
        { name: "📅 Rocznik",           value: fmtYear(analysis.fakty), inline: true },
        { name: "🤑 Przewidywany zysk", value: `**~${analysis.przewidywany_zysk}€**${analysis.transport_eur ? ` (po transporcie ${analysis.transport_eur}€)` : ""}`, inline: true },
        ...(analysis.rozmiar_ramy ? [{ name: "📏 Rozmiar", value: String(analysis.rozmiar_ramy), inline: true }] : []),
        ...forkField(analysis),
        ...frameField(analysis),
        ...(listing.prevPrice != null && listing.price != null && listing.prevPrice > listing.price
          ? [{ name: "📉 Obniżka", value: `${listing.prevPrice}€ → **${listing.price}€** (−${Math.round((1 - listing.price / listing.prevPrice) * 100)}%)`, inline: true }] : []),
        ...(fmtAgo(listing.postedAt) ? [{ name: "🕒 Dodano", value: fmtAgo(listing.postedAt), inline: true }] : []),
        ...(listing.location ? [{ name: "📍 Lokalizacja", value: listing.location, inline: true }] : []),
        { name: "🔎 Wyszukiwanie",      value: listing.bike, inline: true },
        { name: "🔗 Link do ogłoszenia",value: listing.href },
        { name: "📝 Krótki opis",       value: String(analysis._summary || analysis.krotki_opis || "–").slice(0, 1024) },
        ...(analysis.zdjecia ? [{ name: `📷 Zdjęcia (AI, ${analysis._photos || "?"} szt.)`, value: String(analysis.zdjecia).slice(0, 1024) }] : []),
        ...(analysis._verifyMode ? [{ name: "🕵️ Weryfikacja", value: analysis._verifyMode, inline: true }] : []),
        ...(analysis.ostrzezenia ? [{ name: "⚠️ Do sprawdzenia", value: String(analysis.ostrzezenia).slice(0, 1024) }] : []),
      ],
      ...(listing.photo ? { image: { url: listing.photo } } : {}),

    };
    // v5.14: wersja tekstowa (gdy Discord odrzuci embed) z tymi samymi kluczowymi informacjami: weryfikacja, widelec, ostrzeżenia
    const fork = forkField(analysis)[0];
    const fallback = [
      `🚲 **OKAZJA:** ${listing.title} — ${listing.price ?? "?"}€ → zysk ~${analysis.przewidywany_zysk}€${analysis.transport_eur ? ` (po transporcie ${analysis.transport_eur}€)` : ""} · rocznik ${fmtYear(analysis.fakty)}`,
      listing.href,
      analysis._verifyMode ? `🕵️ Weryfikacja: ${analysis._verifyMode}` : null,
      fork ? `🔧 Widelec: ${fork.value}` : null,
      frameField(analysis)[0] ? `🧱 Rama: ${frameField(analysis)[0].value}` : null,
      analysis.ostrzezenia ? `⚠️ Do sprawdzenia: ${analysis.ostrzezenia}` : null,
      analysis._summary ? `📝 ${analysis._summary}` : null,
    ].filter(Boolean).join("\n");
    return postWithRetry(callDiscord, { embeds: [embed] }, fallback);
  };

  // Wysyłka z jedną ponowną próbą przy krótkim limicie Discorda (429). Odmowa treści (400, np. zepsute zdjęcie
  // albo pole) — jeszcze raz jako zwykły tekst, żeby powiadomienie nie wisiało w kolejce przez tydzień.
  const postWithRetry = async (send, payload, fallbackText) => {
    let r = await send(payload);
    if (!r.ok && r.status === 429 && r.retryAfter != null && r.retryAfter <= 15) {
      if (!(await sleepWhileRunning(Math.ceil(r.retryAfter * 1000) + 300))) return r; // STOP — nie ponawiamy, zostaje w kolejce
      r = await send(payload);
    }
    if (!r.ok && r.status === 400 && fallbackText) {
      if (!runningRef.current) return { ...r, stopped: true }; // v5.14: po STOP nie wysyłamy już wersji tekstowej — powiadomienie zostaje w kolejce
      addLog(`⚠️ Discord odrzucił wiadomość (${r.error || "HTTP 400"}) — wysyłam wersję tekstową`, "error");
      r = await send({ content: fallbackText.slice(0, 1900) });
    }
    return r;
  };

  // ── D: oferta "na granicy okazji" — przy obecnej cenie zysk za mały, przy niższej by się opłacało ──
  // v6.1: JEDNA reguła zysku dla wszystkiego (decyzja po zmianie ceny, „opłaca się do”, propozycja, obserwacja spadku).
  // Próg zależy od ceny zakupu, więc „najwyższa cena, przy której się opłaca” liczymy w każdym przedziale osobno
  // i bierzemy najwyższą nie większą niż podany limit (np. obecna cena) — nie globalne maksimum z dowolnego przedziału.
  const meetsProfit = (sale, transport, price) => {
    const S = Number(sale), T = Math.max(0, Number(transport) || 0), p = Number(price);
    if (!(S > 0) || !(p > 0)) return false;
    return (S - p - T) * 100 >= minProfitFor(p) * p - 1e-6; // bez dzielenia — brak błędów zaokrągleń na granicy
  };
  const bestPriceAtMost = (sale, transport, limit = Infinity) => {
    const S = Number(sale), T = Math.max(0, Number(transport) || 0), L = Math.floor(Number(limit));
    if (!(S > 0) || Number.isNaN(L)) return null;
    let best = null;
    PROFIT_TIERS.forEach((t, i) => {
      const lo = i === 0 ? 1 : t.from, hi = i === PROFIT_TIERS.length - 1 ? Infinity : t.to - 1;
      const p = Math.min(hi, L, Math.floor(((S - T) * 100) / (100 + profitTiers[i]) + 1e-6));
      if (p >= lo && (best == null || p > best)) best = p;
    });
    return best;
  };
  // Liczby z analizy, z których da się liczyć zysk (null, gdy brak wyceny albo twarde odrzucenie)
  const profitInputs = (a) => {
    if (!a || a.decyzja !== "nie" || a.odrzucenie || !["full", "dirt", "elektryk_gorski"].includes(a.typ_roweru)) return null;
    const sale = Number(a.szacowana_sprzedaz_eur);
    if (!(sale > 0)) return null;
    return { sale, transport: Math.max(0, Number(a.transport_eur) || 0), price: Number(a.cena_zakupu_eur) };
  };
  const nearDealOf = (a) => {
    const pi = profitInputs(a);
    if (!pi || !(pi.price > 0) || meetsProfit(pi.sale, pi.transport, pi.price)) return null;
    const maxPrice = bestPriceAtMost(pi.sale, pi.transport, pi.price - 1);
    // v5.12: tylko gdy cena musi spaść najwyżej o 20%; propozycja ok. 12% poniżej "opłaca się do"
    if (maxPrice == null || maxPrice < minListingPrice || 1 - maxPrice / pi.price > NEAR_DEAL_MAX_DROP) return null;
    // v6.1: propozycję też sprawdzamy progiem — po zejściu do niższego przedziału próg bywa wyższy
    const okRaw = bestPriceAtMost(pi.sale, pi.transport, Math.floor(maxPrice * NEAR_DEAL_OFFER_SHARE));
    let offer = okRaw != null ? Math.floor(okRaw / 10) * 10 : null;
    if (offer == null || offer < 50 || !meetsProfit(pi.sale, pi.transport, offer)) offer = maxPrice;
    return { maxPrice, offer, profitAtOffer: Math.round(pi.sale - offer - pi.transport) };
  };
  const sellerMessage = (near, args) => [
    "Hallo,",
    `ist das Fahrrad noch zu haben? Ich hätte Interesse und würde Ihnen ${near.offer} € anbieten.`,
    ...(args ? [`Mein Preisvorschlag berücksichtigt: ${args.replace(/\s*;\s*/g, ", ").replace(/[.\s]+$/, "")}.`] : []),
    "Über eine kurze Rückmeldung würde ich mich freuen.",
    "Viele Grüße",
  ].join("\n");
  const sendNearToDiscord = async (item) => {
    const { listing, analysis: a, near } = item;
    const msg = sellerMessage(near, a.argumenty_negocjacji);
    const embed = {
      title: `🤏 NA GRANICY: ${listing.title}`.slice(0, 256),
      url: listing.href,
      color: 0xf59e0b,
      fields: [
        { name: "💰 Cena z ogłoszenia", value: `**${listing.price}€**`, inline: true },
        { name: "📈 Szac. sprzedaż PL", value: `${a.szacowana_sprzedaz_eur}€`, inline: true },
        { name: "✅ Opłaca się do", value: `**${near.maxPrice}€**`, inline: true },
        { name: "🤝 Proponuj", value: `**${near.offer}€** (zysk ~${near.profitAtOffer}€ po transporcie)`, inline: true },
        { name: "📅 Rocznik", value: fmtYear(a.fakty), inline: true },
        ...(a.rozmiar_ramy ? [{ name: "📏 Rozmiar", value: String(a.rozmiar_ramy), inline: true }] : []),
        ...forkField(a),
        ...frameField(a),
        ...(fmtAgo(listing.postedAt) ? [{ name: "🕒 Dodano", value: fmtAgo(listing.postedAt), inline: true }] : []),
        ...(listing.location ? [{ name: "📍 Lokalizacja", value: listing.location, inline: true }] : []),
        { name: "✉️ Wiadomość do sprzedawcy (skopiuj)", value: ("```\n" + msg + "\n```").slice(0, 1024) },
        { name: "📝 Ocena AI", value: String(a._summary || a.krotki_opis || "–").slice(0, 1024) },
        ...(a.zdjecia ? [{ name: `📷 Zdjęcia (AI, ${a._photos || "?"} szt.)`, value: String(a.zdjecia).slice(0, 1024) }] : []),
        ...(a.ostrzezenia ? [{ name: "⚠️ Do sprawdzenia", value: String(a.ostrzezenia).slice(0, 1024) }] : []),
      ],
      ...(listing.photo ? { image: { url: listing.photo } } : {}),
      footer: { text: `DirtDealFinder • ${new Date().toLocaleString("pl-PL")}` },
    };
    const fallback = `🤏 **NA GRANICY:** ${listing.title} — ${listing.price}€, opłaca się do ${near.maxPrice}€, proponuj ${near.offer}€\n${listing.href}\n${msg}`;
    return postWithRetry(callNearDiscord, { embeds: [embed] }, fallback);
  };

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // Prosty, deterministyczny hash (djb2) — używany TYLKO do rozpoznania "czy statyczny blok promptu
  // się zmienił" (np. edytowałeś cennik w Ustawieniach), nie do żadnych celów bezpieczeństwa.
  const hashStr = (str) => {
    let h = 5381;
    for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  };
  // v6.1: tytuł do porównań — bez wielkości liter, znaków i dopisków „Reserviert •” / „Gelöscht •”
  const normTitle = (t) => String(t || "").toLowerCase().replace(/^\s*(reserviert|gelöscht)\s*[•·|-]\s*/g, "").replace(/[^a-z0-9äöüß]+/g, " ").trim();
  // v5.14: odcisk treści ogłoszenia (opis + zdjęcia, opcjonalnie cena) — czy wynik analizy jest nadal aktualny; v6.1: także tytuł
  const contentKey = (l, withPrice = true) => hashStr(`${normTitle(l.title)}|${withPrice ? l.price ?? "" : ""}|${l.fullDesc || ""}|${(l.images || []).join(",")}`);

  // ── Duplikaty — ten sam rower pod innym numerem ogłoszenia (v6.1, przebudowane w v6.2) ──
  // Sam tytuł + cena to tylko podejrzenie (dwa takie same modele w tej samej cenie to normalna rzecz).
  // PEWNY duplikat (bez AI): ten sam tytuł i cena, sprzedawcy nie są różni, ORAZ ten sam sprzedawca z identycznym
  // opisem albo identyczne zdjęcia. Różni (znani) sprzedawcy = zawsze osobne rowery. Ten sam sprzedawca z innym opisem
  // i zdjęciami (może mieć dwa egzemplarze) albo identyczny opis bez numeru sprzedawcy → MOŻLIWY duplikat: normalna
  // analiza z ostrzeżeniem. Wpis = rekord roweru: numery ogłoszeń, aktywny link, wycena do obserwacji, stan alertu.
  const titlePriceKey = (l) => `${normTitle(l.title)}|${l.price ?? ""}`;
  const descKey = (desc) => { const d = String(desc || "").toLowerCase().replace(/[^a-z0-9äöüß]+/g, ""); return d.length >= 40 ? hashStr(d) : null; };
  const imgKey = (images) => (images || []).length >= 2 ? hashStr(images.join(",")) : null;
  const loadDupes = () => {
    let map = {};
    try { map = JSON.parse(localStorage.getItem("ddf_dupes") || "{}") || {}; } catch {}
    const now = Date.now();
    for (const k of Object.keys(map)) if (!(now - (map[k]?.t || 0) < DUPE_TTL_MS)) delete map[k];
    return map;
  };
  const saveDupes = (map) => {
    const ids = Object.keys(map);
    if (ids.length > DUPE_MAX) ids.sort((a, b) => map[a].t - map[b].t).slice(0, ids.length - DUPE_MAX).forEach(k => delete map[k]);
    safeSetItem("ddf_dupes", JSON.stringify(map)); try { localStorage.removeItem("ddf_alert_keys"); } catch {}
  };
  const dupeKeyFor = (map, id) => {
    id = String(id);
    if (map[id]) return id;
    return Object.keys(map).find(k => (map[k].ids || []).includes(id)) || null;
  };
  const findDuplicate = (l) => {
    const map = loadDupes();
    const tp = titlePriceKey(l), dk = descKey(l.fullDesc), ik = imgKey(l.images);
    let maybe = null;
    for (const [key, e] of Object.entries(map)) {
      const id = String(l.listingId);
      if (key === id || (e.ids || []).includes(id) || e.tp !== tp) continue;
      if (l.sellerId && e.seller && e.seller !== l.sellerId) continue; // różni sprzedawcy — różne rowery
      const sameSeller = !!(l.sellerId && e.seller === l.sellerId);
      if (ik && e.ik === ik) return { key, e, sure: true, why: "identyczne zdjęcia" };
      if (sameSeller && dk && e.dk === dk) return { key, e, sure: true, why: "ten sam sprzedawca i opis" };
      if (!maybe && (sameSeller || (dk && e.dk === dk))) maybe = { key, e, sure: false, why: sameSeller ? "ten sam sprzedawca, inny opis i zdjęcia" : "identyczny opis, sprzedawca nieznany" };
    }
    return maybe;
  };
  // Wycena do obserwacji spadku ceny (v6.1): tylko gdy jakaś niższa cena spełniłaby próg
  const watchOf = (a, price) => {
    const pi = profitInputs(a);
    const lower = pi ? bestPriceAtMost(pi.sale, pi.transport, (price ?? Infinity) - 1) : null;
    return lower != null && lower >= minListingPrice ? { watchSale: pi.sale, watchT: pi.transport } : null;
  };
  const recordAnalyzed = (l, a, kind) => {
    if (!l?.listingId || !l.fullDesc) return;
    const map = loadDupes();
    const old = map[dupeKeyFor(map, l.listingId)];
    const w = watchOf(a, l.price);
    map[l.listingId] = {
      tp: titlePriceKey(l), seller: l.sellerId || null, dk: descKey(l.fullDesc), ik: imgKey(l.images), t: Date.now(), kind,
      typ: a?.typ_roweru || "?", dec: a?.decyzja || "nie", opis: String(a?._summary || a?.krotki_opis || "").slice(0, 300),
      ids: old?.ids || [], href: l.href || null, watchSale: w?.watchSale ?? null, watchT: w?.watchT ?? null,
      alert: kind === "deal" ? "pending" : null, // v6.2: stan alertu okazji — oczekuje / wysłany / utracony
    };
    saveDupes(map);
  };
  // v6.2: stan alertu okazji w rekordzie roweru (szukany po dowolnym z jego numerów)
  const setAlertState = (id, state) => {
    const map = loadDupes();
    const key = dupeKeyFor(map, id);
    if (!key || map[key].kind !== "deal") return;
    map[key].alert = state; map[key].t = Date.now();
    saveDupes(map);
  };
  // v6.2: nowy numer tego samego roweru dołącza do rekordu — przejmuje obserwację ceny i aktywny link
  const linkDuplicate = (dup, l) => {
    const map = loadDupes();
    const e = map[dup.key];
    if (!e) return;
    e.ids = [...new Set([...(e.ids || []), String(l.listingId)])].slice(-10);
    e.href = l.href || e.href; e.t = Date.now();
    saveDupes(map);
    const seenE = seenIdsRef.current.get(l.listingId);
    if (seenE && e.watchSale != null) { seenE.watchSale = e.watchSale; seenE.watchT = e.watchT; persistSeenMap(); }
  };

  // ── Wspólne pomocnicze dla pętli ───────────────────────────────────────
  // v6.4 (B2): czekanie JEDNYM odliczaniem do terminu, przerywane STOP-em. Łańcuch 1-sekundowych odliczań w karcie
  // schowanej w tle Chrome budzi raz na minutę — „60 s” przerwy trwało kwadrans; jedno odliczanie spóźnia się najwyżej ok. 1 min.
  const stopWaitersRef = useRef(new Set());
  const sleepOrStop = (ms) => new Promise((resolve) => {
    if (!runningRef.current) { resolve(); return; }
    let done = false;
    const fin = () => { if (done) return; done = true; stopWaitersRef.current.delete(fin); resolve(); };
    stopWaitersRef.current.add(fin);
    sleep(Math.max(0, ms)).then(fin);
  });
  const wakeAllWaiters = () => { for (const f of [...stopWaitersRef.current]) f(); };
  // Czekanie na limit (Discord 429, Groq/AI) — prawdziwy czas (nie skrócony w testach), STOP przerywa od razu
  const sleepWhileRunning = (ms) => new Promise((resolve) => {
    if (!runningRef.current) { resolve(false); return; }
    let done = false;
    const fin = () => { if (done) return; done = true; stopWaitersRef.current.delete(fin); clearTimeout(t); resolve(runningRef.current); };
    const t = setTimeout(fin, Math.max(0, ms));
    stopWaitersRef.current.add(fin);
  });
  const pushResult = (listing, analysis, status = "skip") => {
    const id = Date.now() + Math.random();
    setResults(prev => [{ id, listing, analysis, status, at: Date.now(), timestamp: new Date().toLocaleString("pl-PL", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" }) }, ...prev].slice(0, 400));
    return id;
  };
  // Trwałe odrzucenie oferty — zawsze z konkretnym powodem widocznym w Wynikach
  // v6.4: powód odrzucenia zapisujemy w pamięci widzianych (rej) — nocne sprawdzanie cen pomija odrzucone na stałe
  const rejectReasonOf = (txt) => {
    const t = String(txt || "");
    if (/filtrem słów/i.test(t)) return "slowa";
    if (/filtrem roku|rocznik|sprzed \d{4}/i.test(t)) return "stary";
    if (/e-MTB wykluczone/i.test(t)) return "ebike";
    if (/Groq/i.test(t) && /nie full|po przeczytaniu|inny/i.test(t)) return "inny";
    if (/poniżej progu/i.test(t)) return "tanio_niepewny";
    if (/brak ceny|cena zniknęła/i.test(t)) return "brak_ceny";
    if (/bez AI/i.test(t)) return "bez_ai";
    return null;
  };
  const rejectJob = (job, analysis) => {
    const e = seenIdsRef.current.get(job.listing.listingId);
    const rej = rejectReasonOf(analysis?.krotki_opis);
    if (e && rej) e.rej = rej;
    removeJob(job.listing.listingId); pushResult(job.listing, analysis);
  };

  // Usuń z kolejki i z listy do wysłania pozycje tak stare, że i tak są już nieaktualne
  const cleanupQueues = () => {
    const now = Date.now();
    let dropped = 0;
    for (const [id, j] of pendingRef.current) {
      if (now - (j.addedAt || 0) > PENDING_MAX_AGE_MS) { pendingRef.current.delete(id); dropped++; }
    }
    if (pendingRef.current.size > PENDING_MAX) {
      const extra = [...pendingRef.current.values()].sort((a, b) => a.addedAt - b.addedAt).slice(0, pendingRef.current.size - PENDING_MAX);
      extra.forEach(j => pendingRef.current.delete(j.listing.listingId));
      dropped += extra.length;
    }
    if (dropped > 0) addLog(`🧹 Kolejka: usunięto ${dropped} najstarszych ofert (starsze niż 48 h albo ponad limit ${PENDING_MAX}) — prawdopodobnie nieaktualne`, "info");
    const before = outboxRef.current.length;
    outboxRef.current = outboxRef.current.filter(o => now - (o.addedAt || 0) <= OUTBOX_MAX_AGE_MS).slice(-OUTBOX_MAX);
    if (outboxRef.current.length < before) addLog(`🧹 Usunięto ${before - outboxRef.current.length} niewysłanych powiadomień starszych niż 7 dni`, "info");
    persistPending();
    persistOutbox();
  };

  // ── Wysyłka powiadomień z listy "do wysłania" (outbox) ────────────────
  // Pozycja znika z listy dopiero po potwierdzeniu przez Discorda. Nieudane czekają na kolejny cykl.
  // v6.3: wysyłka po kolei — pętla zbierania i wykonawca AI wołają ją niezależnie; dwie naraz mogłyby wysłać to samo
  const outboxChainRef = useRef(Promise.resolve());
  const flushOutbox = (opts) => {
    const p = outboxChainRef.current.then(() => flushOutboxNow(opts));
    outboxChainRef.current = p.catch(() => {});
    return p;
  };
  const flushOutboxNow = async ({ deals = true, uncertain = true } = {}) => {
    if (!runningRef.current) return; // po STOP nic nie wysyłamy — wyślemy po następnym starcie
    if (deals) {
      for (const item of outboxRef.current.filter(o => o.kind === "deal")) {
        if (!runningRef.current) return;
        // Zaległa okazja (czeka > 30 min): przed wysyłką MUSI się udać sprawdzenie ogłoszenia — dostępność i cena
        if (Date.now() - (item.addedAt || 0) > DETAILS_MAX_AGE_MS && !(item.checkedAt && Date.now() - item.checkedAt <= DETAILS_MAX_AGE_MS)) {
          const toUncertain = (reason) => {
            outboxRef.current = outboxRef.current.filter(o => o.id !== item.id);
            setAlertState(item.listing.listingId, "lost"); // v6.2: alert okazji nie dotarł (ponowne wystawienie → nowa analiza)
            addToOutbox({ kind: "uncertain", listing: item.listing, reason });
            addLog(`❓ Zaległa okazja → do niepewnych (${reason}): ${item.listing.title}`, "info");
          };
          // v5.11: w czasie przerwy po blokadzie i częściej niż co 5 min — nie pobieramy strony (to samo co nieudane sprawdzenie)
          if (Date.now() < detailBlockedUntilRef.current || (item.lastRefreshTryAt && Date.now() - item.lastRefreshTryAt < OUTBOX_REFRESH_MIN_GAP_MS)) {
            if (!item.refreshFailedSince) item.refreshFailedSince = Date.now();
            if (Date.now() - item.refreshFailedSince > DETAILS_WAIT_MAX_MS) { toUncertain("nie udało się potwierdzić, że ogłoszenie jest aktualne"); continue; }
            persistOutbox();
            continue;
          }
          item.lastRefreshTryAt = Date.now();
          const det = await fetchListingDetails(item.listing);
          touchActivity();
          if (!runningRef.current) return;
          if (det.blocked) detailBlockedUntilRef.current = Date.now() + DETAIL_BLOCK_PAUSE_MS;
          if (det.gone) {
            outboxRef.current = outboxRef.current.filter(o => o.id !== item.id);
            persistOutbox();
            setAlertState(item.listing.listingId, "lost");
            addLog(`🗑 Zaległa okazja nie wysłana — ogłoszenie zostało usunięte: ${item.listing.title}`, "info");
            continue;
          }
          if (!det.ok || det.price == null) {
            // Nie udało się potwierdzić aktualności albo odczytać ceny (blokada, błąd, zmieniony układ strony) — starej okazji
            // nie wysyłamy. Ponowimy później; jeśli przez 2 h się nie uda — do niepewnych, do ręcznego sprawdzenia.
            const why = det.ok ? "nie udało się odczytać ceny na stronie ogłoszenia" : det.reason;
            if (!item.refreshFailedSince) item.refreshFailedSince = Date.now();
            if (Date.now() - item.refreshFailedSince > DETAILS_WAIT_MAX_MS) { toUncertain(`nie udało się potwierdzić aktualności ogłoszenia (${why})`); continue; }
            persistOutbox();
            addLog(`⏳ Zaległa okazja czeka — nie udało się sprawdzić ogłoszenia (${why}), spróbuję później: ${item.listing.title}`, "info");
            continue;
          }
          delete item.refreshFailedSince;
          // v5.14: opis albo zdjęcia zmieniły się od analizy (np. dopisane uszkodzenie) — stara ocena nieaktualna → analiza od nowa
          // v6.1: także tytuł; pozycja bez odcisku (sprzed v5.14) — nie da się sprawdzić, więc też analiza od nowa
          const nowKey = contentKey({ title: det.title || item.listing.title, fullDesc: det.desc, images: det.images || [] }, false);
          if (!item.contentKey || nowKey !== item.contentKey) {
            outboxRef.current = outboxRef.current.filter(o => o.id !== item.id);
            persistOutbox();
            const id = item.listing.listingId;
            if (!pendingRef.current.has(id)) {
              pendingRef.current.set(id, {
                listing: { ...item.listing, price: det.price, ...(det.title ? { title: det.title, cardTitle: item.listing.cardTitle ?? item.listing.title } : {}) }, source: "content_changed", cachedType: null, stage: "analyze",
                groqType: ["full", "dirt", "elektryk_gorski"].includes(item.analysis?.typ_roweru) ? item.analysis.typ_roweru : "niepewne",
                classifierDown: false, attempts: 0, addedAt: Date.now(),
              });
              persistPending();
            }
            addLog(item.contentKey
              ? `📝 Zaległa okazja: tytuł, opis lub zdjęcia zmieniły się od analizy — nie wysyłam, analizuję ponownie: ${item.listing.title}`
              : `📝 Zaległa okazja z poprzedniej wersji (bez zapisu treści) — nie da się sprawdzić, czy ogłoszenie się nie zmieniło; analizuję ponownie: ${item.listing.title}`, "info");
            continue;
          }
          item.checkedAt = Date.now();
          const oldPrice = item.listing.price;
          if (oldPrice == null || det.price !== oldPrice) {
            // Cena się zmieniła — przelicz zysk i sprawdź próg opłacalności oraz limit zakupu jeszcze raz
            const sprzedaz = Number(item.analysis?.szacowana_sprzedaz_eur);
            const transport = Number(item.analysis?.transport_eur ?? transportCostEur) || 0;
            if (det.price > maxBuyPrice) { toUncertain(`cena zmieniła się ${oldPrice ?? "?"}€ → ${det.price}€ — ponad limit zakupu ${maxBuyPrice}€`); continue; }
            if (!Number.isFinite(sprzedaz) || sprzedaz <= 0) {
              if (oldPrice == null || det.price > oldPrice) { toUncertain(`cena zmieniła się ${oldPrice ?? "?"}€ → ${det.price}€ — zysku nie da się przeliczyć`); continue; }
            } else {
              const zysk = Math.round((sprzedaz - det.price - transport) * 100) / 100;
              const pct = det.price > 0 ? (zysk / det.price) * 100 : 0;
              if (pct < minProfitFor(det.price)) { toUncertain(`cena zmieniła się ${oldPrice ?? "?"}€ → ${det.price}€ — zysk po transporcie ~${zysk}€ (${pct.toFixed(0)}%) poniżej progu ${minProfitFor(det.price)}%`); continue; }
              item.analysis = { ...item.analysis, przewidywany_zysk: zysk, cena_zakupu_eur: det.price };
            }
            addLog(`💶 Zaległa okazja: cena ${oldPrice ?? "?"}€ → ${det.price}€ — zysk przeliczony, nadal okazja: ${item.listing.title}`, "info");
            item.listing.price = det.price;
            // v6.1: opisy z nowymi liczbami — Discord pokazuje _summary, więc stare „Zakup X€ … zysk ~Y€” nie może tam zostać
            const note = `💶 Cena zmieniła się od analizy: ${oldPrice ?? "?"}€ → ${det.price}€ (zysk przeliczony).`;
            const reprice = (t) => t ? String(t).replace(/Zakup [\d.,]+ ?€/, `Zakup ${det.price}€`).replace(/zysk ~-?[\d.,]+ ?€/, (m) => sprzedaz > 0 ? `zysk ~${item.analysis.przewidywany_zysk}€` : m) : t;
            item.analysis = {
              ...item.analysis,
              krotki_opis: `${note} ${reprice(item.analysis.krotki_opis) || ""}`.trim(),
              _summary: `${note} ${reprice(item.analysis._summary) || ""}`.trim(),
            };
          }
          persistOutbox();
        }
        const r = await sendToDiscord(item.listing, item.analysis);
        if (r.ok) {
          outboxRef.current = outboxRef.current.filter(o => o.id !== item.id);
          setAlertState(item.listing.listingId, "sent"); // v6.2: dopiero teraz „okazja już zgłoszona”
          setStats(st => ({ ...st, sent: st.sent + 1 }));
          if (item.resultId != null) setResults(prev => prev.map(x => x.id === item.resultId ? { ...x, status: "sent" } : x));
          const delay = item.foundAt ? Date.now() - item.foundAt : null; // v6.3: czas od wykrycia oferty do alertu
          if (delay != null) alertDelaysRef.current = [...alertDelaysRef.current, delay].slice(-20);
          addLog(`📨 Wysłano na Discord: ${item.listing.title} — ${item.listing.href}${delay != null ? ` · ⏱ ${fmtDuration(delay)} od wykrycia` : ""}`, "success");
          persistOutbox();
        } else {
          if (r.stopped) return; // v5.14: STOP w trakcie wysyłki — zostaje w kolejce, wyślemy po starcie
          item.tries = (item.tries || 0) + 1;
          persistOutbox();
          if (r.status === 400) { // odrzucona także wersja tekstowa — ponawianie nic nie da
            outboxRef.current = outboxRef.current.filter(o => o.id !== item.id);
            setAlertState(item.listing.listingId, "lost");
            persistOutbox();
            addLog(`⚠️ Discord odrzuca tę wiadomość (${describeDiscordError(r)}) — usuwam z kolejki: ${item.listing.title} — ${item.listing.href}`, "error");
            continue;
          }
          addLog(`⚠️ Discord: okazja NIE wysłana (${describeDiscordError(r)}) — ponowię w następnym cyklu — ${item.listing.title}`, "error");
          if ([401, 403, 404].includes(r.status) || r.status === 0) break; // zły webhook / brak sieci — nie ma sensu próbować dalej teraz
        }
      }
      // ── Oferty "na granicy okazji" (osobny kanał) ──
      for (const item of outboxRef.current.filter(o => o.kind === "near")) {
        if (!runningRef.current) return;
        const drop = () => { outboxRef.current = outboxRef.current.filter(o => o.id !== item.id); persistOutbox(); };
        if (!nearWebhook) { drop(); continue; }
        const r = await sendNearToDiscord(item);
        if (r.ok) { drop(); addLog(`🤏 Wysłano „na granicy okazji”: ${item.listing.title} — proponuj ${item.near.offer}€`, "success"); continue; }
        if (r.stopped) return; // v5.14: STOP — zostaje w kolejce
        item.tries = (item.tries || 0) + 1;
        persistOutbox();
        if (r.status === 400) { drop(); addLog(`⚠️ Discord odrzuca wiadomość „na granicy” (${describeDiscordError(r)}) — usuwam: ${item.listing.title}`, "error"); continue; }
        addLog(`⚠️ Discord: „na granicy” NIE wysłane (${describeDiscordError(r)}) — ponowię w następnym cyklu — ${item.listing.title}`, "error");
        if ([401, 403, 404].includes(r.status) || r.status === 0) break;
      }
    }
    if (!uncertain) return;
    const unc = outboxRef.current.filter(o => o.kind === "uncertain");
    if (unc.length === 0) return;
    if (!uncertainWebhook) {
      outboxRef.current = outboxRef.current.filter(o => o.kind !== "uncertain");
      persistOutbox();
      addLog(`❓ ${unc.length} niepewnych rowerów (brak webhooka „niepewne” — ustaw go w Ustawieniach, żeby dostawać listę)`, "info");
      return;
    }
    // Discord przyjmuje do 2000 znaków na wiadomość — dzielimy listę na kilka wiadomości
    const chunks = [];
    let cur = { text: `❓ **Niepewne rowery** (${unc.length})`, ids: [] };
    for (const u of unc) {
      const entry = `🔸 ${u.listing.title}${u.listing.price != null ? ` (${u.listing.price}€)` : ""} — ${u.reason || "za mało informacji"}`.slice(0, 600) + `\n${u.listing.href}`;
      if ((cur.text + "\n\n" + entry).length > 1900 && cur.ids.length > 0) { chunks.push(cur); cur = { text: entry, ids: [] }; }
      else cur.text += "\n\n" + entry;
      cur.ids.push(u.id);
    }
    chunks.push(cur);
    let sentCount = 0;
    for (let i = 0; i < chunks.length; i++) {
      if (i > 0) await sleep(1200); // odstęp, żeby nie wpaść w limit Discorda
      if (!runningRef.current) break;
      let r = await callUncertainDiscord({ content: chunks[i].text });
      if (!r.ok && r.status === 429 && r.retryAfter != null && r.retryAfter <= 15) {
        if (!(await sleepWhileRunning(Math.ceil(r.retryAfter * 1000) + 300))) break; // STOP — reszta czeka
        r = await callUncertainDiscord({ content: chunks[i].text });
      }
      if (!r.ok) {
        addLog(`⚠️ Lista niepewnych NIE wysłana (${describeDiscordError(r)}) — ${chunks.length - i} wiad. czeka na kolejny cykl`, "error");
        break;
      }
      const ids = new Set(chunks[i].ids);
      outboxRef.current = outboxRef.current.filter(o => !ids.has(o.id));
      sentCount += ids.size;
      persistOutbox();
    }
    if (sentCount > 0) addLog(`📨 Wysłano listę ${sentCount} niepewnych na Discord`, "success");
  };

  // ── Etap 1: filtry i Groq dla ofert z kolejki, które jeszcze go nie przeszły ─────────
  // Przerwanie (STOP) zostawia ofertę w kolejce — dokończymy ją po następnym starcie.
  const runStage1 = async (phase1Stats) => {
    const jobs = [...pendingRef.current.values()].filter(j => j.stage === "new").sort((a, b) => a.addedAt - b.addedAt);
    try {
      for (const job of jobs) {
        if (!runningRef.current) return;
        if (!pendingRef.current.has(job.listing.listingId)) continue;
        const listing = job.listing;
        if (job.source === "price_drop") {
          phase1Stats.priceDrops++;
          addLog(listing._hitWatch
            ? `📉 Cena spadła tak, że według wcześniejszej wyceny zakup spełnia próg zysku: ${listing.title} → ${listing.price}€ — analizuję ponownie`
            : listing._hitNearMax != null
            ? `📉 Cena spadła do kwoty „opłaca się do” (${listing._hitNearMax}€): ${listing.title} → ${listing.price}€ — analizuję ponownie`
            : `📉 Spadek ceny: ${listing.title} → ${listing.price}€`, "info");
        } else if (job.source === "price_added") {
          addLog(`💶 W ogłoszeniu pojawiła się cena: ${listing.title} → ${listing.price}€ — sprawdzam`, "info");
        }

        // ── Filtr słów PRZED Groq — zero kosztu ──
        const filterHit = matchesFilterKeyword(listing);
        if (filterHit) {
          phase1Stats.blacklist++;
          addLog(`🚫 Filtr: odrzucono (słowo: "${filterHit}") — ${listing.title}`, "info");
          rejectJob(job, { typ_roweru: "inny", decyzja: "nie", oplaca_sie: false, krotki_opis: `Odrzucone filtrem słów kluczowych (${filterHit})` });
          continue;
        }
        // ── Filtr roku po tytule — zero kosztu ──
        const yearBlock = checkListingYearBlock(listing);
        if (yearBlock.blocked) {
          phase1Stats.oldBike++;
          addLog(`🚫 Filtr roku: odrzucono (${yearBlock.reason}) — ${listing.title}`, "info");
          rejectJob(job, { typ_roweru: "inny", decyzja: "nie", oplaca_sie: false, krotki_opis: `Odrzucone filtrem roku (${yearBlock.reason})` });
          continue;
        }
        // ── Brak ceny — odrzucone od razu, bez Groqa i bez analizy AI. Gdy cena pojawi się później — oferta wróci. ──
        if (listing.price == null) {
          phase1Stats.noPrice++;
          const se = seenIdsRef.current.get(listing.listingId);
          if (se) { se.noPrice = true; persistSeenMap(); }
          addLog(`🚫 Brak ceny — odrzucono bez AI: ${listing.title}`, "info");
          rejectJob(job, { typ_roweru: "?", decyzja: "nie", oplaca_sie: false, krotki_opis: "Odrzucone — brak ceny w ogłoszeniu (wróci, gdy cena się pojawi)" });
          continue;
        }
        // ── Limit ceny (min./maks.) i darmowe wykrywacze — zero kosztu ──
        const freeReject = freeRejectReason(listing);
        if (freeReject) {
          if (freeReject.kind === "price") phase1Stats.tooExpensive++; else if (freeReject.kind === "cheap") phase1Stats.tooCheap++; else phase1Stats.freeDetect++;
          addLog(`${freeReject.kind === "price" || freeReject.kind === "cheap" ? "💸" : "🚫"} Bez AI: odrzucono (${freeReject.msg}) — ${listing.title}`, "info");
          rejectJob(job, { typ_roweru: "inny", decyzja: "nie", oplaca_sie: false, krotki_opis: `Odrzucone bez AI — ${freeReject.msg}` });
          continue;
        }

        // ── Groq: szybka klasyfikacja typu (przy spadku ceny znanego roweru — typ z pamięci) ──
        const cachedTrusted = ["full", "dirt", "elektryk_gorski"].includes(job.cachedType) ? job.cachedType : null;
        let typ;
        if (cachedTrusted) {
          typ = cachedTrusted;
          addLog(`💾 Typ z pamięci (bez Groq): "${typ}" — ${listing.title}`, "info");
        } else {
          typ = await classifyWithGroq(listing);
          if (!runningRef.current) return; // STOP w trakcie — oferta zostaje na etapie 1
          await sleep(2500); // margines poniżej limitu 30 RPM darmowego Groqa
          if (["full", "dirt", "elektryk_gorski"].includes(typ)) updateSeenType(listing.listingId, typ);
        }
        // v5.12: Groq odrzuca znany model ("Rose The Bruce" → "stary", dirt → "inny") — gdy tytuł to znany model,
        // a nie sama część, decyzję zostawiamy analizie AI (pełny opis + zdjęcia + twarda reguła rocznika)
        // v6.4 (B7): „stary” od Groqa przy dircie bez rocznika PODANEGO w ogłoszeniu — Twoja reguła: dirty odrzucamy
        // tylko przy podanym roczniku, a Groq szacuje rok z samego tytułu → decyzję zostawiamy analizie AI
        if (!cachedTrusted && typ === "stary" && KB_DIRT_RE.test(listing.title) && extractMarkedYear(`${listing.title} ${listing.desc || ""}`) == null
          && !/\b(19\d\d|20(0\d|1[0-6]))\b/.test(listing.title)) {
          addLog(`↩️ Groq: "stary" przy dircie bez podanego rocznika — decyzję zostawiam analizie AI — ${listing.title}`, "info");
          typ = "dirt";
          job.knownModel = true;
        }
        // v6.4: wyjątek — Groq uznał ogłoszenie za samą ramę/części, a cena jest niska (poniżej progu niepewnych):
        // to zwykle naprawdę rama znanego modelu, więc odrzucenie zostaje (jak w v5.14)
        const cheapPart = typ === "inny" && GROQ_PART_REASON_RE.test(listing._groqReason || "") && listing.price != null && listing.price < minUncertainPrice;
        if (!cachedTrusted && (typ === "inny" || typ === "stary") && !PART_TITLE_RE.test(listing.title) && !cheapPart) {
          const known = knownModelInTitle(listing);
          if (known) {
