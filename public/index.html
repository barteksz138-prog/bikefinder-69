          model: geminiModel,
          apiKey: geminiKey,
          messages: [{ role: "user", parts: [{ text: staticPrefix }] }],
          ttlSeconds,
        });
        if (data?.error || !data?.name) {
          // Najczęstsza przyczyna: staticPrefix poniżej minimalnego progu tokenów dla explicit
          // cache (Google: dokumentacja niespójna, 2048 vs 32768 w zależności od modelu/API).
          addLog(`ℹ️ Gemini: nie udało się utworzyć explicit cache (${data?.error?.message || "brak name w odpowiedzi"}) — wysyłam pełny prompt bez cache (10 min cooldown przed kolejną próbą)`, "info");
          cacheFailCooldownRef.current[cacheKey] = now + 10 * 60 * 1000;
          return null;
        }
        cacheMapRef.current[cacheKey] = {
          name: data.name,
          expiresAt: now + (ttlSeconds - 120) * 1000, // margines bezpieczeństwa 2 min przed realnym wygaśnięciem
        };
        // Koszt cache do licznika budżetu: zapis treści + przechowanie przez cały czas życia (liczone z góry, ostrożnie)
        const cacheTokens = data?.usageMetadata?.totalTokenCount || Math.round(staticPrefix.length / 3.5);
        const cachePrice = GEMINI_PRICES[geminiModel] || GEMINI_PRICE_FALLBACK;
        addAiCostUsd(cacheTokens * (cachePrice.in + cachePrice.storage * ttlSeconds / 3600) / 1e6);
        addLog(`💾 Gemini: utworzono explicit cache dla statycznej części promptu (${geminiModel}) — kolejne wywołania tańsze o ~90% na tej części`, "success");
        return data.name;
      } catch (e) {
        addLog(`ℹ️ Gemini: błąd tworzenia cache (${e.message}) — wysyłam pełny prompt bez cache`, "info");
        cacheFailCooldownRef.current[cacheKey] = now + 10 * 60 * 1000;
        return null;
      }
    };

    // ── Pojedyncza próba wywołania Gemini + parsowanie odpowiedzi ─────────────────────────
    // overrides — nadpisania generationConfig (patrz callGemini) — używane do eskalacji z myśleniem.
    // Ma własny retry loop (3 próby) na błędy przejściowe/quota, tak jak dotychczas — DODATKOWO
    // wykrywa ucięcie odpowiedzi (finishReason "MAX_TOKENS", zwykle przy włączonym myśleniu —
    // model zużywa limit tokenów na samo myślenie i nie starcza mu miejsca na dokończenie JSON,
    // co objawia się jako "Unterminated string in JSON") i automatycznie ponawia z WIĘKSZYM
    // limitem tokenów zamiast poddawać się za pierwszym razem.
    // opts.model — inny model niż wybrany w Ustawieniach (np. mocniejszy do weryfikacji okazji);
    // opts.extra — dodatkowe instrukcje doklejane na końcu (np. tryb weryfikacji "adwokat diabła").
    // Explicit cache dotyczy tylko modelu z Ustawień — dla rzadko używanego mocnego modelu
    // przechowywanie cache kosztowałoby więcej, niż by zaoszczędziło.
    const attemptAnalysis = async (overrides, opts = {}) => {
      let effectiveOverrides = { ...overrides };
      const modelForCall = opts.model && opts.model !== geminiModel ? opts.model : null;
      const dyn = opts.extra ? `${dynamicSuffix}\n\n${opts.extra}` : dynamicSuffix;
      // Sprawdź RAZ przed pętlą retry czy mamy działający cache — nie warto próbować go tworzyć
      // ponownie przy każdej z 3 prób w razie błędu przejściowego (patrz cooldown w getCachedContentName).
      const cachedContentName = modelForCall ? null : await getCachedContentName();
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          const data = cachedContentName
            ? await callGemini(dyn, effectiveOverrides, cachedContentName)
            : await callGemini(`${staticPrefix}\n\n${dyn}`, effectiveOverrides, null, modelForCall);

          if (data?.error) {
            const msg = data.error.message || "";
            // Quota exceeded — wyciągnij czas retry i poczekaj
            const retryMatch = msg.match(/retry in ([\d.]+)s/i);
            const waitSec = retryMatch ? Math.ceil(parseFloat(retryMatch[1])) + 2 : 60;
            if (msg.toLowerCase().includes("quota") || msg.toLowerCase().includes("429")) {
              addLog(`⏳ Quota Gemini wyczerpana — czekam ${waitSec}s (próba ${attempt}/3)`, "error");
              if (attempt < 3) { await sleep(waitSec * 1000); continue; }
              else { addLog("❌ Quota wyczerpana — włącz billing w aistudio.google.com", "error"); return null; }
            }
            addLog(`⚠️ Gemini API error: ${msg}`, "error");
            return null;
          }

          const finishReason = data?.candidates?.[0]?.finishReason;
          const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";

          if (!raw) {
            addLog(`⚠️ Gemini pusta odpowiedź (${finishReason || "brak odpowiedzi"})`, "error");
            return null;
          }

          // Ucięta odpowiedź (zwykle myślenie zjadło cały limit tokenów) — nie próbuj nawet
          // parsować, tylko od razu ponów z wyraźnie większym limitem, jeśli zostały próby.
          if (finishReason === "MAX_TOKENS" && attempt < 3) {
            const bumped = Math.min(65000, Math.round((effectiveOverrides.maxOutputTokens || 600) * 1.6) + 1000);
            addLog(`⏳ Gemini: odpowiedź ucięta (zabrakło tokenów, myślenie zjadło limit) — ponawiam z limitem ${bumped}, próba ${attempt + 1}/3 — ${listing.title}`, "error");
            effectiveOverrides = { ...effectiveOverrides, maxOutputTokens: bumped };
            continue;
          }

          let clean = raw.replace(/```json\s*/gi, "").replace(/```\s*/g, "").trim();
          const jsonMatch = clean.match(/\{[\s\S]*\}/);
          if (jsonMatch) clean = jsonMatch[0];
          const parsed = JSON.parse(clean);

          // ── KROK 1: FAKTY — normalizacja. Na nich opierają się twarde reguły niżej: liczy je program,
          // a nie model, bo modele dużo pewniej wyciągają pojedyncze fakty, niż oceniają całość naraz.
          const f = (parsed.fakty && typeof parsed.fakty === "object") ? parsed.fakty : {};
          const toNum = (v) => typeof v === "number" && Number.isFinite(v) ? v
            : (typeof v === "string" && /^\s*\d+([.,]\d+)?\s*$/.test(v) ? parseFloat(v.replace(",", ".")) : null);
          let rocznik = toNum(f.rocznik);
          if (rocznik != null && (rocznik < 1980 || rocznik > new Date().getFullYear() + 1)) rocznik = null;
          if (rocznik != null) rocznik = Math.round(rocznik);
          const rocznikZrodlo = rocznik == null ? "brak" : (f.rocznik_zrodlo === "podany" ? "podany" : "oszacowany");
          const fakty = {
            rocznik, rocznik_zrodlo: rocznikZrodlo,
            e_bike: f.e_bike === true,
            sprzedawca: ["prywatny", "sklep"].includes(f.sprzedawca) ? f.sprzedawca : "nieznany",
            stan: ["nowy", "jak_nowy", "uzywany", "uszkodzony"].includes(f.stan) ? f.stan : null,
            cena_nowego_eur: (() => { const v = toNum(f.cena_nowego_eur); return v != null && v > 200 ? v : null; })(),
            kompletny_rower: f.kompletny_rower !== false,
          };
          parsed.fakty = fakty;

          // Typ: zaufany z Etapu 1 albo z odpowiedzi Gemini. Rower z silnikiem nie jest zwykłym full/dirt.
          let typ = typeIsTrusted
            ? groqType
            : (["full", "dirt", "elektryk_gorski"].includes(parsed.typ_roweru) ? parsed.typ_roweru : "inny");
          if (fakty.e_bike && (typ === "full" || typ === "dirt")) {
            addLog(`⚡ Gemini: z opisu wynika e-bike — zmieniam typ "${typ}" na "elektryk_gorski" — ${listing.title}`, "info");
            typ = "elektryk_gorski";
          }
          parsed.typ_roweru = typ;

          parsed.decyzja = ["tak", "nie", "niepewne"].includes(parsed.decyzja) ? parsed.decyzja : "nie";
          const rawUncertainCat = parsed.niepewne_kategoria;
          parsed.niepewne_kategoria = UNCERTAIN_LABELS[parsed.niepewne_kategoria] ? parsed.niepewne_kategoria : null;
          if (typeof parsed.powod_decyzji === "string") parsed.powod_decyzji = parsed.powod_decyzji.trim().slice(0, 220);
          const markUncertain = (kat, powod) => { parsed.decyzja = "niepewne"; parsed.niepewne_kategoria = kat; parsed.powod_decyzji = powod; };

          // ── TWARDE ODRZUCENIA Z FAKTÓW (kolejność = priorytet komunikatu) ──
          parsed.odrzucenie = !fakty.kompletny_rower ? "czesc"
            : (rocznik != null && rocznik < MIN_BIKE_YEAR) ? "stary"
            : (typ === "elektryk_gorski" && excludeElektryk) ? "ebike"
            : (fakty.sprzedawca === "sklep" && fakty.stan === "nowy") ? "sklep"
            : null;
          if (typ === "inny" || parsed.odrzucenie) parsed.decyzja = "nie";

          // ── CENA ZAKUPU = CENA Z OGŁOSZENIA, nie to, co "odczytało" Gemini ──
          // Parser zna prawdziwą cenę z Kleinanzeigen; model potrafi ją źle przepisać (np. wziąć
          // "Neupreis" albo inną liczbę z opisu). Cała matematyka zysku niżej liczy się od ceny z ogłoszenia.
          if (listing.price != null) {
            if (typeof parsed.cena_zakupu_eur === "number" && Math.abs(parsed.cena_zakupu_eur - listing.price) > 1) {
              addLog(`⚠️ Gemini podał cenę zakupu ${parsed.cena_zakupu_eur}€, a ogłoszenie ma ${listing.price}€ — liczę od ceny z ogłoszenia — ${listing.title}`, "error");
            }
            parsed.cena_zakupu_eur = listing.price;
          }
          const cenaNum = typeof parsed.cena_zakupu_eur === "number" ? parsed.cena_zakupu_eur : null;
          let sprzedazNum = toNum(parsed.szacowana_sprzedaz_eur);

          // ── "CENA NOWEGO" Z OPISU: regex (pewniejszy) albo fakt od modelu ──
          const extractNewPriceFromDesc = (text) => {
            if (!text) return null;
            const patterns = [
              /neupreis\D{0,15}?(\d[\d.,]*)\s*€/i,
              /\bNP\.?\s*:?\s*(\d[\d.,]*)\s*€/,          // "NP 3.900,00 €" — celowo bez /i (małe "np." to polskie "na przykład")
              /\buvp\D{0,15}?(\d[\d.,]*)\s*€/i,
              /listenpreis\D{0,15}?(\d[\d.,]*)\s*€/i,
              /original\w*\s*(?:verkaufs|kauf)?preis\w*\D{0,15}?(\d[\d.,]*)\s*€/i,
              /verkaufspreis\s+betrug\D{0,15}?(\d[\d.,]*)\s*€/i,
              /kostete\s+neu\D{0,15}?(\d[\d.,]*)\s*€/i,
              /neu\s+f[üu]r\D{0,10}?(\d[\d.,]*)\s*€/i,
              /cena\s+nowego\D{0,15}?(\d[\d.,]*)\s*(?:€|eur)/i,
              /nowy\D{0,10}?(\d[\d.,]*)\s*(?:€|eur)/i,
            ];
            for (const re of patterns) {
              const m = text.match(re);
              if (m) {
                const num = parseFloat(m[1].replace(/\./g, "").replace(",", "."));
                if (Number.isFinite(num) && num > 200) return num; // odfiltruj przypadkowe małe liczby
              }
            }
            return null;
          };
          const newPrice = extractNewPriceFromDesc(`${listing.title || ""} ${listing.fullDesc || listing.desc || ""}`) ?? fakty.cena_nowego_eur;

          // ── LIMIT WG WIEKU: używany rower nie sprzeda się drożej niż określony % ceny nowego ──
          let capped = false;
          if (newPrice != null && rocznik != null && sprzedazNum != null) {
            const age = Math.max(0, new Date().getFullYear() - rocznik);
            const cap = Math.round(newPrice * ageCapFactor(age));
            if (sprzedazNum > cap) {
              addLog(`📐 Gemini: szacunek sprzedaży ${sprzedazNum}€ ponad limit dla roweru w wieku ${age} lat (${Math.round(ageCapFactor(age) * 100)}% ceny nowego ${newPrice}€ = ${cap}€) — przycinam — ${listing.title}`, "info");
              sprzedazNum = cap;
              capped = true;
            }
          } else if (newPrice != null && rocznik == null && sprzedazNum != null) {
            const cap = Math.round(newPrice * UNKNOWN_YEAR_CAP);
            if (sprzedazNum > cap) {
              addLog(`📐 Gemini: rocznik nieznany — szacunek ${sprzedazNum}€ ponad ${Math.round(UNKNOWN_YEAR_CAP * 100)}% ceny nowego z opisu (${newPrice}€ → ${cap}€) — przycinam — ${listing.title}`, "info");
              sprzedazNum = cap;
              capped = true;
            }
          }
          parsed.szacowana_sprzedaz_eur = sprzedazNum;

          // ── ZYSK LICZY PROGRAM, nie model (modele potrafią podać niespójne trzy liczby) ──
          const zyskLiczony = (cenaNum != null && sprzedazNum != null) ? Math.round((sprzedazNum - cenaNum) * 100) / 100 : null;
          if (!capped && zyskLiczony != null && typeof parsed.przewidywany_zysk === "number" && Math.abs(zyskLiczony - parsed.przewidywany_zysk) > 1) {
            addLog(`⚠️ Gemini: niespójna matematyka — podał zysk ${parsed.przewidywany_zysk}€ przy zakupie ${cenaNum}€/sprzedaży ${sprzedazNum}€ (powinno być ${zyskLiczony}€) — POPRAWIAM na policzone — ${listing.title}`, "error");
          }
          parsed.przewidywany_zysk = zyskLiczony;

          // ── Brak rocznika sam w sobie NIE jest powodem do "niepewne" ──
          // Gdy model i tak tak odpowie, a podał liczby — decyzję liczymy z liczb (każde "tak" i tak
          // przechodzi potem weryfikację). Bez liczb — to po prostu za mało informacji w opisie.
          if (parsed.decyzja === "niepewne" && rawUncertainCat === "brak_rocznika") {
            if (cenaNum != null && cenaNum > 0 && zyskLiczony != null) {
              parsed.decyzja = (zyskLiczony / cenaNum) * 100 >= minProfit ? "tak" : "nie";
              addLog(`ℹ️ Gemini: "niepewne" tylko z powodu braku rocznika — decyduję z liczb: "${parsed.decyzja}" — ${listing.title}`, "info");
            } else {
              parsed.niepewne_kategoria = "za_malo_opisu";
            }
          }

          // ── "TAK" MUSI SIĘ OBRONIĆ: kompletne liczby i próg zysku ──
          if (parsed.decyzja === "tak") {
            if (cenaNum == null || sprzedazNum == null || cenaNum <= 0) {
              addLog(`⚠️ Gemini: decyzja "tak" bez kompletnych liczb (zakup/sprzedaż) — zmieniam na "niepewne" — ${listing.title}`, "error");
              markUncertain("inne", "brak kompletnych liczb do policzenia zysku");
            } else if ((zyskLiczony / cenaNum) * 100 < minProfit) {
              addLog(`⚠️ Gemini: decyzja "tak" ale policzony zysk to tylko ${((zyskLiczony / cenaNum) * 100).toFixed(1)}% (próg ${minProfit}%) — zmieniam na "nie" — ${listing.title}`, "error");
              parsed.decyzja = "nie";
            }
          }
          if (parsed.decyzja === "niepewne" && !parsed.niepewne_kategoria) parsed.niepewne_kategoria = "inne";
          if (parsed.decyzja !== "niepewne") parsed.niepewne_kategoria = null;

          // Kompatybilność wsteczna — pole oplaca_sie używane w Discord embed / wynikach
          parsed.oplaca_sie = parsed.decyzja === "tak";

          // ── Opis wyniku budujemy z liczb i faktów; dla "niepewne" konkretny powód jest NA POCZĄTKU ──
          const cena = parsed.cena_zakupu_eur;
          const sprzedaz = parsed.szacowana_sprzedaz_eur;
          const zysk = parsed.przewidywany_zysk;
          const rokTxt = rocznik != null ? `rocznik ${rocznik}${rocznikZrodlo === "oszacowany" ? " (oszac.)" : ""}` : "rocznik ?";
          if (parsed.decyzja === "tak") {
            parsed.krotki_opis = `Zakup ${cena}€ → szacowana sprzedaż PL ${sprzedaz}€ → zysk ~${zysk}€ · ${rokTxt}.`;
          } else if (parsed.decyzja === "niepewne") {
            const label = UNCERTAIN_LABELS[parsed.niepewne_kategoria] || UNCERTAIN_LABELS.inne;
            parsed.krotki_opis = `${label}${parsed.powod_decyzji ? ` — ${parsed.powod_decyzji}` : ""}${cena != null ? ` (zakup ${cena}€)` : " (brak ceny)"}`;
          } else if (parsed.odrzucenie === "czesc") {
            parsed.krotki_opis = `Z opisu: sama część/rama, nie kompletny rower — odrzucone.`;
          } else if (parsed.odrzucenie === "stary") {
            parsed.krotki_opis = `${rocznikZrodlo === "podany" ? "Podany" : "Oszacowany"} rocznik ${rocznik} (< ${MIN_BIKE_YEAR}) — odrzucone.`;
          } else if (parsed.odrzucenie === "ebike") {
            parsed.krotki_opis = `E-bike — wykluczone w Ustawieniach.`;
          } else if (parsed.odrzucenie === "sklep") {
            parsed.krotki_opis = `Nowy rower ze sklepu (cena detaliczna) — odrzucone.`;
          } else if (typ === "inny") {
            parsed.krotki_opis = `Typ roweru: inny (nie full/dirt/elektryk górski) — odrzucone automatycznie.`;
          } else {
            parsed.krotki_opis = sprzedaz != null
              ? `Zakup ${cena}€ → szacowana sprzedaż PL ${sprzedaz}€ — zysk za mały (~${zysk}€, próg ${minProfit}%) · ${rokTxt}.`
              : `Zakup ${cena ?? "?"}€ — zysk za mały lub transakcja się nie opłaca.`;
          }
          if (parsed.powod_decyzji && parsed.decyzja !== "niepewne") {
            parsed.krotki_opis += ` (${parsed.powod_decyzji})`;
          }

          return parsed;

        } catch (e) {
          const msg = e.message || "";
          // Limit zapytań (429 / quota) — callGemini RZUCA błąd, więc obsługa musi być tutaj, nie wyżej.
          // Ważne zwłaszcza dla 2.5 Pro, który ma niższe limity zapytań na minutę niż Flash.
          const isQuota = /quota|429|exhausted|rate limit/i.test(msg);
          if (isQuota && attempt < 3) {
            const m = msg.match(/retry in ([\d.]+)\s*s/i);
            const waitSec = m ? Math.ceil(parseFloat(m[1])) + 2 : 30;
            addLog(`⏳ Gemini (${modelForCall || geminiModel}): limit zapytań — czekam ${waitSec}s (próba ${attempt}/3)`, "error");
            await sleep(waitSec * 1000);
            continue;
          }
          const isTransient = /high demand|overloaded|unavailable|503|temporarily/i.test(msg);
          if (isTransient && attempt < 3) {
            addLog(`⏳ Gemini chwilowo przeciążony — ponawiam za 8s (próba ${attempt}/3)`, "error");
            await sleep(8000);
            continue;
          }
          // Zabezpieczenie na wypadek gdyby Google NIE zgłosił finishReason="MAX_TOKENS" wprost,
          // a JSON i tak wygląda na ucięty w połowie — te komunikaty błędu JSON.parse to typowy
          // odcisk palca truncation, nie faktycznie zepsutego JSON-a od modelu.
          const looksTruncated = /unterminated string|unexpected end of json/i.test(msg);
          if (looksTruncated && attempt < 3) {
            const bumped = Math.min(65000, Math.round((effectiveOverrides.maxOutputTokens || 600) * 1.6) + 1000);
            addLog(`⏳ Gemini: JSON wygląda na ucięty (${msg}) — ponawiam z limitem ${bumped}, próba ${attempt + 1}/3 — ${listing.title}`, "error");
            effectiveOverrides = { ...effectiveOverrides, maxOutputTokens: bumped };
            continue;
          }
          addLog(`⚠️ Błąd Gemini (${modelForCall || geminiModel}): ${msg}`, "error");
          return null;
        }
      }
      return null;
    };

    // ── Moc analizy dobierana do budżetu (patrz getAiTier) ───────────────────────────────
    // premium — pierwsza próba z solidnym myśleniem; trudne przypadki i weryfikacja okazji na mocniejszym modelu.
    // normal  — lżejsza pierwsza próba, trudne przypadki na modelu z Ustawień; okazje nadal weryfikuje mocny model.
    // eco     — budżet wyczerpany: tanio, ale każda okazja nadal przechodzi weryfikację (tańszym modelem).
    // Pieniądze idą tam, gdzie błąd kosztuje najwięcej: oczywiste "nie" nie potrzebują drogiego myślenia.
    const BORDERLINE_PROFIT_MARGIN_PCT = 8; // jak blisko progu minProfit (w punktach %) wynik "nie" uznajemy za graniczny
    const isGen3 = (m) => /gemini-3|flash-latest|pro-latest/i.test(m || "");
    const tier = provider === "groq" ? "groq" : getAiTier();
    const ecoModel = /pro|flash-latest|gemini-3/i.test(geminiModel) ? "gemini-2.5-flash" : null; // eco: tańszy zamiennik drogiego modelu
    const PLANS = {
      premium: { first: { budget: 2048, level: "medium" }, esc: { model: STRONG_GEMINI_MODEL, budget: 8192, level: "high" }, ver: { model: STRONG_GEMINI_MODEL, budget: 16384, level: "high" } },
      normal:  { first: { budget: 1024, level: "low" }, esc: { budget: -1, level: "medium" }, ver: { model: STRONG_GEMINI_MODEL, budget: 16384, level: "high" } },
      eco:     { first: { budget: 512, level: "low", model: ecoModel }, esc: { budget: 2048, level: "low", model: ecoModel }, ver: { budget: -1, level: "medium", model: ecoModel } },
      groq:    { first: { effort: "low" }, esc: { effort: "medium" }, ver: { effort: "high" } },
    };
    const plan = PLANS[tier];
    // Zamienia krok planu na nadpisania generationConfig + model do wywołania
    const stepConfig = (step) => {
      if (provider === "groq") return [{ reasoningEffort: step.effort, maxOutputTokens: step.effort === "low" ? 3000 : 8000 }, {}];
      const model = step.model || geminiModel;
      if (isGen3(model)) {
        let level = step.level;
        if (/pro/i.test(model) && level === "medium") level = "high"; // Gemini 3.x Pro: tylko "low"/"high"
        return [{ thinkingLevel: level, maxOutputTokens: 16000 }, { model: step.model || null }];
      }
      // Limit wyjścia = budżet myślenia + miejsce na JSON z faktami; -1 (dynamiczne) dostaje duży zapas
      return [{ thinkingBudget: step.budget, maxOutputTokens: step.budget === -1 ? 20000 : step.budget + 2500 }, { model: step.model || null }];
    };
    const stepLabel = (step) => {
      if (provider === "groq") return `rozumowanie ${step.effort}`;
      const model = step.model || geminiModel;
      return `${model}, myślenie ${isGen3(model) ? step.level : step.budget === -1 ? "dynamiczne" : step.budget}`;
    };

    // ── Próba #1 ──
    const [firstOv, firstOpts] = stepConfig(plan.first);
    let current = await attemptAnalysis(firstOv, firstOpts);
    if (!current) return null; // twardy błąd (quota/parsing) — już zalogowany wyżej

    // ── Dokładniejsza analiza: "niepewne" albo "nie" tuż przy progu zysku ──
    // (każde "tak" i tak przechodzi niżej weryfikację, więc tu go nie powtarzamy)
    const profitPctOf = (r) => (r.cena_zakupu_eur > 0 && r.przewidywany_zysk != null) ? (r.przewidywany_zysk / r.cena_zakupu_eur) * 100 : null;
    const pct1 = profitPctOf(current);
    const borderlineNo = current.decyzja === "nie" && !current.odrzucenie && current.typ_roweru !== "inny"
      && pct1 != null && Math.abs(pct1 - minProfit) <= BORDERLINE_PROFIT_MARGIN_PCT;
    if (current.decyzja === "niepewne" || borderlineNo) {
      const why = current.decyzja === "niepewne"
        ? `niepewne (${UNCERTAIN_LABELS[current.niepewne_kategoria] || "?"})`
        : `wynik graniczny (zysk ~${pct1.toFixed(1)}% vs próg ${minProfit}%)`;
      addLog(`🧠 Gemini: ${why} — druga, dokładniejsza analiza (${stepLabel(plan.esc)}) — ${listing.title}`, "info");
      const [escOv, escOpts] = stepConfig(plan.esc);
      const esc = await attemptAnalysis(escOv, escOpts);
      if (esc) {
        addLog(`🧠 Gemini (dokładniejsza analiza): decyzja="${esc.decyzja}" (było: "${current.decyzja}") — ${listing.title}`, "info");
        esc._escalated = true;
        current = esc;
      } else {
        addLog(`⚠️ Gemini: dokładniejsza analiza nie powiodła się — zostaje wynik pierwszej próby — ${listing.title}`, "error");
      }
    }

    if (current.decyzja !== "tak") return current;

    // ── Weryfikacja okazji — "adwokat diabła" ─────────────────────────────────────────────
    // Ponowne zadanie TEGO SAMEGO pytania zwykle powtarza ten sam błąd. Dlatego weryfikator dostaje
    // INNE zadanie: szukać powodów, dla których to NIE jest okazja, i wycenić rower od nowa.
    // Jego odpowiedź przechodzi przez te same twarde reguły co pierwsza analiza.
    const fk = current.fakty || {};
    const verifyNote = `=== TRYB WERYFIKACJI — ADWOKAT DIABŁA ===
Wcześniejsza analiza uznała to ogłoszenie za OKAZJĘ: rocznik ${fk.rocznik ?? "?"} (${fk.rocznik_zrodlo || "brak"}), szacowana sprzedaż ${current.szacowana_sprzedaz_eur}€, zysk ~${current.przewidywany_zysk}€${current.powod_decyzji ? `, uzasadnienie: "${current.powod_decyzji}"` : ""}.
Fałszywa okazja kosztuje użytkownika prawdziwe pieniądze, a przegapiona — tylko część zysku. Twoim zadaniem jest SZUKAĆ POWODÓW, dla których to NIE jest okazja. Sprawdź po kolei:
1. ROCZNIK — czy nazwa modelu, standard kół (26"/650B), napęd (3x/2x), zawieszenie albo cytowany test wskazują na rower sprzed ${MIN_BIKE_YEAR}? (Sam brak rocznika w ogłoszeniu to norma — NIE jest powodem do odrzucenia.)
2. E-BIKE — czy rower ma silnik/akumulator (Wh, Fazua, Bosch, Shimano Steps/EP, Brose)?
3. SKLEP — czy to nowy rower ze sklepu w cenie detalicznej (Onlineshop, Lieferzeit, "Zustand: Neu")?
4. CENA NOWEGO — czy szacunek nie jest zakotwiczony na "Neupreis"/"NP"/"UVP"?
5. WALUTY — czy kwoty z bazy wiedzy zapisane w złotówkach nie zostały potraktowane jak euro?
6. STAN — uszkodzenia, braki, niekompletny rower?
Wycenę sprzedaży zrób SAMODZIELNIE — nie przepisuj jej z wcześniejszej analizy. Decyzja "tak" tylko wtedy, gdy żaden punkt nie podważa okazji. Odpowiedz w tym samym formacie JSON co wyżej (z polem "fakty").`;
    addLog(`🕵️ Weryfikacja okazji — adwokat diabła (${stepLabel(plan.ver)}) — ${listing.title}`, "info");
    const [verOv, verOpts] = stepConfig(plan.ver);
    const verified = await attemptAnalysis(verOv, { ...verOpts, extra: verifyNote });
    if (!verified) {
      // Okazja, której nie udało się potwierdzić, to z definicji okazja niepewna — do ręcznego sprawdzenia
      addLog(`⚠️ Weryfikacja okazji nie powiodła się — przenoszę do niepewnych — ${listing.title}`, "error");
      return { ...current, decyzja: "niepewne", oplaca_sie: false, niepewne_kategoria: "inne",
        krotki_opis: `${UNCERTAIN_LABELS.inne} — okazja NIEZWERYFIKOWANA (weryfikacja się nie udała): ${current.krotki_opis}` };
    }
    verified._verified = true;
    if (verified.decyzja === "tak") {
      verified.krotki_opis = `${verified.krotki_opis} ✔ potwierdzone weryfikacją`;
      addLog(`🕵️ Weryfikacja: okazja POTWIERDZONA — ${listing.title}`, "success");
    } else {
      addLog(`🕵️ Weryfikacja obaliła okazję → "${verified.decyzja}"${verified.powod_decyzji ? ` (${verified.powod_decyzji})` : ""} — ${listing.title}`, "info");
    }
    return verified;
  };

  // ── Discord embed ──────────────────────────────────────────────────────
  const sendToDiscord = async (listing, analysis) => {
    const typLabel = TYPE_LABELS[analysis.typ_roweru]?.label || analysis.typ_roweru || "–";
    const embed = {
      title: `🚲 OKAZJA: ${listing.title}`,
      url: listing.href,
      color: 0x22c55e,
      fields: [
        { name: "🚴 Typ roweru",        value: `**${typLabel}**`, inline: true },
        { name: "💰 Cena z ogłoszenia", value: listing.price != null ? `**${listing.price}€**` : "brak", inline: true },
        { name: "📅 Rocznik",           value: analysis.fakty?.rocznik ? `**${analysis.fakty.rocznik}**${analysis.fakty.rocznik_zrodlo === "oszacowany" ? " (oszac.)" : ""}` : "?", inline: true },
        { name: "🤑 Przewidywany zysk", value: `**~${analysis.przewidywany_zysk}€**`, inline: true },
        { name: "📍 Lokalizacja",       value: listing.location || "–", inline: true },
        { name: "🔎 Wyszukiwanie",      value: listing.bike, inline: true },
        { name: "🔗 Link do ogłoszenia",value: listing.href },
        { name: "📝 Krótki opis",       value: analysis.krotki_opis },
      ],
      footer: { text: `DirtDealFinder • ${new Date().toLocaleString("pl-PL")}` },
    };
    try {
      const r = await callDiscord({ embeds: [embed] });
      return r.ok;
    } catch (e) {
      addLog(`❌ Discord: ${e.message}`, "error");
      return false;
    }
  };

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // Prosty, deterministyczny hash (djb2) — używany TYLKO do rozpoznania "czy statyczny blok promptu
  // się zmienił" (np. edytowałeś cennik w Ustawieniach), nie do żadnych celów bezpieczeństwa.
  const hashStr = (str) => {
    let h = 5381;
    for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  };

  // ── One full scan cycle ────────────────────────────────────────────────
  // ── One full scan cycle ────────────────────────────────────────────────
  const runOneCycle = useCallback(async (cycleN) => {
    const activeBikes = BIKE_MODELS.filter(b => selectedBikes.includes(b.id));
    addLog(`🔄 Cykl #${cycleN} — sprawdzam ${activeBikes.length} modeli`, "success");
    addLog(
      groqClassifierKey
        ? `🤖 Etap 1 (Groq) AKTYWNY — model ${GROQ_CLASSIFIER_MODEL}, ${getGroqKeyList().length} klucz(e), limit Gemini/cykl = ${maxGeminiPerCycle}`
        : `ℹ️ Etap 1 (Groq) WYŁĄCZONY — brak klucza w Ustawieniach, wszystko po czarnej liście leci prosto do Gemini`,
      "info"
    );

    if (provider !== "groq") {
      const tierNow = getAiTier();
      addLog(`💰 Gemini w tym miesiącu: ${(aiSpendRef.current.usd * USD_PLN_RATE).toFixed(2)} zł z ${aiBudgetPln} zł — tryb: ${TIER_LABELS[tierNow]}`, tierNow === "eco" ? "error" : "info");
    }
    geminiCallsRef.current = 0; // reset licznika analiz Gemini na nowy cykl
    const uncertainBatch = [];   // zbiorcza lista "niepewnych" na ten cykl
    const geminiCandidates = []; // { listing, groqType } — zebrane ze WSZYSTKICH modeli w tym cyklu, czekają na analizę Gemini
    const phase1Stats = { blacklist: 0, groqInny: 0, noPrice: 0, priceThreshold: 0, confident: 0, uncertain: 0, oldBike: 0, priceDrops: 0, tooExpensive: 0, freeDetect: 0 }; // statystyki fazy 1 do podsumowania

    // ── FAZA 1: scraping + filtr słów + klasyfikacja Groq (etap 1, tani/szybki) ──
    for (let bikeIdx = 0; bikeIdx < activeBikes.length; bikeIdx++) {
      const bike = activeBikes[bikeIdx];
      if (!runningRef.current) return;

      // Odstęp między kolejnymi requestami scrapowania — przy liście wielu konkretnych modeli
      // (zamiast jednego requestu na całą kategorię) brak przerwy między nimi wygląda dla
      // Kleinanzeigen jak bot i grozi captchą (patrz wykrywanie "captcha"/"robot"/"blocked" w parseListings).
      if (bikeIdx > 0) await sleep(3000);

      addLog(`🔍 ${bike.label}…`, "info");

      let listings = [];
      try {
        const html = await scrapeKleinanzeigen(bike);
        addLog(`📥 ${bike.label}: pobrano ${html.length} znaków HTML`, "info");
        listings = parseListings(html, bike.label);
        // Usuń duplikaty WEWNĄTRZ tego samego skanu (Kleinanzeigen czasem pokazuje to samo ogłoszenie 2x, np. wyróżnione + zwykłe)
        const uniqueMap = new Map();
        listings.forEach(l => { if (!uniqueMap.has(l.listingId)) uniqueMap.set(l.listingId, l); });
        listings = [...uniqueMap.values()];
        addLog(`📋 ${bike.label}: znaleziono ${listings.length} ogłoszeń`, listings.length > 0 ? "info" : "error");
      } catch (e) {
        addLog(`⚠️ ${bike.label}: błąd scraping — ${e.message}`, "error");
      }

      const fresh = listings.filter(l => !seenIdsRef.current.has(l.listingId));

      // Ogłoszenia zapamiętane BEZ ceny (stary format pamięci albo okres, gdy parser nie widział cen
      // po przebudowie Kleinanzeigen): gdy cena jest już znana — ustaw ją jako punkt odniesienia,
      // bez żadnego alarmu, żeby kolejne obniżki tych ogłoszeń były wykrywane.
      // Znane ogłoszenia droższe niż limit zakupu dostają flagę overMax — gdy później ich cena spadnie
      // do limitu (nawet o mniej niż próg spadku), zostaną sprawdzone jeszcze raz.
      let baselinesSet = 0;
      for (const l of listings) {
        if (l.price == null) continue;
        const e = seenIdsRef.current.get(l.listingId);
        if (!e) continue;
        if (e.lowest == null) { e.lowest = l.price; e.price = l.price; baselinesSet++; }
        if (l.price > maxBuyPrice && !e.overMax) { e.overMax = true; baselinesSet++; }
      }
      if (baselinesSet > 0) persistSeenMap();

      if (firstCycleRef.current) {
        // Cykl #1 — tylko zapamiętaj istniejące ID (z ceną jako punkt odniesienia), nie analizuj
        fresh.forEach(l => saveSeenEntry(l));
        addLog(`📌 ${bike.label}: zapamiętano ${fresh.length} istniejących ogłoszeń`, "info");
        continue;
      }

      // ── Spadki cen na JUŻ widzianych ogłoszeniach — dane już mamy z tego samego skanu, ──
      // ── zero dodatkowych zapytań. Zgłaszamy tylko spadek >= PRICE_DROP_THRESHOLD, który ──
      // ── nie był jeszcze zgłoszony na tym poziomie (bez spamu przy drobnych wahaniach). ──
      const freshIds = new Set(fresh.map(l => l.listingId));
      const priceDropped = listings.filter(l => {
        if (freshIds.has(l.listingId) || l.price == null) return false;
        const entry = seenIdsRef.current.get(l.listingId);
        if (!entry) return false;
        if (entry.overMax && l.price <= maxBuyPrice) return true; // wcześniej za drogie, teraz mieści się w limicie
        if (entry.lowest == null) return false; // brak punktu odniesienia (np. po migracji) — pomijamy
        if (l.price >= entry.lowest * (1 - PRICE_DROP_THRESHOLD)) return false;
        if (entry.notifiedAt != null && l.price >= entry.notifiedAt * (1 - PRICE_DROP_THRESHOLD)) return false;
        return true;
      });
      if (priceDropped.length > 0) {
        priceDropped.forEach(l => {
          const e = seenIdsRef.current.get(l.listingId);
          e.lowest = e.lowest == null ? l.price : Math.min(e.lowest, l.price);
          e.notifiedAt = l.price;
          e.overMax = false;
        });
        persistSeenMap();
        addLog(`📉 ${bike.label}: ${priceDropped.length} spadków ceny na znanych ogłoszeniach`, "success");
      }

      if (fresh.length === 0 && priceDropped.length === 0) {
        addLog(`✔ ${bike.label}: brak nowych`, "info");
      } else if (fresh.length > 0) {
        addLog(`🆕 ${bike.label}: ${fresh.length} nowych ogłoszeń`, "success");
        setStats(s => ({ ...s, scanned: s.scanned + fresh.length }));
      }

      const toProcess = [
        ...fresh.map(l => ({ ...l, _source: "new" })),
        ...priceDropped.map(l => ({ ...l, _source: "price_drop", _cachedType: seenIdsRef.current.get(l.listingId)?.type || null })),
      ];

      for (const listing of toProcess) {
        if (!runningRef.current) return;
        if (listing._source === "new") {
          saveSeenEntry(listing);
        } else {
          phase1Stats.priceDrops++;
          addLog(`📉 Spadek ceny: ${listing.title} → ${listing.price}€`, "info");
        }

        // ── Filtr lokalny PRZED Groq — zero kosztu, odrzuca ewidentne nie-trafienia ──
        const filterHit = matchesFilterKeyword(listing);
        if (filterHit) {
          phase1Stats.blacklist++;
          addLog(`🚫 Filtr: odrzucono (słowo: "${filterHit}") — ${listing.title}`, "info");
          setResults(prev => [{
            id: Date.now() + Math.random(), listing,
            analysis: { typ_roweru: "inny", decyzja: "nie", oplaca_sie: false, krotki_opis: `Odrzucone filtrem słów kluczowych (${filterHit})` },
            status: "skip",
            timestamp: new Date().toLocaleTimeString("pl-PL"),
          }, ...prev].slice(0, 400));
          continue; // nie idzie nawet do Groq
        }

        // ── Filtr roku PRZED Groq — zero kosztu, odrzuca ewidentnie stare rowery po samym tytule ──
        const yearBlock = checkListingYearBlock(listing);
        if (yearBlock.blocked) {
          phase1Stats.oldBike++;
          addLog(`🚫 Filtr roku: odrzucono (${yearBlock.reason}) — ${listing.title}`, "info");
          setResults(prev => [{
            id: Date.now() + Math.random(), listing,
            analysis: { typ_roweru: "inny", decyzja: "nie", oplaca_sie: false, krotki_opis: `Odrzucone filtrem roku (${yearBlock.reason})` },
            status: "skip",
            timestamp: new Date().toLocaleTimeString("pl-PL"),
          }, ...prev].slice(0, 400));
          continue; // nie idzie nawet do Groq
        }

        // ── Limit ceny i darmowe wykrywacze PRZED Groq — zero kosztu ──
        const freeReject = freeRejectReason(listing);
        if (freeReject) {
          if (freeReject.kind === "price") phase1Stats.tooExpensive++; else phase1Stats.freeDetect++;
          addLog(`${freeReject.kind === "price" ? "💸" : "🚫"} Bez AI: odrzucono (${freeReject.msg}) — ${listing.title}`, "info");
          setResults(prev => [{
            id: Date.now() + Math.random(), listing,
            analysis: { typ_roweru: "inny", decyzja: "nie", oplaca_sie: false, krotki_opis: `Odrzucone bez AI — ${freeReject.msg}` },
            status: "skip",
            timestamp: new Date().toLocaleTimeString("pl-PL"),
          }, ...prev].slice(0, 400));
          continue; // nie idzie nawet do Groq
        }

        // ── Etap 1 — Groq: szybka klasyfikacja typu (tanio, byle jak, zero limitu Gemini) ──
        // Dla spadku ceny na JUŻ widzianym ogłoszeniu, którego typ znamy z poprzedniego razu —
        // pomijamy Groq całkowicie: typ roweru się nie zmienia, tylko cena.
        const cachedTrusted = ["full", "dirt", "elektryk_gorski"].includes(listing._cachedType) ? listing._cachedType : null;
        let typ;
        if (cachedTrusted) {
          typ = cachedTrusted;
          addLog(`💾 Typ z pamięci (bez Groq): "${typ}" — ${listing.title}`, "info");
        } else {
          typ = await classifyWithGroq(listing);
          await sleep(2500); // margines poniżej limitu 30 RPM darmowego Groqa (2000ms = dokładnie na granicy, bez zapasu)
          if (["full", "dirt", "elektryk_gorski"].includes(typ)) updateSeenType(listing.listingId, typ);
        }

        if (typ === "stary") {
          phase1Stats.oldBike++;
          addLog(`🚫 Groq: rower oszacowany jako sprzed ${MIN_BIKE_YEAR} — odrzucono — ${listing.title}`, "info");
          setResults(prev => [{
            id: Date.now() + Math.random(), listing,
            analysis: { typ_roweru: "inny", decyzja: "nie", oplaca_sie: false, krotki_opis: `Groq oszacował rok produkcji jako sprzed ${MIN_BIKE_YEAR} — odrzucone` },
            status: "skip",
            timestamp: new Date().toLocaleTimeString("pl-PL"),
          }, ...prev].slice(0, 400));
          continue; // nie idzie do Gemini
        }

        if (typ === "inny" || (typ === "elektryk_gorski" && excludeElektryk)) {
          phase1Stats.groqInny++;
          const label = typ === "elektryk_gorski" ? "elektryk górski (wykluczone w Ustawieniach)" : "inny";
          addLog(`🚫 Groq: typ "${label}" — odrzucono — ${listing.title}`, "info");
          setResults(prev => [{
            id: Date.now() + Math.random(), listing,
            analysis: { typ_roweru: "inny", decyzja: "nie", oplaca_sie: false, krotki_opis: typ === "elektryk_gorski" ? "Odrzucone — e-MTB wykluczone w Ustawieniach" : "Odrzucone przez Groq (etap 1) — nie full/dirt/elektryk górski" },
            status: "skip",
            timestamp: new Date().toLocaleTimeString("pl-PL"),
          }, ...prev].slice(0, 400));
          continue; // nie idzie do Gemini
        }

        // ── Brak ceny — od razu do "niepewne", bez Gemini ──
        if (listing.price == null) {
          phase1Stats.noPrice++;
          addLog(`❓ Brak ceny — do listy niepewnych: ${listing.title}`, "info");
          uncertainBatch.push({ listing, reason: "brak ceny w ogłoszeniu" });
          setResults(prev => [{
            id: Date.now() + Math.random(), listing,
            analysis: { typ_roweru: "?", decyzja: "niepewne", oplaca_sie: false, krotki_opis: "Brak ceny — wymaga ręcznego sprawdzenia" },
            status: "skip",
            timestamp: new Date().toLocaleTimeString("pl-PL"),
          }, ...prev].slice(0, 400));
          continue;
        }

        // typ === "full" | "dirt" | "elektryk_gorski" | "niepewne" → kandydat do Gemini (etap 2)
        // Wyjątek: "niepewne" + cena poniżej progu → od razu odrzuć, nie marnuj wywołania Gemini
        // (ma cenę — więc nie kwalifikuje się do listy "brak ceny" — a Groq nie umiał rozpoznać typu,
        // więc przy niskiej cenie zakładamy że to niewart uwagi hardtail/miejski i pomijamy).
        if (typ === "niepewne" && listing.price < minUncertainPrice) {
          phase1Stats.priceThreshold++;
          addLog(`🚫 Groq: niepewny typ + cena ${listing.price}€ < ${minUncertainPrice}€ próg — odrzucono — ${listing.title}`, "info");
          setResults(prev => [{
            id: Date.now() + Math.random(), listing,
            analysis: { typ_roweru: "?", decyzja: "nie", oplaca_sie: false, krotki_opis: `Niepewny typ, cena ${listing.price}€ poniżej progu ${minUncertainPrice}€ — odrzucone bez Gemini` },
            status: "skip",
            timestamp: new Date().toLocaleTimeString("pl-PL"),
          }, ...prev].slice(0, 400));
          continue;
        }

        if (typ === "niepewne") phase1Stats.uncertain++; else phase1Stats.confident++;
        geminiCandidates.push({ listing, groqType: typ });
      }

      await sleep(3000);
    }

    if (firstCycleRef.current) {
      firstCycleRef.current = false;
      addLog(`✔ Cykl #${cycleN} zakończony — czekam 60s przed kolejnym`, "info");
      return;
    }

    addLog(
      `📊 Podsumowanie etapu 1: 💸 ${phase1Stats.tooExpensive} za drogich (> ${maxBuyPrice}€) · 🚫 ${phase1Stats.freeDetect} e-bike/sklep (bez AI) · 🚫 ${phase1Stats.blacklist} odrzuconych (czarna lista) · 🕰️ ${phase1Stats.oldBike} odrzuconych (za stary, < ${MIN_BIKE_YEAR}) · 🚫 ${phase1Stats.groqInny} odrzuconych (Groq: inny) · 🚫 ${phase1Stats.priceThreshold} odrzuconych (niepewne + cena < ${minUncertainPrice}€) · ❓ ${phase1Stats.noPrice} bez ceny → niepewne · 📉 ${phase1Stats.priceDrops} spadków ceny · ➡️ ${geminiCandidates.length} kandydatów do Gemini (${phase1Stats.confident} pewnych, ${phase1Stats.uncertain} niepewnych)`,
      "success"
    );

    // ── FAZA 2 — Gemini: tylko jeśli jest jeszcze limit na ten cykl, pewne typy najpierw ──
    // Sortowanie stabilne: kandydaci z pewną klasyfikacją (full/dirt/elektryk_gorski) idą PRZED
    // "niepewnymi" — jeśli limit się skończy, to "niepewne" odpadają jako pierwsze.
    const sorted = [...geminiCandidates].sort((a, b) =>
      (b.groqType !== "niepewne" ? 1 : 0) - (a.groqType !== "niepewne" ? 1 : 0));
    if (sorted.length > maxGeminiPerCycle) {
      addLog(`⚖️ ${sorted.length} kandydatów do Gemini, limit cyklu = ${maxGeminiPerCycle} — część zostanie pominięta (priorytet: pewne typy)`, "info");
    }

    let lastDetailFetchAt = 0; // do odstępu między pobraniami stron ogłoszeń
    let detailFetches = 0;     // ile stron ogłoszeń pobrano w tym cyklu

    for (let { listing, groqType } of sorted) {
      if (!runningRef.current) return;

      if (geminiCallsRef.current >= maxGeminiPerCycle) {
        addLog(`⏭ Pominięte — limit ${maxGeminiPerCycle} analiz Gemini na cykl osiągnięty: ${listing.title}`, "info");
        setResults(prev => [{
          id: Date.now() + Math.random(), listing,
          analysis: { typ_roweru: "?", decyzja: "niepewne", oplaca_sie: false, krotki_opis: `Pominięte — limit ${maxGeminiPerCycle} analiz Gemini na ten cykl osiągnięty` },
          status: "skip",
          timestamp: new Date().toLocaleTimeString("pl-PL"),
        }, ...prev].slice(0, 400));
        continue;
      }

      // ── Pełny opis ze strony ogłoszenia — TYLKO dla rowerów, które naprawdę idą do analizy ──
      if (detailFetches < MAX_DETAIL_FETCHES_PER_CYCLE && Date.now() >= detailBlockedUntilRef.current) {
        const wait = DETAIL_FETCH_DELAY_MS + Math.random() * 2000 - (Date.now() - lastDetailFetchAt);
        if (wait > 0) await sleep(wait);
        if (!runningRef.current) return;
        lastDetailFetchAt = Date.now();
        detailFetches++;
        const det = await fetchListingDetails(listing);
        if (det.ok) {
          listing.fullDesc = det.desc;
          addLog(`📄 Pełny opis (${det.fullLength} znaków${det.fullLength > DESC_MAX_CHARS ? `, przycięty do ${DESC_MAX_CHARS}` : ""}) — ${listing.title}`, "info");
          if (det.price != null && det.price !== listing.price) {
            addLog(`💶 Cena na stronie ogłoszenia (${det.price}€) różni się od listy (${listing.price ?? "?"}€) — używam ceny ze strony`, "info");
            listing.price = det.price;
          }
        } else if (det.gone) {
          addLog(`🗑 Ogłoszenie już usunięte — pomijam: ${listing.title}`, "info");
          setResults(prev => [{
            id: Date.now() + Math.random(), listing,
            analysis: { typ_roweru: groqType === "niepewne" ? "?" : groqType, decyzja: "nie", oplaca_sie: false, krotki_opis: "Ogłoszenie usunięte przed analizą" },
            status: "skip",
            timestamp: new Date().toLocaleTimeString("pl-PL"),
          }, ...prev].slice(0, 400));
          continue;
        } else if (det.blocked) {
          detailBlockedUntilRef.current = Date.now() + DETAIL_BLOCK_PAUSE_MS;
          addLog(`⛔ Kleinanzeigen blokuje strony ogłoszeń (${det.reason}) — wstrzymuję pobieranie pełnych opisów na 30 min, AI dostaje krótkie fragmenty`, "error");
        } else {
          addLog(`⚠️ Brak pełnego opisu (${det.reason}) — AI dostaje krótki fragment: ${listing.title}`, "error");
          if (det.doc && !descDiagLoggedRef.current) {
            descDiagLoggedRef.current = true;
            const ids = [...det.doc.querySelectorAll("[id]")].map(e => e.id).filter(id => /desc|beschreib/i.test(id)).slice(0, 10);
            const cls = [...new Set([...det.doc.querySelectorAll("*")].flatMap(el => [...el.classList]).filter(c => /desc|beschreib/i.test(c)))].slice(0, 10);
            addLog(`🔍 Diagnostyka opisu (skopiuj to do czatu): id=[${ids.join(", ") || "brak"}] · klasy=[${cls.join(", ") || "brak"}]`, "error");
          }
        }
      }

      // ── Po pełnym opisie: ponownie limit ceny (cena mogła się zmienić) i darmowe wykrywacze ──
      const freeReject2 = freeRejectReason(listing);
      if (freeReject2) {
        addLog(`${freeReject2.kind === "price" ? "💸" : "🚫"} Pełny opis: odrzucono bez Gemini (${freeReject2.msg}) — ${listing.title}`, "info");
        setResults(prev => [{
          id: Date.now() + Math.random(), listing,
          analysis: { typ_roweru: "inny", decyzja: "nie", oplaca_sie: false, krotki_opis: `Odrzucone bez AI — ${freeReject2.msg}` },
          status: "skip",
          timestamp: new Date().toLocaleTimeString("pl-PL"),
        }, ...prev].slice(0, 400));
        continue;
      }

      // ── Ścisły filtr roku na PEŁNYM opisie — zero kosztu, przed Gemini ──
      const markedYear = extractMarkedYear(listing.fullDesc);
      if (markedYear != null && markedYear < MIN_BIKE_YEAR) {
        phase1Stats.oldBike++;
        addLog(`🕰️ Pełny opis: rocznik ${markedYear} < ${MIN_BIKE_YEAR} — odrzucono bez Gemini: ${listing.title}`, "info");
        setResults(prev => [{
          id: Date.now() + Math.random(), listing,
          analysis: { typ_roweru: "inny", decyzja: "nie", oplaca_sie: false, krotki_opis: `Odrzucone — w pełnym opisie rocznik ${markedYear} (< ${MIN_BIKE_YEAR})` },
          status: "skip",
          timestamp: new Date().toLocaleTimeString("pl-PL"),
        }, ...prev].slice(0, 400));
        continue;
      }

      // ── "Niepewne" z etapu 1: druga, tania próba Groqa — tym razem z pełnym opisem ──
      // Rozstrzygnięte tu części ("inny"), stare rowery i wykluczone e-MTB w ogóle nie trafiają do Gemini.
      if (groqType === "niepewne" && listing.fullDesc && groqClassifierKey) {
        const typ2 = await classifyWithGroq(listing);
        if (typ2 === "inny" || typ2 === "stary" || (typ2 === "elektryk_gorski" && excludeElektryk)) {
          addLog(`🚫 Groq (pełny opis): typ "${typ2}" — odrzucono bez Gemini: ${listing.title}`, "info");
          setResults(prev => [{
            id: Date.now() + Math.random(), listing,
            analysis: { typ_roweru: "inny", decyzja: "nie", oplaca_sie: false, krotki_opis: `Odrzucone przez Groq po przeczytaniu pełnego opisu (${typ2})` },
            status: "skip",
            timestamp: new Date().toLocaleTimeString("pl-PL"),
          }, ...prev].slice(0, 400));
          continue;
        }
        if (["full", "dirt", "elektryk_gorski"].includes(typ2)) {
          groqType = typ2;
          updateSeenType(listing.listingId, typ2);
        }
      }

      geminiCallsRef.current += 1;
      const analysis = await analyzeWithGemini(listing, groqType);
      let status = "skip";

      if (!analysis) {
        status = "error";
      } else if (analysis.decyzja === "tak") {
        // ✅ Gemini mówi TAK → wysyłaj webhook
        addLog(`✅ OKAZJA! [${analysis.typ_roweru}] ${listing.title} | zakup: ${analysis.cena_zakupu_eur ?? "?"}€ → sprzedaż PL: ${analysis.szacowana_sprzedaz_eur ?? "?"}€ | zysk: ~${analysis.przewidywany_zysk}€`, "success");
        setStats(s => ({ ...s, deals: s.deals + 1 }));
        const sent = await sendToDiscord(listing, analysis);
        status = sent ? "sent" : "deal";
        if (sent) {
          setStats(s => ({ ...s, sent: s.sent + 1 }));
          addLog(`📨 Wysłano na Discord: ${listing.href}`, "success");
        } else {
          addLog(`⚠️ Nie udało się wysłać na Discord`, "error");
        }
      } else if (analysis.decyzja === "niepewne") {
        // ❓ Za mało danych żeby ocenić — zbierz do zbiorczej wiadomości
        addLog(`❓ Niepewne [${analysis.typ_roweru}] — ${listing.title} | zakup: ${analysis.cena_zakupu_eur ?? "?"}€ — ${analysis.krotki_opis || "za mało informacji"}`, "info");
        uncertainBatch.push({ listing, reason: analysis.krotki_opis || "za mało informacji" });
      } else {
        // ❌ Gemini mówi NIE → nie wysyłaj
        const reason = analysis.odrzucenie === "czesc" ? `z opisu: sama część, nie kompletny rower`
          : analysis.odrzucenie === "stary" ? `rocznik ${analysis.fakty?.rocznik ?? "?"} sprzed ${MIN_BIKE_YEAR}`
          : analysis.odrzucenie === "ebike" ? `e-bike — wykluczone w Ustawieniach`
          : analysis.odrzucenie === "sklep" ? `nowy rower ze sklepu`
          : analysis.typ_roweru === "inny" ? `typ: inny — odrzucone automatycznie`
          : `zysk za mały`;
        addLog(`⏭ Gemini: NIE opłaca się (${reason}) — [${analysis.typ_roweru}] ${listing.title} | zakup: ${analysis.cena_zakupu_eur ?? "?"}€ → sprzedaż PL: ${analysis.szacowana_sprzedaz_eur ?? "?"}€`, "info");
      }

      setResults(prev => [{
        id: Date.now() + Math.random(), listing, analysis, status,
        timestamp: new Date().toLocaleTimeString("pl-PL"),
      }, ...prev].slice(0, 400));

      await sleep(5000);
    }

    // ── Wyślij zbiorczą listę "niepewnych" na koniec cyklu (jeśli są i webhook ustawiony) ──
    if (uncertainBatch.length > 0 && uncertainWebhook) {
      // Discord przyjmuje do 2000 znaków na wiadomość — dzielimy listę na kilka wiadomości,
      // zamiast ucinać ją w połowie (wcześniej ginęły powody i linki z końca listy).
      const entries = uncertainBatch.map(u => `🔸 ${u.listing.title}${u.listing.price != null ? ` (${u.listing.price}€)` : ""} — ${u.reason}`.slice(0, 600) + `\n${u.listing.href}`);
      const chunks = [];
      let chunk = `❓ **Niepewne rowery — cykl #${cycleN}** (${uncertainBatch.length})`;
      for (const entry of entries) {
        if ((chunk + "\n\n" + entry).length > 1900) { chunks.push(chunk); chunk = entry; }
        else chunk += "\n\n" + entry;
      }
      chunks.push(chunk);
      try {
        for (let i = 0; i < chunks.length; i++) {
          if (i > 0) await sleep(1200); // odstęp, żeby nie wpaść w limit Discorda
          await callUncertainDiscord({ content: chunks[i] });
        }
        addLog(`📨 Wysłano listę ${uncertainBatch.length} niepewnych na Discord (${chunks.length} wiad.)`, "success");
      } catch (e) {
        addLog(`⚠️ Błąd wysyłki listy niepewnych: ${e.message}`, "error");
      }
    } else if (uncertainBatch.length > 0 && !uncertainWebhook) {
      addLog(`❓ ${uncertainBatch.length} niepewnych rowerów (brak webhooka — ustaw w Ustawieniach żeby dostawać listę)`, "info");
    }

    firstCycleRef.current = false;
    addLog(`✔ Cykl #${cycleN} zakończony — czekam 60s przed kolejnym`, "info");
  }, [geminiKey, geminiModel, geminiChatName, discordWebhook, discordThread, uncertainWebhook, filterKeywords, groqClassifierKey, maxGeminiPerCycle, minUncertainPrice, selectedBikes, priceKnowledge, minProfit, excludeElektryk, maxBuyPrice, aiBudgetPln, provider]);

  // ── Continuous loop ────────────────────────────────────────────────────
  const startLoop = async () => {
    if (!geminiKey)      { addLog("❌ Brak klucza API (Groq/Gemini)", "error"); setTab("settings"); return; }
    if (!discordWebhook) { addLog("❌ Brak Discord Webhook",    "error"); setTab("settings"); return; }

    runningRef.current = true;
    firstCycleRef.current = true;
    setRunning(true);
    setStats({ scanned: 0, deals: 0, sent: 0 });
    addLog(`🏷️ Wersja aplikacji: ${APP_VERSION}`, "info");
    addLog("🚀 Uruchamiam skanowanie — zbieram istniejące ogłoszenia (cykl #1), od cyklu #2 analizuję tylko nowe", "success");

    let n = 1;
    while (runningRef.current) {
      setCycleNum(n);
      await runOneCycle(n);
      if (!runningRef.current) break;
      for (let i = 60; i > 0 && runningRef.current; i--) {
        await sleep(1000);
      }
      n++;
    }

    setRunning(false);
    addLog("⏹ Zatrzymano", "info");
  };

  const stopLoop = () => { runningRef.current = false; };

  const logColors = { info: "#475569", success: "#22c55e", error: "#f87171" };

  // ── RENDER ─────────────────────────────────────────────────────────────
  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>

      {/* HEADER */}
      <div style={{
        background: "#0c1525", borderBottom: "1px solid #1a2d4a",
        padding: "14px 24px",
        display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{
            width: 40, height: 40, borderRadius: 10,
            background: "linear-gradient(135deg, #f59e0b 0%, #ef4444 100%)",
            display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20,
          }}>🚲</div>
          <div>
            <div style={{ fontSize: 17, fontWeight: 800, letterSpacing: -0.5 }}>
              DirtDeal<span style={{ color: "#f59e0b" }}>Finder</span>
            </div>
            <div style={{ fontSize: 10, color: "#334155", letterSpacing: 0.8, textTransform: "uppercase" }}>
              Kleinanzeigen × Gemini AI × Discord · {APP_VERSION}
            </div>
          </div>
        </div>

        <div style={{ display: "flex", gap: 16, alignItems: "center" }}>
          {[["🔍", stats.scanned, "Nowe"], ["✅", stats.deals, "Okazje"], ["📨", stats.sent, "Wysłane"]].map(([ico, n, lbl]) => (
            <div key={lbl} style={{ textAlign: "center" }}>
              <div style={{ fontSize: 18, fontWeight: 800 }}>{ico} {n}</div>
              <div style={{ fontSize: 10, color: "#475569", textTransform: "uppercase" }}>{lbl}</div>
            </div>
          ))}
          {running && (
            <div style={{ background: "#0a1520", border: "1px solid #22c55e44", borderRadius: 8, padding: "6px 14px", textAlign: "center" }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#22c55e", display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ width: 8, height: 8, borderRadius: "50%", background: "#22c55e", display: "inline-block",
                  animation: "pulse 1.2s infinite" }} />
                Cykl #{cycleNum}
              </div>
              <div style={{ fontSize: 10, color: "#475569" }}>aktywne skanowanie</div>
            </div>
          )}
        </div>

        <div style={{ display: "flex", gap: 4 }}>
          {[["scanner","🔍 Skaner"], ["results","📋 Wyniki"], ["chat","💬 Chat AI"], ["settings","⚙️ Ustawienia"]].map(([id, label]) => (
            <button key={id} onClick={() => setTab(id)} style={{
              padding: "8px 16px", borderRadius: 8, border: "none", fontWeight: 600, fontSize: 13,
              background: tab === id ? "#f59e0b" : "#1e293b",
              color: tab === id ? "#0a0f18" : "#64748b",
            }}>{label}</button>
          ))}
        </div>
      </div>

      {/* BODY */}
      <div style={{ flex: 1, padding: 24, maxWidth: 1200, width: "100%", margin: "0 auto" }}>

        {/* ═══ SCANNER ═══ */}
        {tab === "scanner" && (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 280px", gap: 20 }}>

            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>

              {/* Bike selector */}
              <div style={{ background: "#0d1526", border: "1px solid #1a2d4a", borderRadius: 14, padding: 20 }}>
                <div style={{ fontSize: 11, color: "#475569", textTransform: "uppercase", letterSpacing: 0.8, marginBottom: 12 }}>
                  Modele do skanowania
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                  {BIKE_MODELS.map(b => {
                    const sel = selectedBikes.includes(b.id);
                    return (
                      <button key={b.id} onClick={() => setSelectedBikes(prev =>
                        sel ? prev.filter(x => x !== b.id) : [...prev, b.id]
                      )} style={{
                        padding: "7px 14px", borderRadius: 8, fontWeight: 600, fontSize: 13,
                        border: `1px solid ${sel ? "#f59e0b88" : "#1e293b"}`,
                        background: sel ? "#f59e0b18" : "#0f172a",
                        color: sel ? "#f59e0b" : "#475569",
                      }}>{b.label}</button>
                    );
                  })}
                </div>
              </div>

              {/* START / STOP */}
              <div style={{ display: "flex", gap: 10 }}>
                {!running ? (
                  <button onClick={startLoop} style={{
                    flex: 1, padding: "14px 0", borderRadius: 10, border: "none",
                    fontWeight: 800, fontSize: 15,
                    background: "linear-gradient(135deg, #f59e0b, #ef4444)",
                    color: "#080d18",
                  }}>▶ Start — skanuj ciągle</button>
                ) : (
                  <button onClick={stopLoop} style={{
                    flex: 1, padding: "14px 0", borderRadius: 10,
                    border: "1px solid #ef444466", background: "#ef444418",
                    color: "#f87171", fontWeight: 800, fontSize: 15,
                  }}>⏹ Stop</button>
                )}
              </div>

              {/* Log */}
              <div style={{
                background: "#070c17", border: "1px solid #0f1a2e", borderRadius: 14,
                height: 400, overflowY: "auto", padding: 14,
                fontFamily: "monospace", fontSize: 12, lineHeight: 1.7,
              }}>
                {logs.length === 0 && (
                  <div style={{ color: "#1e293b", textAlign: "center", marginTop: 80 }}>
                    Kliknij Start, żeby zacząć…
                  </div>
                )}
                {logs.map((l, i) => (
                  <div key={i} style={{ color: logColors[l.type] || "#475569" }}>
                    <span style={{ color: "#1e3352" }}>{l.time} </span>{l.msg}
                  </div>
                ))}
                <div ref={logsEndRef} />
              </div>
            </div>

            {/* Right panel */}
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>

              {/* Logika */}
              <div style={{ background: "#0d1526", border: "1px solid #1a2d4a", borderRadius: 14, padding: 20 }}>
                <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 14, color: "#94a3b8" }}>🤖 Logika decyzji</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  <div style={{ background: "#0a1f0f", border: "1px solid #22c55e33", borderRadius: 10, padding: 12 }}>
                    <div style={{ color: "#22c55e", fontWeight: 700, fontSize: 12, marginBottom: 4 }}>✅ Gemini mówi TAK</div>
                    <div style={{ fontSize: 11, color: "#475569", lineHeight: 1.5 }}>
                      Typ roweru to <strong>full</strong> lub <strong>dirt</strong> i zysk ≥ minimum — webhook Discord wysłany z typem, ceną, zyskiem i linkiem
                    </div>
                  </div>
                  <div style={{ background: "#1a0f0f", border: "1px solid #ef444433", borderRadius: 10, padding: 12 }}>
                    <div style={{ color: "#f87171", fontWeight: 700, fontSize: 12, marginBottom: 4 }}>❌ Gemini mówi NIE</div>
                    <div style={{ fontSize: 11, color: "#475569", lineHeight: 1.5 }}>
                      Ogłoszenie pominięte, webhook nie wysłany — gdy typ to <strong>"inny"</strong> (np. szosówka, hardtail XC, miejski), odrzucane jest <strong>zawsze</strong>, niezależnie od ceny
                    </div>
                  </div>
                </div>
              </div>

              {/* Status */}
              <div style={{ background: "#0d1526", border: "1px solid #1a2d4a", borderRadius: 14, padding: 20 }}>
                <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 14, color: "#94a3b8" }}>📊 Status</div>
                {[
                  ["Gemini API",    geminiKey      ? "✅ OK" : "❌ Brak", geminiKey      ? "#22c55e" : "#f87171"],
                  ["Discord",       discordWebhook ? "✅ OK" : "❌ Brak", discordWebhook ? "#22c55e" : "#f87171"],
                  ["Gemini (miesiąc)", `${(aiSpend.usd * USD_PLN_RATE).toFixed(0)} / ${aiBudgetPln} zł`, aiSpend.usd * USD_PLN_RATE >= aiBudgetPln ? "#f87171" : "#94a3b8"],
                  ["Aktywne modele",`${selectedBikes.length}/${BIKE_MODELS.length}`, "#f59e0b"],
                  ["Widzianych ID", seenIdsRef.current.size, "#64748b"],
                ].map(([k, v, c]) => (
                  <div key={k} style={{ display: "flex", justifyContent: "space-between", marginBottom: 8, fontSize: 13 }}>
                    <span style={{ color: "#475569" }}>{k}</span>
                    <span style={{ color: c, fontWeight: 600 }}>{v}</span>
                  </div>
                ))}
              <button onClick={() => {
                seenIdsRef.current = new Map();
                localStorage.removeItem("ddf_seen");
                addLog("🗑 Reset — następny cykl przeskanuje wszystko od nowa", "info");
              }} style={{
                width: "100%", marginTop: 10, padding: "7px 0", borderRadius: 8,
                border: "1px solid #1e293b", background: "transparent",
                color: "#475569", fontSize: 11, fontWeight: 600,
              }}>🗑 Reset zapamiętanych ogłoszeń</button>
            </div>

            <div style={{ background: "#070f1e", border: "1px solid #0f1f36", borderRadius: 14, padding: 16, fontSize: 12, color: "#334155", lineHeight: 1.7 }}>
                🔄 Sprawdza każdy model co ~60s<br/>
                🆕 Tylko <strong style={{ color: "#475569" }}>nowe ogłoszenia</strong> trafiają do Gemini<br/>
                📨 Discord tylko gdy Gemini = <strong style={{ color: "#22c55e" }}>TAK</strong>
              </div>
            </div>
          </div>
        )}

        {/* ═══ RESULTS ═══ */}
        {tab === "results" && (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <div style={{ fontSize: 16, fontWeight: 700 }}>Wyniki ({results.length})</div>
              {results.length > 0 && (
                <button onClick={() => setResults([])} style={{
                  padding: "6px 14px", borderRadius: 8, border: "1px solid #ef444433",
                  background: "#ef444411", color: "#f87171", fontSize: 12, fontWeight: 600,
                }}>🗑 Wyczyść</button>
              )}
            </div>

            {results.length === 0 ? (
              <div style={{ background: "#0d1526", border: "1px dashed #1a2d4a", borderRadius: 16,
                padding: 60, textAlign: "center", color: "#1e293b" }}>
                <div style={{ fontSize: 48, marginBottom: 12 }}>🚲</div>
                Uruchom skanowanie — wyniki pojawią się tutaj.
              </div>
            ) : results.map(r => (
              <div key={r.id} style={{
                background: "#0d1526",
                border: `1px solid ${r.status === "sent" ? "#3b82f633" : r.status === "deal" ? "#22c55e33" : "#1a2d4a"}`,
                borderRadius: 14, padding: 18, marginBottom: 10,
                display: "grid", gridTemplateColumns: "1fr auto", gap: 16, alignItems: "start",
              }}>
                <div>

                </div>
                <div style={{ fontSize: 11, color: "#334155", marginTop: 5, lineHeight: 1.5 }}>
                  Droższe ogłoszenia odpadają przed jakimkolwiek wywołaniem AI (zero kosztu). Gdy cena takiego ogłoszenia spadnie do limitu, zostanie sprawdzone jeszcze raz.
                </div>
              </div>

              <div style={{ marginTop: 18, paddingTop: 18, borderTop: "1px solid #1a2d4a" }}>
                <label style={{ fontSize: 11, color: "#475569", display: "block", marginBottom: 6, textTransform: "uppercase", letterSpacing: 0.8 }}>
                  Miesięczny budżet na Gemini (zł)
                </label>
                <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
                  <input type="number" min="0" step="10" value={aiBudgetPln}
                    onChange={e => setAiBudgetPln(Math.max(0, Number(e.target.value) || 0))}
                    style={{ width: 110 }} />
                  <div style={{ fontSize: 13, color: "#94a3b8" }}>
                    w tym miesiącu: <strong style={{ color: "#f59e0b" }}>{(aiSpend.usd * USD_PLN_RATE).toFixed(2)} zł</strong> · tryb: <strong>{TIER_LABELS[getAiTier()]}</strong>
                  </div>
                </div>
                <div style={{ fontSize: 11, color: "#334155", marginTop: 5, lineHeight: 1.5 }}>
                  Aplikacja sama dobiera moc analizy, żeby zmieścić się w budżecie. Premium (wydatki w tempie budżetu): solidne myślenie przy każdej analizie, a trudne przypadki i weryfikacja okazji na Gemini 2.5 Pro. Normalny (wydatki wyprzedzają tempo): lżejsza analiza, okazje nadal weryfikuje 2.5 Pro. Oszczędny (budżet wyczerpany): tanio, ale okazje dalej są weryfikowane. Licznik opiera się na zużyciu zgłaszanym przez Google i liczy tylko w tej przeglądarce — źródłem prawdy są rachunki w Google AI Studio.
                </div>
              </div>
            </div>

            {/* Strategia */}
            <div style={{ gridColumn: "span 2", background: "#0d1526", border: "1px solid #1a2d4a", borderRadius: 16, padding: 24 }}>
              <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 20, display: "flex", alignItems: "center", gap: 10 }}>
                <span>🎯</span> Strategia oceny
              </div>

              <div>
                <label style={{ fontSize: 11, color: "#475569", display: "block", marginBottom: 6, textTransform: "uppercase", letterSpacing: 0.8 }}>
                  Minimalny zysk (%)
                </label>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <input
                    type="range" min="5" max="100" step="5"
                    value={minProfit}
                    onChange={e => setMinProfit(Number(e.target.value))}
                    style={{ flex: 1, accentColor: "#f59e0b", padding: 0, border: "none", background: "transparent" }}
                  />
                  <div style={{
                    minWidth: 64, textAlign: "center", fontWeight: 800, fontSize: 22, color: "#f59e0b",
                  }}>{minProfit}%</div>
                </div>
                <div style={{ fontSize: 11, color: "#334155", marginTop: 4 }}>
                  Gemini powie TAK tylko gdy szacowany zysk wynosi minimum {minProfit}% ceny zakupu
                </div>
              </div>

              <div style={{ marginTop: 20, paddingTop: 20, borderTop: "1px solid #1a2d4a" }}>
                <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
                  <input type="checkbox" checked={excludeElektryk} onChange={e => setExcludeElektryk(e.target.checked)}
                    style={{ width: 18, height: 18, accentColor: "#f59e0b" }} />
                  <span style={{ fontSize: 13, fontWeight: 600 }}>⚡ Wyklucz elektryki górskie (e-MTB)</span>
                </label>
                <div style={{ fontSize: 11, color: "#334155", marginTop: 6, marginLeft: 28 }}>
                  Gdy zaznaczone — ogłoszenia sklasyfikowane przez Groq jako "elektryk_gorski" są odrzucane od razu na Etapie 1, zanim dotrą do Gemini (zero kosztu). Odznacz, żeby wrócić do analizowania e-MTB.
                </div>
              </div>
            </div>

            {/* Save */}
            <div style={{ gridColumn: "span 2" }}>
              <button onClick={saveSettings} style={{
                width: "100%", padding: "14px 0", borderRadius: 12, border: "none",
                fontWeight: 800, fontSize: 15,
                background: "linear-gradient(135deg, #f59e0b, #ef4444)",
                color: "#080d18",
              }}>💾 Zapisz ustawienia</button>
            </div>

            {/* How it works */}
            <div style={{ gridColumn: "span 2", background: "#0d1526", border: "1px solid #1a3a5f", borderRadius: 16, padding: 24 }}>
              <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 14, color: "#3b82f6" }}>ℹ️ Jak to działa?</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14 }}>
                {[
                  { ico: "🔄", t: "Pętla ciągła",  d: "Skanuje bez przerwy — po każdym pełnym cyklu czeka 60s i zaczyna od nowa" },
                  { ico: "🆕", t: "Tylko nowe",     d: "Każde ogłoszenie trafia do Gemini tylko raz — widziane ID są zapamiętane" },
                  { ico: "🤖", t: "AI (Groq/Gemini)", d: "Rozpoznaje typ (full/dirt/inny) i ocenia czy warto kupić i odsprzedać w Polsce. Typ \"inny\" jest zawsze odrzucany" },
                  { ico: "📨", t: "Discord",        d: "Webhook z ceną, zyskiem i linkiem wysyłany TYLKO gdy Gemini mówi TAK" },
                ].map(s => (
                  <div key={s.t} style={{ background: "#070c17", borderRadius: 12, padding: 16 }}>
                    <div style={{ fontSize: 22, marginBottom: 8 }}>{s.ico}</div>
                    <div style={{ fontWeight: 700, marginBottom: 6, fontSize: 13 }}>{s.t}</div>
                    <div style={{ fontSize: 12, color: "#475569", lineHeight: 1.6 }}>{s.d}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
